<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Mockup v2 · Twirl Dress</title>
<style>
  :root{ --ink:#1a1a1a; --mut:#6b6b6b; --line:#d8d8d8; --ground:#fff; --accent:#2f6f4e; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; }
  }
  :root[data-theme="dark"]{ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; }

  body{ margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  [hidden]{ display:none!important; }
  .wrap{ display:flex; gap:40px; align-items:flex-start; padding:32px; flex-wrap:wrap; max-width:1180px; margin:0 auto; }
  .controls{ flex:0 0 300px; display:flex; flex-direction:column; gap:20px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  label,figcaption{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  select,input[type=text],.file{ font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:7px; padding:9px 10px; width:100%; box-sizing:border-box; }
  .file{ display:flex; align-items:center; gap:10px; padding:4px 10px 4px 4px; min-height:41px; }
  .file button{ flex:none; padding:5px 10px; font-size:12px; border-radius:5px; }
  .file span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--mut); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .trim{ display:flex; gap:10px; align-items:center; }
  .trim input[type=color]{ width:44px; height:40px; padding:0; border:1px solid var(--line); border-radius:7px; background:transparent; cursor:pointer; }
  .trim input[type=text]{ flex:1; font-family:ui-monospace,"SF Mono",Menlo,monospace; text-transform:uppercase; }
  .scale-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .scale-head .val{ font-family:ui-monospace,Menlo,monospace; color:var(--ink); font-weight:600; }
  .scale-head .hint{ text-transform:none; letter-spacing:0; font-weight:400; color:var(--mut); }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  button{ font:inherit; font-weight:600; padding:11px 14px; border-radius:8px; cursor:pointer; background:transparent; }
  .primary{ border:1px solid var(--accent); color:var(--accent); }
  .primary:hover{ background:var(--accent); color:var(--ground); }
  .secondary{ border:1px solid var(--line); color:var(--mut); }
  .secondary:hover{ color:var(--ink); border-color:var(--ink); }
  button:disabled{ opacity:.4; cursor:default; }
  button:disabled:hover{ background:transparent; color:var(--mut); border-color:var(--line); }
  .msg{ font-size:12px; color:var(--mut); min-height:16px; }
  .view{ flex:1; min-width:280px; display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; justify-content:flex-start; }
  .shot{ margin:0; flex:0 0 calc((100% - 20px)/2); max-width:calc((100% - 20px)/2); display:flex; flex-direction:column; gap:8px; }
  @media (max-width:820px){ .shot{ flex-basis:calc((100% - 20px)/2); max-width:calc((100% - 20px)/2); } }
  @media (max-width:520px){ .shot{ flex-basis:100%; max-width:100%; } }
  .shot img{ width:100%; max-height:74vh; object-fit:contain; display:block; }
  figcaption{ text-align:center; }
  /* v2 */
  .group{ border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:12px; }
  .group h3{ margin:0; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); }
  label.check{ text-transform:none; letter-spacing:0; font-weight:400; font-size:13px; color:var(--ink); display:flex; gap:8px; align-items:center; }
  .row{ display:flex; gap:8px; }
  .row select{ flex:1; }
  .row button{ flex:none; padding:8px 10px; font-size:12px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="controls">
    <div class="field">
      <label for="patternBtn">Pattern file</label>
      <div class="file">
        <input type="file" id="pattern" accept="image/png,image/jpeg,image/webp" hidden>
        <button type="button" class="secondary" id="patternBtn">Choose file</button>
        <span id="patternName">No file chosen</span>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="go">Generate</button>
      <button class="secondary" id="dl" disabled>Download PNGs</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="view" id="view"></div>
</div>

<script>
'use strict';
// ===== GARMENT DATA: page-specific, NOT part of the shared block (each page keeps its own table) =====
// CDN, the V() helper, the GARMENTS table and the helpers below are page-local. This demo carries a single
// garment (twirl dress, one on-model view); the engine below never references these names.
const CDN='https://cdn.shopify.com/s/files/1/0704/3321/0621/files/';
// Each garment has a flatlay view and on-model views: mock photo + panel map on the Shopify CDN. The model
// maps were traced on the photo pixels themselves (SAM + colour threshold, zum-prd/prompt-test/model-map),
// so they align to the photo exactly; the mock is the original photo.
// Corner dots live IN THE MAP, 4 per panel, not here: whoever traces a map sets them without touching this file.
// Map convention: R = id x 20 · G >= 250 stroke = grain axis · B >= 250 (blue) dot = fan · G+B >= 250 (cyan) dot = perspective quad.
// (Swapped 2026-09-16: before that blue = perspective, cyan = fan. The old perspective map ?v=1789551352 has blue dots and would now read as a fan.)
const V=(mock,map,r,name)=>({ mock:CDN+mock, map:CDN+map, r, name });
// A garment carries flats:[...] (one or more flatlay views) + models:[...] (on-model photos). The kids
// pajama, men's and women's pajama each have two flatlay mockups; the production form ships only the
// first of a type. Every view carries r: the pattern raster width as a fraction of the mock width
// (pattern px = r x mock W), multiplied by the Motif-size slider. Each mock is tuned by eye on its own,
// because the photos are cropped very differently (a body spanning 40% of the frame vs 99%). Within a
// garment the values keep checks-per-chest equal: r scales with the top's torso width on the map
// (forms/motif-r.py derives them from one anchor view; romper keeps its 2026-09-10 seed values).
// One garment only: the twirl dress bodysuit, one on-model view. Mock = the product photo with the print
// erased to plain white (Gemini nano banana pro, 2026-09-16); map traced on that mock with SAM
// (zum-prd/prompt-test/model-map/build_twirl_map.py): 1 bodice, 2/3 flutter sleeves L/R, 4 skirt, 5 headband, 6 bow, no trim.
const GARMENTS={
  twirlDress:{ flats:[],
               // skirt = fan (four blue dots in the map). The perspective-dot map (zum-flatlay-model-map-twirl-dress-1.png
               // ?v=1789551352, pre-swap colours) is kept on Shopify but no longer rendered: the fan was judged better on 2026-09-16.
               models:[ V('zum-model-twirl-dress-1.png?v=1789549743','zum-flatlay-model-map-twirl-dress-1-fan.png?v=1789555588',1,'Dress'),
                        // romper-1 from pattern-mockup.html (same mock/map/r), rendered alongside for comparison
                        V('zum-model-romper-1.jpg?v=1786079988','zum-flatlay-model-map-romper-1.png?v=1788949187',1.634,'Zippy') ] },
};
const GKEY='twirlDress';
const FLAT_KEYS=Object.keys(GARMENTS);
const flatName=f=>f.mock.split('/').pop().replace(/^zum-(flatlay-mock|model)-/,'').replace(/\.(jpg|png).*$/,'');
const modelName=m=>m.mock.split('/').pop().replace(/^zum-model-/,'').replace(/\.(jpg|png).*$/,'');
// model gender from the filename: boy / girl, or null when the photo is unisex (romper, men, women).
const modelGender=m=>{ const n=modelName(m); return /(^|-)boy(-|$)/.test(n)?'boy':/(^|-)girl(-|$)/.test(n)?'girl':null; };
// which models to show for the chosen gender: neutral -> all; boy/girl -> that gender + any unisex photo.
const modelsFor=g=>g.models;
// ===== END GARMENT DATA =====

// ===== V2 ENGINE: a demo copy of the SHARED BLOCK of pattern-mockup.html, NOT synced by sync-shared.ps1 =====
// Only addition over the shared block: perspective homography from cyan corner dots (marked "v2:").
// The END SHARED BLOCK marker is kept so regress-engine.js render works on this page.
// Nothing in here touches the DOM or page state: it reads images + an options object and returns pixels.

// Map encoding: red channel / 20 -> panel id. 0 = background (incl. skin/hair), 1..8 = fabric panels, 9 = trim.
// Panel 6 = inside of the collar (wrong side of a one-sided print): mirrored + faint bleed-through.
// Model maps never use id 6. Per-panel tile phase offsets: seams cut the print, so adjacent panels must not line up.
// Motif size: the pattern is rastered to r x mock width (r = the view's own number in the page's GARMENT
// DATA x the Motif-size slider) and tiled. Nothing is derived from the garment's extent on the map.
const OFFX=[0,0.37,0.71,0.13,0.58,0.92,0.26,0.64,0.45];
const OFFY=[0,0.53,0.19,0.81,0.34,0.67,0.08,0.46,0.88];
const OUT_AREA=1900*2356;  // output pixels (~1900px wide) - crisp motifs
const SS=1.3;              // supersample factor: mild edge anti-aliasing only; the pattern itself is sampled bilinearly
                           // (2.0 clears the last staircase on the romper map's id edges and a twill moire, at ~2.4x the time and memory)
const TRIM_CEIL=1.15;      // flatlay trim ceiling
const TRIM_KNEE=0.86;      // model view only: soft-knee onset for trim highlights (kills specular gloss + lit-collar glare that the flat-lit flatlay never shows)
const TRIM_ROLL=0.22;      // compression slope above the knee
const TRIM_MCEIL=1.00;     // model view trim ceiling, below the flat one
const TRIM_FLOOR=0.65;     // trim shadow floor: flatlay = hard clamp on f (mirrors TRIM_CEIL); model view = soft-knee onset on the low-pass
                           // (mirrors TRIM_KNEE, same TRIM_ROLL), so a charcoal trim / shadowed cuff is lifted without flattening its weave
const TRIM_MFLOOR=0.50;    // model view hard floor below the soft knee (mirrors TRIM_MCEIL)
const TRIM_BLUR=0.006;     // model view only: trim low-pass radius, fraction of the raster width (2-pass box, ~60px wide at 2470). The knee
                           // acts on this low-pass (broad glare, lit collar); the weave / stitching / fold detail riding on it is kept as in the mock
const COLLAR_ID=6;
const AXIS_MIN=250;        // map G channel >= this = a hand-drawn grain axis for the panel it sits on (R keeps the id)
const AX_STEP=10;          // limb axis sample spacing (px at the analysis size)
const AX_CURVE=0.035;      // max deviation/chord above which a drawn stroke counts as bent and becomes a curved axis
const AX_RMIN=2;           // min bend radius of the curved-axis normal field, in panel half-widths (fold guard, see buildAxis)
const AX_SMOOTH=0.25;      // axis smoothing half-window as a fraction of the panel width (x3 passes): the (u,v) map folds where
                           // the bend radius drops below the half-width; 0.25 keeps a 90 deg elbow fold-free yet visibly bent

// --- colour helpers ---
const HEX_RE=/^#?([0-9a-f]{6})$/i;
const parseHex=s=>{ const m=HEX_RE.exec(String(s||'').trim()); return m?m[1].toUpperCase():null; };   // 'RRGGBB' or null
const hexToRgb=h=>[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=rgb=>'#'+rgb.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');
// HSV, never HSL: the HSL denominator (2 - max - min) collapses near white, so rgb(255,250,240) reads as
// fully saturated and a pale cream swatch came out as a solid brown band. HSV reads that cream as 0.06.
function rgbToHsv(r,g,b){ const max=Math.max(r,g,b),min=Math.min(r,g,b),c=max-min; let h=0; if(c!==0){ if(max===r)h=((g-b)/c+6)%6; else if(max===g)h=(b-r)/c+2; else h=(r-g)/c+4; h/=6; } return [h, max===0?0:c/max, max/255]; }
function hsvToRgb(h,s,v){ const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s); return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].map(x=>Math.round(x*255)); }

// --- image helpers ---
// rAF never fires in a hidden tab, so a timer fallback keeps a build moving when the user switches away
const nextPaint=()=>new Promise(r=>{ let done=false; const go=()=>{ if(!done){ done=true; setTimeout(r,0); } }; requestAnimationFrame(go); setTimeout(go,120); });
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('image load failed: '+src)); i.src=src; });
// The panel map is an exact id image - it must NOT be chroma-subsampled. An <img> lets Shopify's CDN serve
// WebP, whose 4:2:0 subsampling bleeds sharp colour edges (e.g. a drawn G axis line) into the R channel and
// corrupts the id, printing thin stray-panel lines. Fetch it as PNG so every pixel's id stays exact.
const loadPng=src=>fetch(src,{headers:{Accept:'image/png'}}).then(r=>{ if(!r.ok) throw new Error('map load failed: '+src); return r.blob(); }).then(createImageBitmap);
// decode a File/Blob once; the bitmap feeds every later draw (swatch scan, compositor, thumbnails)
const decodeFile=f=>window.createImageBitmap ? createImageBitmap(f) : loadImg(URL.createObjectURL(f));

// Draw img at w x h and return its pixels. One scratch canvas for every call: getImageData copies the
// pixels out, so nothing keeps the canvas, and a fresh 30MB canvas per call (Safari frees them only on GC)
// is what used to push a phone over its canvas memory budget mid-build.
const scratch=document.createElement('canvas'), sctx=scratch.getContext('2d',{willReadFrequently:true});
function raster(img,w,h,smooth){
  scratch.width=w; scratch.height=h;
  sctx.imageSmoothingEnabled=smooth; sctx.imageSmoothingQuality='high'; sctx.drawImage(img,0,0,w,h);
  return { w, h, data:sctx.getImageData(0,0,w,h).data };
}
function rasterArea(img,area,smooth){
  const s=Math.sqrt(area/(img.width*img.height));
  return raster(img, Math.max(1,Math.round(img.width*s)), Math.max(1,Math.round(img.height*s)), smooth);
}
function rasterWidth(img,w,smooth){ return raster(img, w, Math.max(1,Math.round(img.height*w/img.width)), smooth); }

// --- swatch colour: dominant hue -> trim suggestion, gender ---
// 64x64 nearest-neighbour sample (area-averaging blends every motif into the light ground a swatch sits on,
// so each cell lands near white and every pattern reports the same colour), hue histogram weighted by
// chroma, mean colour of the heaviest bin: a single most-saturated pixel is noise, the dominant hue is what
// the eye reads. null when the swatch has no readable hue (grey / black / white).
function dominantColor(img){
  try{
    const n=64, B=36, d=raster(img,n,n,false).data;
    const weight=new Float64Array(B), sum=new Float64Array(B*3), count=new Int32Array(B);
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<128) continue;
      const r=d[i],g=d[i+1],b=d[i+2], max=Math.max(r,g,b), ch=max-Math.min(r,g,b);
      if(max<40||ch/max<0.2) continue;   // near-black or near-grey: no hue
      const k=Math.min(B-1,Math.floor(rgbToHsv(r,g,b)[0]*B));
      weight[k]+=ch; sum[k*3]+=r; sum[k*3+1]+=g; sum[k*3+2]+=b; count[k]++;
    }
    let top=-1,tw=0; for(let k=0;k<B;k++) if(weight[k]>tw){ tw=weight[k]; top=k; }
    if(top<0) return null;
    const c=count[top]; return [sum[top*3]/c, sum[top*3+1]/c, sum[top*3+2]/c];
  }catch{ return null; }
}
// That colour pulled into the range a garment trim can actually be: never near-white, never near-black,
// never fully saturated. '#rrggbb' lowercase, or null when the colour is too washed out to name a hue.
function trimHexFrom(r,g,b){
  const [h,s,v]=rgbToHsv(r,g,b);
  if(s<0.15||v<0.10) return null;
  return toHex(hsvToRgb(h, Math.min(0.70,Math.max(0.25,s)), Math.min(0.86,Math.max(0.52,v))));
}
// Gender from the trim hue: 250-350 deg violet -> magenta -> pink = girl; 90-249 deg green -> teal -> blue = boy;
// the rest (yellow, orange, red, brown) and anything too washed out to read a hue = neutral. null = not a hex.
function genderFromHex(v){
  const m=parseHex(v); if(!m) return null;
  const [h,s,val]=rgbToHsv(...hexToRgb(m));
  if(s<0.15||val<0.10) return 'neutral';
  const hd=h*360;
  return hd>=250&&hd<=350 ? 'girl' : hd>=90&&hd<250 ? 'boy' : 'neutral';
}

// --- garment analysis: independent of pattern/scale/trim, so computed once per garment ---
// One pass over the map yields: panel id per pixel, garment bbox (width for motif size, box for the
// compose loop: on a model photo ~70% of the frame is background), per-panel centroid +
// major-axis angle (PCA; the print is rotated to follow each panel's grain), the trim
// luminance reference (90th percentile of panel 9) and the fabric white reference (95th percentile
// of each channel over panels 1..8), both sampled every 2nd pixel each axis.
// model=true (on-model photo): a drawn curved axis also gets the tube wrap; the flatlay stays flat (see limb axes below).
// LRU of a few garments (never below 2 flats + 2 models, or a new random model pick evicts a flatlay): each entry holds ids (1 byte/px) + axes; the mock is re-rasterised per compose
// from the decoded image, so switching between the 12 maps does not pile up 30MB pixel buffers.
const garmentCache=new Map(), CACHE_MAX=6;   // 2 flats + up to 4 model photos: a new random pick must not evict a flatlay
function mapQuadsFrom(pxRaw,ids,W,H){
  if(!pxRaw.length) return null;
  const fanOf=new Map(); const px=pxRaw.map(v=>{ const i=v<0?-1-v:v; fanOf.set(i,v<0); return i; });
  const inSet=new Set(px), seen=new Set(), blobs=[];
  for(const s0 of px){ if(seen.has(s0)) continue;
    const st=[s0]; seen.add(s0); let n=0, nf=0, sx=0, sy=0; const kc=new Uint32Array(10);
    while(st.length){ const i=st.pop(); n++; if(fanOf.get(i)) nf++; sx+=i%W; sy+=(i/W)|0; kc[ids[i]]++;
      for(const j of [i-1,i+1,i-W,i+W]) if(j>=0&&j<W*H&&inSet.has(j)&&!seen.has(j)){ seen.add(j); st.push(j); } }
    let k=0; for(let q=1;q<=8;q++) if(kc[q]>kc[k]) k=q;
    blobs.push({ k, n, nf, x:sx/n, y:sy/n }); }
  const out={}; let any=false;
  for(let k=1;k<=8;k++){ const b=blobs.filter(o=>o.k===k&&o.n>=4).sort((a,c)=>c.n-a.n).slice(0,4); if(b.length<4) continue;
    const fan=b.reduce((a,o)=>a+o.nf,0)*2>b.reduce((a,o)=>a+o.n,0);   // blue dots (B only) = fan, cyan dots (G+B) = perspective
    // Garment panels hang: the two highest dots are the top edge (TL = left of them), the two lowest the bottom edge
    // (BR = right of them). Angle-based ordering failed twice (a dot exactly at -135 deg; a hem-left dot placed higher
    // than the waist-left dot so min x+y picked the wrong one).
    b.sort((a,c)=>a.y-c.y);
    const top=b.slice(0,2).sort((a,c)=>a.x-c.x), bot=b.slice(2).sort((a,c)=>a.x-c.x);
    out[k]=[top[0],top[1],bot[1],bot[0]].map(o=>[o.x/W,o.y/H]); out[k].fan=fan; any=true; }
  return any?out:null;
}
function analyzeGarment(spec,model){
  const key=spec.map+(model?'|model':'');
  if(garmentCache.has(key)){ const p=garmentCache.get(key); garmentCache.delete(key); garmentCache.set(key,p); return p; }
  const p=(async()=>{
    const CA=OUT_AREA*SS*SS;
    const [mockImg,mapImg]=await Promise.all([loadImg(spec.mock),loadPng(spec.map)]);
    const M=rasterArea(mockImg,CA,true), MAP=rasterArea(mapImg,CA,false);
    if(mapImg.close) mapImg.close();   // the id raster is all that is kept of the map
    const W=M.w, H=M.h, md=M.data, xd=MAP.data, N=W*H;
    const ids=new Uint8Array(N);
    const cnt=new Float64Array(10), sx=new Float64Array(10), sy=new Float64Array(10),
          sxx=new Float64Array(10), sxy=new Float64Array(10), syy=new Float64Array(10);
    const hist=new Uint32Array(256); let nTrim=0;
    const fh=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)]; let nFab=0;   // fabric per-channel histograms
    let bx0=W, bx1=-1, by0=H, by1=-1;   // compose bbox (fabric + trim)
    const pbx0=new Int32Array(10).fill(W), pby0=new Int32Array(10).fill(H), pbx1=new Int32Array(10).fill(-1), pby1=new Int32Array(10).fill(-1);   // per-panel bbox (axis grids)
    const linePx=[];                    // every G-maxed pixel, traced into strokes below
    const cornerPx=[];                  // v2: every B-maxed fabric pixel = a corner dot baked into the map (blue = fan, cyan = perspective quad)
    // hand-drawn grain axis: pixels whose map G channel is maxed, summed per panel to a direction below
    const acnt=new Float64Array(10), asx=new Float64Array(10), asy=new Float64Array(10), asxx=new Float64Array(10), asyy=new Float64Array(10), asxy=new Float64Array(10);
    for(let y=0, i=0, p=0; y<H; y++) for(let x=0; x<W; x++, i++, p+=4){
      const k=((xd[p]+10)/20)|0, dot=xd[p+2]>=AXIS_MIN, axis=!dot&&xd[p+1]>=AXIS_MIN, even=!((x|y)&1); ids[i]=k;
      if(dot&&k>=1&&k<=8) cornerPx.push(xd[p+1]>=AXIS_MIN ? i : -1-i);   // negative = fan dot (B only), positive = perspective dot (G and B maxed)
      if(k>=1&&k<=9){ if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; }
      if(k>=1&&k<=8){ if(x<pbx0[k])pbx0[k]=x; if(x>pbx1[k])pbx1[k]=x; if(y<pby0[k])pby0[k]=y; if(y>pby1[k])pby1[k]=y;
        cnt[k]++; sx[k]+=x; sy[k]+=y; sxx[k]+=x*x; sxy[k]+=x*y; syy[k]+=y*y;
        if(even){ fh[0][md[p]]++; fh[1][md[p+1]]++; fh[2][md[p+2]]++; nFab++; }
        if(axis){ acnt[k]++; asx[k]+=x; asy[k]+=y; asxx[k]+=x*x; asyy[k]+=y*y; asxy[k]+=x*y; } }
      else if(k===9 && even){ hist[((md[p]*299+md[p+1]*587+md[p+2]*114)/1000)|0]++; nTrim++; }

    localXY(G,k,x,y);
    if(LX<x0[k])x0[k]=LX; if(LX>x1[k])x1[k]=LX; if(LY<y0[k])y0[k]=LY; if(LY>y1[k])y1[k]=LY; }
  return { x0, x1, y0, y1 };
}

// --- composite: tile the pattern into each fabric panel, recolor the trim, downscale by SS ---
const big=document.createElement('canvas'), bctx=big.getContext('2d',{willReadFrequently:true});
const disp=document.createElement('canvas'), dctx=disp.getContext('2d');

// ---- fold displacement + feathered edge (constants at the output scale, x SS inside compose) ----
// Tone is a plain multiply, print x mock/Fref. A Photoshop chain (shadow Linear Burn 0.25, high-pass Soft Light 0.8)
// was measured on 2026-09-16 and dropped: 6-13 levels in the folds, 2 for the Soft Light, neither visible at normal size.
const DISP_AMP=12;   // max print shift on a fold flank, px. Gradient-driven: a luminance-driven shift moved the print
                     // diagonally as a whole and only wobbled straight lines; the gradient form compresses the print on fold flanks
const DISP_BLUR=8;   // box-blur radius of the mock luminance the gradient is read from, px
const DISP_GREF=3;   // luminance change per px (on the blurred mock) that gives the full DISP_AMP shift; steeper is clamped
const FEATHER=3;     // edge blend radius, px: the print fades over this band across the panel boundary instead of a hard cut
// masked 2-pass box blur over the rect x0..x1 / y0..y1 of a W-wide frame: src(i) is the value, msk(i) whether
// the pixel counts. Returns Float32Array over the rect = local mean of src among counted pixels (0 where none).
function blurMasked(W,x0,y0,x1,y1,r,src,msk){
  const BW=x1-x0+1, BH=y1-y0+1, v=new Float32Array(BW*BH), m=new Float32Array(BW*BH), t=new Float32Array(BW*BH);
  for(let y=y0,j=0;y<=y1;y++) for(let x=x0,i=y*W+x0;x<=x1;x++,i++,j++) if(msk(i)){ v[j]=src(i); m[j]=1; }
  const box=(s,d,n,stride,off)=>{ let a=0; for(let q=0;q<=r&&q<n;q++) a+=s[off+q*stride];
    for(let q=0;q<n;q++){ d[off+q*stride]=a; const hi=q+r+1, lo=q-r; if(hi<n) a+=s[off+hi*stride]; if(lo>=0) a-=s[off+lo*stride]; } };
  const blur=a=>{ for(let pass=0;pass<2;pass++){ for(let y=0;y<BH;y++) box(a,t,BW,1,y*BW); for(let x=0;x<BW;x++) box(t,a,BH,BW,x); } };
  blur(v); blur(m);
  for(let j=0;j<BW*BH;j++) v[j]=m[j]>0?v[j]/m[j]:0;
  return v;
}
// Grow fabric ids (1..8) outward by f pixels (4-neighbour), so a feathered edge has a panel to sample. Trim (9) neither grows nor is overwritten.
function dilateIds(ids,W,H,x0,y0,x1,y1,f){
  const ok=q=>q>=1&&q<=8; let cur=ids;
  for(let p=0;p<f;p++){ const nx=Uint8Array.from(cur);
    for(let y=y0;y<=y1;y++) for(let x=x0,i=y*W+x0;x<=x1;x++,i++){ if(cur[i]!==0) continue;
      let k=0; if(x>0&&ok(cur[i-1]))k=cur[i-1]; else if(x<W-1&&ok(cur[i+1]))k=cur[i+1]; else if(y>0&&ok(cur[i-W]))k=cur[i-W]; else if(y<H-1&&ok(cur[i+W]))k=cur[i+W];
      if(k) nx[i]=k; }
    cur=nx; }
  return cur;
}
// 4-point homography src->dst (each [[x,y]x4]); returns h[0..8] with h[8]=1. Direct 8x8 Gaussian elimination.
function homography(src,dst){
  const A=[], B=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i], [u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); B.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); B.push(v); }
  for(let c=0;c<8;c++){ let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [B[c],B[p]]=[B[p],B[c]]; const d=A[c][c]||1e-12;
    for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/d; if(!f) continue; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; B[r]-=f*B[c]; } }
  const h=B.map((b,i)=>b/(A[i][i]||1e-12)); h.push(1); return h;
}
// quads {k:[[nx,ny]x4]} (normalised to the mock, TL TR BR BL) -> {k:{h,w,hh}}: the quad maps onto a w x hh
// rectangle, w = the longer of the top/bottom edges, hh = the longer side, so the wide end keeps the flat motif size.
function buildQuads(q,W,H,G){
  if(!q) return null; const out={}; let any=false;
  for(const k in q){ const F=G&&G.fans&&G.fans[k];
    const P=q[k].map(([x,y])=>{ if(F){ fanXY(F,x*W,y*H); return [LX,LY]; } return [x*W,y*H]; }), L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
    const w=Math.max(L(P[0],P[1]),L(P[3],P[2])), hh=Math.max(L(P[0],P[3]),L(P[1],P[2]));
    if(w<2||hh<2) continue;
    out[k]={ h:homography(P,[[0,0],[w,0],[w,hh],[0,hh]]), w, hh }; any=true; }
  return any?out:null;
}

// ratio: pattern raster width as a fraction of the mock width (the view's r x the Motif-size slider).
// trim: [r,g,b] or null (keep the mock's own trim). opt (testing page only): { quads:false } = no perspective quads
// (the production render), { quads:{<map url>:{k:[[nx,ny]x4]}} } overrides the map's cyan dots, showQuad draws them. Returns a canvas (W/SS x H/SS).
function compose(G, pat, ratio, trim, opt){
  opt=opt||{};
  const {w:W,h:H,ids,Lref,tlo,box:[bx0,by0,bx1,by1]}=G; const BW=bx1-bx0+1;
  const iFr=1/G.Fref[0], iFg=1/G.Fref[1], iFb=1/G.Fref[2];
  const patW = ratio*W;
  const P=rasterWidth(pat, Math.max(2,Math.round(patW)), true);
  const PW=P.w, PH=P.h, pd=P.data;
  // v2: perspective homography per panel (cyan dots) replaces axis / PCA / fan for that panel; extents re-measured because the frame changed
  G.H=buildQuads(opt.quads===false ? null : ((opt.quads&&opt.quads[G.key])||G.mapQuads), W, H, G);
  const ext=G.H?panelExtents(G):G.ext;
  const ox=OFFX.map(v=>v*PW), oy=OFFY.map(v=>v*PH);
  for(let k=1;k<=8;k++){ if(ext.x1[k]<ext.x0[k]) continue;
    const sX=ext.x1[k]-ext.x0[k]; if(sX<PW-1) ox[k]=-ext.x0[k]+OFFX[k]*(PW-sX);
    const sY=ext.y1[k]-ext.y0[k]; if(sY<PH-1) oy[k]=-ext.y0[k]+OFFY[k]*(PH-sY); }

  big.width=W; big.height=H;
  bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality='high'; bctx.drawImage(G.mockImg,0,0,W,H);
  const img=bctx.getImageData(0,0,W,H), out=img.data;
  const [tr,tg,tb]=trim||[0,0,0];

  // Fold displacement field: low-pass of the mock luminance over the box (fabric + trim only). Feather: fraction
  // of fabric among non-trim pixels over the box grown by the feather, + ids dilated so the outside band has a panel to sample.
  // Built per compose (one pass each over the box), nothing is cached on the garment.
  const fpx=Math.round(FEATHER*SS), dpx=Math.max(1,Math.round(DISP_BLUR*SS)), amp=DISP_AMP*SS;
  const ex0=Math.max(0,bx0-fpx), ey0=Math.max(0,by0-fpx), ex1=Math.min(W-1,bx1+fpx), ey1=Math.min(H-1,by1+fpx), EW=ex1-ex0+1;
  const dl=blurMasked(W,bx0,by0,bx1,by1,dpx, i=>{ const o=i*4; return (out[o]*299+out[o+1]*587+out[o+2]*114)/1000; }, i=>ids[i]>=1&&ids[i]<=9);
  const idsF=dilateIds(ids,W,H,ex0,ey0,ex1,ey1,fpx), alpha=blurMasked(W,ex0,ey0,ex1,ey1,fpx, i=>(ids[i]>=1&&ids[i]<=8)?1:0, i=>ids[i]!==9);

  for(let y=ey0; y<=ey1; y++) for(let x=ex0, i=y*W+ex0; x<=ex1; x++, i++){
    const k0=ids[i], k=idsF[i]; if(k===0||k>9) continue;
    const o=i*4, r=out[o], g=out[o+1], b=out[o+2];
    if(k0===9){
      if(!trim) continue;
      const lum=(r*299+g*587+b*114)/1000; let f;
      if(tlo){
        const lo=tlo[(y-by0)*BW+(x-bx0)]||lum; let fl=lo/Lref;
        if(fl>TRIM_KNEE){ fl=TRIM_KNEE+(fl-TRIM_KNEE)*TRIM_ROLL; if(fl>TRIM_MCEIL) fl=TRIM_MCEIL; }
        else if(fl<TRIM_FLOOR){ fl=TRIM_FLOOR-(TRIM_FLOOR-fl)*TRIM_ROLL; if(fl<TRIM_MFLOOR) fl=TRIM_MFLOOR; }
        f=fl*lum/lo; if(f>TRIM_CEIL) f=TRIM_CEIL; }
      else { f=lum/Lref; if(f>TRIM_CEIL) f=TRIM_CEIL; else if(f<TRIM_FLOOR) f=TRIM_FLOOR; }
      out[o]=(tr*f)|0; out[o+1]=(tg*f)|0; out[o+2]=(tb*f)|0;
      continue;
    }
    if(k===9) continue;
    // Displace along the GRADIENT of the blurred mock luminance (not the luminance itself, which only slid the
    // print diagonally): each pixel samples the print from the brighter side, by amp px at DISP_GREF luminance/px.
    // Where the slope steepens leaving a valley the print is traversed faster (compressed on the fold's flank),
    // where it flattens toward a ridge it is traversed slower (the ridge shows the print at full size).
    let xs=x, ys=y;
    if(x>bx0&&x<bx1&&y>by0&&y<by1){ const j=(y-by0)*BW+(x-bx0);
      let gx=(dl[j+1]-dl[j-1])*(0.5/DISP_GREF), gy=(dl[j+BW]-dl[j-BW])*(0.5/DISP_GREF);
      if(gx>1) gx=1; else if(gx<-1) gx=-1; if(gy>1) gy=1; else if(gy<-1) gy=-1;
      xs=x+gx*amp; ys=y+gy*amp; }
    localXY(G,k,xs,ys);
    let fx=LX+ox[k]; fx-=Math.floor(fx/PW)*PW; if(fx>=PW) fx=0; let fy=LY+oy[k]; fy-=Math.floor(fy/PH)*PH; if(fy>=PH) fy=0;
    if(k===COLLAR_ID){ fx=PW-fx; if(fx>=PW) fx=0; }
    const x0=fx|0, y0=fy|0, ax=fx-x0, ay=fy-y0, x1=x0+1===PW?0:x0+1, y1=y0+1===PH?0:y0+1;
    const p00=(y0*PW+x0)*4, p10=(y0*PW+x1)*4, p01=(y1*PW+x0)*4, p11=(y1*PW+x1)*4;
    const w00=(1-ax)*(1-ay), w10=ax*(1-ay), w01=(1-ax)*ay, w11=ax*ay;
    let pr=pd[p00]*w00+pd[p10]*w10+pd[p01]*w01+pd[p11]*w11,
        pg=pd[p00+1]*w00+pd[p10+1]*w10+pd[p01+1]*w01+pd[p11+1]*w11,
        pb=pd[p00+2]*w00+pd[p10+2]*w10+pd[p01+2]*w01+pd[p11+2]*w11;
    if(k===COLLAR_ID){ pr=pr*0.4+126; pg=pg*0.4+126; pb=pb*0.4+126; }
    let Pr=r*iFr, Pg=g*iFg, Pb=b*iFb; if(Pr>1) Pr=1; if(Pg>1) Pg=1; if(Pb>1) Pb=1;   // mock, normalised to the fabric white
    let R=pr*Pr, Gc=pg*Pg, Bc=pb*Pb;
    // feather: the edge pixel keeps a share of the mock (inside) or takes a share of the print (outside)
    const a=alpha[(y-ey0)*EW+(x-ex0)]; if(a<0.999){ R=r+a*(R-r); Gc=g+a*(Gc-g); Bc=b+a*(Bc-b); }
    out[o]=R|0; out[o+1]=Gc|0; out[o+2]=Bc|0;
  }

  bctx.putImageData(img,0,0);
  disp.width=Math.round(W/SS); disp.height=Math.round(H/SS);
  dctx.imageSmoothingQuality='high';
  dctx.drawImage(big,0,0,disp.width,disp.height);
  // v2: picked quads drawn on top (demo aid; off = the plain composite)
  const qs=opt.showQuad&&opt.quads&&opt.quads[G.key];
  if(qs){ dctx.save(); dctx.lineWidth=3; dctx.strokeStyle='#ff2d8a'; dctx.fillStyle='#ff2d8a'; dctx.font='bold 28px sans-serif';
    for(const k in qs){ const Pq=qs[k]; dctx.beginPath();
      Pq.forEach(([nx,ny],j)=>{ const X=nx*disp.width, Y=ny*disp.height; j?dctx.lineTo(X,Y):dctx.moveTo(X,Y); }); dctx.closePath(); dctx.stroke();
      Pq.forEach(([nx,ny],j)=>dctx.fillText(String(j+1)+(j?'':' · panel '+k), nx*disp.width+6, ny*disp.height-6)); }
    dctx.restore(); }
  return disp;
}
// ===== END SHARED BLOCK =====

// ===== page: dev tool UI (this file only) =====
const $=id=>document.getElementById(id);
const msg=m=>{ $('msg').textContent=m; };

let patImg=null, patLoading=null, busy=false;   // patLoading: the decode in flight, awaited by generate()
let trimRgb=null;   // trim colour from the pattern's dominant hue (same rule as the dev tool's auto-fill), no field on this page
const results={ flats:[], models:[] };   // each: {name,blob,url,fig}

function readOpt(){ return { quads:null, showQuad:false }; }   // quads:null = perspective quads from the map's cyan dots, not drawn
// Production engine (pattern-mockup.html / zum_prd_form.html) through the same compose(): no perspective quads. With them off
// this block is the SHARED BLOCK math (fan, displace, feather, swept axis, print x mock/Fref), so one function renders both.
const PROD_OPT={ quads:false, showQuad:false };
// Every Generate renders each view twice: [label, engine options, filename prefix]. production = the shipped engine, testing = this page's additions.
const ENGINES=[ ['production', PROD_OPT, 'production'], ['testing', null, 'testing'] ];

async function toBlobURL(canvas){
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob) throw new Error('PNG encode failed');
  return { blob, url:URL.createObjectURL(blob) };
}
function clearShots(list){
  for(const r of list){ URL.revokeObjectURL(r.url); r.fig.remove(); }
  list.length=0;
}
async function showShot(bucket, canvas, name, caption, spec){
  const r=await toBlobURL(canvas);
  const fig=document.createElement('figure'); fig.className='shot'; fig.dataset.map=spec.map;
  const img=document.createElement('img'); img.alt=caption;
  const cap=document.createElement('figcaption'); cap.textContent=caption;
  img.src=r.url; fig.append(img,cap); $('view').append(fig);
  bucket.push({ ...r, name, fig });
}

async function generate(){
  if(busy) return;
  busy=true; $('go').disabled=true;
  try{ if(patLoading){ msg('Reading pattern…'); await patLoading; } }catch{}
  const pat=patImg;   // one bitmap for the whole run: a decode finishing mid-run must not swap the pattern between shots
  if(!pat){ msg('Choose a pattern file first.'); busy=false; $('go').disabled=false; return; }
  msg('Generating…'); await nextPaint();
  const t0=performance.now();
  try{
    const g=GARMENTS[GKEY], trim=trimRgb, scale=1, opt=readOpt();
    const mdls=modelsFor(g);
    clearShots(results.flats); clearShots(results.models);
    for(let i=0;i<g.flats.length;i++){
      if(g.flats.length>1){ msg('Flatlay '+(i+1)+'/'+g.flats.length+'…'); await nextPaint(); }
      const GF=await analyzeGarment(g.flats[i]);
      for(const [lab,o,pre] of ENGINES)
        await showShot(results.flats, compose(GF, pat, scale*g.flats[i].r, trim, o||opt), pre+'-flatlay-'+flatName(g.flats[i]), (g.flats.length>1?'Flatlay '+(i+1):'Flatlay')+' · '+lab, g.flats[i]);
    }
    for(let i=0;i<mdls.length;i++){
      msg('Flatlays done · on-model '+(i+1)+'/'+mdls.length+'…'); await nextPaint();
      const GM=await analyzeGarment(mdls[i], true);
      for(const [lab,o,pre] of ENGINES)
        await showShot(results.models, compose(GM, pat, scale*mdls[i].r, trim, o||opt), pre+'-model-'+modelName(mdls[i]), (mdls[i].name||modelName(mdls[i]))+' · '+lab, mdls[i]);
    }
    $('dl').disabled=false;
    msg('Done · '+results.flats.length+' flatlay · '+results.models.length+' on-model (production + testing) · '+((performance.now()-t0)/1000).toFixed(1)+'s');
  }catch(err){ msg('Error: '+err.message); }
  finally{ busy=false; $('go').disabled=false; }
}

$('patternBtn').addEventListener('click', ()=>$('pattern').click());
$('pattern').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('patternName').textContent=f.name;
  msg('Reading pattern…'); await nextPaint();
  const job=decodeFile(f); patLoading=job;
  try{
    const img=await job;
    if(patLoading!==job) return;   // a newer file was chosen meanwhile
    if(patImg&&patImg.close&&!busy) patImg.close();
    patImg=img; patLoading=null;
    const c=dominantColor(img), t=c&&trimHexFrom(...c); trimRgb=t?hexToRgb(parseHex(t)):null;
    msg('Pattern '+img.width+'×'+img.height+(t?' · trim '+t.toUpperCase():''));
  }catch{ if(patLoading===job) patLoading=null; msg('Could not read that image.'); }
});
$('go').addEventListener('click', generate);
$('dl').addEventListener('click', async ()=>{
  let dl=null; try{ dl = (window.claude&&claude.use) ? await claude.use('downloads') : null; }catch{}
  const items=[];
  for(const r of [...results.flats,...results.models]) items.push({ name:r.name+'.png', blob:r.blob, url:r.url });
  for(const it of items){
    if(dl){ try{ await dl.save({filename:it.name, data:it.blob}); }catch(e){ msg('Download '+((e&&e.code)||'failed')); } }
    else { const a=document.createElement('a'); a.href=it.url; a.download=it.name; a.click(); await new Promise(res=>setTimeout(res,300)); }
  }
});
</script>
</script>
