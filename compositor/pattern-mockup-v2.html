<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Mockup v2 · Body + rest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Shopify admin (Polaris) look, measured on admin.shopify.com collection + product pages (2026-10-14);
     see D:\Bamboo\claude\guide\SHOPIFY-UI-GUIDE.md. Light only, like the admin. */
  :root{
    --ink:#101010; --ink2:#303030; --mut:#616161; --line:#f2f2f2; --ground:#fff; --focus:#5083f0;
    --card-shadow:0 0 2px rgba(0,0,0,.24),0 2px 12px rgba(0,0,0,.02),0 4px 16px rgba(0,0,0,.02),0 4px 48px rgba(0,0,0,.02);
    --tile-shadow:0 8px 10px -5px rgba(0,0,0,.08),0 5px 5px -2.5px rgba(0,0,0,.03),0 3px 3px -1.5px rgba(0,0,0,.02),0 2px 2px -1px rgba(0,0,0,.02),0 1px 1px -.5px rgba(0,0,0,.03),0 .5px .5px 0 rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);
    --btn-shadow:0 0 0 1px rgba(0,0,0,.07),0 2px 20px rgba(0,0,0,.03),0 5px 20px rgba(0,0,0,.03),0 8px 60px rgba(0,0,0,.03);
    --pri-shadow:0 1px .5px -.5px rgba(0,0,0,.13),0 1px 2px -.5px rgba(0,0,0,.13),0 4px 6px -2px rgba(0,0,0,.13),0 2px 3px -1.5px rgba(0,0,0,.13),inset 0 0 4px 1px #101010,inset 0 0 4px 2px rgba(255,255,255,.1),inset 0 0 12px -6px rgba(255,255,255,.75);
    --field-shadow:0 2px 3px -1px rgba(0,0,0,.04),0 3px 4px -1.5px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.13);
    --field-hover:0 2px 3px -1px rgba(0,0,0,.04),0 3px 4px -1.5px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.2);
    --field-focus:0 2px 3px -1px rgba(0,0,0,.04),0 3px 4px -1.5px rgba(0,0,0,.04),0 4px 5px -2px rgba(0,0,0,.04),0 0 0 1px #5083f0,0 0 0 3px rgba(53,115,246,.06),0 4px 20px 2px rgba(53,115,246,.06),inset 0 0 8px 1px rgba(53,115,246,.05);
  }

  body{ margin:0; background:var(--ground); color:var(--ink); font-family:'Inter',-apple-system,system-ui,sans-serif; font-size:13px; line-height:20px; letter-spacing:-.01em; }
  [hidden]{ display:none!important; }
  ::-webkit-scrollbar{ width:11px; height:11px; background-color:#fff; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background-color:transparent; border:2px solid transparent; border-radius:12px; background-clip:content-box; }
  :hover::-webkit-scrollbar-thumb,::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{ background-color:#8c8c8c; }
  .wrap{ display:flex; gap:16px; align-items:flex-start; padding:16px; flex-wrap:wrap; max-width:1180px; margin:0 auto; }
  /* left column: settings card, then Generate / Download below it, outside the card */
  .side{ flex:0 0 300px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .controls{ display:flex; flex-direction:column; gap:16px; padding:16px; background:#fff; border-radius:20px; box-shadow:var(--card-shadow); }
  .field{ display:flex; flex-direction:column; gap:4px; }
  label{ font-size:13px; line-height:20px; color:var(--ink); font-weight:500; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  input[type=text]{ font-family:inherit; font-size:13px; letter-spacing:inherit; color:var(--ink); background:#fff; border:0; border-radius:12px; height:30px; padding:0 12px; width:100%; box-sizing:border-box; outline:none; box-shadow:var(--field-shadow); transition:box-shadow .12s; }
  input[type=text]:hover{ box-shadow:var(--field-hover); }
  input[type=text]:focus{ box-shadow:var(--field-focus); }
  input::placeholder{ color:#4a4a4a; }
  input[type=range]{ width:100%; margin:4px 0 0; accent-color:var(--ink2); }
  .trim{ display:flex; gap:8px; align-items:center; }
  .trim input[type=color]{ flex:none; width:30px; height:30px; padding:0; border:0; border-radius:12px; overflow:hidden; background:transparent; cursor:pointer; box-shadow:var(--field-shadow); }
  .trim input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  .trim input[type=color]::-webkit-color-swatch{ border:0; border-radius:12px; }
  .trim input[type=text]{ flex:1; font-family:ui-monospace,"SF Mono",Menlo,monospace; text-transform:uppercase; }
  .actions{ display:flex; flex-direction:column; gap:8px; }
  button{ font-family:inherit; font-size:13px; line-height:20px; letter-spacing:inherit; font-weight:500; height:28px; padding:4px 12px; border:0; border-radius:9999px; cursor:pointer; background:#fff; color:var(--ink); box-shadow:var(--btn-shadow); }
  .actions button{ height:32px; }
  .primary{ background:#101010; color:#fff; font-weight:600; box-shadow:var(--pri-shadow); }
  .primary:hover:not(:disabled){ background:#2a2a2a; }
  .secondary:hover:not(:disabled){ background:#f7f7f7; }
  .secondary:active:not(:disabled){ background:#f2f2f2; }
  button:disabled{ opacity:.45; cursor:default; }
  /* from pattern-mockup.html: pattern drop zone, Stop, progress, toast, stale note, drop veil, lightbox */
  .flabel{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .hint{ font-size:12px; line-height:16px; color:var(--mut); }
  .linkbtn{ height:24px; padding:2px 10px; margin:-2px -10px -2px 0; background:transparent; box-shadow:none; font-size:12px; line-height:16px; }
  .linkbtn:hover{ background:rgba(0,0,0,.08); }
  .trim .secondary{ flex:none; height:30px; }
  .drop{ position:relative; border:1px dashed #c0c0c0; border-radius:12px; background:#fff; cursor:pointer; transition:border-color .12s, background .12s; }
  .drop:hover{ border-color:#8a8a8a; background:#f7f7f7; }
  .drop:has(> .drop-full:not([hidden])){ border-color:transparent; background:#f7f7f7; }
  .drop-empty{ padding:24px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; color:var(--mut); }
  .add-pill{ display:inline-flex; align-items:center; gap:4px; height:28px; padding:4px 12px 4px 8px; border-radius:9999px; background:#ebebeb; color:var(--ink); font-weight:500; white-space:nowrap; }
  .add-pill svg{ width:16px; height:16px; flex:none; }
  .drop:hover .add-pill{ background:#e3e3e3; }
  .drop-full{ display:flex; gap:12px; align-items:center; padding:8px 44px 8px 8px; }
  .drop-full img{ width:64px; height:64px; object-fit:cover; border-radius:8px; box-shadow:0 0 0 1px rgba(0,0,0,.06); background:#fff; flex:none; }
  .drop-full .meta{ min-width:0; display:flex; flex-direction:column; color:var(--mut); }
  .drop-full b{ color:var(--ink); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drop-x{ position:absolute; top:50%; right:8px; width:28px; height:28px; margin-top:-14px; display:none; place-items:center; padding:0; background:transparent; box-shadow:none; color:#4a4a4a; }
  .drop-x svg{ width:20px; height:20px; }
  .drop-x:hover{ background:rgba(0,0,0,.08); color:var(--ink); }
  .drop:hover .drop-x, .drop:focus-within .drop-x{ display:grid; }
  .primary.stop{ background:#8e0b21; box-shadow:none; }
  .actions .progress[hidden]{ display:block!important; visibility:hidden; }
  .progress{ height:4px; border-radius:2px; background:#ebebeb; overflow:hidden; }
  .progress div{ height:100%; width:0; background:var(--ink2); transition:width .25s; }
  body.busy .controls{ pointer-events:none; opacity:.5; }
  .toast{ position:fixed; left:50%; bottom:24px; z-index:60; max-width:min(560px,calc(100vw - 32px)); transform:translateX(-50%) translateY(10px); padding:12px 16px; border-radius:12px; background:#1b1b1b; color:#fff; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:#8e0b21; }
  .main{ flex:1; min-width:280px; display:flex; flex-direction:column; gap:16px; }
  .note{ padding:8px 12px; border-radius:12px; background:#fff1e3; color:#5e4200; }
  .note b{ color:inherit; font-weight:600; }
  .shot{ position:relative; }
  .shot canvas{ cursor:zoom-in; }
  .badge{ position:absolute; top:10px; right:10px; font-size:12px; line-height:18px; font-weight:500; padding:1px 6px; border-radius:8px; }
  .shot.old .badge{ background:#ffd6a4; color:#5e4200; }
  .shot.err .badge{ background:#fedad9; color:#8e0b21; }
  .shot .fail{ padding:40px 16px; text-align:center; color:#8e0b21; background:#fff5f5; overflow-wrap:anywhere; }
  .dropveil{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(255,255,255,.8); backdrop-filter:blur(2px); font-weight:500; pointer-events:none; }
  .dropveil span{ padding:24px 32px; border-radius:20px; background:#f7f7f7; border:1px dashed #8a8a8a; }
  dialog.lb{ border:0; padding:0; background:#0a0a0a; max-width:none; max-height:none; width:100vw; height:100vh; color:#eee; }
  dialog.lb::backdrop{ background:#0a0a0a; }
  .lb-wrap{ width:100%; height:100%; display:flex; flex-direction:column; }
  .lb-top{ flex:none; height:56px; display:flex; align-items:center; gap:8px; padding:0 12px 0 8px; background:#1a1a1a; }
  .lb-head{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .lb-head .t{ font-weight:600; color:#eee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-head .i{ color:#aaa; }
  .lb-icon{ flex:none; width:32px; height:32px; display:grid; place-items:center; padding:0; border-radius:12px; background:none; box-shadow:none; color:#dcdcdc; text-decoration:none; }
  .lb-icon:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .lb-icon svg{ width:20px; height:20px; }
  .lb-main{ flex:1; min-height:0; display:flex; gap:20px; padding:20px; background:radial-gradient(rgba(255,255,255,.05) 2px, transparent 2px) 0 0/40px 40px, #030303; }
  .lb-body{ flex:1; min-width:0; display:flex; align-items:center; gap:16px; }
  .lb-body img{ flex:1; min-width:0; height:100%; object-fit:contain; }
  .lb-nav{ flex:none; width:56px; height:56px; display:grid; place-items:center; padding:0; border-radius:16px; background:#1a1a1a; box-shadow:none; color:#eee; }
  .lb-nav:hover{ background:#262626; }
  .lb-nav svg{ width:20px; height:20px; }
  .lb-info{ flex:none; width:310px; align-self:flex-start; padding:16px; border-radius:12px; background:#1a1a1a; color:#eee; }
  .lb-info h3{ margin:0 0 16px; display:flex; align-items:center; gap:8px; font-size:15px; line-height:22px; font-weight:600; }
  .lb-info h3 svg{ width:20px; height:20px; }
  .lb-info h4{ margin:8px 0 6px; font-weight:500; }
  .lb-info > h4:first-of-type{ margin-top:0; }
  .lb-info p{ margin:0; color:#aaa; overflow-wrap:anywhere; }
  @media (max-width:900px){ .lb-info{ display:none; } .lb-main{ padding:12px; } .lb-nav{ width:44px; height:44px; } }
  .view{ display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; justify-content:flex-start; }
  .shot{ margin:0; flex:0 0 calc((100% - 16px)/2); max-width:calc((100% - 16px)/2); display:flex; flex-direction:column; border-radius:20px; overflow:hidden; background:#fff; box-shadow:var(--tile-shadow); }
  @media (max-width:520px){ .shot{ flex-basis:100%; max-width:100%; } }
  .shot img,.shot canvas{ width:100%; max-height:74vh; object-fit:contain; display:block; }
  /* caption = Shopify product tile: 8px 8px 10px, no divider, 12px/16px 400, up to 2 lines */
  figcaption{ padding:8px 8px 10px; font-size:12px; line-height:16px; font-weight:400; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .nudge{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .nudge button{ padding:4px 8px; min-width:32px; }
  .nudge span{ font-size:13px; color:var(--mut); font-variant-numeric:tabular-nums; margin-left:4px; }

  /* dropdown over the native <select> (script at the end): white field button (same box as the text field) + Shopify popover menu */
  .dd{ position:relative; display:flex; min-width:0; }
  .dd-btn{ display:flex; align-items:center; justify-content:space-between; gap:4px; width:100%; height:30px; padding:0 8px 0 12px; border-radius:12px; background:#fff; color:var(--ink); font-weight:400; box-shadow:var(--field-shadow); transition:box-shadow .12s; }
  .dd-btn:hover:not(:disabled){ background:#fff; box-shadow:var(--field-hover); }
  .dd.open .dd-btn{ box-shadow:var(--field-focus); }
  .dd-label{ overflow:hidden; text-overflow:ellipsis; }
  .dd-chevron{ width:16px; height:16px; flex:none; transition:transform .12s; }
  .dd.open .dd-chevron{ transform:rotate(180deg); }
  .dd-menu{ position:absolute; top:calc(100% + 6px); left:0; min-width:100%; max-height:min(420px,70vh); overflow:auto; background:#fff; border-radius:16px; padding:6px; box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.1); z-index:200; }
  .dd-item{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; height:32px; text-align:left; border:0; box-shadow:none; background:none; padding:6px 8px; border-radius:12px; font-weight:450; color:var(--ink2); }
  .dd-item:hover:not(:disabled){ background:#f2f2f2; }
  .dd-item.selected{ background:#ebebeb; font-weight:600; color:var(--ink); }
  .dd-check{ width:16px; height:16px; flex:none; }

  /* tooltip = Shopify admin hover card (replaces the native title tooltip) */
  .tip{ position:fixed; z-index:1000; max-width:280px; padding:12px; border-radius:12px; background:#1b1b1b; color:#e3e3e3; box-shadow:0 8px 24px rgba(0,0,0,.25); pointer-events:none; font-size:13px; line-height:20px; font-weight:450; letter-spacing:-.01em; }
</style>
</head>
<body>

<div class="wrap">
  <div class="side">
  <div class="controls">
    <div class="field">
      <label for="drop">Pattern file</label>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a pattern file">
        <input type="file" id="pattern" accept="image/png,image/jpeg,image/webp" hidden>
        <div class="drop-empty" id="dropEmpty">
          <span class="add-pill"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>Add pattern</span>
          <span>Drag and drop or paste an image</span>
        </div>
        <div class="drop-full" id="dropFull" hidden>
          <img id="patThumb" alt="Pattern preview">
          <div class="meta"><b id="patternName"></b><span id="patternDims"></span></div>
          <button type="button" class="drop-x" id="patClear" aria-label="Remove pattern"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m6 6 8 8M14 6l-8 8"/></svg></button>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="layout">Layout</label>
      <select id="layout">
        <option value="allover">All over</option>
        <option value="placement">Body + rest</option>
      </select>
    </div>

    <div class="field" id="restField" hidden>
      <div class="flabel"><label for="restHex">Rest color</label><span class="hint" id="restHint"></span></div>
      <div class="trim">
        <input type="color" id="restColor" value="#ffffff" aria-label="Rest color picker">
        <input type="text" id="restHex" value="" placeholder="White" spellcheck="false" aria-label="Rest color hex">
        <button type="button" class="secondary" id="restAuto" title="Use the pattern's background color">Auto</button>
      </div>
      <div class="flabel" style="margin-top:10px"><label for="bodySize">Body print size · <span id="bodySizeVal">0.75</span></label><button type="button" class="linkbtn" id="bodyReset" hidden>Reset</button></div>
      <input type="range" id="bodySize" min="0.3" max="1.5" step="0.05" value="0.75">
      <label style="margin-top:10px">Move body print</label>
      <div class="nudge">
        <button type="button" class="secondary" data-d="-1,0" aria-label="Move left">←</button>
        <button type="button" class="secondary" data-d="0,-1" aria-label="Move up">↑</button>
        <button type="button" class="secondary" data-d="0,1" aria-label="Move down">↓</button>
        <button type="button" class="secondary" data-d="1,0" aria-label="Move right">→</button>
        <button type="button" class="secondary" id="nudgeReset">0</button>
        <span id="nudgeVal">x 0 · y 0</span>
      </div>
    </div>

    <div class="field">
      <div class="flabel"><label for="trimHex">Trim color</label><span class="hint" id="trimHint"></span></div>
      <div class="trim">
        <input type="color" id="trimColor" value="#c9c9c9" aria-label="Trim color picker">
        <input type="text" id="trimHex" value="" placeholder="From the pattern" spellcheck="false" aria-label="Trim color hex">
        <button type="button" class="secondary" id="trimAuto" title="Use the color picked from the pattern">Auto</button>
      </div>
    </div>
  </div>

    <div class="actions">
      <div class="progress" id="progress" hidden><div id="bar"></div></div>
      <button class="primary" id="go"><span id="goLabel">Generate</span></button>
      <button class="secondary" id="dl" disabled>Download PNGs</button>
    </div>
  </div>

  <div class="main">
    <div class="note" id="stale" hidden>Settings changed since the last run. Press <b>&nbsp;Generate</b> to update the images.</div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="toast" id="msg" role="status" aria-live="polite"></div>

<div class="dropveil" id="dropveil" hidden><span>Drop to use as the pattern</span></div>

<dialog class="lb" id="lb" aria-label="Image preview">
  <div class="lb-wrap">
    <div class="lb-top">
      <button type="button" class="lb-icon" id="lbClose" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 4 10l4 4M4 10h9"/><path d="M11 4h3.5A1.5 1.5 0 0 1 16 5.5v9a1.5 1.5 0 0 1-1.5 1.5H11"/></svg></button>
      <div class="lb-head"><div class="t" id="lbTitle"></div><div class="i" id="lbIdx"></div></div>
      <a class="lb-icon" id="lbDl" download aria-label="Download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v8M6.5 8.5 10 12l3.5-3.5"/><path d="M4 13v1.5A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></a>
    </div>
    <div class="lb-main">
      <div class="lb-body">
        <button type="button" class="lb-nav" id="lbPrev" aria-label="Previous"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-5 5 5 5"/></svg></button>
        <img id="lbImg" alt="">
        <button type="button" class="lb-nav" id="lbNext" aria-label="Next"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 5 5-5 5"/></svg></button>
      </div>
      <aside class="lb-info">
        <h3><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9v4.5M10 6.5v.01"/></svg>Information</h3>
        <h4>Name</h4>
        <p id="lbName"></p>
        <h4>Details</h4>
        <p id="lbDetails"></p>
      </aside>
    </div>
  </div>
</dialog>

<script>
'use strict';
// ===== GARMENT DATA: page-specific, NOT part of the shared block (each page keeps its own table) =====
// CDN, the V() helper, the GARMENTS table and the helpers below are page-local; the engine below never references them.
const CDN='https://cdn.shopify.com/s/files/1/0704/3321/0621/files/';
// Each garment has a flatlay view and on-model views: mock photo + panel map on the Shopify CDN. The model
// maps were traced on the photo pixels themselves (SAM + colour threshold, zum-prd/prompt-test/model-map),
// so they align to the photo exactly; the mock is the original photo.
// Corner dots live IN THE MAP, 4 per panel, not here: whoever traces a map sets them without touching this file.
// Map convention: R = id x 20 · G >= 250 stroke = grain axis · B >= 250 (blue) dot = fan · G+B >= 250 (cyan) dot = perspective quad.
// (Swapped 2026-09-16: before that blue = perspective, cyan = fan. The old perspective map ?v=1789551352 has blue dots and would now read as a fan.)
// bc (optional) = [nx,ny] the real centre of panel 1 (R 20) as a fraction of the mock, may lie outside the frame: set it on a
// view whose body is cropped, where the measured centroid only covers what the frame shows (Body + rest).
// br (optional) = this view's own body ratio (body width / pattern width: larger br, larger body print) for Body + rest, for
// a twisted pose where the garment's br does not hold; empty = the garment's br, measured on its bodyRef. Pass null for bc to set br alone.
const V=(mock,map,r,name,bc,br)=>({ mock:CDN+mock, map:CDN+map, r, name, bc, br });
// A garment carries flats:[...] + models:[...]; every view carries r = the pattern raster width as a fraction of the
// mock width (pattern px = r x mock W). This page has no Motif-size slider: scale is fixed at 1.
// Empty: add the views to test here. Garment shape (bodyRef only needed when a view has no k):
//   key:{ bodyRef:V(mock,map,r), flats:[ V(...) ], models:[ V(mock,map,r,name,bc,br) ] },
const GARMENTS={
  // 4 test views (2026-10-09): kids pajama flatlay + boy-1, men-3, women-3. bodyRef = the whole-body flat that
  // pattern-mockup.html measures br on (kids flats[0], men / women the top-only flat): read for br only, not rendered.

    for(let y=ey0, j=0; y<=ey1; y++) for(let x=ex0; x<=ex1; x++, j++){ let kk;
      if(j===ej){ kk=eK[e]; e++; ej=e<nE?eJ[e]:-1; } else kk=ids[j];
      if(kk!==k) continue; n++; if(x<rx0) rx0=x; if(x>rx1) rx1=x; if(y<ry0) ry0=y; if(y>ry1) ry1=y; } }
  if(!n||!(bW>0)) return null;
  const RW=rx1-rx0+1, RH=ry1-ry0+1;
  const ri=new Int32Array(n), lx=new Float32Array(n), ly=new Float32Array(n), pf=new Float32Array(n*3), mk=new Uint8Array(n*4);
  const iFr=1/G.Fref[0], iFg=1/G.Fref[1], iFb=1/G.Fref[2];
  const dpx=Math.max(1,Math.round(DISP_BLUR*SS)), amp=DISP_AMP*SS, dl=foldLum(md,W,ids,G.box,G.ebox,dpx);
  // pass 2: the same walk as compose's main loop, panel k only
  { let e=0, ej=nE?eJ[0]:-1, m=0;
    for(let y=ey0, j=0; y<=ey1; y++) for(let x=ex0, i=y*W+ex0; x<=ex1; x++, i++, j++){ let kk, a=255;
      if(j===ej){ kk=eK[e]; a=eC[e]; e++; ej=e<nE?eJ[e]:-1; } else kk=ids[j];
      if(kk!==k) continue;
      const q=i*4, r=md[q], g=md[q+1], b=md[q+2];
      let Pr=r*iFr, Pg=g*iFg, Pb=b*iFb; if(Pr>1) Pr=1; if(Pg>1) Pg=1; if(Pb>1) Pb=1;
      let xs=x, ys=y;
      if(x>bx0&&x<bx1&&y>by0&&y<by1){ const jj=(y-by0)*BW+(x-bx0);
        let gx=(dl[jj+1]-dl[jj-1])*(0.5/DISP_GREF), gy=(dl[jj+BW]-dl[jj-BW])*(0.5/DISP_GREF);
        if(gx>1) gx=1; else if(gx<-1) gx=-1; if(gy>1) gy=1; else if(gy<-1) gy=-1;
        xs=x+gx*amp; ys=y+gy*amp; }
      localXY(G,k,xs,ys);
      ri[m]=(y-ry0)*RW+(x-rx0); lx[m]=LX; ly[m]=LY;
      pf[m*3]=Pr; pf[m*3+1]=Pg; pf[m*3+2]=Pb;
      mk[m*4]=r; mk[m*4+1]=g; mk[m*4+2]=b; mk[m*4+3]=a; m++; } }
  const out=document.createElement('canvas'); out.width=Math.round(W/SS); out.height=Math.round(H/SS);
  return { pat, bg:B.bg, bW, cx, cy, n, ri, lx, ly, pf, mk, vbig, vctx, rx0, ry0, reg:vctx.getImageData(rx0,ry0,RW,RH), out, PB:null, pbW:0 };
}
function renderLive(L){
  const w=Math.max(2,Math.round(bodyFrac()*L.bW));
  if(L.pbW!==w){ L.PB=rasterWidth(L.pat, w, true); L.pbW=w; }
  const PB=L.PB, PW=PB.w, PH=PB.h, bd=PB.data, s=NUDGE_STEP*L.bW;
  const pbx=PW/2-(L.cx+nudge[0]*s), pby=PH/2-(L.cy+Math.max(0,(PH-BODY_REF_FRAC*L.bW)/2)+nudge[1]*s);   // as compose: taller than the square moves down
  const {n,ri,lx,ly,pf,mk,bg}=L, od=L.reg.data;
  for(let m=0;m<n;m++){
    const Pr=pf[m*3], Pg=pf[m*3+1], Pb=pf[m*3+2], bu=lx[m]+pbx, bv=ly[m]+pby;
    let R,Gc,Bc;
    if(bu>=0&&bv>=0&&bu<=PW-1&&bv<=PH-1){
      const u0=bu|0, v0=bv|0, au=bu-u0, av=bv-v0, u1=u0+1<PW?u0+1:u0, v1=v0+1<PH?v0+1:v0;
      const p00=(v0*PW+u0)*4, p10=(v0*PW+u1)*4, p01=(v1*PW+u0)*4, p11=(v1*PW+u1)*4;
      const w00=(1-au)*(1-av), w10=au*(1-av), w01=(1-au)*av, w11=au*av;
      R=(bd[p00]*w00+bd[p10]*w10+bd[p01]*w01+bd[p11]*w11)*Pr;
      Gc=(bd[p00+1]*w00+bd[p10+1]*w10+bd[p01+1]*w01+bd[p11+1]*w11)*Pg;
      Bc=(bd[p00+2]*w00+bd[p10+2]*w10+bd[p01+2]*w01+bd[p11+2]*w11)*Pb;
    } else { R=bg[0]*Pr; Gc=bg[1]*Pg; Bc=bg[2]*Pb; }
    const a=mk[m*4+3];
    if(a<255){ const f=a/255, r=mk[m*4], g=mk[m*4+1], b=mk[m*4+2]; R=r+f*(R-r); Gc=g+f*(Gc-g); Bc=b+f*(Bc-b); }
    const q=ri[m]*4; od[q]=R|0; od[q+1]=Gc|0; od[q+2]=Bc|0;
  }
  L.vctx.putImageData(L.reg, L.rx0, L.ry0);

}
// slider / arrows: at most one redraw of every live view per frame
let liveFrame=0;
function scheduleLive(){
  const lives=[...results.flats,...results.models].filter(r=>r.live);
  if(!lives.length){ if((patImg||patLoading)&&!busy&&layoutV()==='placement') generate(); return; }
  if(liveFrame) return;
  liveFrame=requestAnimationFrame(()=>{ liveFrame=0; const t0=performance.now();
    for(const r of [...results.flats,...results.models]) if(r.live) renderLive(r.live);
    msg('Live · size '+bodyFrac().toFixed(2)+' · offset '+nudge[0]+', '+nudge[1]+' · '+Math.round(performance.now()-t0)+' ms'); });
}

function clearShots(list){
  for(const r of list) r.fig.remove();
  list.length=0;
}
const allShots=()=>[...results.flats,...results.models];
// new shots wait in stage and replace the old ones in one swap at the end of the run (no blank page while re-rendering)
let stage=document.createDocumentFragment(), failed=[];   // failed: figures of views that threw, shown as error cards
function shotFig(caption){
  const fig=document.createElement('figure'); fig.className='shot';
  const badge=document.createElement('span'); badge.className='badge'; badge.hidden=true;
  const cap=document.createElement('figcaption'); cap.textContent=caption;
  fig.append(badge,cap); stage.append(fig);
  return fig;
}
function showShot(bucket, canvas, name, caption, live){
  const fig=shotFig(caption);
  canvas.setAttribute('role','img'); canvas.setAttribute('aria-label',caption);
  fig.insertBefore(canvas, fig.lastChild);
  const r={ canvas, name, fig, live };
  canvas.addEventListener('click', ()=>openLightbox(r));
  bucket.push(r);
}
function showFail(caption, err){
  const fig=shotFig(caption); fig.classList.add('err');
  const b=fig.querySelector('.badge'); b.hidden=false; b.textContent='Failed';
  const d=document.createElement('div'); d.className='fail'; d.textContent=err&&err.message||String(err);
  fig.insertBefore(d, fig.lastChild);
  failed.push({ fig });
}
function copyCanvas(src){ const c=document.createElement('canvas'); c.width=src.width; c.height=src.height; c.getContext('2d').drawImage(src,0,0); return c; }

// buttons, hints, Outdated badges: one pass after every settings change
const isStale=()=>!!(lastRun && lastRun!==settingsKey());
function refresh(){
  const stale=isStale(), shots=allShots();
  $('goLabel').textContent=busy?(stopReq?'Stopping…':'Stop'+(prog?' · '+prog:'')):'Generate';
  $('go').classList.toggle('stop', busy);
  $('go').disabled=busy&&stopReq;
  $('go').title=busy?'Stop after the current image':'';
  $('dl').disabled=busy||!shots.length;
  $('dl').textContent=shots.length?'Download '+shots.length+' PNG'+(shots.length>1?'s':''):'Download PNGs';
  $('stale').hidden=!(shots.length && stale) || busy;
  for(const r of shots){ r.fig.classList.toggle('old', stale); const b=r.fig.querySelector('.badge'); b.hidden=!stale; b.textContent='Outdated'; }
  const th=parseHex($('trimHex').value), ath=autoTrim&&parseHex(autoTrim);
  $('trimAuto').disabled=!autoTrim || th===ath;
  $('trimHint').textContent=!th?'Mock trim (no color)':autoTrim&&th===ath?'Picked from the pattern':'Custom';
  const rh=parseHex($('restHex').value), arh=autoRest&&parseHex(autoRest);
  $('restAuto').disabled=!autoRest || rh===arh;
  $('restHint').textContent=!rh?'White':autoRest&&rh===arh?'Pattern background':'Custom';
  if(!rh) $('restColor').value='#ffffff';
  $('restField').hidden=layoutV()!=='placement';
  const bs=+$('bodySize').value; $('bodySizeVal').textContent=bs.toFixed(2); $('bodyReset').hidden=bs===BODY_FRAC;
}

const setBar=f=>{ $('bar').style.width=(f*100).toFixed(1)+'%'; };
let prog='';
async function generate(){
  if(busy){ stopReq=true; refresh(); return; }   // second press = Stop after the current image
  busy=true; stopReq=false; document.body.classList.add('busy'); refresh();
  try{ if(patLoading){ msg('Reading pattern…'); await patLoading; } }catch{}
  const pat=patImg;   // one bitmap for the whole run: a decode finishing mid-run must not swap the pattern between shots
  if(!pat){ msg('Add a pattern first.', true); busy=false; document.body.classList.remove('busy'); refresh(); $('drop').focus(); return; }
  const t0=performance.now();
  const hex=parseHex($('trimHex').value), trim=hex&&hexToRgb(hex);
  const old=[...allShots(), ...failed];
  results.flats=[]; results.models=[]; failed=[]; stage=document.createDocumentFragment();
  lastRun=settingsKey();
  // every view of every garment, in page order
  const jobs=[];
  for(const gk of FLAT_KEYS){ const g=GARMENTS[gk];
    for(const v of g.flats) jobs.push([gk,v,false,results.flats,'flatlay',flatName(v)]);
    for(const v of g.models) jobs.push([gk,v,true,results.models,'model',v.name||modelName(v)]); }
  $('progress').hidden=false; setBar(0);
  const BRs=new Map();   // garment -> body ratio (body width / pattern width) from the uncropped bodyRef, only for Body + rest
  let done=0, nFail=0;
  try{
    for(const [gk,v,model,bucket,kind,name] of jobs){
      if(stopReq) break;
      prog=(done+1)+' of '+jobs.length; refresh(); await nextPaint();
      try{
        const g=GARMENTS[gk], o=prodOpt();
        if(!o.body) showShot(bucket, copyCanvas(compose(await analyzeGarment(v, model), pat, v.r, trim, o)), 'all-over-'+kind+'-'+name, name+' · all-over');
        else{
          if(!v.br && !BRs.has(gk)) BRs.set(gk, g.bodyRef ? bodyBr(await analyzeGarment(g.bodyRef), g.bodyRef.r) : 0);
          const G=await analyzeGarment(v, model), bo=bodyOpt(o, G, v, v.br||BRs.get(gk)||0);
          const L=bo.body.none ? null : buildLive(G, pat, v.r, trim, bo);
          if(L){ renderLive(L); showShot(bucket, L.out, 'production-'+kind+'-'+name, name+' · production', L); }
          else showShot(bucket, copyCanvas(compose(G, pat, v.r, trim, bo)), 'production-'+kind+'-'+name, name+' · production');
        }
      }catch(err){ nFail++; showFail(name+' · '+kind, err); console.error(gk, name, err); }
      finally{ done++; setBar(done/jobs.length); }
    }
    clearShots(old); $('view').append(stage);
    msg(results.flats.length+' flatlay · '+results.models.length+' on-model images · '+((performance.now()-t0)/1000).toFixed(1)+'s'
      +(done<jobs.length?' · stopped, '+(jobs.length-done)+' skipped':'')+(nFail?' · '+nFail+' failed':''), nFail>0);
  }catch(err){ msg('Error: '+err.message, true); }
  finally{
    busy=false; stopReq=false; prog=''; document.body.classList.remove('busy');

}
function setNudge(x,y){ nudge=[x,y]; $('nudgeVal').textContent='x '+x+' · y '+y; scheduleLive(); }
document.querySelectorAll('.nudge [data-d]').forEach(btn=>btn.addEventListener('click', ()=>{
  const [dx,dy]=btn.dataset.d.split(',').map(Number); setNudge(nudge[0]+dx, nudge[1]+dy); }));
$('nudgeReset').addEventListener('click', ()=>setNudge(0,0));
$('bodySize').addEventListener('input', ()=>{ refresh(); scheduleLive(); });

$('bodySize').addEventListener('dblclick', ()=>$('bodyReset').click());

// --- pattern: click, drag & drop anywhere, or paste (as pattern-mockup.html) ---
async function loadPattern(f){

  msg('Reading pattern…'); await nextPaint();

  try{
    const img=await job;
    if(patLoading!==job) return;   // a newer file was chosen meanwhile
    if(patImg&&patImg.close) patImg.close();
    patImg=img; patLoading=null; patName=f.name||'pattern.png';
    const old=$('patThumb').src; if(old.startsWith('blob:')) URL.revokeObjectURL(old);
    $('patThumb').src=URL.createObjectURL(f);

$('drop').addEventListener('click', ()=>$('pattern').click());
$('drop').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('pattern').click(); } });

$('patClear').addEventListener('click', e=>{ e.stopPropagation(); if(busy) return;
  if(patImg&&patImg.close) patImg.close(); patImg=null; patName=''; patLoading=null; autoTrim=null; autoRest=null;
  const old=$('patThumb').src; if(old.startsWith('blob:')) URL.revokeObjectURL(old); $('patThumb').removeAttribute('src');

$('patClear').addEventListener('keydown', e=>e.stopPropagation());   // Enter/Space on the x must not open the picker
let dragDepth=0;
const hasFiles=e=>e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('dropveil').hidden=false; });

$('trimAuto').addEventListener('click', ()=>{ if(autoTrim){ setTrim(autoTrim); refresh(); } });
$('layout').addEventListener('change', refresh);
$('restColor').addEventListener('input', e=>{ $('restHex').value=e.target.value.toUpperCase(); refresh(); });

$('go').addEventListener('click', generate);
window.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && !$('lb').open && !busy){ e.preventDefault(); generate(); } });
const toBlob=c=>new Promise(res=>c.toBlob(res,'image/png'));
$('dl').addEventListener('click', async ()=>{

// --- lightbox over the shots on screen (a live shot is read when shown, so it has the size / offset in use) ---

<script>
// Shopify-style dropdown over native <select> (from dashboards/shared/shared.js).
// The native select stays in the DOM (hidden) as the source of truth: page code keeps
// reading/writing .value and onchange; option changes and .value writes re-render the pill.
(() => {
  const CHECK = '<svg class="dd-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 10.5 3.2 3L15 6.5"/></svg>';
  const CHEVRON = '<svg class="dd-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 8 4 4 4-4"/></svg>';
  const valueDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  let openDd = null;
  function close(dd) {
    if (!dd) return;
    dd.classList.remove('open');
    dd.querySelector('.dd-menu').hidden = true;
    if (openDd === dd) openDd = null;
  }
  function enhance(sel) {
    if (sel.closest('.dd')) return;
    const dd = document.createElement('div');
    dd.className = 'dd dd-' + (sel.id || 'select');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dd-btn';
    const menu = document.createElement('div');
    menu.className = 'dd-menu';
    menu.hidden = true;
    sel.parentNode.insertBefore(dd, sel);
    dd.append(btn, menu, sel);
    sel.hidden = true;
    const render = () => {
      const cur = sel.options[sel.selectedIndex];
      btn.innerHTML = `<span class="dd-label"></span>${CHEVRON}`;
      btn.querySelector('.dd-label').textContent = cur ? cur.textContent : '';
      btn.disabled = sel.disabled;
      menu.innerHTML = '';
      for (const opt of sel.options) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'dd-item' + (opt.selected ? ' selected' : '');
        item.textContent = opt.textContent;
        item.disabled = opt.disabled;
        if (opt.selected) item.insertAdjacentHTML('beforeend', CHECK);
        item.addEventListener('click', () => {
          close(dd);
          if (sel.value === opt.value) return;
          sel.value = opt.value;
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        });
        menu.appendChild(item);
      }
    };
    Object.defineProperty(sel, 'value', {
      configurable: true,
      get() { return valueDesc.get.call(this); },
      set(v) { valueDesc.set.call(this, v); render(); },
    });
    new MutationObserver(render).observe(sel, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['disabled'] });
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (dd.classList.contains('open')) return close(dd);
      close(openDd);
      dd.classList.add('open');
      menu.hidden = false;
      menu.style.left = ''; menu.style.right = '';
      if (menu.getBoundingClientRect().right > document.documentElement.clientWidth - 8) { menu.style.left = 'auto'; menu.style.right = '0'; }
      const s = menu.querySelector('.selected'); if (s) s.scrollIntoView({ block: 'nearest' });
      openDd = dd;
    });
    menu.addEventListener('click', e => e.stopPropagation());
    render();
  }
  document.addEventListener('click', () => close(openDd));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(openDd); });
  document.querySelectorAll('select').forEach(enhance);
})();
</script>
<script>
// Tooltips like Shopify admin: dark card under the element (above when there is no room).
// Reads the native title (moved into data-tip on hover so the browser tooltip never shows);
// page code keeps setting .title as before.
(() => {
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.hidden = true;
  document.body.appendChild(tip);
  let cur = null;
  const hide = () => { tip.hidden = true; cur = null; };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[title],[data-tip]');
    if (el && el.hasAttribute('title')) { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); }
    if (!el || !el.dataset.tip) { if (cur) hide(); return; }
    if (el === cur) return;
    cur = el;
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
    tip.style.top = top + 'px';
    tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8)) + 'px';
  });
  document.addEventListener('scroll', hide, true);
  document.addEventListener('mousedown', hide);
})();
</script>
</body>
</html>
