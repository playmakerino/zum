<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Area Tuner</title>
<style>
:root{
  --bg:#ecebe7; --panel:#fff; --sunk:#f6f5f2; --line:#e3e1dc; --line2:#d3d0c9; --ink:#1d1d1b; --mute:#77746d; --faint:#a5a29b;
  --acc:#1f6feb; --acc-ink:#fff; --acc-soft:#e8f0fe; --dot:#f59e0b;
  --r:6px; --h:30px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
.app{ display:grid; grid-template-columns:280px minmax(0,1fr) 260px; height:100vh; }

/* sidebars: stacked sections split by a hairline */
.pane{ background:var(--panel); overflow:auto; display:flex; flex-direction:column; }
.pane.left{ border-right:1px solid var(--line); }
.pane.right{ border-left:1px solid var(--line); }
.sec{ padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.sec:last-child{ border-bottom:0; }
.sec.grow{ flex:1; }
.sec.foot{ margin-top:auto; border-top:1px solid var(--line); border-bottom:0; }
.h{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--mute); display:flex; align-items:baseline; gap:6px; }
.h .val{ margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums; }
.row{ display:flex; gap:6px; align-items:center; }
.row > *{ min-width:0; }
.sub{ font-size:12px; color:var(--mute); line-height:1.45; }
.sub:empty{ display:none; }

/* controls */
select,input[type=number]{ height:var(--h); padding:0 8px; border:1px solid var(--line2); border-radius:var(--r); font:inherit; background:#fff; color:var(--ink); }
select{ width:100%; }
input[type=number]{ width:100%; font-variant-numeric:tabular-nums; }
input[type=number]::placeholder{ color:var(--faint); }
input[type=range]{ width:100%; margin:0; accent-color:var(--acc); }
button{ height:var(--h); padding:0 12px; font:inherit; border:1px solid var(--line2); border-radius:var(--r); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap; }
button:hover:not(:disabled){ background:var(--sunk); }
button.pri{ background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
button.pri:hover:not(:disabled){ background:#1a5fd0; }
button:disabled,input:disabled{ cursor:default; }
.wide{ width:100%; }
.row > button{ flex:1; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:1px; }
.off{ opacity:.4; pointer-events:none; }

/* photo grid */
.views{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.v{ position:relative; border-radius:var(--r); cursor:pointer; background:var(--sunk); aspect-ratio:3/4; overflow:hidden; outline:2px solid transparent; outline-offset:-2px; }
.v:hover{ outline-color:var(--line2); }
.v.on{ outline-color:var(--acc); }
.v img{ width:100%; height:100%; object-fit:cover; display:block; }
.v .tag{ position:absolute; left:0; right:0; bottom:0; padding:2px 5px; background:linear-gradient(transparent,rgba(0,0,0,.6)); color:#fff; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v.edited::after{ content:''; position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--dot); box-shadow:0 0 0 2px #fff; }

/* pattern pickers: swatch + name, click or drop */
.pats{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pat{ display:flex; flex-direction:column; gap:4px; }
.pat .lab{ font-size:12px; color:var(--mute); }
.drop{ position:relative; height:72px; border:1px dashed var(--line2); border-radius:var(--r); cursor:pointer; overflow:hidden; background:var(--sunk); }
.drop:hover,.drop.over{ border-color:var(--acc); }
.drop img{ width:100%; height:100%; object-fit:cover; display:block; }
.drop .name{ position:absolute; left:0; right:0; bottom:0; padding:2px 5px; background:rgba(255,255,255,.88); font-size:10px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drop .x{ position:absolute; top:3px; right:3px; width:20px; height:20px; padding:0; border-radius:50%; font-size:12px; line-height:1; display:none; }
.drop.custom .x{ display:block; }

/* new photo: file buttons */
.file{ display:flex; align-items:center; gap:8px; height:var(--h); padding:0 10px; border:1px solid var(--line2); border-radius:var(--r); cursor:pointer; background:#fff; }
.file:hover{ background:var(--sunk); }
.file b{ font-weight:500; flex:none; }
.file span{ color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file input{ display:none; }
.kind{ display:flex; gap:14px; font-size:12px; }
.kind label{ display:flex; gap:5px; align-items:center; cursor:pointer; }

/* right pane */
.who{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pad{ display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(3,30px); gap:4px; justify-content:center; }
.pad button{ height:30px; padding:0; font-size:14px; }
.xy span{ color:var(--mute); font-size:12px; flex:none; }

/* stage */
.stage{ position:relative; overflow:hidden; background:var(--bg); }
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; outline:none; }
.busy{ position:absolute; right:12px; top:12px; display:flex; align-items:center; gap:8px; background:rgba(29,29,27,.88); color:#fff; border-radius:999px; padding:5px 12px; font-size:12px; pointer-events:none; }
.busy.spin::before{ content:''; width:10px; height:10px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.err{ padding:40px; color:#b42318; font-size:14px; }
@media (max-width:980px){ .app{ grid-template-columns:1fr; grid-template-rows:auto 70vh auto; height:auto; } .pane.left,.pane.right{ border:0; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="pane left">
    <section class="sec">
      <div class="h">Product</div>
      <select id="garment"></select>
    </section>
    <section class="sec grow">
      <div class="h">Photos</div>
      <div class="views" id="views"></div>
    </section>
    <section class="sec">
      <div class="h">Preview patterns</div>
      <div class="pats">
        <div class="pat"><span class="lab">All-over</span>
          <div class="drop" id="patDrop-allover" title="Click or drop an image"><img alt=""><span class="name"></span><button class="x" title="Back to the default pattern">×</button></div>
          <input type="file" id="patFile-allover" accept="image/*" hidden></div>
        <div class="pat"><span class="lab">Body</span>
          <div class="drop" id="patDrop-placement" title="Click or drop an image"><img alt=""><span class="name"></span><button class="x" title="Back to the default pattern">×</button></div>
          <input type="file" id="patFile-placement" accept="image/*" hidden></div>
      </div>
      <div class="h" style="margin-top:4px">Body print size <span class="val" id="fracV">0.75</span></div>
      <div id="fracRow"><input type="range" id="frac" min="0.3" max="1" step="0.05" value="0.75"></div>
    </section>
    <section class="sec">
      <div class="h">Add a photo</div>
      <label class="file"><b>Mock</b><span id="upMockName">Choose image</span><input type="file" id="upMock" accept="image/*"></label>
      <label class="file"><b>Map</b><span id="upMapName">Choose PNG</span><input type="file" id="upMap" accept="image/png"></label>
      <div class="kind" id="upKind"><label><input type="radio" name="upKind" value="model" checked> On-model</label><label><input type="radio" name="upKind" value="flat"> Flatlay</label></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="busy" id="busy" hidden></div>
  </main>

  <aside class="pane right">
    <section class="sec">
      <div class="who" id="who"></div>
      <div class="sub" id="whoSub"></div>
    </section>
    <section class="sec" id="rGrp">
      <div class="h">Ratio (r) <span class="sub" id="r0"></span></div>
      <input type="range" id="rRange" min="0" max="1" step="0.001">
      <input type="number" id="r" step="0.01">
    </section>
    <section class="sec" id="bcGrp">
      <div class="h">Body center (bc) <span class="sub" id="bc0"></span></div>
      <div class="pad">
        <span></span><button id="bcU" aria-label="Up">↑</button><span></span>
        <button id="bcL" aria-label="Left">←</button><span></span><button id="bcR" aria-label="Right">→</button>
        <span></span><button id="bcD" aria-label="Down">↓</button><span></span>
      </div>
      <div class="row xy"><span>x</span><input type="number" id="bx" step="0.005"><span>y</span><input type="number" id="by" step="0.005"></div>
      <div class="row" id="bcBtns"><button id="bcAuto">Auto centre</button><button id="bcNone">No body print</button></div>
    </section>
    <section class="sec" id="brGrp">
      <div class="h">Body ratio (br) <span class="sub" id="br0"></span></div>
      <input type="number" id="br" step="0.01">
      <div class="sub" id="brWhy"></div>
    </section>
    <section class="sec">
      <div class="row"><button class="pri" id="copy">Copy</button><button id="reset">Undo this photo</button></div>
    </section>
    <section class="sec foot">
      <button class="pri wide" id="copyAll">Copy all</button>
      <button class="wide" id="clearAll">Undo all photos</button>
    </section>
  </aside>
</div>

<script>
'use strict';
// Loads GARMENT DATA + SHARED BLOCK straight out of pattern-mockup.html, so this page always runs the current views and
// the real engine (no third copy to keep in sync). Needs http(s): file:// cannot fetch a sibling file.
(async()=>{
  const SRC='pattern-mockup.html';
  let text;
  try{ const res=await fetch(SRC,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); text=await res.text(); }
  catch(e){ document.getElementById('app').innerHTML='<div class="err">Cannot read '+SRC+' ('+e.message+'). Open this page through an http server, e.g. http://localhost:4178/compositor/print-area-tuner.html</div>'; return; }
  const cut=(a,b)=>{ const i=text.indexOf(a), j=text.indexOf(b,i); if(i<0||j<0) throw new Error('marker missing: '+a); return text.slice(i,j+b.length); };
  const code=cut('// ===== GARMENT DATA','// ===== END GARMENT DATA =====')+'\n'+cut('// ===== SHARED BLOCK','// ===== END SHARED BLOCK =====');
  // this page renders at ~1/4 of the production pixel count: motif size is scale-free (r x width), and switching photos stays quick
  const s=document.createElement('script'); s.textContent="'use strict';\n"+code.replace(/const OUT_AREA=[^;]+;/,'const OUT_AREA=1000*1240;')+'\nwindow.__ENGINE_OK=true;';
  // products with no separate body panel: page code of the dev tool, outside both blocks
  const np=/const NO_PLACEMENT=new Set\((\[[^\]]*\])\)/.exec(text);
  window.__NO_PLACEMENT=np?JSON.parse(np[1].replace(/'/g,'"')):[];
  document.head.appendChild(s);
  if(!window.__ENGINE_OK){ document.getElementById('app').innerHTML='<div class="err">The engine in '+SRC+' failed to run, see the console.</div>'; return; }
  main();
})();

function main(){
  const $=id=>document.getElementById(id);
  const cv=$('cv'), ctx=cv.getContext('2d');
  const fmt=(x,d)=>+(+x).toFixed(d);
  const REST=[232,232,232];      // Body + rest: rest of the fabric in light grey, body around the file white

  // ---- state ----
  let garment=Object.keys(GARMENTS)[0], view=null, allMode=true;   // allMode: the canvas shows every product's reference flatlay
  const GOF=new Map(); for(const g of Object.keys(GARMENTS)) for(const v of [...GARMENTS[g].flats, ...GARMENTS[g].models]) GOF.set(v,g);
  const hasBody=()=>!window.__NO_PLACEMENT.includes(garment);
  const modes=()=>!allMode&&hasBody()?['allover','placement']:['allover'];   // canvas rows, top to bottom
  // edits = current values that differ from the ones loaded with the page (this page never writes them anywhere: use Copy)
  let edits={};
  const uploaded={};             // garment -> [{v,flat}] added in this tab
  const vid=v=>v.vid||flatName(v);
  const keyOf=v=>(GOF.get(v)||garment)+'/'+vid(v);
  const allViews=g=>[...GARMENTS[g].flats.map(v=>({v,flat:true})), ...GARMENTS[g].models.map(v=>({v,flat:false})), ...(uploaded[g]||[])];
  const cur=v=>{ const e=edits[keyOf(v)]; return e?{ ...e }:{ r:v.r, bc:v.bc||null, br:v.br||null }; };
  const isFlat=v=>v.vid?!!v.isFlat:allViews(GOF.get(v)||garment).some(o=>o.v===v&&o.flat);
  const refFlat=()=>{ const g=GARMENTS[garment]; return g.flats[g.bodyRef||0]; };   // left column: the garment's reference flatlay (bodyRef, the one br comes from)
  const refView=()=>{ const g=GARMENTS[garment]; return g.flats[g.bodyRef||0]; };   // br reference (Body + rest)
  const refOf=g=>GARMENTS[g].flats[GARMENTS[g].bodyRef||0];
  const allRefs=()=>Object.keys(GARMENTS).map(refOf);
  const allItems=()=>[...allRefs(), ...(uploaded.__all||[]).map(o=>o.v)];   // the All overview: references + photos added there

  const userPat={ allover:null, placement:null };   // patterns the user dropped, one per row (replace the defaults)
  let BR=0;
  // per view: { a: assets, G: analysed garment, img:{mode:render}, key:{mode:state key}, pv:{mode:preview canvas} }
  const S=new Map(); const st=v=>{ if(!S.has(v)) S.set(v,{ img:{}, key:{}, pv:{} }); return S.get(v); };
  const assetCache=new Map();

  // default patterns: all-over = 16 x 16 checks per repeat, so the checks across the chest can be counted on both photos;
  // Body + rest = 3 x 3 checks, printed once on the body.
  function testPattern(N){
    const c=document.createElement('canvas'); c.width=c.height=400; const x=c.getContext('2d'), q=400/N;
    for(let j=0;j<N;j++) for(let i=0;i<N;i++){ x.fillStyle=(i+j)%2?'#f1e6d0':'#2f4b7c'; x.fillRect(i*q,j*q,q,q); }
    x.fillStyle='#e07a5f'; x.fillRect(0,0,q,q);   // one marked check per tile = where each repeat starts
    return c;
  }
  const DEF={ allover:testPattern(16), placement:testPattern(3) };
  const patOf=m=>userPat[m]||DEF[m];
  const PAT_LS='printAreaTuner.pattern';
  async function savedPattern(m){ try{ const k=PAT_LS+'.'+m, u=localStorage.getItem(k); if(u) return { img:await loadImg(u), name:localStorage.getItem(k+'.name')||'saved pattern' }; }catch(e){} return null; }

  // ---- UI: garment + views ----
  { const o=document.createElement('option'); o.value='__all'; o.textContent='All (reference flatlays)'; $('garment').appendChild(o); }
  for(const g of Object.keys(GARMENTS)){ const o=document.createElement('option'); o.value=g; o.textContent=g+(TYPE_CODE[g]?' ('+TYPE_CODE[g]+')':''); $('garment').appendChild(o); }
  $('garment').value=allMode?'__all':garment;
  $('garment').onchange=()=>{ const g=$('garment').value; BR=0; allMode=g==='__all';
    if(allMode) selectView(refOf(garment)); else { garment=g; selectView(allViews(garment)[0].v); } };

  function paintViews(){
    const box=$('views'); box.innerHTML='';
    for(const {v,flat} of allMode?allItems().map(v=>({v,flat:isFlat(v)})):allViews(garment)){
      const d=document.createElement('div'); d.className='v'+(v===view?' on':'')+(edits[keyOf(v)]?' edited':'');
      const im=document.createElement('img'); im.loading='lazy'; im.src=v.thumb||(v.mock+(v.mock.includes('?')?'&':'?')+'width=200'); d.appendChild(im);
      const t=document.createElement('div'); t.className='tag'; t.textContent=allMode?(GOF.get(v)||'new · '+vid(v).replace(/^new-/,'')):(flat?'F · ':'')+(MOC[vid(v)]||vid(v)); d.appendChild(t);
      d.title=vid(v); d.onclick=()=>selectView(v); box.appendChild(d);
    }
    // Copy all carries the number of changed photos (every product + uploads)
    const n=Object.keys(edits).length+Object.values(uploaded).reduce((s,l)=>s+l.length,0);
    $('copyAll').textContent='Copy all ('+n+' edited)';
  }

  // load + analyse one view (mock, masks, engine garment); cached
  async function prep(v){
    const s=st(v);
    if(!s.a) s.a=await loadAssets(v);
    if(!s.G) s.G=await analyzeGarment(v, !isFlat(v));
    return s;
  }
  async function selectView(v){
    if(allMode&&GOF.get(v)) garment=GOF.get(v);
    view=v; paintViews(); syncInputs(); draw();
    busy('Loading…');
    try{
      const ref=refFlat();
      await Promise.all((allMode?allItems():[v,ref]).filter(Boolean).map(async o=>{ const s=st(o); if(!s.a) s.a=await loadAssets(o); }));   // quick: preview shows
      if(view!==v) return; draw(); busy('Rendering…');
      await Promise.all([prep(v), ref?prep(ref):null]);
      if(view!==v) return;
      await updateBr(); syncInputs();
    }catch(e){ console.error(e); busy('Error: '+e.message); return; }
    busy(''); draw(); renderAll();
  }

  // mock + two alpha masks at display size (fabric = ids 1..8, body = id 1) + the body centroid
  async function loadAssets(v){
    if(assetCache.has(v.map)) return assetCache.get(v.map);
    // display copies resized by the CDN (the engine loads the full files itself); a resized map blurs ids only on the edges
    const small=u=>u.startsWith(CDN)?u+(u.includes('?')?'&':'?')+'width=1200':u;
    const [mock,map]=await Promise.all([loadImg(small(v.mock)), loadPng(small(v.map))]);
    const sc=Math.min(1, 1200/mock.width), w=Math.round(mock.width*sc), h=Math.round(mock.height*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d',{willReadFrequently:true});
    x.imageSmoothingEnabled=false; x.drawImage(map,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;
    const mk=()=>{ const m=document.createElement('canvas'); m.width=w; m.height=h; const mx=m.getContext('2d'); return { m, mx, id:mx.createImageData(w,h) }; };
    const F=mk(), B=mk(); let sx=0, sy=0, n=0;
    for(let i=0,p=0;i<w*h;i++,p+=4){ const k=((d[p]+10)/20)|0;
      if(k>=1&&k<=8) F.id.data[p+3]=255;
      if(k===1){ B.id.data[p+3]=255; sx+=i%w; sy+=(i/w)|0; n++; } }
    F.mx.putImageData(F.id,0,0); B.mx.putImageData(B.id,0,0);
    const a={ mock, w, h, fab:F.m, body:B.m, cent:n?[(sx/n+0.5)/w,(sy/n+0.5)/h]:[0.5,0.5] };
    assetCache.set(v.map,a); return a;
  }

  // br = body width / pattern width of the garment's bodyRef flat at its CURRENT r (an edit to that r moves every other view)
  async function updateBr(){
    const ref=refView(); if(!ref){ BR=0; return; }
    BR=bodyBr((await prep(ref)).G, cur(ref).r);
  }
  const brOf=v=>cur(v).br||BR;
  // Body + rest on the br reference view without its own br: body width is the measured one, r does not change it
  const bodyFixed=v=>v===refView()&&!cur(v).br;

  // ---- geometry: the print box of a view in one mode, mock-normalised ----
  // all-over: one repeat tile, width r, centred on the body centroid (the engine's center:true).
  // placement: the file printed once, width frac x br x r, centre bc | centroid.
  function box(v,m){
    const s=st(v); if(!s.a) return null;
    const {r,bc}=cur(v), A=s.a, G=s.G, P=patOf(m), ar=P.height/P.width;
    let wN, c, kind;
    if(m==='placement'){
      const br=brOf(v), frac=+$('frac').value; if(!br) return null;
      const md=G?bodyMode(G,{r,bc}):(bc?'bc':'auto');
      if(md==='none') return { none:true };
      if(bodyFixed(v)&&G){ const e=G.ext; wN=frac*(e.x1[1]-e.x0[1])/G.w; } else wN=frac*br*r;
      c=bc||A.cent; kind=md;
    } else { wN=r; c=A.cent; kind='tile'; }
    const th=G&&G.cs?Math.atan2(G.sn[1],G.cs[1]):0;
    return { cx:c[0], cy:c[1], w:wN, h:wN*A.mock.width*ar/A.mock.height, th, kind };
  }

  // quick preview of the print at display size (multiplied onto the mock): pattern tiled / placed, clipped to the map
  function preview(v,m){
    const s=st(v), A=s.a, b=box(v,m), P=patOf(m); if(!A) return null;
    const c=s.pv[m]||(s.pv[m]=document.createElement('canvas')); c.width=A.w; c.height=A.h; const x=c.getContext('2d');
    if(m==='allover'){
      if(!b) return null;
      const tw=b.w*A.w, th=tw*P.height/P.width, F=x.createPattern(P,'repeat');
      F.setTransform(new DOMMatrix().translate(b.cx*A.w,b.cy*A.h).rotate(b.th*180/Math.PI).translate(-tw/2,-th/2).scale(tw/P.width,th/P.height));
      x.fillStyle=F; x.fillRect(0,0,A.w,A.h);
      x.globalCompositeOperation='destination-in'; x.drawImage(A.fab,0,0); x.globalCompositeOperation='source-over';
    } else {
      x.fillStyle='rgb('+REST+')'; x.fillRect(0,0,A.w,A.h);
      x.globalCompositeOperation='destination-in'; x.drawImage(A.fab,0,0); x.globalCompositeOperation='source-over';
      const t=s.pb||(s.pb=document.createElement('canvas')); t.width=A.w; t.height=A.h; const y=t.getContext('2d');
      y.fillStyle='#fff'; y.fillRect(0,0,A.w,A.h);
      if(b&&!b.none){ y.save(); y.translate(b.cx*A.w,b.cy*A.h); y.rotate(b.th); const w=b.w*A.w, h=b.h*A.h; y.drawImage(P,-w/2,-h/2,w,h); y.restore(); }
      y.globalCompositeOperation='destination-in'; y.drawImage(A.body,0,0); y.globalCompositeOperation='source-over';
      x.drawImage(t,0,0);
    }
    return c;
  }

  // ---- layout: one row per mode (all-over on top, Body + rest below); left column = the first flatlay, right = the
  // photo being edited. The first flatlay itself edits in place on the left, the right column then stays empty.
  const GAP=12;
  // cells take the photos' aspect (the wider of the two), so the photos sit edge to edge with the same GAP across and down;
  // the whole grid is as large as fits and centred in the canvas
  function allCells(){
    const W=cv.width, H=cv.height, refs=allItems(), cols=3, rows=Math.ceil(refs.length/cols), g=GAP*(window.devicePixelRatio||1);
    const asp=Math.max(...refs.filter(v=>st(v).a).map(v=>st(v).a.mock.width/st(v).a.mock.height), 0.1)||0.75;
    const cw=Math.max(1,Math.min((W-g*(cols+1))/cols, (H-g*(rows+1))/rows*asp)), ch=cw/asp;
    const x0=(W-(cols*cw+(cols-1)*g))/2, y0=(H-(rows*ch+(rows-1)*g))/2;
    return refs.map((v,i)=>({ v, P:{ x:x0+(i%cols)*(cw+g), y:y0+Math.floor(i/cols)*(ch+g), w:cw, h:ch } }));
  }
  function cells(){
    if(allMode) return [];
    const W=cv.width, H=cv.height, M=modes(), n=M.length, one=view===refFlat(), g=GAP*(window.devicePixelRatio||1);
    const asp=Math.max(...[view,refFlat()].filter(v=>v&&st(v).a).map(v=>st(v).a.mock.width/st(v).a.mock.height), 0.1)||0.75;
    const cw=Math.max(1,Math.min((W-g*3)/2, (H-g*(n+1))/n*asp)), ch=cw/asp;
    const x0=(W-(2*cw+g))/2, y0=(H-(n*ch+(n-1)*g))/2;
    return M.map((m,i)=>{ const y=y0+i*(ch+g), L={ x:x0, y, w:cw, h:ch }, R={ x:x0+cw+g, y, w:cw, h:ch };
      return { m, L, R, E:one?L:R }; });
  }
  // every cell is the same size and the photo fills it the same way, so all photos show at one size
  function fit(A,P){
    const W0=A.mock.width, H0=A.mock.height, s=Math.min(P.w/W0, P.h/H0);
    return { ox:P.x+(P.w-W0*s)/2, oy:P.y+(P.h-H0*s)/2, W:W0*s, H:H0*s };
  }

  // ---- draw ----
  let raf=0, drag=null;
  function draw(){ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; paint(); }); }
  function drawView(v, m, T, editable){
    const s=st(v), A=s.a; if(!A) return;
    const fresh=s.img[m]&&s.key[m]===stateKey(v,m);
    ctx.fillStyle='#fff'; ctx.fillRect(T.ox,T.oy,T.W,T.H);
    if(fresh) ctx.drawImage(s.img[m],T.ox,T.oy,T.W,T.H);   // still valid (e.g. all-over while bc moves): keep the real render
    else { ctx.drawImage(A.mock,T.ox,T.oy,T.W,T.H); const p=preview(v,m);
      if(p){ ctx.globalCompositeOperation='multiply'; ctx.drawImage(p,T.ox,T.oy,T.W,T.H); ctx.globalCompositeOperation='source-over'; } }
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.strokeRect(T.ox+.5,T.oy+.5,T.W-1,T.H-1);
    if(!editable) return;
    const b=box(v,m), dpr=window.devicePixelRatio||1; if(!b||b.none) return;
    const cx=T.ox+b.cx*T.W, cy=T.oy+b.cy*T.H, w=b.w*T.W, h=b.h*T.H;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.th);
    ctx.lineWidth=2*dpr; ctx.strokeStyle='#1f6feb'; ctx.strokeRect(-w/2,-h/2,w,h);
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#e5484d'; ctx.lineWidth=2*dpr;
    ctx.beginPath(); ctx.arc(cx,cy,4*dpr,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  function paint(){
    const dpr=window.devicePixelRatio||1, rc=cv.getBoundingClientRect();
    if(cv.width!==Math.round(rc.width*dpr)||cv.height!==Math.round(rc.height*dpr)){ cv.width=Math.round(rc.width*dpr); cv.height=Math.round(rc.height*dpr); }
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    if(!view) return;
    if(allMode){ for(const c of allCells()) if(st(c.v).a) drawView(c.v, 'allover', fit(st(c.v).a,c.P), c.v===view); return; }
    const ref=refFlat();
    for(const c of cells()){
      if(view!==ref&&ref&&st(ref).a) drawView(ref, c.m, fit(st(ref).a,c.L), false);
      if(st(view).a) drawView(view, c.m, fit(st(view).a,c.E), true);
    }
  }
  function busy(t){ const b=$('busy'); b.hidden=!t; b.textContent=t; b.classList.toggle('spin',/…$/.test(t)); }
  new ResizeObserver(draw).observe($('stage'));

  // ---- interaction: bc is dragged on the edited photo of the Body + rest row ----
  const bodyCell=()=>cells().find(c=>c.m==='placement');
  const at=e=>{ const rc=cv.getBoundingClientRect(), dpr=cv.width/rc.width, C=bodyCell(), T=fit(st(view).a,C.E);
    const px=(e.clientX-rc.left)*dpr, py=(e.clientY-rc.top)*dpr; return { px, py, nx:(px-T.ox)/T.W, ny:(py-T.oy)/T.H, T, C }; };
  const inCell=p=>{ const R=p.C.E; return p.px>=R.x&&p.px<=R.x+R.w&&p.py>=R.y&&p.py<=R.y+R.h; };
  function hit(p){
    const b=box(view,'placement'); if(!b||b.none) return null;
    const cx=p.T.ox+b.cx*p.T.W, cy=p.T.oy+b.cy*p.T.H, w=b.w*p.T.W, h=b.h*p.T.H;
    const dx=p.px-cx, dy=p.py-cy, c=Math.cos(-b.th), s=Math.sin(-b.th), lx=dx*c-dy*s, ly=dx*s+dy*c;
    return Math.abs(lx)<=w/2&&Math.abs(ly)<=h/2 ? { b } : null;
  }
  const ready=()=>view&&st(view).a;
  cv.addEventListener('pointerdown',e=>{
    if(allMode){ const rc=cv.getBoundingClientRect(), d=cv.width/rc.width, x=(e.clientX-rc.left)*d, y=(e.clientY-rc.top)*d;
      const c=allCells().find(c=>x>=c.P.x&&x<=c.P.x+c.P.w&&y>=c.P.y&&y<=c.P.y+c.P.h); if(c&&c.v!==view) selectView(c.v); return; }
    if(!ready()||!bodyCell()) return; const p=at(e); if(!inCell(p)) return;
    const h=hit(p); cv.focus();
    if(h) drag={ type:'move', p0:p, bc0:[h.b.cx,h.b.cy] };
    else { const bc=[fmt(p.nx,3),fmt(p.ny,3)]; setVal({ bc }); drag={ type:'move', p0:p, bc0:bc }; }
    cv.setPointerCapture(e.pointerId); draw();
  });
  cv.addEventListener('pointermove',e=>{
    if(allMode){ cv.style.cursor='pointer'; return; }
    if(!ready()||!bodyCell()){ cv.style.cursor='default'; return; } const p=at(e);
    if(!drag){ cv.style.cursor=inCell(p)?(hit(p)?'move':'crosshair'):'default'; return; }
    if(drag.type==='move') setVal({ bc:[fmt(drag.bc0[0]+(p.nx-drag.p0.nx),3), fmt(drag.bc0[1]+(p.ny-drag.p0.ny),3)] });
  });
  const end=()=>{ if(!drag||drag.type!=='move') return; drag=null; afterEdit(); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  let idleT=0;
  cv.tabIndex=0;
  cv.addEventListener('keydown',e=>{
    if(!ready()||!bodyCell()) return;
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!d) return;
    e.preventDefault(); const b=box(view,'placement'); if(!b||b.none) return;
    const T=fit(st(view).a,bodyCell().E), px=(e.shiftKey?10:1)*(window.devicePixelRatio||1);
    setVal({ bc:[fmt(b.cx+d[0]*px/T.W,3), fmt(b.cy+d[1]*px/T.H,3)] });
    clearTimeout(idleT); idleT=setTimeout(afterEdit,600);
  });

  // write r / bc / k for the current view (an edit equal to the loaded value is dropped)
  function setVal(p){
    const key=keyOf(view), n={ ...cur(view), ...p };
    const same=n.r===view.r && JSON.stringify(n.bc)===JSON.stringify(view.bc||null) && (n.br||null)===(view.br||null);
    if(view.vid){ view.r=n.r; view.bc=n.bc; view.br=n.br; }   // uploaded views carry their own values
    else if(same) delete edits[key]; else edits[key]=n;
    syncInputs(); draw();
  }
  async function afterEdit(){
    paintViews();
    if(view===refView()) await updateBr();
    syncInputs(); draw(); renderAll();
  }
  const RMIN=0.4, RMAX=2.5;   // r slider: 0.4x .. 2.5x the original r, log scale
  function syncInputs(){
    if(!view) return; const {r,bc,br}=cur(view), r0=view.origR!==undefined?view.origR:view.r, b0=view.vid?null:(view.bc||null), br0=view.vid?null:(view.br||null);
    $('r').value=r; $('bx').value=bc?bc[0]:''; $('by').value=bc?bc[1]:'';
    $('br').value=br||''; $('br').placeholder=BR?String(fmt(BR,3)):'';
    $('rRange').value=Math.log(r/(r0*RMIN))/Math.log(RMAX/RMIN);
    $('r0').textContent=r!==r0?'was '+r0:'';
    $('bc0').textContent=JSON.stringify(bc)!==JSON.stringify(b0)?'was '+(b0?b0.join(', '):'auto'):'';
    // All compares reference flatlays: a photo added there is a flatlay, On-model is greyed out
    { const mr=document.querySelector('input[name=upKind][value=model]'), fr=document.querySelector('input[name=upKind][value=flat]');
      mr.disabled=allMode; mr.parentElement.classList.toggle('off',allMode); if(allMode) fr.checked=true; }
    // header: which photo is being edited
    $('who').textContent=MOC[vid(view)]||vid(view);
    $('whoSub').textContent=(GOF.get(view)||garment)+' · '+(isFlat(view)?'flatlay':'on-model')+(view===refView()?' · reference':'')+(view.vid?' · new upload':'');
    for(const id of ['bcGrp','brGrp']){ const g=$(id), off=allMode||!hasBody();   // no Body + rest here (or the All overview): bc / br unused   // no Body + rest on this product (or the All overview): bc / br unused
      g.classList.toggle('off',off); for(const el of g.querySelectorAll('input,button')) el.disabled=off; }
    { const ref=refView(), id=ref?(MOC[vid(ref)]||vid(ref)):'';   // where the product's br comes from, in one line
      $('brWhy').textContent=!hasBody()||allMode||!ref ? '' : br ? 'This photo uses its own br. Empty the box to follow '+id+' again.'
        : 'br '+(BR?fmt(BR,3):'…')+' comes from '+id+' at r '+fmt(cur(ref).r,4)+'. Changing that r resizes the body print on every photo without its own br.'; }
    $('br0').textContent=(br||null)!==br0?'was '+(br0||'auto'):'';
  }
  const rFromRange=()=>{ const r0=view.origR!==undefined?view.origR:view.r; return fmt(r0*RMIN*Math.pow(RMAX/RMIN,+$('rRange').value),4); };
  $('rRange').oninput=()=>{ if(!ready()) return; drag={ type:'slider' }; setVal({ r:rFromRange() }); };
  $('rRange').onchange=()=>{ drag=null; afterEdit(); };
  $('r').onchange=()=>{ const v=parseFloat($('r').value); if(v>0){ setVal({r:v}); afterEdit(); } };
  const bcIn=()=>{ const x=parseFloat($('bx').value), y=parseFloat($('by').value); if(isFinite(x)&&isFinite(y)){ setVal({bc:[x,y]}); afterEdit(); } };
  $('bx').onchange=bcIn; $('by').onchange=bcIn;
  const nudge=(dx,dy)=>e=>{ if(!ready()) return; const b=box(view,'placement'); if(!b||b.none) return;
    const s=e.shiftKey?0.02:0.005; setVal({ bc:[fmt(b.cx+dx*s,3), fmt(b.cy+dy*s,3)] }); clearTimeout(idleT); idleT=setTimeout(afterEdit,500); };
  $('bcU').onclick=nudge(0,-1); $('bcD').onclick=nudge(0,1); $('bcL').onclick=nudge(-1,0); $('bcR').onclick=nudge(1,0);
  $('bcAuto').onclick=()=>{ setVal({bc:null}); afterEdit(); };
  $('bcNone').onclick=()=>{ setVal({bc:[10,10]}); afterEdit(); };
  $('br').onchange=()=>{ const v=parseFloat($('br').value); setVal({ br:v>0?v:null }); afterEdit(); };   // empty = the garment's br
  $('reset').onclick=()=>{ if(view.vid){ view.r=view.origR; view.bc=null; view.br=null; } delete edits[keyOf(view)]; syncInputs(); afterEdit(); };
  // "<mockup id> r= bc=" (+ br= only when the view has its own)
  const lineOf=v=>{ const {r,bc,br}=cur(v); return (MOC[vid(v)]||vid(v))+' r='+fmt(r,4)+' bc='+(bc?bc.map(x=>fmt(x,3)).join(','):'auto')+(br?' br='+fmt(br,4):''); };
  const copyText=async(s,note)=>{ try{ await navigator.clipboard.writeText(s); busy(note); setTimeout(()=>busy(''),1500); }catch(e){ prompt('Copy:',s); } };
  $('copy').onclick=()=>{ if(view){ const s=lineOf(view); copyText(s,'Copied: '+s); } };
  // every photo changed on this page (all products), one line each, grouped by product
  $('copyAll').onclick=()=>{
    const L=[];
    for(const g of Object.keys(GARMENTS)){
      const vs=[...GARMENTS[g].flats, ...GARMENTS[g].models].filter(v=>edits[g+'/'+flatName(v)]).concat((uploaded[g]||[]).map(o=>o.v));
      if(vs.length) L.push('# '+g, ...vs.map(lineOf));
    }
    if(uploaded.__all&&uploaded.__all.length) L.push('# new (added on All)', ...uploaded.__all.map(o=>lineOf(o.v)));
    if(!L.length){ busy('Nothing changed yet'); setTimeout(()=>busy(''),1500); return; }
    copyText(L.join(String.fromCharCode(10)),'Copied '+L.filter(l=>l[0]!=='#').length+' photos');
  };
  $('frac').oninput=()=>{ $('fracV').textContent=$('frac').value; draw(); };
  $('frac').onchange=()=>renderAll();

  // ---- pattern ----
  let patId=0;
  function paintPat(m,name){
    const d=$('patDrop-'+m), P=patOf(m), c=document.createElement('canvas'), s=Math.min(1,240/Math.max(P.width,P.height));
    c.width=Math.max(1,Math.round(P.width*s)); c.height=Math.max(1,Math.round(P.height*s)); c.getContext('2d').drawImage(P,0,0,c.width,c.height);
    d.querySelector('img').src=c.toDataURL(); d.querySelector('.name').textContent=userPat[m]?name:'Default'; d.classList.toggle('custom',!!userPat[m]);
  }
  for(const m of ['allover','placement']){
    const drop=$('patDrop-'+m), file=$('patFile-'+m);
    drop.onclick=()=>file.click();
    drop.ondragover=e=>{ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) setPat(m,f); };
    file.onchange=()=>{ const f=file.files[0]; if(f) setPat(m,f); file.value=''; };
    drop.querySelector('.x').onclick=e=>{ e.stopPropagation(); userPat[m]=null; patId++; paintPat(m);
      try{ localStorage.removeItem(PAT_LS+'.'+m); localStorage.removeItem(PAT_LS+'.'+m+'.name'); }catch(err){} draw(); renderAll(); };
    paintPat(m);
    savedPattern(m).then(s=>{ if(s){ userPat[m]=s.img; patId++; paintPat(m,s.name); draw(); if(ready()) renderAll(); } });
  }
  async function setPat(m,f){ userPat[m]=await decodeFile(f); patId++; paintPat(m,f.name); draw(); renderAll();
    try{ const u=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });   // remembered for the next visit
      localStorage.setItem(PAT_LS+'.'+m,u); localStorage.setItem(PAT_LS+'.'+m+'.name',f.name); }catch(e){} }

  // ---- real render through the engine (the preview is only an approximation) ----
  const stateKey=(v,m)=>{ const {r,bc}=cur(v); return [vid(v),m,m==='placement'?$('frac').value:'',r,m==='placement'?JSON.stringify(bc)+brOf(v):'',patId].join('|'); };
  let jobs=0;
  async function render(v,m){
    const s=st(v), key=stateKey(v,m); if(s.img[m]&&s.key[m]===key) return;
    const {G}=await prep(v), {r,bc}=cur(v);
    const opt=m==='placement'
      ? bodyOpt({ center:true, body:{ frac:+$('frac').value, bg:[255,255,255] }, rest:{ solid:REST } }, G, { ...v, r, bc }, brOf(v))
      : { center:true };
    const c=compose(G, patOf(m), r, null, opt), o=document.createElement('canvas');   // compose reuses one canvas: copy it out
    o.width=c.width; o.height=c.height; o.getContext('2d').drawImage(c,0,0);
    if(stateKey(v,m)===key){ s.img[m]=o; s.key[m]=key; }
  }
  // the edited photo first (both rows), then the reference flatlay
  async function renderAll(){
    const my=++jobs, ref=refFlat(), todo=[];
    for(const m of modes()) todo.push([view,m]);
    if(allMode) for(const v of allItems()){ if(v!==view) todo.push([v,'allover']); }
    else if(ref&&ref!==view) for(const m of modes()) todo.push([ref,m]);
    busy('Rendering…');
    try{ for(const [v,m] of todo){ if(my!==jobs) return; await render(v,m); draw(); } }
    catch(e){ console.error(e); busy('Render failed: '+e.message); draw(); return; }
    if(my===jobs) busy(''); draw();
  }

  // ---- upload new mock + map ----
  // added to the current product as soon as both files are picked. Kind: on-model maps wrap the print round a bent limb
  // axis (tube wrap), flatlay maps do not; it only shows on a map with a curved axis line drawn on it
  let upEntry=null;
  const kindFlat=()=>document.querySelector('input[name=upKind]:checked').value==='flat';
  const addUpload=()=>{
    const fm=$('upMock').files[0], fp=$('upMap').files[0]; if(!fm||!fp) return;
    const m=/-r(\d+(?:\.\d+)?)(?=\.[a-z]+$)/i.exec(fp.name), r0=m?parseFloat(m[1]):1;
    const v={ mock:URL.createObjectURL(fm), map:URL.createObjectURL(fp), r:r0, origR:r0, bc:null,
      vid:'new-'+fm.name.replace(/\.[^.]+$/,'') };
    v.thumb=v.mock;
    upEntry={ v, flat:kindFlat() }; v.isFlat=upEntry.flat;
    const bucket=allMode?'__all':garment;   // on All the photo joins the overview, next to the references
    (uploaded[bucket]=uploaded[bucket]||[]).push(upEntry);
    selectView(v);
  };
  const fname=(id,label)=>{ const f=$(id).files[0]; $(id+'Name').textContent=f?f.name:label; };
  $('upMock').onchange=()=>{ fname('upMock','Choose image'); addUpload(); };
  $('upMap').onchange=()=>{ fname('upMap','Choose PNG'); addUpload(); };
  for(const el of document.querySelectorAll('input[name=upKind]')) el.onchange=()=>{ if(!upEntry) return; upEntry.flat=upEntry.v.isFlat=kindFlat();
    const s=st(upEntry.v); s.G=null; s.img={}; s.key={}; if(view===upEntry.v) selectView(view); };

  $('clearAll').onclick=()=>{ if(!confirm('Put every photo back to its r / bc / br from pattern-mockup.html?')) return;
    edits={}; syncInputs(); paintViews(); updateBr().then(()=>{ syncInputs(); draw(); renderAll(); }); };

  // ---- start ----
  selectView(allMode?refOf(garment):allViews(garment)[0].v);
}
</script>
</body>
</html>
