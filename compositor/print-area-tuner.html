<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Area Tuner</title>
<style>
:root{ --bg:#f4f4f2; --panel:#fff; --line:#ddd; --ink:#222; --mute:#777; --acc:#1f6feb; --warn:#b54708; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
.app{ display:grid; grid-template-columns:290px 1fr; height:100vh; }
aside{ background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px; }
.step{ font-size:12px; font-weight:600; color:var(--mute); margin:16px 0 6px; }
.step:first-child{ margin-top:0; }
select{ width:100%; padding:6px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; }
input[type=number]{ width:72px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; font:inherit; }
button{ font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; white-space:nowrap; }
button:hover{ border-color:#aaa; }
button.pri{ background:var(--acc); border-color:var(--acc); color:#fff; }
button:disabled{ opacity:.45; cursor:default; }
.tabs{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.tabs button{ flex:1; border:0; border-radius:0; padding:8px 4px; }
.tabs button.on{ background:var(--acc); color:#fff; }
.hint{ color:var(--mute); font-size:12px; margin:6px 0 0; }
.slider{ display:flex; gap:8px; align-items:center; margin-top:8px; }
.slider input{ flex:1; }
.views{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.views .v{ position:relative; border:2px solid transparent; border-radius:4px; cursor:pointer; background:#eee; aspect-ratio:3/4; overflow:hidden; }
.views .v img{ width:100%; height:100%; object-fit:cover; display:block; }
.views .v.on{ border-color:var(--acc); }
.views .v .tag{ position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:10px; padding:1px 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.views .v.edited::after{ content:''; position:absolute; top:4px; right:4px; width:9px; height:9px; border-radius:50%; background:#f59e0b; border:1px solid #fff; }
.drop{ border:1px dashed #bbb; border-radius:4px; padding:8px; text-align:center; color:var(--mute); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
details{ margin-top:16px; }
details summary{ font-size:12px; font-weight:600; color:var(--mute); cursor:pointer; }
.up{ display:grid; grid-template-columns:40px 1fr; gap:6px; align-items:center; margin-top:8px; }
.up input[type=file]{ font-size:11px; min-width:0; }
.right{ display:flex; flex-direction:column; min-width:0; }
.bar{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
.bar .grp{ display:flex; gap:6px; align-items:center; }
.bar .lbl{ color:var(--mute); }
.bar .sp{ flex:1; }
.bar .orig{ color:var(--mute); font-size:12px; }
.stage{ position:relative; flex:1; overflow:hidden; background:#cfcfcb; }
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; outline:none; }
.hud{ position:absolute; left:10px; bottom:10px; background:rgba(255,255,255,.94); border-radius:4px; padding:6px 10px; font-size:12px; pointer-events:none; max-width:70%; }
.hud:empty{ display:none; }
.hud .warn{ color:var(--warn); }
.busy{ position:absolute; right:10px; top:10px; background:#222; color:#fff; border-radius:4px; padding:4px 8px; font-size:12px; }
.legend{ position:absolute; right:10px; bottom:10px; background:rgba(255,255,255,.94); border-radius:4px; padding:6px 10px; font-size:12px; line-height:1.6; pointer-events:none; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.err{ padding:40px; color:#b42318; font-size:14px; }
@media (max-width:800px){ .app{ grid-template-columns:1fr; grid-template-rows:auto 70vh; height:auto; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="step">1. Product</div>
    <select id="garment"></select>

    <div class="step">2. Print layout</div>
    <div class="tabs" id="mode"><button data-m="allover">All-over</button><button data-m="placement">Body + rest</button></div>
    <p class="hint" id="modeNote"></p>
    <div class="slider" id="fracRow"><span class="hint" style="margin:0">Body print size</span><input type="range" id="frac" min="0.3" max="1" step="0.05" value="0.75"><span id="fracV">0.75</span></div>

    <div class="step">3. Photo <span class="hint">(orange dot = edited)</span></div>
    <div class="views" id="views"></div>

    <div class="step">Test pattern</div>
    <div class="drop" id="patDrop">Click or drop a pattern image</div>
    <input type="file" id="patFile" accept="image/*" hidden>

    <details>
      <summary>Add a new photo (mock + map)</summary>
      <div class="up"><span class="hint" style="margin:0">Mock</span><input type="file" id="upMock" accept="image/*"></div>
      <div class="up"><span class="hint" style="margin:0">Map</span><input type="file" id="upMap" accept="image/png"></div>
      <div class="up"><span class="hint" style="margin:0">Kind</span><select id="upKind"><option value="model">On-model</option><option value="flat">Flatlay</option></select></div>
      <p class="hint">A <code>-r1.25</code> suffix in the map filename sets the starting r.</p>
      <button id="upAdd" style="margin-top:6px">Add to this product</button>
    </details>
  </aside>

  <div class="right">
    <div class="bar">
      <div class="grp"><span class="lbl">r</span><input type="number" id="r" step="0.01"><span class="orig" id="r0"></span></div>
      <div class="grp" id="bcGrp"><span class="lbl">bc</span><input type="number" id="bx" step="0.005"><input type="number" id="by" step="0.005"><span class="orig" id="bc0"></span></div>
      <div class="grp" id="bcBtns"><button id="bcAuto" title="Clear bc: the engine uses the body centroid (red dot)">Auto centre</button><button id="bcNone" title="bc [10,10]">No body print</button></div>
      <button id="reset" title="Put r and bc of this photo back to the values in pattern-mockup.html">Undo this photo</button>
      <span class="sp"></span>
      <button class="pri" id="copyAll" disabled>Copy new r/bc</button>
      <button id="clearAll" title="Put every photo back to the values in pattern-mockup.html">Undo all photos</button>
    </div>
    <main class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud"></div>
      <div class="legend" id="legend"></div>
      <div class="busy" id="busy" hidden></div>
    </main>
  </div>
</div>

<script>
'use strict';
// Loads GARMENT DATA + SHARED BLOCK straight out of pattern-mockup.html, so this page always runs the current views and
// the real engine (no third copy to keep in sync). Needs http(s): file:// cannot fetch a sibling file.
(async()=>{
  const SRC='pattern-mockup.html';
  let text;
  try{ const res=await fetch(SRC,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); text=await res.text(); }
  catch(e){ document.getElementById('app').innerHTML='<div class="err">Cannot read '+SRC+' ('+e.message+'). Open this page through an http server, e.g. http://localhost:4178/compositor/print-area-tuner.html</div>'; return; }
  const cut=(a,b)=>{ const i=text.indexOf(a), j=text.indexOf(b,i); if(i<0||j<0) throw new Error('marker missing: '+a); return text.slice(i,j+b.length); };
  const code=cut('// ===== GARMENT DATA','// ===== END GARMENT DATA =====')+'\n'+cut('// ===== SHARED BLOCK','// ===== END SHARED BLOCK =====');
  const s=document.createElement('script'); s.textContent="'use strict';\n"+code+'\nwindow.__ENGINE_OK=true;';
  // products with no separate body panel: page code of the dev tool, outside both blocks
  const np=/const NO_PLACEMENT=new Set\((\[[^\]]*\])\)/.exec(text);
  window.__NO_PLACEMENT=np?JSON.parse(np[1].replace(/'/g,'"')):[];
  document.head.appendChild(s);
  if(!window.__ENGINE_OK){ document.getElementById('app').innerHTML='<div class="err">The engine in '+SRC+' failed to run, see the console.</div>'; return; }
  main();
})();

function main(){
  const $=id=>document.getElementById(id);
  const cv=$('cv'), ctx=cv.getContext('2d');
  const LS='printAreaTuner.v1';
  const fmt=(x,d)=>+(+x).toFixed(d);
  const REST=[232,232,232];      // Body + rest preview: rest of the fabric in light grey, body around the file white

  // ---- state ----
  let garment=Object.keys(GARMENTS)[0], view=null, mode='allover';
  const hasBody=()=>!window.__NO_PLACEMENT.includes(garment);
  let edits={}; try{ edits=JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ edits={}; }
  const saveEdits=()=>{ try{ localStorage.setItem(LS,JSON.stringify(edits)); }catch(e){} };
  const uploaded={};             // garment -> [{v,flat}] added in this tab
  const fileOf=u=>String(u).startsWith(CDN)?u.slice(CDN.length):u;
  const vid=v=>v.vid||flatName(v);
  const keyOf=v=>garment+'/'+vid(v);
  const allViews=g=>[...GARMENTS[g].flats.map(v=>({v,flat:true})), ...GARMENTS[g].models.map(v=>({v,flat:false})), ...(uploaded[g]||[])];
  const cur=v=>{ const e=edits[keyOf(v)]; return { r:e?e.r:v.r, bc:e?e.bc:(v.bc||null) }; };
  const isFlat=v=>allViews(garment).some(o=>o.v===v&&o.flat);
  const refFlat=()=>GARMENTS[garment].flats[0];                       // left pane: always the first flatlay
  const refView=()=>{ const g=GARMENTS[garment]; return g.flats[g.bodyRef||0]; };   // K reference (Body + rest)

  let pat=testPattern(), K=0;
  // per view: { a: assets, G: analysed garment, img: last real render, key: its state key }
  const S=new Map(); const st=v=>{ if(!S.has(v)) S.set(v,{}); return S.get(v); };
  const assetCache=new Map();

  function testPattern(){
    const c=document.createElement('canvas'); c.width=c.height=600; const x=c.getContext('2d');
    x.fillStyle='#f3d9b1'; x.fillRect(0,0,600,600);
    x.fillStyle='#e07a5f'; x.fillRect(0,0,300,300); x.fillRect(300,300,300,300);
    x.strokeStyle='#3d405b'; x.lineWidth=14; x.strokeRect(7,7,586,586);
    x.fillStyle='#3d405b'; x.beginPath(); x.arc(300,300,150,0,Math.PI*2); x.fill();
    x.fillStyle='#fff'; x.font='bold 110px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('TOP',300,300);
    return c;
  }

  // ---- UI: garment + views ----
  for(const g of Object.keys(GARMENTS)){ const o=document.createElement('option'); o.value=g; o.textContent=g+(TYPE_CODE[g]?' ('+TYPE_CODE[g]+')':''); $('garment').appendChild(o); }
  $('garment').onchange=()=>{ garment=$('garment').value; K=0; setMode(mode,true); selectView(allViews(garment)[0].v); };

  function paintViews(){
    const box=$('views'); box.innerHTML='';
    for(const {v,flat} of allViews(garment)){
      const d=document.createElement('div'); d.className='v'+(v===view?' on':'')+(edits[keyOf(v)]?' edited':'');
      const im=document.createElement('img'); im.loading='lazy'; im.src=v.thumb||(v.mock+(v.mock.includes('?')?'&':'?')+'width=200'); d.appendChild(im);
      const t=document.createElement('div'); t.className='tag'; t.textContent=(flat?'F · ':'')+(MOC[vid(v)]||vid(v)); d.appendChild(t);
      d.title=vid(v); d.onclick=()=>selectView(v); box.appendChild(d);
    }
  }

  // load + analyse one view (mock, masks, engine garment); cached
  async function prep(v){
    const s=st(v);
    if(!s.a) s.a=await loadAssets(v);
    if(!s.G) s.G=await analyzeGarment(v, !isFlat(v));
    return s;
  }
  async function selectView(v){
    view=v; paintViews(); syncInputs(); draw();
    busy('Loading…');
    try{
      const ref=refFlat();
      await Promise.all([prep(v), ref?prep(ref):null]);
      if(view!==v) return;
      await updateK();
    }catch(e){ console.error(e); hud('<span class="warn">Error: '+e.message+'</span>'); busy(''); return; }
    busy(''); draw(); renderAll();
  }

  // mock + two alpha masks at display size (fabric = ids 1..8, body = id 1) + the body centroid
  async function loadAssets(v){
    if(assetCache.has(v.map)) return assetCache.get(v.map);
    const [mock,map]=await Promise.all([loadImg(v.mock), loadPng(v.map)]);
    const sc=Math.min(1, 1200/mock.width), w=Math.round(mock.width*sc), h=Math.round(mock.height*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d',{willReadFrequently:true});
    x.imageSmoothingEnabled=false; x.drawImage(map,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;
    const mk=()=>{ const m=document.createElement('canvas'); m.width=w; m.height=h; const mx=m.getContext('2d'); return { m, mx, id:mx.createImageData(w,h) }; };
    const F=mk(), B=mk(); let sx=0, sy=0, n=0;
    for(let i=0,p=0;i<w*h;i++,p+=4){ const k=((d[p]+10)/20)|0;
      if(k>=1&&k<=8) F.id.data[p+3]=255;
      if(k===1){ B.id.data[p+3]=255; sx+=i%w; sy+=(i/w)|0; n++; } }
    F.mx.putImageData(F.id,0,0); B.mx.putImageData(B.id,0,0);
    const a={ mock, w, h, fab:F.m, body:B.m, cent:n?[(sx/n+0.5)/w,(sy/n+0.5)/h]:[0.5,0.5] };
    assetCache.set(v.map,a); return a;
  }

  // K = pattern width / body width of the garment's bodyRef flat at its CURRENT r (an edit to that r moves every other view)
  async function updateK(){
    const ref=refView(); if(!ref){ K=0; return; }
    K=bodyK((await prep(ref)).G, cur(ref).r);
  }
  const kOf=v=>v.k||K;
  // Body + rest on the K reference view without its own k: body width is the measured one, r does not change it
  const rLocked=v=>mode==='placement'&&v===refView()&&!v.k;

  // ---- geometry: the print box of a view, mock-normalised ----
  // all-over: one repeat tile, width r, centred on the body centroid (the engine's center:true).
  // placement: the file printed once, width frac x r / K, centre bc | centroid.
  function box(v){
    const s=st(v); if(!s.a) return null;
    const {r,bc}=cur(v), A=s.a, G=s.G, ar=pat.height/pat.width;
    let wN, c, kind;
    if(mode==='placement'){
      const k=kOf(v), frac=+$('frac').value; if(!k) return null;
      const m=G?bodyMode(G,{r,bc}):(bc?'bc':'auto');
      if(m==='none') return { none:true };
      if(rLocked(v)&&G){ const e=G.ext; wN=frac*(e.x1[1]-e.x0[1])/G.w; } else wN=frac*r/k;
      c=bc||A.cent; kind=m;
    } else { wN=r; c=A.cent; kind='tile'; }
    const th=G&&G.cs?Math.atan2(G.sn[1],G.cs[1]):0;
    return { cx:c[0], cy:c[1], w:wN, h:wN*A.mock.width*ar/A.mock.height, th, kind };
  }

  // quick preview of the print at display size (multiplied onto the mock): pattern tiled / placed, clipped to the map
  function preview(v){
    const s=st(v), A=s.a, b=box(v); if(!A) return null;
    const c=s.pv||(s.pv=document.createElement('canvas')); c.width=A.w; c.height=A.h; const x=c.getContext('2d');
    if(mode==='allover'){
      if(!b) return null;
      const tw=b.w*A.w, th=tw*pat.height/pat.width, P=x.createPattern(pat,'repeat');
      P.setTransform(new DOMMatrix().translate(b.cx*A.w,b.cy*A.h).rotate(b.th*180/Math.PI).translate(-tw/2,-th/2).scale(tw/pat.width,th/pat.height));
      x.fillStyle=P; x.fillRect(0,0,A.w,A.h);
      x.globalCompositeOperation='destination-in'; x.drawImage(A.fab,0,0); x.globalCompositeOperation='source-over';
    } else {
      x.fillStyle='rgb('+REST+')'; x.fillRect(0,0,A.w,A.h);
      x.globalCompositeOperation='destination-in'; x.drawImage(A.fab,0,0); x.globalCompositeOperation='source-over';
      const t=s.pb||(s.pb=document.createElement('canvas')); t.width=A.w; t.height=A.h; const y=t.getContext('2d');
      y.fillStyle='#fff'; y.fillRect(0,0,A.w,A.h);
      if(b&&!b.none){ y.save(); y.translate(b.cx*A.w,b.cy*A.h); y.rotate(b.th); const w=b.w*A.w, h=b.h*A.h; y.drawImage(pat,-w/2,-h/2,w,h); y.restore(); }
      y.globalCompositeOperation='destination-in'; y.drawImage(A.body,0,0); y.globalCompositeOperation='source-over';
      x.drawImage(t,0,0);
    }
    return c;
  }

  // ---- layout: left half = first flatlay (reference), right half = the photo being edited ----
  const GAP=12;
  function panes(){
    const W=cv.width, H=cv.height, top=34*(window.devicePixelRatio||1), hw=(W-GAP*3)/2;
    return { L:{ x:GAP, y:top, w:hw, h:H-top-GAP }, R:{ x:GAP*2+hw, y:top, w:hw, h:H-top-GAP } };
  }
  // pad = margin around the photo as a fraction of its size; the edited photo keeps room to drag bc outside the frame
  function fit(A,P,pad){
    const W0=A.mock.width, H0=A.mock.height, s=Math.min(P.w/(W0*(1+2*pad)), P.h/(H0*(1+2*pad)));
    return { ox:P.x+(P.w-W0*s)/2, oy:P.y+(P.h-H0*s)/2, W:W0*s, H:H0*s };
  }
  const padR=()=>mode==='placement'?0.25:0.02;

  // ---- draw ----
  let raf=0, drag=null;
  function draw(){ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; paint(); }); }
  function drawView(v, T, editable){
    const s=st(v), A=s.a; if(!A) return;
    const fresh=s.img&&s.key===stateKey(v);
    ctx.fillStyle='#fff'; ctx.fillRect(T.ox,T.oy,T.W,T.H);
    if(fresh&&!(editable&&drag)) ctx.drawImage(s.img,T.ox,T.oy,T.W,T.H);
    else { ctx.drawImage(A.mock,T.ox,T.oy,T.W,T.H); const p=preview(v);
      if(p){ ctx.globalCompositeOperation='multiply'; ctx.drawImage(p,T.ox,T.oy,T.W,T.H); ctx.globalCompositeOperation='source-over'; } }
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.strokeRect(T.ox+.5,T.oy+.5,T.W-1,T.H-1);
    if(!editable) return;
    const b=box(v), dpr=window.devicePixelRatio||1; if(!b||b.none) return;
    const cx=T.ox+b.cx*T.W, cy=T.oy+b.cy*T.H, w=b.w*T.W, h=b.h*T.H;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.th);
    ctx.lineWidth=2*dpr; ctx.strokeStyle='#1f6feb'; ctx.strokeRect(-w/2,-h/2,w,h);
    if(!rLocked(v)){ ctx.fillStyle='#fff'; for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ ctx.beginPath(); ctx.arc(sx*w/2,sy*h/2,6*dpr,0,Math.PI*2); ctx.fill(); ctx.stroke(); } }
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#e5484d'; ctx.lineWidth=2*dpr;
    ctx.beginPath(); ctx.arc(cx,cy,4*dpr,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  function label(t,P,dpr){ ctx.fillStyle='#333'; ctx.font=(12*dpr)+'px system-ui,sans-serif'; ctx.textBaseline='middle'; ctx.fillText(t,P.x,P.y/2+2*dpr); }
  function paint(){
    const dpr=window.devicePixelRatio||1, rc=cv.getBoundingClientRect();
    if(cv.width!==Math.round(rc.width*dpr)||cv.height!==Math.round(rc.height*dpr)){ cv.width=Math.round(rc.width*dpr); cv.height=Math.round(rc.height*dpr); }
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    if(!view) return;
    const {L,R}=panes(), ref=refFlat();
    if(ref&&st(ref).a){ drawView(ref, fit(st(ref).a,L,0.02), false); label('Reference: '+(MOC[vid(ref)]||vid(ref))+' · r '+fmt(cur(ref).r,4), L, dpr); }
    if(st(view).a){ drawView(view, fit(st(view).a,R,padR()), true); label('Editing: '+(MOC[vid(view)]||vid(view))+' · r '+fmt(cur(view).r,4), R, dpr); }
    hudInfo();
  }
  function hud(h){ $('hud').innerHTML=h; }
  function hudInfo(){
    const b=box(view), {bc}=cur(view), L=[];
    if(mode==='placement'){
      if(b&&b.none) L.push('<span class="warn">The body is cropped and has no centre: nothing prints on it. Click where the centre should go.</span>');
      else if(bc&&(bc[0]>3||bc[1]>3)) L.push('<span class="warn">Set to "no body print". Click the photo to place a centre.</span>');
      else if(b&&b.kind==='auto') L.push('Centre is automatic (red dot). Drag the box to set your own.');
      if(rLocked(view)) L.push('<span class="warn">This photo sets the body size for the whole product, so the box size is fixed here. Change its r in the All-over tab.</span>');
    }
    hud(L.join('<br>'));
    $('legend').innerHTML=mode==='placement'
      ? 'Blue box = the pattern printed on the body.<br>Drag the box to move it, drag a corner to resize.'
      : 'Blue box = one repeat of the pattern.<br>Drag anywhere on the right photo: away from the red dot = bigger, towards it = smaller. Mouse wheel also works.';
  }
  function busy(t){ $('busy').hidden=!t; $('busy').textContent=t; }
  new ResizeObserver(draw).observe($('stage'));

  // ---- interaction (right pane only) ----
  const at=e=>{ const rc=cv.getBoundingClientRect(), dpr=cv.width/rc.width, T=fit(st(view).a,panes().R,padR());
    const px=(e.clientX-rc.left)*dpr, py=(e.clientY-rc.top)*dpr; return { px, py, nx:(px-T.ox)/T.W, ny:(py-T.oy)/T.H, T }; };
  const inRight=p=>{ const R=panes().R; return p.px>=R.x&&p.px<=R.x+R.w&&p.py>=R.y&&p.py<=R.y+R.h; };
  function hit(p){
    const b=box(view); if(!b||b.none) return null;
    const cx=p.T.ox+b.cx*p.T.W, cy=p.T.oy+b.cy*p.T.H, w=b.w*p.T.W, h=b.h*p.T.H;
    const dx=p.px-cx, dy=p.py-cy, c=Math.cos(-b.th), s=Math.sin(-b.th), lx=dx*c-dy*s, ly=dx*s+dy*c;
    const R=12*(window.devicePixelRatio||1);
    if(!rLocked(view)) for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]) if(Math.hypot(lx-sx*w/2,ly-sy*h/2)<R) return { type:'resize', cx, cy };
    if(Math.abs(lx)<=w/2&&Math.abs(ly)<=h/2) return { type:'move', b, cx, cy };
    return { type:'out', cx, cy };
  }
  const ready=()=>view&&st(view).a;
  cv.addEventListener('pointerdown',e=>{
    if(!ready()) return; const p=at(e); if(!inRight(p)) return;
    const h=hit(p); cv.focus();
    if(mode==='allover'){
      if(!h) return; const d0=Math.hypot(p.px-h.cx,p.py-h.cy);
      drag={ type:'resize', cx:h.cx, cy:h.cy, d0:Math.max(d0,8), r0:cur(view).r };
    } else if(h&&h.type==='resize') drag={ type:'resize', cx:h.cx, cy:h.cy, d0:Math.hypot(p.px-h.cx,p.py-h.cy), r0:cur(view).r };
    else if(h&&h.type==='move') drag={ type:'move', p0:p, bc0:[h.b.cx,h.b.cy] };
    else { const bc=[fmt(p.nx,3),fmt(p.ny,3)]; setVal({ bc }); drag={ type:'move', p0:p, bc0:bc }; }
    cv.setPointerCapture(e.pointerId); draw();
  });
  cv.addEventListener('pointermove',e=>{
    if(!ready()) return; const p=at(e);
    if(!drag){ let c='default';
      if(inRight(p)){ const h=hit(p); c=mode==='allover'?(rLocked(view)?'default':'nwse-resize'):h&&h.type==='resize'?'nwse-resize':h&&h.type==='move'?'move':'crosshair'; }
      cv.style.cursor=c; return; }
    if(drag.type==='move') setVal({ bc:[fmt(drag.bc0[0]+(p.nx-drag.p0.nx),3), fmt(drag.bc0[1]+(p.ny-drag.p0.ny),3)] });
    else if(drag.d0>2) setVal({ r:fmt(drag.r0*Math.hypot(p.px-drag.cx,p.py-drag.cy)/drag.d0,4) });
  });
  const end=()=>{ if(!drag) return; drag=null; afterEdit(); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  let idleT=0;
  cv.addEventListener('wheel',e=>{
    if(!ready()||rLocked(view)||!inRight(at(e))) return; e.preventDefault();
    setVal({ r:fmt(cur(view).r*(e.deltaY<0?1.02:1/1.02),4) });
    clearTimeout(idleT); idleT=setTimeout(afterEdit,500);
  },{passive:false});
  cv.tabIndex=0;
  cv.addEventListener('keydown',e=>{
    if(!ready()||mode!=='placement') return;
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!d) return;
    e.preventDefault(); const b=box(view); if(!b||b.none) return;
    const T=fit(st(view).a,panes().R,padR()), px=(e.shiftKey?10:1)*(window.devicePixelRatio||1);
    setVal({ bc:[fmt(b.cx+d[0]*px/T.W,3), fmt(b.cy+d[1]*px/T.H,3)] });
    clearTimeout(idleT); idleT=setTimeout(afterEdit,600);
  });

  // write r / bc for the current view (an edit equal to the original is dropped)
  function setVal(p){
    const k=keyOf(view), c=cur(view), n={ r:p.r!==undefined?p.r:c.r, bc:p.bc!==undefined?p.bc:c.bc };
    const same=n.r===view.r && JSON.stringify(n.bc)===JSON.stringify(view.bc||null);
    if(view.vid){ view.r=n.r; view.bc=n.bc; }   // uploaded views carry their own values
    else if(same) delete edits[k]; else edits[k]=n;
    saveEdits(); syncInputs(); draw();
  }
  async function afterEdit(){
    paintViews(); paintChanges();
    if(view===refView()) await updateK();
    draw(); renderAll();
  }
  function syncInputs(){
    if(!view) return; const {r,bc}=cur(view), r0=view.origR!==undefined?view.origR:view.r, b0=view.vid?null:(view.bc||null);
    $('r').value=r; $('bx').value=bc?bc[0]:''; $('by').value=bc?bc[1]:'';
    $('r0').textContent=r!==r0?'(was '+r0+')':'';
    $('bc0').textContent=JSON.stringify(bc)!==JSON.stringify(b0)?'(was '+(b0?b0.join(', '):'auto')+')':'';
    const off=mode!=='placement'; $('bcGrp').style.display=$('bcBtns').style.display=off?'none':'';
  }
  $('r').onchange=()=>{ const v=parseFloat($('r').value); if(v>0){ setVal({r:v}); afterEdit(); } };
  const bcIn=()=>{ const x=parseFloat($('bx').value), y=parseFloat($('by').value); if(isFinite(x)&&isFinite(y)){ setVal({bc:[x,y]}); afterEdit(); } };
  $('bx').onchange=bcIn; $('by').onchange=bcIn;
  $('bcAuto').onclick=()=>{ setVal({bc:null}); afterEdit(); };
  $('bcNone').onclick=()=>{ setVal({bc:[10,10]}); afterEdit(); };
  $('reset').onclick=()=>{ if(view.vid){ view.r=view.origR; view.bc=null; } delete edits[keyOf(view)]; saveEdits(); syncInputs(); afterEdit(); };

  // ---- mode / frac ----
  function setMode(m,quiet){ if(!hasBody()) m='allover'; mode=m; $('mode').querySelector('[data-m=placement]').style.display=hasBody()?'':'none';
    for(const b of $('mode').children) b.classList.toggle('on',b.dataset.m===m);
    $('modeNote').textContent=m==='placement'
      ? 'The pattern prints once on the body. Set its position (bc) and size (r).'
      : 'The pattern repeats over the fabric. Set the tile size (r).';
    $('fracRow').style.display=m==='placement'?'':'none';
    syncInputs(); draw(); if(!quiet&&ready()) renderAll(); }
  for(const b of $('mode').children) b.onclick=()=>setMode(b.dataset.m);
  $('frac').oninput=()=>{ $('fracV').textContent=$('frac').value; draw(); };
  $('frac').onchange=()=>renderAll();

  // ---- pattern ----
  $('patDrop').onclick=()=>$('patFile').click();
  $('patDrop').ondragover=e=>e.preventDefault();
  $('patDrop').ondrop=e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) setPat(f); };
  $('patFile').onchange=()=>{ const f=$('patFile').files[0]; if(f) setPat(f); };
  let patId=0;
  async function setPat(f){ pat=await decodeFile(f); patId++; $('patDrop').textContent=f.name; draw(); renderAll(); }

  // ---- real render through the engine (the preview is only an approximation) ----
  const stateKey=v=>{ const {r,bc}=cur(v); return [vid(v),mode,$('frac').value,r,JSON.stringify(bc),kOf(v),patId].join('|'); };
  let jobs=0;
  async function render(v){
    const s=st(v), key=stateKey(v); if(s.img&&s.key===key) return;
    const {G}=await prep(v), {r,bc}=cur(v);
    const opt=mode==='placement'
      ? bodyOpt({ center:true, body:{ frac:+$('frac').value, bg:[255,255,255] }, rest:{ solid:REST } }, G, { ...v, r, bc }, kOf(v))
      : { center:true };
    const c=compose(G, pat, r, null, opt), o=document.createElement('canvas');   // compose reuses one canvas: copy it out
    o.width=c.width; o.height=c.height; o.getContext('2d').drawImage(c,0,0);
    if(stateKey(v)===key){ s.img=o; s.key=key; }
  }
  async function renderAll(){
    const my=++jobs; busy('Rendering…');
    try{ await render(view); draw(); const ref=refFlat(); if(ref&&ref!==view&&my===jobs) await render(ref); }
    catch(e){ console.error(e); hud('<span class="warn">Render failed: '+e.message+'</span>'); }
    if(my===jobs) busy(''); draw();
  }

  // ---- upload new mock + map ----
  $('upAdd').onclick=()=>{
    const fm=$('upMock').files[0], fp=$('upMap').files[0];
    if(!fm||!fp){ alert('Pick both a mock and a map.'); return; }
    const m=/-r(\d+(?:\.\d+)?)(?=\.[a-z]+$)/i.exec(fp.name), r0=m?parseFloat(m[1]):1;
    const v={ mock:URL.createObjectURL(fm), map:URL.createObjectURL(fp), r:r0, origR:r0, bc:null,
      vid:'new-'+fm.name.replace(/\.[^.]+$/,''), mockName:fm.name, mapName:fp.name.replace(/-r\d+(?:\.\d+)?(?=\.[a-z]+$)/i,'') };
    v.thumb=v.mock;
    (uploaded[garment]=uploaded[garment]||[]).push({ v, flat:$('upKind').value==='flat' });
    selectView(v); paintChanges();
  };

  // ---- output ----
  const vLine=(v,r,bc)=>{
    const mk=v.vid?v.mockName:fileOf(v.mock), mp=v.vid?v.mapName:fileOf(v.map);
    let s="V('"+mk+"','"+mp+"',"+fmt(r,4);
    if(bc) s+=',['+bc.map(x=>String(fmt(x,3))).join(',')+']'; else if(v.k) s+=',null';
    if(v.k) s+=','+v.k;
    return s+')';
  };
  function changeList(){
    const out=[];
    for(const g of Object.keys(GARMENTS)){
      for(const v of [...GARMENTS[g].flats, ...GARMENTS[g].models]){ const e=edits[g+'/'+flatName(v)]; if(e) out.push({ g, v, line:vLine(v,e.r,e.bc) }); }
      for(const {v} of uploaded[g]||[]) out.push({ g, v, line:vLine(v,v.r,v.bc) });
    }
    return out;
  }
  function paintChanges(){
    const n=changeList().length; $('copyAll').disabled=!n; $('copyAll').textContent=n?'Copy new r/bc ('+n+' photo'+(n!==1?'s':'')+')':'Copy new r/bc';
    $('copyAll').title=n?'Copies the V(...) line of every changed photo. Send it to Claude, or paste it over the matching lines in GARMENT DATA of pattern-mockup.html':'Nothing changed yet';
  }
  async function copy(t){ try{ await navigator.clipboard.writeText(t); busy('Copied'); setTimeout(()=>busy(''),900); }catch(e){ prompt('Copy:',t); } }
  $('copyAll').onclick=()=>{ const L=changeList(); if(L.length) copy(L.map(c=>'// '+c.g+' · '+vid(c.v)+'\n'+c.line+',').join('\n')); };
  $('clearAll').onclick=()=>{ if(!confirm('Put every photo back to its original r and bc?')) return; edits={}; saveEdits(); syncInputs(); paintViews(); paintChanges(); afterEdit(); };

  // ---- start ----
  setMode('allover',true); paintChanges();
  selectView(allViews(garment)[0].v);
}
</script>
</body>
</html>
