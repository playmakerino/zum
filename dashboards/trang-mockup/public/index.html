<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Mockup Performance</span>
      <span class="cache-time" id="headerCachedAt"></span>
    </div>
    <div class="topbar-actions">
      <span class="period-label" id="periodLabel"></span>
      <div class="tooltip-wrap">
        <button class="btn btn-primary" onclick="fetchAll()"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 8A6 6 0 0 0 4.7 6.5M4.5 12a6 6 0 0 0 10.8 1.5"/><path d="M4.5 3.5v3h3M15.5 16.5v-3h-3"/></svg>Load Data</button>
        <div class="tooltip-box">Fetches fresh data from Meta API. Frequent use may trigger rate limits — wait a few minutes between loads.</div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="card">
    <div class="card-head">
      <nav class="topbar-tabs">
        <button class="tab-btn active" data-page="mockups" onclick="showPage('mockups')">By Mockup</button>
        <button class="tab-btn" data-page="creatives" onclick="showPage('creatives')">By Image</button>
        <span class="tab-sep" id="subTabSep" style="display:none"></span>
        <button class="sub-tab active" data-sub="creativesValid" onclick="showCreativeSub('creativesValid')" style="display:none">Full Format</button>
        <button class="sub-tab" data-sub="creativesSpend" onclick="showCreativeSub('creativesSpend')" style="display:none">High Spend</button>
      </nav>
    </div>
    <div id="page-mockups" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="mockupsTable"><thead><tr></tr></thead><tbody id="mockupsBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Click "Load Data" to start'><div class="load-log" id="mockupsLoadLog"></div></div>
    </div>

    <div id="page-creatives" class="page">
      <div id="sub-creativesValid" class="sub-page active">
        <div class="table-wrap">
          <div class="table-scroll">
            <table id="creativesValidTable"><thead><tr></tr></thead><tbody id="creativesValidBody"></tbody></table>
          </div>
        </div>
      </div>
      <div id="sub-creativesSpend" class="sub-page">
        <div class="table-wrap">
          <div class="table-scroll">
            <table id="creativesSpendTable"><thead><tr></tr></thead><tbody id="creativesSpendBody"></tbody></table>
          </div>
        </div>
      </div>
      <div class="card-foot" data-empty='Click "Load Data" to start'><div class="load-log" id="creativesLoadLog"></div></div>
    </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="filterPopup" class="filter-popup">
  <div class="filter-popup-title" id="filterPopupTitle"></div>
  <div class="filter-popup-body">
    <div class="filter-chips">
      <select id="filterOp" data-dd="chip" onchange="onFilterOpChange()">
        <option value="gt">greater than</option>
        <option value="lt">less than</option>
        <option value="between">between</option>
        <option value="notBetween">not between</option>
      </select>
      <button type="button" class="filter-value-chip" id="filterValueChip">Add value</button>
    </div>
  </div>
  <div class="filter-editor">
    <div class="filter-inputs">
      <input type="number" id="filterVal1" step="any" placeholder="0" onkeydown="if(event.key==='Enter')applyFilter()">
      <span id="filterAnd" class="filter-and" style="display:none">and</span>
      <input type="number" id="filterVal2" step="any" placeholder="0" style="display:none" onkeydown="if(event.key==='Enter')applyFilter()">
    </div>
    <div class="filter-popup-actions">
      <button class="filter-clear" onclick="clearCurrentFilter()">Clear</button>
      <button class="btn btn-primary" onclick="applyFilter()">Apply</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
