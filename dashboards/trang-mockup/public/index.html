<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Mockup Performance</span>
      <span class="cache-time" id="headerCachedAt"></span>
    </div>
    <div class="topbar-actions">
      <div id="dateRange"></div>
      <button type="button" class="press-btn" id="controlsBtn" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 6.5h5M12.5 6.5h4M3.5 13.5h2M9.5 13.5h7"/><circle cx="10.5" cy="6.5" r="2"/><circle cx="7.5" cy="13.5" r="2"/></svg>Controls</button>
    </div>
  </header>

  <main class="main">
    <div class="report-layout" id="reportLayout">
    <div class="card">
    <div id="page-mockups" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="mockupsTable"><thead><tr></tr></thead><tbody id="mockupsBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Pick a date range and click "Load Data"'><div class="load-log" id="mockupsLoadLog"></div></div>
    </div>

    <div id="page-creatives" class="page">
      <div id="sub-creativesValid" class="sub-page active">
        <div class="table-wrap">
          <div class="table-scroll">
            <table id="creativesValidTable"><thead><tr></tr></thead><tbody id="creativesValidBody"></tbody></table>
          </div>
        </div>
      </div>
      <div id="sub-creativesSpend" class="sub-page">
        <div class="table-wrap">
          <div class="table-scroll">
            <table id="creativesSpendTable"><thead><tr></tr></thead><tbody id="creativesSpendBody"></tbody></table>
          </div>
        </div>
      </div>
      <div class="card-foot" data-empty='Pick a date range and click "Load Data"'><div class="load-log" id="creativesLoadLog"></div></div>
    </div>
    </div>
    <aside class="card report-panel">
      <div id="filterSec"></div>
      <div id="metricSec"></div>
      <div id="dimSec"></div>
    </aside>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
