<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Most Spent Image Ad by Design</span>
      <span class="cache-time" id="headerCachedAt"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="fetchAll()" data-tip-title="Load Data" data-tip="Reads active and paused image ads over $100 in the last 12 months from Triple Whale, in a few seconds. Pick active or paused with the Status filter."><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 8A6 6 0 0 0 4.7 6.5M4.5 12a6 6 0 0 0 10.8 1.5"/><path d="M4.5 3.5v3h3M15.5 16.5v-3h-3"/></svg>Load Data</button>
      <button type="button" class="press-btn" id="controlsBtn" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 6.5h5M12.5 6.5h4M3.5 13.5h2M9.5 13.5h7"/><circle cx="10.5" cy="6.5" r="2"/><circle cx="7.5" cy="13.5" r="2"/></svg>Controls</button>
    </div>
  </header>

  <main class="main">
    <div class="report-layout" id="reportLayout">
    <div class="card">
    <div id="page-ads" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="adsTable"><thead><tr>
            <th class="th-thumb" aria-label="Thumbnail"></th>
            <th data-sort="print_id" onclick="sortTable('ads','print_id')"><div class="th-content">Print ID <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th><div class="th-content">Ad name</div></th>
            <th><div class="th-content">Link</div></th>
            <th data-sort="spend" onclick="sortTable('ads','spend')"><div class="th-content">Spend <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="roas" onclick="sortTable('ads','roas')"><div class="th-content">ROAS <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
          </tr></thead><tbody id="adsBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Click "Load Data" to start'><div class="load-log" id="adsLoadLog"></div></div>
    </div>
    </div>
    <aside class="card report-panel">
      <div id="filterSec"></div>
      <div class="rp-sec"><div class="rp-head"><span>Dimensions</span></div><div class="rp-row"><span class="rp-label">Print ID</span><span class="rp-icon rp-info" data-tip-title="Print ID" data-tip="One row per design (print and product type): the ad with the most spend among the ads the Status filter keeps." aria-label="About Print ID"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg></span></div><div class="rp-row"><span class="rp-label">Ad name</span><span class="rp-icon rp-info" data-tip-title="Ad name" data-tip="Name of that ad in Meta." aria-label="About Ad name"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg></span></div><div class="rp-row"><span class="rp-label">Link</span><span class="rp-icon rp-info" data-tip-title="Link" data-tip="Product page the ad links to." aria-label="About Link"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg></span></div></div>
      <div id="metricSec"></div>
    </aside>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
