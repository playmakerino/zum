<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Most Spent Image Ad by Design</span>
      <span class="cache-time" id="headerCachedAt"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="fetchAll('active')" data-tip-title="Load Active Ads" data-tip="Top-spend image ad per design, from ads that are active now. Usually loads in under a minute."><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 8A6 6 0 0 0 4.7 6.5M4.5 12a6 6 0 0 0 10.8 1.5"/><path d="M4.5 3.5v3h3M15.5 16.5v-3h-3"/></svg>Load Active Ads</button>
      <button class="btn btn-secondary" style="opacity:0.45" data-tip-title="Load All" data-tip="Includes paused ads and takes a few minutes. Click once and wait: clicking again will hit Meta's rate limit." onclick="fetchAll('all')"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 8A6 6 0 0 0 4.7 6.5M4.5 12a6 6 0 0 0 10.8 1.5"/><path d="M4.5 3.5v3h3M15.5 16.5v-3h-3"/></svg>Load All</button>
    </div>
  </header>

  <main class="main">
    <div class="card">
    <div class="card-head">
      <span class="card-title" id="modeTitle"></span>
    </div>
    <div id="page-ads" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="adsTable"><colgroup><col class="col-img"><col class="col-pid"><col class="col-name"><col class="col-link"><col class="col-spend"><col class="col-roas"></colgroup><thead><tr>
            <th>Image</th>
            <th data-sort="print_id" onclick="sortTable('ads','print_id')"><div class="th-content">Print ID <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th><div class="th-content"><input data-table="ads" data-col="ad_name" data-type="text" class="th-filter-input" placeholder="Search ad name" oninput="filterTable('ads')" onclick="event.stopPropagation()"></div></th>
            <th>Link</th>
            <th data-sort="spend" onclick="sortTable('ads','spend')"><div class="th-content">Spend <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="ads" data-col="spend" onclick="event.stopPropagation();openFilterPopup('ads','spend',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="roas" onclick="sortTable('ads','roas')"><div class="th-content">ROAS <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="ads" data-col="roas" onclick="event.stopPropagation();openFilterPopup('ads','roas',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
          </tr></thead><tbody id="adsBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Click "Load Active Ads" or "Load All" to start'><div class="load-log" id="adsLoadLog"></div></div>
    </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="filterPopup" class="filter-popup">
  <div class="filter-popup-title" id="filterPopupTitle"></div>
  <div class="filter-popup-body">
    <div class="filter-chips">
      <select id="filterOp" data-dd="chip" onchange="onFilterOpChange()">
        <option value="gt">greater than</option>
        <option value="lt">less than</option>
        <option value="between">between</option>
        <option value="notBetween">not between</option>
      </select>
      <button type="button" class="filter-value-chip" id="filterValueChip">Add value</button>
    </div>
  </div>
  <div class="filter-editor">
    <div class="filter-inputs">
      <input type="number" id="filterVal1" step="any" placeholder="0" onkeydown="if(event.key==='Enter')applyFilter()">
      <span id="filterAnd" class="filter-and" style="display:none">and</span>
      <input type="number" id="filterVal2" step="any" placeholder="0" style="display:none" onkeydown="if(event.key==='Enter')applyFilter()">
    </div>
    <div class="filter-popup-actions">
      <button class="filter-clear" onclick="clearCurrentFilter()">Clear</button>
      <button class="btn btn-primary" onclick="applyFilter()">Apply</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
