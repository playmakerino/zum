<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Meta Ads Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Video Creative Performance</span>
      <span class="cache-time" id="cachedAt"></span>
    </div>
    <div class="topbar-actions">
      <div id="dateRange"></div>
      <button type="button" class="press-btn" id="controlsBtn" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 6.5h5M12.5 6.5h4M3.5 13.5h2M9.5 13.5h7"/><circle cx="10.5" cy="6.5" r="2"/><circle cx="7.5" cy="13.5" r="2"/></svg>Controls</button>
      <span class="user-chip" id="userChip" hidden><span id="userName"></span><button type="button" class="press-btn" onclick="logout()">Log out</button></span>
    </div>
  </header>

  <main class="main">
    <div class="report-layout" id="reportLayout">
    <div class="card">
    <div id="page-creatives" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="creativesTable"><thead><tr>
            <th class="th-thumb" aria-label="Thumbnail"></th>
            <th><div class="th-content">Video</div></th>
            <th data-sort="created_on" onclick="sortTable('creatives','created_on')"><div class="th-content">Created <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="spend" onclick="sortTable('creatives','spend')"><div class="th-content">Spend <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="roas" onclick="sortTable('creatives','roas')"><div class="th-content">ROAS <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="cpr" onclick="sortTable('creatives','cpr')"><div class="th-content">CPR <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="aov" onclick="sortTable('creatives','aov')"><div class="th-content">AOV <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="cr" onclick="sortTable('creatives','cr')"><div class="th-content">CR <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="cpm" onclick="sortTable('creatives','cpm')"><div class="th-content">CPM <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="ctr" onclick="sortTable('creatives','ctr')"><div class="th-content">CTR <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="cpc" onclick="sortTable('creatives','cpc')"><div class="th-content">CPC <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="video_3sec_rate" onclick="sortTable('creatives','video_3sec_rate')"><div class="th-content">3s/Impr <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
            <th data-sort="thruplay_rate" onclick="sortTable('creatives','thruplay_rate')"><div class="th-content">ThruPlay% <span class="sort-icon">&#x25B4;&#x25BE;</span></div></th>
          </tr></thead><tbody id="creativesBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Pick a date range and click "Load Data"'><div id="debugLine" class="debug-line"></div></div>
    </div>
    </div>
    <aside class="card report-panel">
      <div id="filterSec"></div>
      <div id="metricSec"></div>
      <div class="rp-sec"><div class="rp-head"><span>Dimensions</span></div><div class="rp-row"><span class="rp-label">Video</span><span class="rp-icon rp-info" data-tip-title="Video" data-tip="One row per video file: every ad that uses it is added up. The name shown is the ad with the most spend." aria-label="About Video"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg></span></div></div>
    </aside>
    </div>

  </main>
</div>
<div id="toast"></div>
<div id="loginView" class="login-view" hidden>
  <form class="login-card" id="loginForm" onsubmit="login(event)">
    <h2>Video Creative Performance</h2>
    <p class="login-hint">Log in to see the videos you sent.</p>
    <label>Name<input id="loginName" name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label>
    <p class="login-error" id="loginError" hidden></p>
    <button type="submit" class="login-btn" id="loginBtn">Log in</button>
  </form>
</div>
<div id="videoViewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <button class="viewer-btn" id="viewerExit" type="button" onclick="closeVideo()" aria-label="Exit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4H14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 14 16h-2.5"/><path d="M8 6.5 4.5 10 8 13.5M4.5 10H12"/></svg></button>
    <h3 class="viewer-title" id="viewerTitle"></h3>
    <a class="viewer-btn" id="viewerDownload" href="#" target="_blank" rel="noopener" aria-label="Download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v8.5M6.5 8.5 10 12l3.5-3.5"/><path d="M4 12.5v2A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg></a>
  </div>
  <div class="viewer-stage">
    <div class="viewer-media"><video id="viewerVideo" controls playsinline preload="metadata" disablepictureinpicture controlslist="nodownload"></video><iframe id="viewerReel" hidden allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <aside class="viewer-side">
      <div class="viewer-card">
        <div class="viewer-card-head"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg>Information</div>
        <div class="viewer-card-body">
          <div class="viewer-sec viewer-sec-name"><h4>Name</h4><p id="viName"></p></div>
          <div class="viewer-sec"><h4>Details</h4><p id="viFormat"></p><p id="viAdded"></p></div>
          <div class="viewer-sec" id="viSubmitterSec"><h4>Submitted by</h4><p id="viSubmitter"></p></div>
          <div class="viewer-sec" id="viThumbSec"><h4>Thumbnail <span class="viewer-note" id="viThumbSource"></span></h4><div class="viewer-thumb"><img id="viThumb" alt="" onerror="viewerThumbError(this)"></div></div>
          <div class="viewer-sec"><h4>Used in</h4><p id="viUsedIn"></p></div>
          <div class="viewer-sec" id="viBackupSec"><h4>Backup</h4><p><a class="viewer-link" id="viBackup" href="#" target="_blank" rel="noopener"></a></p></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
