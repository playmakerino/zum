<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Meta Ads Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">Video Creative Performance</span>
      <span class="cache-time" id="cachedAt"></span>
    </div>
    <div class="topbar-actions">
      <select class="period-select" id="periodSelect" data-icon="calendar" onchange="onPeriodChange()">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <button class="btn btn-primary" onclick="fetchAll()" data-tip-title="Load Data" data-tip="Fetches fresh data from Meta API. Loading often may hit Meta's rate limit, so wait a few minutes between loads."><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 8A6 6 0 0 0 4.7 6.5M4.5 12a6 6 0 0 0 10.8 1.5"/><path d="M4.5 3.5v3h3M15.5 16.5v-3h-3"/></svg>Load Data</button>
    </div>
  </header>

  <main class="main">
    <div class="card">
    <div class="card-head">
      <select class="period-select submitter-select" id="submitterSelect" data-icon="person" onchange="onSubmitterChange()" data-tip-title="Submitted by" data-tip="Who sent the video through the form.">
        <option value="">All submitters</option>
      </select>
    </div>
    <div id="page-creatives" class="page active">
      <div class="table-wrap">
        <div class="table-scroll">
          <table id="creativesTable"><thead><tr>
            <th>Thumb</th>
            <th><div class="th-content"><input data-table="creatives" data-col="ad_name" data-type="text" class="th-filter-input" placeholder="Search ad name" oninput="filterTable('creatives')" onclick="event.stopPropagation()"></div></th>
            <th data-sort="spend" onclick="sortTable('creatives','spend')"><div class="th-content">Spend <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="spend" onclick="event.stopPropagation();openFilterPopup('creatives','spend',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="roas" onclick="sortTable('creatives','roas')"><div class="th-content">ROAS <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="roas" onclick="event.stopPropagation();openFilterPopup('creatives','roas',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="cpr" onclick="sortTable('creatives','cpr')"><div class="th-content">CPR <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="cpr" onclick="event.stopPropagation();openFilterPopup('creatives','cpr',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="aov" onclick="sortTable('creatives','aov')"><div class="th-content">AOV <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="aov" onclick="event.stopPropagation();openFilterPopup('creatives','aov',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="cpm" onclick="sortTable('creatives','cpm')"><div class="th-content">CPM <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="cpm" onclick="event.stopPropagation();openFilterPopup('creatives','cpm',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="ctr" onclick="sortTable('creatives','ctr')"><div class="th-content">CTR <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="ctr" onclick="event.stopPropagation();openFilterPopup('creatives','ctr',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="cpc" onclick="sortTable('creatives','cpc')"><div class="th-content">CPC <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="cpc" onclick="event.stopPropagation();openFilterPopup('creatives','cpc',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="video_3sec_rate" onclick="sortTable('creatives','video_3sec_rate')"><div class="th-content" data-tip-title="3s/Impr" data-tip="3-second video plays divided by impressions">3s/Impr <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="video_3sec_rate" onclick="event.stopPropagation();openFilterPopup('creatives','video_3sec_rate',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="thruplay_rate" onclick="sortTable('creatives','thruplay_rate')"><div class="th-content" data-tip-title="ThruPlay%" data-tip="ThruPlays divided by video plays">ThruPlay% <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="thruplay_rate" onclick="event.stopPropagation();openFilterPopup('creatives','thruplay_rate',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
            <th data-sort="video_avg_time" onclick="sortTable('creatives','video_avg_time')"><div class="th-content" data-tip-title="Avg Time" data-tip="Average video play time, weighted by plays">Avg Time <span class="sort-icon">&#x25B4;&#x25BE;</span><button class="col-filter-btn" data-table="creatives" data-col="video_avg_time" onclick="event.stopPropagation();openFilterPopup('creatives','video_avg_time',this)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 1.5h13L9 8v5l-2 1.5V8z"/></svg></button></div></th>
          </tr></thead><tbody id="creativesBody"></tbody></table>
        </div>
      </div>
      <div class="card-foot" data-empty='Click "Load Data" to start'><div id="debugLine" class="debug-line"></div></div>
    </div>
    </div>

  </main>
</div>
<div id="toast"></div>
<div id="videoViewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <button class="viewer-btn" id="viewerExit" type="button" onclick="closeVideo()" aria-label="Exit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4H14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 14 16h-2.5"/><path d="M8 6.5 4.5 10 8 13.5M4.5 10H12"/></svg></button>
    <h3 class="viewer-title" id="viewerTitle"></h3>
    <a class="viewer-btn" id="viewerDownload" href="#" target="_blank" rel="noopener" aria-label="Download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v8.5M6.5 8.5 10 12l3.5-3.5"/><path d="M4 12.5v2A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg></a>
  </div>
  <div class="viewer-stage">
    <div class="viewer-media"><video id="viewerVideo" controls playsinline preload="metadata" disablepictureinpicture controlslist="nodownload"></video><iframe id="viewerReel" hidden allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <aside class="viewer-side">
      <div class="viewer-card">
        <div class="viewer-card-head"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9.25v4"/><circle cx="10" cy="6.75" r=".9" fill="currentColor" stroke="none"/></svg>Information</div>
        <div class="viewer-card-body">
          <div class="viewer-sec viewer-sec-name"><h4>Name</h4><p id="viName"></p></div>
          <div class="viewer-sec"><h4>Details</h4><p id="viFormat"></p><p id="viAdded"></p></div>
          <div class="viewer-sec" id="viSubmitterSec"><h4>Submitted by</h4><p id="viSubmitter"></p></div>
          <div class="viewer-sec" id="viThumbSec"><h4>Thumbnail <span class="viewer-note" id="viThumbSource"></span></h4><div class="viewer-thumb"><img id="viThumb" alt="" onerror="viewerThumbError(this)"><button class="viewer-tertiary" id="viThumbFetch" type="button" onclick="fetchAdThumb()">Fetch from Meta</button></div></div>
          <div class="viewer-sec"><h4>Used in</h4><p id="viUsedIn" class="viewer-used"></p></div>
          <div class="viewer-sec" id="viBackupSec"><h4>Backup</h4><p><a class="viewer-link" id="viBackup" href="#" target="_blank" rel="noopener"></a></p></div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div id="filterPopup" class="filter-popup">
  <div class="filter-popup-title" id="filterPopupTitle"></div>
  <div class="filter-popup-body">
    <div class="filter-chips">
      <select id="filterOp" data-dd="chip" onchange="onFilterOpChange()">
        <option value="gt">greater than</option>
        <option value="lt">less than</option>
        <option value="between">between</option>
        <option value="notBetween">not between</option>
      </select>
      <button type="button" class="filter-value-chip" id="filterValueChip">Add value</button>
    </div>
  </div>
  <div class="filter-editor">
    <div class="filter-inputs">
      <input type="number" id="filterVal1" step="any" placeholder="0" onkeydown="if(event.key==='Enter')applyFilter()">
      <span id="filterAnd" class="filter-and" style="display:none">and</span>
      <input type="number" id="filterVal2" step="any" placeholder="0" style="display:none" onkeydown="if(event.key==='Enter')applyFilter()">
    </div>
    <div class="filter-popup-actions">
      <button class="filter-clear" onclick="clearCurrentFilter()">Clear</button>
      <button class="btn btn-primary" onclick="applyFilter()">Apply</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
