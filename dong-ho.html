<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đồng Hồ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  /* ===== BIẾN & KHUNG TRANG ===== */
  :root{
    --bg:#fdf6f0;
    --ink:#3f3a5c;
    --muted:#a99fb8;
    --line:#e9cdb6;
    --neutral:#2b2b2b;       /* đen trung tính: mép đồng hồ + ngày chưa đến + tháng/năm */
    --accent:#ff5d97;
    --c-hour:#5a63d8;
    --c-min:#f5921b;
    --c-sec:#ff5d97;
    --c-buoi:#1fab95;
    /* Vòng tiến trình & nhãn mốc — dùng chung nhiều nơi */
    --ring-thin:1px;                       /* nét MẢNH: ô quá khứ / tương lai + nhãn mốc */
    --ring-bold:3.2px;                      /* nét ĐẬM: ô hiện tại (giờ/phút này) */
    --faint:.25;                           /* độ MỜ dùng chung (track vòng, ô chưa trôi) */
    --c-hour-faint:rgba(90,99,216,.25);    /* = c-hour ở độ mờ --faint (cho nét/viền nhãn chưa đến) */
    /* Kích thước nhãn & emoji — MỘT nguồn (JS đọc --badge-dia để tính bố cục) */
    --badge-dia:26px;                      /* đường kính nhãn tròn (giờ / phút / emoji) */
    --emoji-size:15px;                     /* cỡ emoji trên nhãn; emoji trên tâm = x2 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  /* MOBILE (mặc định): chỉ CHẶN TRÀN NGANG (giữ mọi thứ căn giữa, không bị đẩy lệch
     trái do nhãn/đồng hồ cát tràn mép), nhưng VẪN cho cuộn DỌC tự nhiên. */
  /* clip = CẮT THẬT phần tràn ngang (nhãn/vòng SVG thò ra mép), KHÔNG tạo vùng cuộn ẩn
     -> canvas không phình quá viewport, hết dải nền thừa bên phải. hidden = fallback trình duyệt cũ. */
  html{ overflow-x:hidden; overflow-x:clip; }
  /* MOBILE (mặc định): trang CUỘN tự nhiên. Đồng hồ co theo BỀ RỘNG; nội dung dài hơn
     màn thì cuộn — KHÔNG ép vừa khít viewport. Logic "không scroll" chỉ bật ở DESKTOP. */
  body{
    min-height:100dvh;
    /* KHÔNG đặt overflow-x:hidden ở body: sẽ biến body thành scroll-container (overflow-y auto)
       cao bằng nội dung -> KHÔNG cuộn dọc được trên mobile. Chặn tràn ngang đã có ở html. */
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:0;
    padding:.5rem;
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Khối "đồng hồ" = analog + digital(+cát). Mặc định (MOBILE DỌC) xếp dọc: analog trên, digital dưới. */
  .clock{ display:flex; flex-direction:column; align-items:center; }

  /* DESKTOP (≥768px): [đồng hồ | lịch] cùng BỀ RỘNG (JS đặt lịch = khối đồng hồ),
     space-evenly -> 3 khoảng trống trái/giữa/phải BẰNG NHAU. */
  @media (min-width:768px){
    html{overflow:hidden;}
    body{ height:100dvh; overflow:hidden; flex-direction:row; justify-content:space-evenly; }
  }

  /* ===== ANALOG: MẶT SỐ, VẠCH, KIM =====
     MỌI KÍCH THƯỚC dưới đây (đường kính mặt, lề, chiều dài vạch, chiều dài kim) chỉ là giá
     trị cho khung hình ĐẦU TIÊN — layout() và layoutFace() ghi đè hết ngay sau đó theo FACE
     tính từ viewport. Đừng chỉnh ở đây để đổi tỉ lệ mặt, chỉnh trong JS. */
  .analog{
    width:300px;height:300px;border-radius:50%;
    background:#fff;
    border:1px solid var(--neutral);  /* mép đồng hồ: đen trung tính */
    position:relative;
    /* LƯU Ý: KHÔNG đặt isolation:isolate ở đây. WebKit (Safari iOS) BỎ VẼ emoji màu
       khi nhóm isolate chứa phần tử mix-blend-mode (bug đã tái hiện bằng Playwright
       WebKit: mọi nhãn hoạt động biến mất). Nhóm hòa trộn vì thế là cả trang; đĩa
       kính multiply trên nền be ngoài mặt chỉ sẫm hơn ~1% — không nhận ra được. */
    margin:58px;
  }
  .tick{position:absolute;left:50%;top:50%;transform-origin:0 0;}
  .tick span{
    position:absolute;
    width:1px;height:6px;
    background:var(--c-min);
    left:-0.5px;top:-118px;
  }
  .tick.major span{height:12px;width:1.5px;left:-0.75px;background:var(--c-hour);}
  .numeral{
    position:absolute;
    font-size:.95rem;font-weight:400;line-height:1;
    color:var(--c-hour);
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
  }
  .numeral.active{font-weight:700;}
  .hand{
    position:absolute;left:50%;top:50%;
    transform-origin:50% 100%;
    border-radius:99px;
    background:var(--ink);
  }
  .hour{width:5px;height:72px;margin-left:-2.5px;margin-top:-72px;background:var(--c-hour);}
  .minute{width:3px;height:104px;margin-left:-1.5px;margin-top:-104px;background:var(--c-min);}
  .second{width:1.5px;height:118px;margin-left:-.75px;margin-top:-118px;
    background:var(--c-sec);}
  .center{
    position:absolute;left:50%;top:50%;
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);transform:translate(-50%,-50%);
    z-index:10;
    box-shadow:0 0 0 4px #fff;
  }
  /* Emoji hoạt động hiện NGAY TRÊN TÂM khi ĐẾN GIỜ — JS bật .show trong 5 giây rồi tắt */
  .center-emoji{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:calc(var(--emoji-size)*2);line-height:1;   /* x2 cỡ emoji trên nhãn */
    z-index:14;                        /* nổi trên kim + mọi nhãn (bằng lớp số #orbitHt/#orbitMt z14, đứng cuối DOM nên đè) */
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
  }
  .center-emoji.show{opacity:1;}

  /* ===== NHÃN QUAY QUANH MẶT (giờ / phút / emoji hoạt động) ===== */
  /* z-index đặt theo TỪNG LOẠI orbit ở dưới (nét nối z9 / emoji z10-12 / số z14), không đặt ở gốc */
  .orbit{
    position:absolute;left:50%;top:50%;
    width:0;height:0;
  }
  .connector{
    position:absolute;left:50%;
    width:1.5px;margin-left:-.75px;
    background:var(--ink);
    transform-origin:center;
  }
  #connH{background:var(--c-hour);}
  #connM{background:var(--c-min);}
  .badge{
    position:absolute;left:50%;top:0;
    transform:translate(-50%,-50%);
    /* HÌNH TRÒN đều (Ø = --badge-dia khai báo ở :root): offsetHeight/2 = bán kính ở MỌI hướng
       -> nét nối chạm đúng viền ở mọi góc, không đâm xuyên (pill cũ sai khi nhãn ở góc xiên). */
    width:var(--badge-dia);height:var(--badge-dia);
    min-width:0;padding:0;
    border-radius:50%;
    font-size:.72rem;font-weight:500;
    font-variant-numeric:tabular-nums;
    line-height:1;
    /* Căn giữa số bằng flex (không dựa baseline/line-box) */
    display:flex;align-items:center;justify-content:center;
    background:var(--badge-bg);color:#fff;
  }
  #badgeH{--badge-bg:var(--c-hour);}
  #badgeM{--badge-bg:var(--c-min);}
  /* ĐĨA NHÃN GIỜ/PHÚT = KÍNH MÀU: mix-blend-mode multiply -> trên nền trắng giữ NGUYÊN màu;
     đè lên nét nối/emoji/kim thì tint như nhìn qua tấm kính xanh/cam. Là CON TRỰC TIẾP của
     .analog (không nằm trong orbit xoay) để "phông nền" hòa trộn gồm cả mặt đồng hồ.
     KHÔNG chứa số (multiply với chữ trắng = trong suốt -> số biến mất); số nằm ở lớp #orbitHt/#orbitMt.
     KHÔNG bọc nhóm isolate quanh đĩa kính (xem chú thích .analog — WebKit mất emoji). */
  .glass-badge{ top:50%; mix-blend-mode:multiply; z-index:13; }
  /* Nhãn EMOJI mốc trong ngày (tập 8h / ăn sáng 8h15 / ăn tối 19h30 / đi ngủ 22h): màu xanh giờ;
     nét nối + viền MẢNH (--ring-thin) khớp vòng tròn. */
  /* z-index THẤP -> CAO: nét nối GIỜ/PHÚT (#orbitH/#orbitM) < emoji NGOÀI < emoji TRONG < KÍNH nhãn (.glass-badge z13) < SỐ (z14) */
  #orbitH,#orbitM{z-index:9;}               /* nét nối giờ/phút xuống DƯỚI nhãn hoạt động khi trùng */
  .emoji-orbit{z-index:10;}                 /* nhãn hoạt động vòng NGOÀI (mặc định) */
  .emoji-orbit.user-label{z-index:11;}      /* nhãn do user tạo (cũng vòng ngoài) */
  .emoji-orbit.inner{z-index:12;}           /* nhãn vòng TRONG nổi TRÊN nhãn vòng ngoài (nét nối nhãn ngoài không đè) */
  #orbitHt,#orbitMt{z-index:14;}             /* lớp SỐ GIỜ/PHÚT riêng -> TRÊN cùng (nổi trên KÍNH + emoji) */
  #badgeHt,#badgeMt{background:transparent;} /* chỉ hiện SỐ, không vòng tròn nền */
  .emoji-orbit.off{display:none;}          /* nhãn không thuộc thứ hôm nay -> ẩn hẳn */
  .emoji-orbit .connector{width:var(--ring-thin);margin-left:calc(var(--ring-thin)/-2);background:var(--c-hour);}
  /* HÌNH TRÒN đều (bỏ min-width pill kế thừa): offsetHeight/2 = bán kính ở MỌI hướng
     -> nét nối chạm đúng viền, không đâm xuyên khi nhãn ở góc xiên. */
  .badge-emoji{width:var(--badge-dia);height:var(--badge-dia);border:var(--ring-thin) solid var(--c-hour);
    /* nền = MÀU NỀN TRANG ở MỌI trạng thái (không transparent): nhãn luôn nằm trên nền be
       ngoài mặt nên trông y hệt, nhưng CHE được nét nối của nhãn vòng ngoài / kim chạy SAU LƯNG. */
    background:var(--bg);}
  /* CHƯA đến giờ -> nét nối + viền MỜ (khớp vòng track); ĐÃ đến/qua -> viền + nét ĐẶC (mặc định ở trên) */
  .emoji-orbit.upcoming .connector{background:var(--c-hour-faint);}
  .emoji-orbit.upcoming .badge-emoji{border-color:var(--c-hour-faint);}
  /* 2 class -> đè .badge span{display:block}; flex để emoji vào ĐÚNG TÂM (không theo baseline) */
  .badge-emoji .ic-emoji{display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;font-size:var(--emoji-size);line-height:1;
    transform:translateY(.06em);}   /* glyph emoji nằm cao trong line-box -> bù xuống ~0.9px */
  .badge span{display:block;}
  /* Nhãn PHÚT deadline: chấm TRÒN cam nhỏ ở MÉP XA TÂM NHẤT của nhãn hoạt động (JS đặt theo góc).
     Mặc định ẩn; .show mới hiện (đè .badge span{display:block} bằng specificity 2 class). */
  .badge-emoji .deadline-min{
    display:none;
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);  /* JS thêm translate ra mép ngoài */
    width:16px; height:16px; padding:0; box-sizing:border-box;
    border-radius:50%;
    background:var(--c-min); color:#fff;
    font-size:.48rem; font-weight:700; line-height:16px; text-align:center;
    font-variant-numeric:tabular-nums;
    box-shadow:0 0 0 1.5px var(--bg);   /* tách khỏi emoji bằng vòng nền */
  }
  .badge-emoji .deadline-min.show{ display:block; }

  /* ===== VÒNG TIẾN TRÌNH — 4 trạng thái = (đậm/mảnh) × (đặc/mờ). Màu đặt ở thuộc tính stroke mỗi path. ===== */
  .r-track,.r-arc,.r-act,.r-live{fill:none;stroke-linecap:butt;}
  .r-track{stroke-width:var(--ring-thin);opacity:var(--faint);}  /* MẢNH MỜ  — ô tương lai */
  .r-arc  {stroke-width:var(--ring-thin);}                        /* MẢNH ĐẶC — ô quá khứ */
  .r-act  {stroke-width:var(--ring-bold);opacity:var(--faint);}  /* ĐẬM MỜ   — ô hiện tại (chưa trôi) */
  .r-live {stroke-width:var(--ring-bold);}                        /* ĐẬM ĐẶC  — ô hiện tại (đã trôi) */

  /* ===== NHỊP ĐẾM NGƯỢC (giây 55-59): mỗi giây một cú nảy gọn, nền nhấp một nhịp. =====
     NỀN nhấp bằng CSS animation (chỉ đổi background/box-shadow -> không xê dịch).
     SCALE "nảy" do JS gộp thẳng vào transform của badge (cùng translate+rotate,
     transform-origin tâm) -> luôn scale quanh đúng tâm, không lệch vị trí. */
  .badge.beat{animation:beatBg .45s ease-out;}
  .badge.beat-final{animation:beatBgFinal .45s ease-out;}
  @keyframes beatBg{
    0%  {background:var(--badge-bg);}
    25% {background:var(--accent);}
    100%{background:var(--badge-bg);}
  }
  @keyframes beatBgFinal{
    0%  {background:var(--badge-bg);}
    20% {background:#ff3d83;box-shadow:0 0 0 8px rgba(255,93,151,.32);}
    100%{background:var(--badge-bg);box-shadow:0 0 0 0 rgba(255,93,151,0);}
  }

  /* ===== DIGITAL + ĐỒNG HỒ CÁT ===== */
  .digital{
    display:flex;
    align-items:flex-start;
    gap:clamp(.6rem,3vw,1.1rem);
  }
  .unit{display:flex;flex-direction:column;align-items:center;gap:.45rem;}
  /* Ô chứa icon: chiều cao cố định -> mọi số (và dấu :) bắt đầu cùng một mốc => thẳng hàng */
  .hg-slot{
    height:clamp(30px,8vw,42px);
    display:flex;align-items:center;justify-content:center;
  }
  .hourglass{
    width:clamp(27px,7vw,40px);
    height:100%;
    display:block;
    overflow:visible;
    transform-origin:50% 50%;
  }
  .hourglass.flip{animation:hgFlip .7s ease-in-out;}
  @keyframes hgFlip{
    0%  {transform:rotate(0deg);}
    100%{transform:rotate(180deg);}
  }
  .hg-glass{fill:none;stroke:var(--line);stroke-width:1.2;}
  .hg-cap{stroke:var(--line);stroke-width:1.6;stroke-linecap:round;}   /* nắp màu be — vẫn vẽ SAU nét cát rơi để che đầu nét */
  .u-hour .hg-sand,.u-hour .hg-stream{fill:var(--c-hour);}
  .u-min  .hg-sand,.u-min  .hg-stream{fill:var(--c-min);}
  .num{
    font-size:clamp(1.1rem,4.6vw,1.6rem);font-weight:300;line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  #h{color:var(--c-hour);}
  #m{color:var(--c-min);}
  #s{color:var(--c-sec);}
  .sep{
    display:flex;flex-direction:column;align-items:center;gap:.45rem;
  }
  .sep-mark{
    font-size:clamp(1.1rem,4.6vw,1.6rem);font-weight:300;line-height:1;color:var(--line);
  }

  /* ===== CỘT DIGITAL + DÒNG VĂN NÓI ===== */
  /* Cột digital: bọc đồng hồ số + dòng "văn nói" ngay dưới nó.
     Dòng văn nói nằm trong luồng, chiều cao cố định luôn được dành sẵn
     (chỉ đổi opacity khi hiện/ẩn -> không giật), và layout() đo cả cột này
     nên analog co vừa đủ để luôn còn chỗ cho dòng văn nói. */
  .digital-col{
    display:flex;flex-direction:column;align-items:center;
    position:relative;
    padding-bottom:2.1rem;   /* chừa chỗ cho dòng văn nói (đặt TUYỆT ĐỐI -> không nới rộng cột) */
  }
  .spoken{
    /* Tuyệt đối + translateX(-50%): căn giữa CHẮC CHẮN theo bề ngang cột, và KHÔNG
       làm cột digital rộng ra (tránh dòng dài làm analog co nhỏ ở landscape). */
    position:absolute;
    left:50%; bottom:0;
    transform:translateX(-50%);
    height:1.4em;
    white-space:nowrap;
    font-size:clamp(.85rem,3.6vw,1.05rem);
    font-weight:400;
    color:var(--muted);
    text-align:center;
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .spoken.show{opacity:1;}
  /* Viết hoa chữ cái đầu câu (câu bắt đầu bằng số thì giữ nguyên; văn nói VN luôn bắt đầu bằng số) */
  .spoken::first-letter{text-transform:uppercase;}
  /* Giờ -> màu giờ; phần phút (đúng/rưỡi/kém/Y phút) -> màu phút; buổi -> xanh ngọc */
  .spoken .sp-h{color:var(--c-hour);}
  .spoken .sp-m{color:var(--c-min);}
  .spoken .sp-b{color:var(--c-buoi);}

  /* ===== LỊCH TUẦN (timeline: cột = giờ 12h, hàng = 7 thứ T2..CN) ===== */
  /* RULE bề rộng: BẢNG rộng bằng KHỐI ĐỒNG HỒ (--clock-w do JS công bố), không vượt màn hình.
     Timeline bên trong hẹp hơn min-width thì .wk-scroll cuộn ngang. */
  .calendar{
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(.4rem,1.5vw,.7rem);
    width:min(var(--clock-w,100%),100%);
    font-variant-numeric:tabular-nums;
  }
  .wk-heads{ width:100%; display:flex; justify-content:space-between; }   /* VN trái · EN phải, TRÊN bảng */
  .wk-head{                           /* tháng/năm — cùng style tiêu đề lịch cũ */
    font-size:clamp(.95rem,4vw,1.2rem);
    font-weight:500; letter-spacing:.02em;
    color:var(--neutral);             /* đen trung tính */
  }
  /* Khung cuộn ngang cho timeline (chỉ bật ở mobile — xem @media max-width) */
  .wk-scroll{ width:100%; }
  .wk-grid{
    display:grid;
    grid-template-columns:auto auto 1fr auto;   /* ngày | thứ VN | track 24 giờ | thứ EN */
    align-items:center;
    row-gap:clamp(.3rem,1.4vw,.55rem);
    column-gap:clamp(.4rem,1.6vw,.6rem);
  }
  /* .wk-corner: ô góc để trống (giữ chỗ cột nhãn thứ ở hàng trục giờ) — không cần style riêng. */
  /* Trục GIỜ (hàng đầu): số 12h cho mỗi giờ, đặt theo % */
  .wk-axis{ position:relative; height:1.2em; }
  .wk-axis .wk-tick{                   /* số giờ 12h — màu GIỜ như số trên mặt đồng hồ */
    position:absolute; bottom:0; transform:translateX(calc(-50% + 0.5px));   /* +0.5px -> khớp TÂM vạch giờ */
    font-size:.72rem; font-weight:500;   /* track có min-width nên số không dính (hẹp thì cuộn ngang) */
    color:var(--c-hour); white-space:nowrap;
  }
  /* Bốn cột nhãn: NGÀY | thứ VN | (track) | thứ EN — mỗi cột tự thẳng hàng */
  .wk-day{
    display:flex; align-items:center;
    font-size:clamp(.8rem,3.2vw,1rem); font-weight:500;
    color:var(--neutral); white-space:nowrap;
  }
  /* justify-self co item về ĐÚNG bề rộng chữ (không giãn full cột) -> nền/pill ôm sát chữ, không lệch;
     đồng thời canh cột: ngày sát phải, thứ sát trái -> vẫn thẳng hàng giữa các dòng. */
  .wk-col-date{ justify-self:end; font-weight:400; }          /* số ngày căn phải -> thẳng cột */
  .wk-col-vn{ justify-self:start; }                           /* thứ VN */
  .wk-col-en{ justify-self:start; }                           /* thứ EN: CÙNG style với thứ VN */
  /* Thứ đã qua KHÔNG tô màu (giữ neutral); chỉ HÔM NAY là pill teal. */
  .wk-col-date.today, .wk-col-vn.today, .wk-col-en.today{  /* hôm nay: NGÀY + THỨ chữ màu XANH, KHÔNG nền */
    color:var(--c-buoi); font-weight:700;
  }
  /* Track một ngày: vạch giờ màu GIỜ NHẠT mỗi 1 giờ; nhãn hoạt động đặt theo % giờ */
  .wk-track{
    position:relative;
    height:clamp(32px,8vw,42px);
    border-radius:2px;
    /* CHỈ vạch mỗi GIỜ (mảnh, dài BẰNG NHAU) — màu GIỜ nhạt. 16 ô = 7h sáng -> 11h đêm */
    background:
      repeating-linear-gradient(to right,
        var(--c-hour-faint) 0 1px, transparent 1px calc(100%/16));
  }
  /* Nhãn hoạt động: vạch DỌC ở TRÊN (mốc BẮT ĐẦU) nối liền vòng tròn icon ở DƯỚI, canh giữa mốc giờ.
     Vòng tròn dùng chung cỡ/viền với nhãn emoji trên mặt đồng hồ (.badge-emoji). */
  .wk-mark{
    position:absolute; top:50%; left:0; transform:translate(calc(-50% + 0.5px),-50%);   /* +0.5px -> khớp TÂM vạch giờ */
    display:flex; flex-direction:column; align-items:center;
  }
  .wk-mark .wk-bar{                           /* vạch DỌC ở TRÊN = mốc BẮT ĐẦU (đậm BẰNG viền vòng tròn) */
    width:var(--ring-thin); height:6px; border-radius:1px;
    background:var(--c-hour);
  }
  .wk-mark .wk-badge{                         /* vòng tròn quanh icon (như label mặt đồng hồ) */
    width:var(--badge-dia); height:var(--badge-dia);
    border-radius:50%;
    border:var(--ring-thin) solid var(--c-hour);
    background:transparent;                    /* nền trong -> không che vạch giờ phía sau */
    display:flex; align-items:center; justify-content:center;
  }
  .wk-mark .wk-emoji{                         /* icon trong vòng tròn */
    font-size:var(--emoji-size); line-height:1;
    transform:translateY(.06em);              /* bù glyph emoji nằm cao trong line-box */
  }
  /* Vạch "bây giờ" trên hàng hôm nay — màu accent như tâm/kim đồng hồ */
  .wk-now{
    position:absolute; top:0; bottom:0; left:0; width:2px;   /* cao ĐÚNG bằng vạch giờ (đầy track) */
    transform:translateX(-50%); border-radius:2px;
    background:var(--accent);
  }
  /* MOBILE: full 100vw; timeline co theo bề rộng còn lại (KHÔNG cuộn ngang) */
  @media (max-width:767.98px){
    body{ padding-inline:0; }
    .calendar{ margin-top:.8rem; }
    .wk-axis .wk-tick{ font-size:.6rem; }   /* slot hẹp -> số nhỏ lại cho "10","11" không dính nhau */
  }

  /* ===== NÚT + & POPUP TẠO NHÃN ===== */
  #fab{
    position:fixed; right:18px; bottom:18px; z-index:50;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:30px; line-height:1; font-weight:300;
    display:flex; align-items:center; justify-content:center;
  }
  /* MOBILE: nút + vào TRONG LUỒNG, nằm DƯỚI bảng — fixed góc màn sẽ đè lên các hàng cuối của lịch.
     (Phải đứng SAU rule #fab gốc: cùng specificity, sau thắng.) */
  @media (max-width:767.98px){
    #fab{ position:static; margin:14px auto 20px; }
  }
  .modal{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(63,58,92,.28);    /* nền mờ (ink) */
  }
  .modal.open{ display:flex; }
  .modal-card{
    background:#fff; border-radius:22px; padding:16px;
    width:min(92vw,340px); max-height:90vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
    font-family:'Space Grotesk',sans-serif;
  }
  .modal-card button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }  /* thấy ô đang chọn khi dùng remote TV */
  .emoji-pick{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .emoji-pick button{
    width:38px; height:38px; border-radius:11px; padding:0; cursor:pointer;
    border:2px solid transparent; background:var(--bg); font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .emoji-pick button.sel{ border-color:var(--c-buoi); background:#fff; }   /* khung chọn emoji -> màu NGÀY (teal) */
  /* Ô DÁN emoji tùy ý (cuối hàng emoji) — JS chỉ thêm trên thiết bị dán được (không phải tivi).
     Viền ĐỨT để phân biệt với nút có sẵn; .sel khi đang dùng emoji vừa dán (giống nút được chọn). */
  .emoji-pick .emoji-paste{
    width:38px; height:38px; border-radius:11px; padding:0;
    border:2px dashed var(--line); background:var(--bg);
    font:20px/1 'Space Grotesk',sans-serif; text-align:center; color:var(--ink);
  }
  .emoji-pick .emoji-paste:focus{ outline:none; border-color:var(--c-buoi); }
  .emoji-pick .emoji-paste.sel{ border-style:solid; border-color:var(--c-buoi); background:#fff; }
  .emoji-pick .emoji-paste.invalid{ border-style:solid; border-color:var(--muted); color:var(--muted); }   /* gõ KHÔNG phải emoji -> XÁM "không hợp lệ" (≠ pink hành động); nút ✓ bị khoá */
  .num-strip{ display:grid; grid-template-columns:repeat(6,1fr); gap:5px; padding:4px 2px; }   /* 6 CỘT, không cuộn -> remote TV chọn được */
  .num-strip button{
    min-width:0; height:32px; border-radius:9px; padding:0; cursor:pointer;
    border:2px solid var(--pick); color:var(--pick); background:transparent;
    font:600 .9rem/1 'Space Grotesk',sans-serif; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center;
  }
  .num-strip button.past{ opacity:.35; }                          /* giờ ĐÃ QUA -> làm mờ */
  .num-strip button.sel{ background:var(--pick); color:#fff; opacity:1; }
  .hour-strip{ --pick:var(--c-hour); }   /* số GIỜ -> màu giờ (xanh) */
  .min-strip{  --pick:var(--c-min); }    /* số PHÚT -> màu phút (cam) */
  .modal-add{
    align-self:center; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:var(--c-sec); color:#fff; font-size:22px; line-height:1;   /* nút submit -> màu GIÂY */
    display:flex; align-items:center; justify-content:center;
  }
  .modal-add:disabled{ background:var(--muted); opacity:.6; cursor:not-allowed; }   /* khoá khi ô tự do đang gõ KHÔNG phải emoji */
  /* Nút × xóa nhãn (chỉ nhãn người dùng tự thêm) — hiện khi rê chuột / chạm vào nhãn */
  .label-del{
    position:absolute; top:-7px; right:-7px; z-index:20; display:none;
    width:15px; height:15px; border-radius:50%; padding:0; cursor:pointer;
    border:1.5px solid #fff; background:var(--accent); color:#fff;
    font:700 11px/1 sans-serif; align-items:center; justify-content:center;
  }
  .emoji-orbit:hover .label-del,
  .emoji-orbit.reveal-del .label-del{ display:flex; }

  <div class="clock">
  <div class="analog" id="analog">
    <!-- width/height:1px BẮT BUỘC (KHÔNG để 0: SVG viewport 0 bị Chrome bỏ render hoàn toàn;
         không khai báo thì nhận mặc định 300x150, box thò khỏi mép phải viewport tạo dải nền thừa).
         1x1 tại tâm: gốc toạ độ vẫn ở tâm mặt, nét vẽ hiện đủ nhờ overflow:visible. -->
    <svg style="position:absolute;left:50%;top:50%;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:9;">
      <!-- LUẬT MỚI — mỗi vòng MỘT màu, 4 TRẠNG THÁI = (đậm/mảnh) × (đặc/mờ):
             track = CẢ vòng:        MẢNH + MỜ  (op .25) -> ô TƯƠNG LAI (chưa đến)
             arc   = đã qua:         MẢNH + ĐẶC (op 1)   -> ô QUÁ KHỨ
             act   = ô hiện tại:     ĐẬM  + MỜ  (op .25) -> phần CHƯA trôi trong ô này
             live  = đã trôi trong ô:ĐẬM  + ĐẶC (op 1)   -> phần ĐÃ trôi của ô hiện tại
           Màu: 2 vòng NGÀY/GIỜ = c-hour (xanh giờ); vòng PHÚT = c-min (cam).
           Thứ tự vẽ (dưới->trên): track, arc, act, live. Vòng 1 = sáng (0-12h), vòng 2 = chiều/tối. -->
      <path id="dayTrack1" class="r-track" stroke="var(--c-hour)"></path>
      <path id="dayTrack2" class="r-track" stroke="var(--c-hour)"></path>
      <path id="dayArc1" class="r-arc" stroke="var(--c-hour)"></path>
      <path id="dayArc2" class="r-arc" stroke="var(--c-hour)"></path>
      <path id="dayAct1" class="r-act" stroke="var(--c-hour)"></path>
      <path id="dayAct2" class="r-act" stroke="var(--c-hour)"></path>
      <path id="dayLive1" class="r-live" stroke="var(--c-hour)"></path>
      <path id="dayLive2" class="r-live" stroke="var(--c-hour)"></path>
      <path id="minTrack" class="r-track" stroke="var(--c-min)"></path>
      <path id="minArc" class="r-arc" stroke="var(--c-min)"></path>
      <path id="minAct" class="r-act" stroke="var(--c-min)"></path>
      <path id="minLive" class="r-live" stroke="var(--c-min)"></path>
    </svg>
    <div class="hand hour" id="hour"></div>

    <!-- Nhãn EMOJI hoạt động (cố định + người dùng): KHÔNG viết tay ở đây.
         JS dựng toàn bộ từ MỘT nguồn: bảng FIXED_LABELS + localStorage (phần 3 của script). -->
    <div class="orbit" id="orbitH">

    <!-- ĐĨA KÍNH GIỜ: con TRỰC TIẾP .analog (không trong orbit xoay) -> multiply tint được cả mặt.

    <div class="badge glass-badge" id="badgeH"></div>

    <div class="orbit" id="orbitMt">
      <div class="badge" id="badgeMt"><span id="textMt">00</span></div>
    </div>
    <div class="center"></div>
    <!-- Emoji hoạt động hiện TRÊN TÂM khi đến giờ (x2, tự ẩn sau 5s) — JS điều khiển -->
    <div class="center-emoji" id="centerEmoji"></div>
  </div>

  <div class="digital-col">
    <div class="digital">
      <!-- 2 đồng hồ cát: JS dựng từ MỘT khuôn (buildHourglass — phần 2 của script) vào .hg-slot -->

  <!-- Nút + (góc dưới-phải) mở popup tạo nhãn hoạt động (không chữ: chọn emoji / giờ / phút) -->
