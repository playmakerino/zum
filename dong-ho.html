<!-- Firebase compat (đồng bộ nhãn người dùng giữa các thiết bị qua Realtime Database).
     Dùng bản COMPAT để gọi được từ script thường bên dưới (không phải module).
     CDN không tải được (offline/chặn mạng) -> typeof firebase === 'undefined'
     -> trang tự rớt về chế độ localStorage một máy như bản cũ. -->
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
<script>
  /* ============================================================
     ĐỒNG HỒ — script chia 11 phần:
       1. Tiện ích & tham chiếu DOM      7. Nhịp nhãn + đồng hồ cát
       2. Mặt số: vạch, số, đồng hồ cát  8. Lịch tháng
       3. Nhãn hoạt động (1 nguồn)       9. Vòng lặp tick()
       4. Văn nói giờ (VN + EN)         10. Popup tạo nhãn
       5. Bố cục tự co (layout)         11. Khởi động
       6. Vòng tiến trình (SVG)
     ============================================================ */

  /* ===== 1. TIỆN ÍCH & THAM CHIẾU DOM ===== */
  const $ = id => document.getElementById(id);
  const analog = $('analog');

  // Phần tử cập nhật MỖI FRAME -> cache sẵn, khỏi tra DOM lặp lại
  const elHour=$('hour'), elMin=$('minute'), elSec=$('second');
  const elOrbitH=$('orbitH'), elOrbitM=$('orbitM');
  const elBadgeH=$('badgeH'), elBadgeM=$('badgeM');
  const elOrbitHt=$('orbitHt'), elBadgeHt=$('badgeHt'), elTextHt=$('textHt');   // lớp SỐ giờ riêng (z cao)
  const elOrbitMt=$('orbitMt'), elBadgeMt=$('badgeMt'), elTextMt=$('textMt');   // lớp SỐ phút riêng (z cao)
  const elConnH=$('connH'), elConnM=$('connM');
  const elH=$('h'), elM=$('m'), elS=$('s'), elSpoken=$('spoken');
  const elDigitalCol=document.querySelector('.digital-col');   // layout() đo chiều cao cột digital

  // Các path cung gom 4 lớp = 4 trạng thái: track(mảnh mờ)/arc(mảnh đặc)/act(đậm mờ)/live(đậm đặc)
  const ring = {
    min:  {track:$('minTrack'),  arc:$('minArc'),  act:$('minAct'),  live:$('minLive')},
    day1: {track:$('dayTrack1'), arc:$('dayArc1'), act:$('dayAct1'), live:$('dayLive1')},
    day2: {track:$('dayTrack2'), arc:$('dayArc2'), act:$('dayAct2'), live:$('dayLive2')},
  };
  const setD=(el,d)=>el.setAttribute('d', d||'');

  const pad=n=>String(n).padStart(2,'0');

  // Số giờ kiểu 12h (1..12)
  function gio12(h){ const x=((h%12)+12)%12; return x===0?12:x; }

  // Phần PHÚT của giờ thập phân (8.25 -> 15)
  const minPart = hour => Math.round((hour % 1) * 60);

  // TỌA ĐỘ CỰC quanh tâm mặt — MỘT quy ước cho cả trang: deg đo TỪ 12 GIỜ, theo chiều kim.
  // Trả [dx, dy] px so với tâm. Dùng chung cho: cung SVG, chữ số, đĩa kính, pill deadline.
  function polar(r, deg){
    const a=(deg-90)*Math.PI/180;
    return [r*Math.cos(a), r*Math.sin(a)];
  }
  // Chuỗi translate(...) tới điểm cực (r, deg) — cho transform của đĩa kính / pill deadline
  function polarTranslate(r, deg){
    const [x,y]=polar(r, deg);
    return `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
  }

  // Ghi text vào badge chỉ khi đổi (đỡ tải)
  function updateBadge(el, txt){
    if(el.textContent!==txt) el.textContent=txt;
  }

  /* ===== 2. MẶT SỐ: VẠCH CHIA + CHỮ SỐ + ĐỒNG HỒ CÁT ===== */
  const tickSpans=[];
  for(let i=0;i<60;i++){
    const t=document.createElement('div');
    t.className='tick'+(i%5===0?' major':'');
    t.style.transform=`rotate(${i*6}deg)`;
    const sp=document.createElement('span');
    t.appendChild(sp);
    tickSpans.push(sp);
    analog.appendChild(t);
  }
  const numerals=[];
  for(let n=1;n<=12;n++){
    const el=document.createElement('div');
    el.className='numeral';
    el.dataset.n=n;
    el.textContent=n;
    numerals.push(el);
    analog.appendChild(el);
  }

  // Hai ĐỒNG HỒ CÁT (giờ/phút) dựng từ MỘT khuôn — chỉ khác id và nét cát rơi (giờ mảnh hơn).
  // THỨ TỰ VẼ quan trọng: cát + nét rơi TRƯỚC, kính + 2 nắp SAU CÙNG -> nắp/kính đè lên,
  // nét rơi dừng đúng tại nắp đáy, cát không lòi ra ngoài. Đáy cát (5..19) khớp đáy KÍNH
  // (nắp rộng hơn: 4..20).
  function buildHourglass(slot, id, streamX, streamW){
    slot.innerHTML =
      `<svg class="hourglass" id="${id}" viewBox="0 0 24 32" aria-hidden="true">
        <clipPath id="${id}-top"><rect id="${id}-top-r" x="0" y="0" width="24" height="14"></rect></clipPath>
        <clipPath id="${id}-bot"><rect id="${id}-bot-r" x="0" y="32" width="24" height="0"></rect></clipPath>
        <path class="hg-sand" clip-path="url(#${id}-top)" d="M5 4 H19 L12.8 14.5 V16 H11.2 V14.5 Z"></path>
        <path class="hg-sand" clip-path="url(#${id}-bot)" d="M5 28 L11.2 17 V16 H12.8 V17 L19 28 Z"></path>
        <rect class="hg-stream" x="${streamX}" y="15" width="${streamW}" height="13"></rect>
        <path class="hg-glass" d="M5 4 H19 L12.8 15 Q12 16 12.8 17 L19 28 H5 L11.2 17 Q12 16 11.2 15 Z"></path>
        <line class="hg-cap" x1="4" y1="4" x2="20" y2="4"></line>
        <line class="hg-cap" x1="4" y1="28" x2="20" y2="28"></line>
      </svg>`;
  }
  buildHourglass(document.querySelector('.u-hour .hg-slot'), 'hgH', 11.7, 0.6);
  buildHourglass(document.querySelector('.u-min .hg-slot'),  'hgM', 11.5, 1);
  // Cache root + 2 clip-rect (cát trên / cát dưới) cho updateHourglass()/flipHourglass()
  const hg = {
    H: {root:$('hgH'), top:$('hgH-top-r'), bot:$('hgH-bot-r')},
    M: {root:$('hgM'), top:$('hgM-top-r'), bot:$('hgM-bot-r')},
  };

  /* ===== 3. NHÃN HOẠT ĐỘNG — MỘT NGUỒN CẤU HÌNH ===== */
  // Toàn bộ nhãn cố định khai báo Ở ĐÂY; DOM, vị trí, trạng thái và emoji ô lịch đều sinh từ bảng này:
  //   emoji   : icon trên nhãn
  //   hour    : giờ thập phân (8.25 = 8h15)
  //   days    : chỉ HIỆN vào các thứ này (getDay 0=CN..6=T7); bỏ trống = mọi ngày
  //   inner   : đặt nhãn ở VÒNG TRONG (bán kính nhãn phút) để không đè nhãn cùng góc ở vòng ngoài
  //             (vd 10h sáng & 22h tối đều ở 300°: nhãn sáng nằm trong, tối nằm ngoài)
  //   noCal   : CHỈ hiện trên mặt đồng hồ, KHÔNG đánh dấu ở lịch (nhãn gần như ngày nào cũng có
  //             thì đánh dấu chỉ làm rối ô lịch mà không thêm thông tin)
  // Ô LỊCH tự suy ra từ đây (xem DAY_ACTIVITIES ngay dưới) — KHÔNG khai báo riêng, không lệch được.
  const FIXED_LABELS = [
    {emoji:'🎒', hour:8,    days:[1,2,3,4,5]},                    // ba lô: T2-T6 8h sáng
    {emoji:'☕', hour:8.5,  days:[0]},                            // cà phê: Chủ nhật 8h30
    {emoji:'🔠', hour:8.5,  days:[6]},                            // chữ cái: thứ Bảy 8h30
    {emoji:'🎨', hour:10,   days:[6], inner:true},                // vẽ: thứ Bảy 10h — vòng TRONG, tránh đè 22h
    {emoji:'🏀', hour:18,   days:[2], inner:true},                // bóng rổ: thứ Ba 18h — vòng TRONG (nhường vòng ngoài cho 🙋‍♀️)
    {emoji:'🩰', hour:18,   days:[5], inner:true},                // múa: thứ Sáu 18h — vòng TRONG (nhường vòng ngoài cho 🙋‍♀️)
    {emoji:'🔠', hour:18,   days:[3], inner:true},                // chữ cái: thứ Tư 18h — vòng TRONG (nhường vòng ngoài cho 🙋‍♀️)
    {emoji:'♟️', hour:18,   days:[0]},                             // cờ: Chủ nhật 18h — vòng NGOÀI (CN không có 🙋‍♀️)
    {emoji:'🙋‍♀️', hour:18, days:[1,2,3,4,5], noCal:true},         // giơ tay: T2-T6 18h — vòng NGOÀI, không lên lịch
    {emoji:'🎹', hour:19.25, days:[4]},                           // piano: thứ Năm 19h15
    {emoji:'🍲', hour:19.5},                                      // ăn tối: mọi ngày
    {emoji:'✍️', hour:20.25, days:[1,2,3,4]},                     // viết: T2-T5 20h15
    {emoji:'🤸🏼', hour:20.25, days:[5,6,0]},                      // T6-CN 20h15
    {emoji:'😴', hour:22},                                        // đi ngủ: mọi ngày
  ];
  // Emoji hoạt động ở góc ô lịch theo THỨ — SUY THẲNG từ bảng trên, không có cờ khai báo riêng:
  //   nhãn chỉ diễn ra vào MỘT SỐ THỨ (có days) -> đánh dấu đúng các thứ đó (T7 -> ['🔠','🎨']);
  //   nhãn MỌI NGÀY (không days) -> KHÔNG đánh dấu, vì ngày nào cũng có thì dấu không nói thêm gì;
  //   nhãn có noCal -> chủ động BỎ QUA (chỉ sống trên mặt đồng hồ).
  // => sửa/thêm/bớt nhãn ở FIXED_LABELS là mặt đồng hồ và lịch luôn khớp nhau.
  // Giữ dạng MẢNG (không nối chuỗi) để đếm đúng SỐ nhãn: emoji ghép ZWJ như 🙋‍♀️ dài 3 mã
  // -> nối chuỗi rồi đếm ký tự sẽ tưởng nhầm là nhiều nhãn.
  const DAY_ACTIVITIES = {};   // getDay 0..6 -> [{emoji, hour}] (lịch tuần đặt badge theo giờ)
  for(const L of FIXED_LABELS){
    if(!L.days || L.noCal) continue;
    for(const d of L.days){
      if(!DAY_ACTIVITIES[d]) DAY_ACTIVITIES[d] = [];
      DAY_ACTIVITIES[d].push({emoji:L.emoji, hour:L.hour});
    }
  }

  // Dựng DOM 1 nhãn emoji — dùng CHUNG cho nhãn cố định & nhãn người dùng.
  // Trả về {orbit, conn, badge, hour, dline}: cấu trúc chung cho applyLabel (trạng thái)
  // và placeLabel (vị trí). Nhãn phút deadline (.deadline-min) điền sẵn SỐ PHÚT của giờ
  // hoạt động (vd 8.25 -> "15"); nguồn duy nhất là hour nên không lệch.
  function createLabel(emoji, hour, extraClass){
    const orbit = document.createElement('div');
    orbit.className = 'orbit emoji-orbit upcoming' + (extraClass ? ' ' + extraClass : '');
    const conn  = document.createElement('div'); conn.className = 'connector';
    const badge = document.createElement('div'); badge.className = 'badge badge-emoji';
    const ic    = document.createElement('span'); ic.className = 'ic-emoji'; ic.textContent = emoji;
    const dline = document.createElement('span'); dline.className = 'deadline-min';
    dline.textContent = pad(minPart(hour));
    badge.append(ic, dline);
    orbit.append(conn, badge);
    analog.appendChild(orbit);
    return {orbit, conn, badge, hour, dline, emoji};
  }
  // Nhãn cố định: dựng từ bảng cấu hình; giữ thêm days/inner để lọc theo thứ & xếp tầng.
  // inner -> thêm class 'inner' (CSS cho z-index cao hơn nhãn vòng ngoài cùng góc).
  const fixedLabels = FIXED_LABELS.map(c => {
    const o = Object.assign(createLabel(c.emoji, c.hour), {days:c.days, inner:c.inner});
    if(c.inner) o.orbit.classList.add('inner');
    return o;
  });

  // Nhãn do NGƯỜI DÙNG tự thêm (dựng DOM động) — là LỜI NHẮC MỘT LẦN:
  // hiện từ lúc tạo và TỰ XÓA khi đã qua 6 TIẾNG sau giờ của nhãn (xem updateLabelStates).
  // Ngoài hour (vị trí trên mặt), mỗi nhãn lưu mốc TUYỆT ĐỐI 'at' (ms) = lần xuất hiện
  // sắp tới lúc tạo -> trạng thái & hạn xóa so theo thời gian thật, không lệch khi qua
  // nửa đêm (vd nhãn 22h vẫn "reached" lúc 1h sáng, tự xóa lúc 4h).
  // userLabelObjs giống cấu trúc {orbit,conn,badge,hour,dline} của fixedLabels
  // -> dùng chung applyLabel/placeLabel.
  //
  // ĐỒNG BỘ NHIỀU THIẾT BỊ (Firebase Realtime Database):
  //   Nguồn CHUẨN = nhánh /labels trên RTDB, MỖI NHÃN MỘT NODE con (id -> {emoji,hour,at})
  //   -> hai thiết bị thêm/xóa cùng lúc không ghi đè nhau. Mọi thiết bị nghe on('value'):
  //   thêm/xóa ở máy này hiện ra máy kia sau ~1 giây. localStorage chỉ còn là CACHE OFFLINE
  //   (mở trang không mạng vẫn thấy nhãn); snapshot server về -> server là chuẩn, thay cache.
  //   Mất mạng TẠM trong phiên: SDK tự xếp hàng lệnh ghi, gửi lại khi nối lại.
  //   Không tải được SDK (chặn CDN / offline từ đầu) -> labelsRef = null, mọi thứ chạy
  //   localStorage một máy như bản cũ (chỉ không đồng bộ).
  const LS_USER_LABELS = 'zumUserLabels';
  const USER_LABEL_TTL_MS = 6*3600e3;   // sống thêm 6 tiếng sau giờ của nhãn
  let userLabels = [];      // [{id, emoji, hour, at}] — bản chiếu đang hiển thị (server là chuẩn)
  let userLabelObjs = [];   // [{orbit, conn, badge, hour, dline, at}] — DOM đang hiển thị
  let labelsRef = null;     // nhánh /labels trên RTDB; null = chạy một máy (không sync)
  try{
    if(typeof firebase !== 'undefined'){
      firebase.initializeApp({
        apiKey: "AIzaSyCQnlQxrXyceuYHCNnyGIEAyU_KyBQUAXs",
        authDomain: "a2-1011-thoi-gian.firebaseapp.com",
        databaseURL: "https://a2-1011-thoi-gian-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "a2-1011-thoi-gian",
        storageBucket: "a2-1011-thoi-gian.firebasestorage.app",
        messagingSenderId: "1017684060626",
        appId: "1:1017684060626:web:636c64f4f049521074800b"
      });
      labelsRef = firebase.database().ref('labels');
    }
  }catch(e){ labelsRef = null; }
  // Thứ tự ổn định (mốc 'at' rồi id) -> mảng cục bộ và snapshot server so JSON được với nhau
  const sortLabels = a => a.sort((x,y) => (x.at - y.at) || (x.id < y.id ? -1 : 1));
  // MỌI đường sửa userLabels (snapshot server / thêm / xoá / hết hạn) đều kết thúc ở đây.
  // Gom lại một chỗ để đường thứ năm không thể quên mất layout() — thiếu nó là nhãn mới dựng
  // xong nhưng chưa được đặt vị trí, nằm chồng ở tâm mặt.
  function refreshUserLabels(){ saveUserLabels(); buildUserLabels(); layout(); }
  // Nghe server: mọi thay đổi /labels (kể cả echo do chính máy này ghi) đều về qua đây.
  // Dựng lại userLabels từ snapshot; so JSON trước, không đổi thì khỏi dựng lại DOM
  // (echo sau cập-nhật-tại-chỗ cho ra mảng y hệt nhờ sortLabels -> không giật).
  function startLabelSync(){
    if(!labelsRef) return;
    labelsRef.on('value', snap => {
      const v = snap.val() || {};
      const arr = sortLabels(Object.keys(v)
        .map(id => ({id, emoji:String(v[id].emoji||''), hour:+v[id].hour, at:+v[id].at}))
        .filter(u => u.emoji && isFinite(u.hour) && isFinite(u.at)));   // bỏ node dị dạng
      if(JSON.stringify(arr) === JSON.stringify(userLabels)) return;
      userLabels = arr;
      refreshUserLabels();
    });
  }
  // Mốc tuyệt đối GẦN NHẤT SẮP TỚI của giờ thập phân: hôm nay, hoặc NGÀY MAI nếu hôm nay
  // đã qua (vd 23:50 tạo nhãn 00:05 -> hiểu là 15 phút nữa, không phải đầu hôm nay).
  function nextOccurrence(hour){
    const d = new Date();
    d.setHours(Math.floor(hour), minPart(hour), 0, 0);
    if(d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function loadUserLabels(){
    try{ userLabels = JSON.parse(localStorage.getItem(LS_USER_LABELS)) || []; }catch(e){ userLabels = []; }
    // Nhãn lưu từ bản cũ chưa có mốc 'at' -> gán lần xuất hiện sắp tới rồi lưu lại
    if(userLabels.some(u => !u.at)){
      userLabels.forEach(u => { if(!u.at) u.at = nextOccurrence(u.hour); });
      saveUserLabels();
    }
    sortLabels(userLabels);
  }
  function saveUserLabels(){ try{ localStorage.setItem(LS_USER_LABELS, JSON.stringify(userLabels)); }catch(e){} }
  // Dựng lại toàn bộ DOM nhãn người dùng từ mảng userLabels; khác nhãn cố định ở chỗ
  // có nút × xóa + chạm để hiện × (mobile).
  function buildUserLabels(){
    userLabelObjs.forEach(o => o.orbit.remove());
    userLabelObjs = userLabels.map(u => {
      const o = Object.assign(createLabel(u.emoji, u.hour, 'off user-label'), {at:u.at});
      const del = document.createElement('button'); del.className = 'label-del';
      del.textContent = '×'; del.setAttribute('aria-label','Xóa nhãn');
      del.addEventListener('click', e => { e.stopPropagation(); removeUserLabel(u.id); });
      o.badge.appendChild(del);
      o.badge.addEventListener('click', () => o.orbit.classList.toggle('reveal-del'));  // chạm để hiện × (mobile)
      return o;
    });
  }
  // Thêm/xóa: ghi SERVER (nếu có) + cập nhật TẠI CHỖ ngay, không chờ echo
  // -> bấm là thấy liền, và đang offline (SDK chưa nối lại) vẫn dùng được.
  function addUserLabel(emoji, hour){
    const u = {id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
               emoji, hour, at: nextOccurrence(hour)};
    if(labelsRef) labelsRef.child(u.id).set({emoji:u.emoji, hour:u.hour, at:u.at});
    userLabels.push(u); sortLabels(userLabels);
    refreshUserLabels();
  }
  function removeUserLabel(id){
    if(labelsRef) labelsRef.child(id).remove();
    userLabels = userLabels.filter(u => u.id !== id);
    refreshUserLabels();
  }

  // ĐẾN GIỜ hoạt động -> hiện emoji của nhãn NGAY TRÊN TÂM đồng hồ (x2 cỡ nhãn) trong 5 giây.
  // Nhãn mới kích hoạt sau (hiếm khi trùng) đè nhãn trước và tính lại 5 giây.
  const elCenterEmoji = $('centerEmoji');
  const CENTER_EMOJI_MS = 5000;
  let centerEmojiTimer = 0;
  function showCenterEmoji(emoji){
    elCenterEmoji.textContent = emoji;
    elCenterEmoji.classList.add('show');
    clearTimeout(centerEmojiTimer);
    centerEmojiTimer = setTimeout(()=>elCenterEmoji.classList.remove('show'), CENTER_EMOJI_MS);
  }

  // Bật/tắt 1 nhãn + cập nhật trạng thái chưa-đến-giờ + nhãn phút deadline.
  //   CHỈ có một class: 'upcoming' = chưa tới giờ (viền + nét MỜ). Đã tới/qua thì GỠ class,
  //   rơi về kiểu mặc định (viền + nét đặc) — không có class 'reached', đừng thêm vào.
  function applyLabel(L, show, nowH){
    L.orbit.classList.toggle('off', !show);   // ẩn nhãn khi không thỏa điều kiện
    if(!show){ if(L.dline) L.dline.classList.remove('show'); L.wasReached = undefined; return; }
    // Nhãn người dùng có mốc tuyệt đối 'at' (một lần) -> so theo thời gian thật để không
    // lệch khi qua nửa đêm; nhãn cố định lặp hằng ngày -> so theo giờ trong ngày.
    const reached = L.at ? Date.now() >= L.at : nowH >= L.hour;
    // VỪA chạm giờ hoạt động (đang hiện + upcoming -> reached) -> emoji nổi trên tâm 5s.
    //   So sánh === false (không phải falsy): lần áp đầu tiên wasReached = undefined
    //   -> mở trang khi ĐÃ QUA giờ sẽ không bắn lại.
    if(reached && L.wasReached === false) showCenterEmoji(L.emoji);
    L.wasReached = reached;
    L.orbit.classList.toggle('upcoming', !reached);
    // Nhãn phút deadline: chỉ hiện trong 59 phút TRƯỚC giờ hoạt động (ẩn đúng lúc tới giờ)
    if(L.dline){
      const deltaMin = L.at ? (L.at - Date.now())/60000 : (L.hour - nowH) * 60;
      L.dline.classList.toggle('show', deltaMin > 0 && deltaMin <= 59);
    }
  }
  function updateLabelStates(nowH, dow){
    // Nhãn lịch tuần cố định: lọc theo THỨ — hiện TẤT CẢ nhãn của hôm đó suốt cả ngày
    // (nhãn trùng góc đã có cờ inner xếp tầng trong/ngoài nên không đè nhau).
    for(const L of fixedLabels){
      applyLabel(L, !L.days || L.days.includes(dow), nowH);
    }
    // Nhãn người dùng: TỰ XÓA HẲN khi đã qua 6 tiếng sau giờ của nhãn — xóa cả trên
    // SERVER (idempotent: nhiều thiết bị cùng xóa một id không sao) lẫn cache cục bộ.
    const cutoff = Date.now() - USER_LABEL_TTL_MS;
    if(userLabels.some(u => u.at < cutoff)){
      if(labelsRef) for(const u of userLabels) if(u.at < cutoff) labelsRef.child(u.id).remove();
      userLabels = userLabels.filter(u => u.at >= cutoff);
      refreshUserLabels();
    }
    // Còn hạn -> LUÔN hiện;
    //   pill phút vẫn theo logic 59' của applyLabel (chỉ hiện trong 59' trước giờ).
    for(const o of userLabelObjs){ applyLabel(o, true, nowH); }
  }

  /* ===== 4. VĂN NÓI GIỜ (VN + EN) ===== */
  // Phân buổi theo giờ 24h — MỘT nguồn ranh giới cho cả VN & EN (luôn đồng bộ)
  function buoiIdx(h){
    if(h>=4  && h<=10) return 0;   // sáng  / morning
    if(h>=11 && h<=12) return 1;   // trưa  / noon
    if(h>=13 && h<=17) return 2;   // chiều / afternoon
    if(h>=18 && h<=21) return 3;   // tối   / evening
    return 4;                      // đêm   / night (22,23,0–3)
  }
  const BUOI_VN = ['sáng','trưa','chiều','tối','đêm'];
  const BUOI_EN = ['in the morning','at noon','in the afternoon','in the evening','at night'];
  const buoi     = h => BUOI_VN[buoiIdx(h)];   // buổi tiếng Việt
  const periodEn = h => BUOI_EN[buoiIdx(h)];   // buổi tiếng Anh (cùng ranh giới)
  // Bọc span màu cho văn nói: 'h'=giờ, 'm'=phút/kém, 'b'=buổi
  const spk = (cls,x)=>`<span class="sp-${cls}">${x}</span>`;

  // Văn nói TIẾNG VIỆT — "giờ hơn": luôn đọc xuôi theo giờ HIỆN TẠI (mọi phút).
  //   0 -> "X giờ đúng"  ·  còn lại -> "X giờ m phút"
  //   (:30 -> "X giờ 30 phút", KHÔNG dùng "rưỡi" — rưỡi để cho cửa sổ kém, tránh trùng)
  function noiGioHon(h,m){
    const b=spk('b',buoi(h)), hr=spk('h',gio12(h)+' giờ');
    if(m===0) return hr+' '+spk('m','đúng')+' '+b;
    return hr+' '+spk('m',m+' phút')+' '+b;
  }
  // Văn nói TIẾNG VIỆT — "giờ kém": CHỈ có ở nửa sau giờ (rưỡi ở :30, kém ở 31–59).
  //   <30 -> null (ẩn — nửa đầu giờ không có cách đọc kém)
  //   30  -> "X giờ rưỡi"  ·  31–59 -> "(X+1) giờ kém (60-m) phút"
  //   (vd 16:30 -> "4 giờ rưỡi chiều"; 16:45 -> "5 giờ kém 15 phút chiều")
  function noiGioKem(h,m){
    if(m<30) return null;
    const b=spk('b',buoi(h));
    if(m===30) return spk('h',gio12(h)+' giờ')+' '+spk('m','rưỡi')+' '+b;
    return spk('h',gio12(h+1)+' giờ')+' '+spk('m','kém '+(60-m)+' phút')+' '+b;
  }

  // Số đếm tiếng Anh bằng CHỮ (0..59): giờ 1-12 và phút 0-59.
  const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten',
              'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen',
              'eighteen','nineteen'];
  const TENS=['','','twenty','thirty','forty','fifty'];
  function numEn(n){
    if(n<20) return ONES[n];
    const o=n%10; return o ? TENS[(n/10)|0]+'-'+ONES[o] : TENS[(n/10)|0];
  }
  // Văn nói TIẾNG ANH — "giờ hơn": đọc giờ rồi phút (số viết bằng CHỮ).
  // Viết hoa chữ cái đầu câu lo bằng CSS (.spoken::first-letter).
  //   12:00 -> "twelve noon"; 0:00 -> "twelve midnight"
  //   :00 -> "four o'clock"   :01-:09 -> "four oh five"   >=:10 -> "four forty-five"
  function noiGioEnHon(h,m){
    if(m===0 && h===12) return spk('h','twelve')+' '+spk('b','noon');
    if(m===0 && h===0)  return spk('h','twelve')+' '+spk('b','midnight');
    const hr=spk('h',numEn(gio12(h))), b=spk('b',periodEn(h));
    if(m===0) return hr+' '+spk('m',"o'clock")+' '+b;     // four o'clock
    if(m<10)  return hr+' '+spk('m','oh '+numEn(m))+' '+b; // four oh five
    return hr+' '+spk('m',numEn(m))+' '+b;                 // four forty-five
  }
  // Văn nói TIẾNG ANH — "giờ kém": CHỈ có ở nửa sau giờ ("half past" :30, "... to ..." 31–59).
  //   <30 -> null (ẩn)  ·  30 -> "half past X"  ·  31–59 -> "(60-m) to (X+1)"
  //   (vd 16:30 -> "half past four..."; 16:45 -> "fifteen to five...")
  function noiGioEnKem(h,m){
    if(m<30) return null;
    if(m===30) return spk('m','half past')+' '+spk('h',numEn(gio12(h)))+' '+spk('b',periodEn(h));
    return spk('m',numEn(60-m)+' to')+' '+spk('h',numEn(gio12(h+1)))+' '+spk('b',periodEn(h));
  }

  /* ===== 5. BỐ CỤC TỰ CO (layout) ===== */
  /* px tính từ tâm. Nhãn nằm NGOÀI cả cụm vòng (phút + 2 vòng ngày); bán kính nhãn
     tính trong layout() theo mép ngoài cụm vòng + nửa bề rộng nhãn (lúc nhãn ở 3/9 giờ).
     Khe MÉP nhãn giờ -> mép nhãn phút = khe mép nhãn phút -> vòng ngày ngoài (D2)
     => hai khe nhìn thấy quanh nhãn phút bằng nhau; nhãn không đè khi hai kim trùng. */
  // Mọi số dùng chung với CSS đều ĐỌC TỪ :root, không chép tay sang đây — đổi một chỗ là cả
  // hai phía đi theo. (Bề rộng nét vòng đặc biệt quan trọng: mọi bán kính ở vành ngoài đều
  // suy từ nửa nét, chép tay mà lệch là cả cụm vòng đặt sai chỗ mà không báo lỗi.)
  const cssVar = (name, fallback) =>
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || fallback;
  // Nhãn là HÌNH TRÒN đều -> nửa bề ngang = nửa bề cao = bán kính.
  const BADGE_H    = cssVar('--badge-dia', 26);   // ĐƯỜNG KÍNH nhãn
  const BADGE_HALF = BADGE_H/2;   // BÁN KÍNH nhãn (điểm gần tâm nhất khi nhãn ở 3/9 giờ = tâm - bán kính)
  // Bán kính THẬT của một nhãn đã dựng (đo được thì lấy số đo, chưa thì lấy cỡ danh nghĩa):
  // nhãn emoji có viền nên chiều cao thật lệch chút so với --badge-dia.
  const halfOf = el => el.offsetHeight/2 || BADGE_HALF;
  const RING_HALF  = cssVar('--ring-thin', 1)/2;  // nửa nét MẢNH — MỌI khe ở vành ngoài đo theo số này
  const EDGE       = 12;   // lề tối thiểu tới cạnh màn hình

  // Hai sàn cho bán kính mặt: sàn MỀM là cỡ dễ đọc, chỉ giữ khi bề ngang còn cho phép; sàn
  // CỨNG là mức không bao giờ xuống dưới, kể cả khi vì thế mà nội dung rộng hơn màn.
  const FACE_SOFT_MIN = 70;
  const FACE_MIN = 50;
  let FACE;
  let ARC_R_M = 0, ARC_R_D1 = 0, ARC_R_D2 = 0;
  let HOUR_BADGE_R = 0, MIN_BADGE_R = 0, HOUR_HALF = 0, lastPm = null;   // bán kính đĩa kính giờ/phút (JS đặt vị trí) + nét nối giờ bám vòng ngày

  // Chiều cao vùng nhìn thấy THẬT (đã trừ thanh công cụ Safari): visualViewport chính
  // xác nhất; 100dvh/clientHeight trên vài bản Safari trả vùng LỚN -> căn giữa bị lệch.
  const viewportH = () => (window.visualViewport && window.visualViewport.height)
        || document.documentElement.clientHeight || window.innerHeight;

  // KHÔNG đo zoom ở đây. devicePixelRatio đổi vì nhiều lý do (màn hình khác mức scale, máy có
  // dpr 2/3) chứ không riêng zoom -> lấy nó làm hệ số zoom là có lúc thổi phồng mặt đồng hồ ra
  // ngoài màn. Chống co rúm làm ở chỗ NGHE SỰ KIỆN: mobile không căn lại theo chiều cao.

  // 2 bố cục theo BỀ RỘNG (khớp media query CSS):
  //   >=768px: đồng hồ trái + lịch phải | <768px: xếp dọc.
  const mqDesktop = window.matchMedia('(min-width:768px)');

  function layout(){
    const ARC_GAP = 8;

    // ===== Bán kính VÒNG & NHÃN (đều là độ lệch so với FACE, KHÔNG phụ thuộc FACE) =====
    // MỘT khe hở duy nhất cho cả vành ngoài, đo MÉP tới MÉP (không phải tâm tới tâm):
    //     mép mặt -> vòng phút -> vòng ngày TRONG -> vòng ngày NGOÀI -> nhãn phút -> nhãn giờ
    // Mọi khe đều bằng CLEAR, RIÊNG khe giữa hai vòng ngày bằng NỬA CLEAR vì hai vòng đó là
    // một nhóm. Đo theo mép nên mỗi bước phải cộng thêm nửa bề rộng của thứ nằm hai bên khe.
    //
    // MỖI VÒNG CÓ HAI LỚP NÉT CHỒNG LÊN NHAU: track/arc nét MẢNH (--ring-thin 1px) vẽ TRỌN
    // vòng, còn act/live nét ĐẬM (--ring-bold 3.2px) chỉ phủ Ô HIỆN TẠI (6° phút / 30° giờ).
    // Đường liên tục mắt nhìn thấy là nét MẢNH nên MỌI khe đo theo nó — kể cả khe ra nhãn.
    //   Đo nhầm theo nét đậm thì khe MÉP MẶT -> vòng phút (chỉ có MỘT mép vòng) hụt hơn khe
    //   vòng-tới-vòng (có HAI mép) đúng 1.1px, nhìn ra ngay.
    //   Đánh đổi đã cân nhắc: ngay tại ô hiện tại, nét đậm thò thêm 1.1px mỗi bên nên khe ở
    //   đúng chỗ đó hẹp lại (vd vòng ngày ngoài -> nhãn phút còn ~3.9px). Chấp nhận để cả
    //   vành có MỘT nhịp đều, thay vì để riêng khe ra nhãn rộng hơn mọi khe khác 1.1px.
    // RING_HALF đọc từ --ring-thin ở đầu script, không khai báo lại ở đây.
    const CLEAR = 5;                           // khe hở CHUNG của mọi cặp kề nhau ở vành ngoài
    const STEP  = RING_HALF + CLEAR + RING_HALF;   // tâm->tâm hai vòng cách nhau một khe CHUNG
    const R_M_OFF  = CLEAR + RING_HALF;        // vòng phút (60'): mép trong cách MÉP MẶT đúng CLEAR
    const R_D1_OFF = R_M_OFF + STEP;           // vòng nửa ngày 1 (TRONG)
    const R_D2_OFF = R_D1_OFF + STEP - CLEAR/2;// vòng nửa ngày 2 (NGOÀI) — chỉ cách vòng 1 nửa khe
    const RING_OUT = R_D2_OFF + RING_HALF;     // mép NGOÀI cụm vòng, theo NÉT MẢNH như mọi khe khác

    // Nhãn quay quanh mặt: khi ở 3/9 giờ, điểm GẦN TÂM NHẤT của nhãn = tâm_nhãn - BADGE_HALF.
    // Điểm đó cách mép cụm vòng (RING_OUT) đúng CLEAR => tâm nhãn phút = RING_OUT + CLEAR + BADGE_HALF.
    const badgeM_off = RING_OUT + CLEAR + BADGE_HALF;   // khoảng cách tâm -> nhãn PHÚT
    // Nhãn GIỜ: khe mép nhãn phút -> mép nhãn giờ cũng ĐÚNG BẰNG CLEAR => hai khe NHÌN THẤY
    // hai bên nhãn phút (vào vòng ngày ngoài, ra nhãn giờ) bằng nhau.
    //   Phải trừ theo RING_OUT (MÉP nét vòng) chứ không phải R_D2_OFF (TÂM nét), không thì
    //   khe trong hụt đúng nửa bề rộng nét.
    // Nhãn hoạt động dùng lại chính hai bán kính này (placeLabel: inner -> badgeM_r,
    // ngoài -> badgeH_r) nên tầng trong/ngoài của chúng tự khớp, không tính riêng.
    const badgeH_off = badgeM_off + BADGE_H + CLEAR;

    // Lề quanh mặt = mép NGOÀI nhãn giờ lúc nằm ngang (tâm + nửa bề rộng) + 1 ARC_GAP dư.
    const maxReach = badgeH_off + BADGE_HALF + ARC_GAP;

    // clientWidth = LAYOUT viewport: trên Safari iOS window.innerWidth bám VISUAL viewport,
    // pinch-zoom xong đổi giá trị -> layout() co mặt lại (chỉ số .95rem không co nên "số to ra").
    const vw = document.documentElement.clientWidth;
    const vh = viewportH();

    // 2 bố cục theo CHIỀU RỘNG (khớp media query CSS): desktop (≥768) | dọc (<768)
    const desktop = mqDesktop.matches;

    const bodyPad = 16;                       // padding .5rem hai đầu (chiều cao body do CSS media lo)

    // ===== Lề dọc analog: đẩy analog LÊN, cách digital/cát xa hơn — KHÔNG co FACE =====
    // Lề NGANG phải bằng maxReach (tầm với của nhãn giờ lúc nó ở 3/9 giờ). Tầm với THẲNG
    // ĐỨNG nhỏ hơn đúng ARC_GAP, vì maxReach = topNeed + ARC_GAP (BADGE_HALF với BADGE_H/2
    // là cùng một số). Dồn phần dư đó xuống dưới => analog nhích LÊN đúng ARC_GAP.
    // GAP_EXTRA lấy thêm từ ĐỆM ĐÁY -> khe hở tới digital rõ hơn mà FACE giữ nguyên.
    const topNeed   = badgeH_off + BADGE_HALF;           // tầm với THẲNG ĐỨNG của nhãn giờ
    const GAP_EXTRA = desktop ? 24 : 8;                  // khe thêm lấy từ đệm đáy
    const marginTop    = topNeed;                        // = maxReach - ARC_GAP
    const marginBottom = topNeed + ARC_GAP + GAP_EXTRA;

    let faceByW;
    if(desktop){
      // DESKTOP chia đôi màn hình: đồng hồ chiếm NỬA TRÁI. Khối analog (2*FACE + 2*maxReach)
      // vừa trong nửa màn hình; đồng thời vừa CHIỀU CAO (chừa nhãn + cột digital + dòng văn nói).
      const digitalH = elDigitalCol?.offsetHeight || 140;   // gồm dòng văn nói đã dành chỗ
      const faceByH = (vh - bodyPad - marginTop - marginBottom - digitalH - 16 + GAP_EXTRA) / 2;
      faceByW = ((vw/2) - 2*maxReach - 24) / 2;             // khối analog vừa ~nửa màn hình (khe hẹp lại -> mặt TO hơn)
      FACE = Math.min(faceByW, faceByH);
    } else {
      // MOBILE DỌC: đồng hồ chỉ co theo BỀ RỘNG (cao hơn màn thì cuộn) -> không cần đo
      // chiều cao digital/lịch hay tính theo viewport-height.
      const halfW = (Math.min(vw, 900) / 2) - EDGE;
      faceByW = halfW - maxReach;
      FACE = faceByW;
    }
    // Sàn MỀM (FACE_SOFT_MIN) NHƯNG không bao giờ vượt quá giới hạn BỀ RỘNG (faceByW) ->
    // bề ngang khối analog luôn vừa viewport, không gây scroll ngang. (Màn quá thấp
    // thì chấp nhận co theo chiều cao thay vì tràn ngang.)
    FACE = Math.max(FACE, Math.min(FACE_SOFT_MIN, faceByW));
    // SÀN CỨNG: faceByW có thể ÂM khi viewport cực hẹp (zoom rất sâu) -> chặn để mặt
    // KHÔNG BAO GIỜ co về 0 (thà cuộn còn hơn co rúm).
    FACE = Math.max(FACE, FACE_MIN);

    const D = FACE*2;
    analog.style.width  = D+'px';
    analog.style.height = D+'px';
    // Lề: trên = marginTop (đã nhích analog lên); dưới = marginBottom (khe hở tới digital);
    //     hai bên = maxReach (đủ chỗ nhãn lúc 3/9 giờ).
    analog.style.margin = `${marginTop}px ${maxReach}px ${marginBottom}px`;

    // Ba vòng đồng tâm, cách đều nhau đúng CLEAR; RIÊNG hai vòng "ngày" chỉ cách nhau NỬA
    // CLEAR nên đọc thành một nhóm (xem khối hằng số ở đầu hàm).
    ARC_R_M  = FACE + R_M_OFF;        // vòng phút (60') — trong cùng
    ARC_R_D1 = FACE + R_D1_OFF;       // vòng nửa ngày 1 (sáng 0-12h)
    ARC_R_D2 = FACE + R_D2_OFF;       // vòng nửa ngày 2 (chiều/tối 12-24h) — sát vòng 1

    // Tâm nhãn: nằm NGOÀI cả cụm vòng (đã tính ở trên), không đè vòng ngày khi quay tới 3/9 giờ
    const badgeM_r = FACE + badgeM_off;   // nhãn phút
    const badgeH_r = FACE + badgeH_off;   // nhãn giờ

    // Nét nối: nhãn PHÚT nối từ VÒNG PHÚT (ARC_R_M). Nhãn GIỜ nối từ vòng ngày ĐANG CHẠY
    //   (sáng -> vòng TRONG D1, chiều/tối -> vòng NGOÀI D2) nên LUÔN chạm vòng hiện hành.
    //   Dùng chiều cao thật của nhãn đo được để nét nối kết thúc đúng tại mép nhãn.
    const realHalfM = halfOf(elBadgeM);
    const realHalfH = halfOf(elBadgeH);
    // Nét nối PHÚT + lớp số phút (đĩa kính phút là con .analog, tick() lo vị trí theo MIN_BADGE_R).
    place(elConnM, elBadgeMt, ARC_R_M, badgeM_r, realHalfM);
    MIN_BADGE_R = badgeM_r;                            // tick() đặt đĩa kính phút theo bán kính này
    // Nhãn GIỜ: lưu bán kính nhãn + nửa chiều cao để placeHourConn() tính lại khi qua trưa/nửa đêm.
    HOUR_BADGE_R = badgeH_r; HOUR_HALF = realHalfH;
    elBadgeHt.style.marginTop = (-badgeH_r) + 'px';   // lớp số giờ trùng vị trí đĩa kính
    placeHourConn(new Date().getHours() >= 12);

    // Nhãn EMOJI (cố định + người dùng): GIỐNG nhãn giờ (nét nối từ vòng ngày AM/PM) nhưng đặt
    // tại 'hour' giờ thập phân. Trên mặt 12h: góc = hour*30 (vd 22h -> 660°≡300°).
    //   inner=true -> đặt nhãn ở VÒNG TRONG (bán kính nhãn phút) để KHÔNG đè nhãn cùng góc
    //   ở vòng ngoài (vd 10h sáng & 22h tối đều ở 300°): nhãn sáng nằm trong, tối nằm ngoài.
    const placeLabel = L => {
      const deg = L.hour * 30;
      const ringR = L.hour < 12 ? ARC_R_D1 : ARC_R_D2;   // SÁNG -> vòng TRONG (AM); CHIỀU/TỐI -> vòng NGOÀI (PM)
      const badgeR = L.inner ? badgeM_r : badgeH_r;       // tầng nhãn: trong (badgeM_r) / ngoài (badgeH_r)
      place(L.conn, L.badge, ringR, badgeR, halfOf(L.badge));              // nét nối CHẠM đúng vòng AM/PM
      L.orbit.style.transform = `rotate(${deg}deg)`;                       // hướng nhãn ra đúng giờ
      L.badge.style.transform = `translate(-50%,-50%) rotate(${-deg}deg)`; // giữ nhãn thẳng đứng
      // Pill phút: đẩy ra ĐIỂM XA TÂM NHẤT của nhãn (mép ngoài, đối diện nét nối). Net xoay
      //   orbit(+deg)·badge(-deg)=0 nên offset (px,py) hiện đúng màn hình; hướng xa tâm = (sin, -cos).
      if(L.dline){
        // Đẩy chấm phút RA NGOÀI mép nhãn thêm chút nữa -> bớt đè lên emoji
        const R = halfOf(L.badge) + 4;
        L.dline.style.transform = `translate(-50%,-50%) ${polarTranslate(R, deg)}`;
      }
    };
    for(const L of fixedLabels)   placeLabel(L);
    for(const o of userLabelObjs) placeLabel(o);

    layoutFace();

    // Phát bề rộng KHỐI ĐỒNG HỒ (mặt + tầm với nhãn) ra biến CSS --clock-w.
    // JS chỉ công bố một con số (vì FACE do JS tính); còn RULE "bảng rộng bằng đồng hồ"
    // nằm ở CSS: .calendar{ width:min(var(--clock-w), 100%) }.
    document.documentElement.style.setProperty('--clock-w', (D + 2*maxReach) + 'px');

  }

  // Nét nối: chạy TỪ vòng ringR ra ngoài, dài len. Đặt bằng top vì gốc toạ độ là tâm mặt,
  // nên top phải là điểm XA TÂM NHẤT của nét.
  function placeConn(conn, ringR, len){
    conn.style.top    = (-(ringR + len)) + 'px';
    conn.style.height = len + 'px';
  }
  // Nét nối + nhãn của cùng một cặp. len tính ngay trong đây: nét nối luôn chạy từ vòng ra
  // tới đúng MÉP TRONG của nhãn, không chỗ gọi nào cần công thức khác.
  function place(conn, badge, ringR, badgeR, badgeHalf){
    placeConn(conn, ringR, (badgeR - badgeHalf) - ringR);
    badge.style.marginTop = (-badgeR)+'px';
  }
  // Nét nối nhãn GIỜ: bám vòng ngày đang chạy (pm -> vòng NGOÀI D2, sáng -> vòng TRONG D1).
  //   Đầu xa (mép nhãn) cố định ở HOUR_BADGE_R - HOUR_HALF; chỉ đổi điểm đầu trong theo vòng.
  //   Gọi placeConn chứ không gọi place: nhãn giờ đã được layout() đặt rồi, hàm này chỉ
  //   chỉnh mỗi nét nối mỗi khi qua trưa/nửa đêm.
  function placeHourConn(pm){
    // ringR, KHÔNG đặt tên 'ring': ở phạm vi ngoài đã có object `ring` chứa các path SVG.
    const ringR = pm ? ARC_R_D2 : ARC_R_D1;
    placeConn(elConnH, ringR, (HOUR_BADGE_R - HOUR_HALF) - ringR);
  }

  // Đặt lại vạch chia và số theo FACE hiện tại
  function layoutFace(){
    // Hai khoảng riêng:
    //   G_RIM: mép -> đầu vạch
    //   G_NUM: đuôi vạch -> chữ số  (để nhỏ cho số sát vạch)
    const G_RIM = 5;
    const G_NUM = 2;
    const majorLen = 8;
    const minorLen = 4;
    const tickOuter = FACE - G_RIM;
    const tickInner = tickOuter - majorLen;

    tickSpans.forEach((sp,i)=>{
      const major=(i%5===0);
      const len=major?majorLen:minorLen;
      sp.style.top=(-tickOuter)+'px';
      sp.style.height=len+'px';
    });

    // Đặt BÁN KÍNH RIÊNG cho từng số: mép ngoài mỗi số cách đuôi vạch đúng G_NUM
    numerals.forEach(el=>{
      const n=+el.dataset.n;
      const [ux,uy]=polar(1, n*30);   // vector đơn vị từ tâm hướng ra số n
      const rg=document.createRange(); rg.selectNodeContents(el);
      const r=rg.getBoundingClientRect();
      const halfReach=Math.abs(ux)*r.width/2 + Math.abs(uy)*r.height/2;
      const radius=(tickInner - G_NUM) - halfReach;
      el.style.left=`calc(50% + ${ux*radius}px)`;
      el.style.top=`calc(50% + ${uy*radius}px)`;
    });
    // Kim ngắn hơn vòng số để không đè lên số (dùng ref đã cache)
    const hh=FACE*0.34, mh=FACE*0.55, sh=FACE*0.62;
    elHour.style.height=hh+'px'; elHour.style.marginTop=(-hh)+'px';
    elMin.style.height=mh+'px';  elMin.style.marginTop=(-mh)+'px';
    elSec.style.height=sh+'px';  elSec.style.marginTop=(-sh)+'px';
  }

  /* ===== 6. VÒNG TIẾN TRÌNH (SVG) ===== */
  // TRỌN vòng nhưng thiếu một tí: cung 360° có hai đầu trùng nhau nên SVG vẽ ra rỗng.
  const FULL_DEG = 359.999;
  // Cung tròn từ startDeg đến endDeg (đo từ 12h) — dựa trên polar() ở phần 1
  function arcPath(r, startDeg, endDeg){
    const sweep=endDeg-startDeg;
    if(sweep<=0.001) return '';
    const [x1,y1]=polar(r, startDeg);
    const [x2,y2]=polar(r, endDeg);
    const largeArc = sweep>180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
  }
  // Vẽ MỘT vòng 4 trạng thái: track(MẢNH MỜ=tương lai) + arc(MẢNH ĐẶC=quá khứ)
  //   + act(ĐẬM MỜ=ô hiện tại) + live(ĐẬM ĐẶC=phần đã trôi trong ô hiện tại).
  //   doneDeg = hết các đơn vị đã qua; slot = bề rộng 1 đơn vị (6° phút / 30° giờ); liveDeg = tiến trình.
  //   slot=0 -> không có ô hiện tại (dùng cho nửa ngày KHÔNG diễn ra).
  function drawRing(g, r, doneDeg, slot, liveDeg){
    setD(g.track, arcPath(r, 0, FULL_DEG));                        // cả vòng: MẢNH MỜ (chưa tới)
    setD(g.arc,   arcPath(r, 0, doneDeg));                         // đã qua: MẢNH ĐẶC
    setD(g.act,   slot ? arcPath(r, doneDeg, doneDeg+slot) : ''); // ô hiện tại: ĐẬM MỜ
    setD(g.live,  slot ? arcPath(r, doneDeg, liveDeg) : '');      // đã trôi trong ô: ĐẬM ĐẶC
  }
  // Vòng phút (60'): đơn vị 6°; đã qua = phút trọn, ô PHÚT hiện tại đậm, tiến trình theo giây.
  function updateMinArc(m, s){
    drawRing(ring.min, ARC_R_M, m*6, 6, (m + s/60)*6);
  }
  // Hai vòng nửa ngày (mỗi vòng 12h, đơn vị GIỜ = 30°): SÁNG -> vòng 1 chạy, CHIỀU/TỐI -> vòng 2.
  //   Vòng đang chạy: đủ 4 trạng thái. Vòng kia: nửa ĐÃ xong -> đầy đặc; chưa tới -> chỉ track mờ.
  function drawDayRings(g1, g2, r1, r2, h, m, s){
    const H = h % 12, doneDeg = H*30, liveDeg = (H + m/60 + s/3600)*30, pm = h >= 12;
    drawRing(pm ? g2 : g1, pm ? r2 : r1, doneDeg, 30, liveDeg);   // nửa đang chạy: đủ 4 trạng thái
    drawRing(pm ? g1 : g2, pm ? r1 : r2, pm ? FULL_DEG : 0, 0, 0); // nửa kia: đầy nếu đã qua / mờ nếu chưa tới
  }
  function updateDayArcs(h, m, s){
    drawDayRings(ring.day1, ring.day2, ARC_R_D1, ARC_R_D2, h, m, s);
  }

  /* ===== 7. NHỊP NHÃN + ĐỒNG HỒ CÁT ===== */
  // Trạng thái "nảy" của mỗi nhãn: thời điểm bắt đầu + đỉnh scale. Scale do JS lo (xem tick).
  const BEAT_MS = 450;
  const beat = { H:{start:-1e12, peak:1, badge:elBadgeH},
                 M:{start:-1e12, peak:1, badge:elBadgeM} };

  // Hệ số scale tại thời điểm now cho một nhãn (envelope: lên đỉnh ~22% rồi về 1).
  function beatScale(b, now){
    const t = (now - b.start) / BEAT_MS;
    if(t<=0 || t>=1) return 1;
    const up = 0.22;
    const e = t<up ? t/up : 1-(t-up)/(1-up);   // tam giác 0..1..0
    return 1 + (b.peak-1) * (e*(2-e));          // ease-out nhẹ
  }

  // Bắn một nhịp lên nhãn (key 'H'/'M'): NỀN nhấp bằng CSS; SCALE do JS gộp vào transform.
  // cls = 'beat' (thường) hoặc 'beat-final' (nhịp cuối, nảy mạnh hơn).
  function pulse(key, cls){
    const b = beat[key];
    b.badge.classList.remove('beat','beat-final');
    void b.badge.offsetWidth;          // restart CSS animation nền
    b.badge.classList.add(cls);
    b.start = performance.now();
    b.peak  = cls==='beat-final' ? 1.3 : 1.12;
  }

  // Lật đồng hồ cát (one-shot): gỡ class rồi thêm lại để animation chạy lại từ đầu
  function flipHourglass(el){
    el.classList.remove('flip');
    void el.offsetWidth;
    el.classList.add('flip');
    el.addEventListener('animationend', ()=>el.classList.remove('flip'), {once:true});
  }

  // Đồng hồ cát: p = tiến trình 0..1. Cát trên vơi (lùi xuống), cát dưới đầy (dâng lên).
  //   Hai buồng cát là TAM GIÁC (đỉnh ở cổ) nên THỂ TÍCH (~ diện tích) tỉ lệ với
  //   chiều cao BÌNH PHƯƠNG. Muốn cát chảy đều theo thời gian (thể tích tuyến tính
  //   theo p) thì chiều cao phải đi theo CĂN BẬC HAI, không tuyến tính.
  //   Cát trên còn lại = (1-p) thể tích  -> chiều cao còn lại ~ sqrt(1-p)
  //   Cát dưới phần TRỐNG phía trên = (1-p) thể tích -> chiều cao trống ~ sqrt(1-p)
  function updateHourglass(g, p){
    // Đang lật: giữ cát ở trạng thái CẠN cho khớp lúc xoay, chưa refill vội
    if(g.root.classList.contains('flip')) p=1;
    const TOP_Y=4,  TOP_NECK=15;     // tam giác trên: đáy y=4, đỉnh ở cổ y=15
    const BOT_Y=28, BOT_NECK=17;     // tam giác dưới: đáy y=28, đỉnh ở cổ y=17
    const rem=Math.sqrt(Math.max(0, 1-p));   // tỉ lệ CHIỀU CAO ứng với (1-p) thể tích
    const topStart=TOP_NECK - (TOP_NECK-TOP_Y)*rem;
    g.top.setAttribute('y', topStart);
    g.top.setAttribute('height', Math.max(0, TOP_NECK - topStart));
    const botStart=BOT_NECK + (BOT_Y-BOT_NECK)*rem;
    g.bot.setAttribute('y', botStart);
    g.bot.setAttribute('height', Math.max(0, BOT_Y - botStart));
    // Nét dọc cát rơi: chiều dài CỐ ĐỊNH (khai báo sẵn trong rect), luôn hiện -> không xử lý ở JS.
  }

  /* ===== 8. LỊCH TUẦN (cột = giờ 0–24, hàng = 7 thứ T2..CN) ===== */
  /* Tuần HIỆN TẠI (bắt đầu Thứ Hai). Mỗi hàng = một ngày: TRÁI = số ngày + thứ VN,
       GIỮA = track 24 giờ, PHẢI = thứ EN; hoạt động của thứ đó (DAY_ACTIVITIES suy từ
       FIXED_LABELS) đặt badge theo đúng giờ. Hôm nay: pill teal + vạch "bây giờ"; đã qua: xanh ngọc. */
  const DOW    = ['T2','T3','T4','T5','T6','T7','CN'];        // thứ VN, bắt đầu Thứ Hai
  const DOW_EN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; // thứ EN, cùng thứ tự
  const MONTH_EN = ['January','February','March','April','May','June','July','August',
                    'September','October','November','December'];
  // Timeline chỉ hiển thị 7h SÁNG -> 11h ĐÊM (bỏ 0-6h và 23h không có hoạt động) = 16 ô giờ
  const WK_H0 = 7, WK_HOURS = 16;
  const wkPos = hour => ((hour - WK_H0) / WK_HOURS * 100) + '%';   // vị trí % trên track
  const mkEl = (tag,cls)=>{ const e=document.createElement(tag); if(cls) e.className=cls; return e; };
  let lastDay = -1;

  function buildWeek(){
    const now = new Date();
    const y=now.getFullYear(), mo=now.getMonth(), today=now.getDate();
    $('wkHead').textContent   = `Tháng ${mo+1}, ${y}`;          // tháng/năm VN — trên bảng, TRÁI
    $('wkHeadEn').textContent = `${MONTH_EN[mo]} ${y}`;          // tháng/năm EN — trên bảng, PHẢI
    const grid = $('wkGrid');
    grid.innerHTML = '';
    // Hàng đầu: 2 ô góc trống (cột ngày + thứ VN) + trục GIỜ + ô góc (cột thứ EN)
    grid.appendChild(mkEl('div','wk-corner'));
    grid.appendChild(mkEl('div','wk-corner'));
    const axis = mkEl('div','wk-axis');
    for(let hh=WK_H0; hh<23; hh++){                    // 7..22: 7 sáng ... 12 trưa ... 10 đêm (bỏ 11 đêm)
      const t = mkEl('div','wk-tick');
      t.textContent = ((hh+11)%12)+1;                 // 12h: 7->7 ... 12->12(trưa) ... 22->10
      t.style.left = wkPos(hh);                       // trùng vạch giờ (canh giữa)
      axis.appendChild(t);
    }
    grid.appendChild(axis);
    grid.appendChild(mkEl('div','wk-corner'));   // ô góc phải (cột thứ EN)
    // Thứ Hai của tuần hiện tại (getDay: 0=CN -> đưa về 0=T2 bằng (d+6)%7)
    const dow = (now.getDay()+6)%7;
    const start = new Date(y, mo, today-dow);
    const todayMid = new Date(y, mo, today).getTime();
    for(let i=0;i<7;i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      const isToday = d.getTime()===todayMid;
      const cls = isToday ? ' today' : '';   // chỉ đánh dấu HÔM NAY (thứ đã qua không tô màu)
      // Cột NGÀY (neutral, KHÔNG theo trạng thái) | cột thứ VN
      const dateCell = mkEl('div','wk-day wk-col-date' + cls); dateCell.textContent = d.getDate();
      const vnCell   = mkEl('div','wk-day wk-col-vn' + cls); vnCell.textContent = DOW[i];
      grid.appendChild(dateCell); grid.appendChild(vnCell);
      const track = mkEl('div','wk-track');
      const acts = DAY_ACTIVITIES[d.getDay()];
      if(acts) for(const a of acts){
        const mark = mkEl('div','wk-mark'); mark.style.left = wkPos(a.hour);   // canh giữa tại mốc bắt đầu
        mark.appendChild(mkEl('span','wk-bar'));                                 // vạch DỌC (trên) nối vào vòng tròn
        const b = mkEl('span','wk-badge');                                      // vòng tròn (dưới)
        const ic = mkEl('span','wk-emoji'); ic.textContent = a.emoji;
        b.appendChild(ic); mark.appendChild(b);
        track.appendChild(mark);
      }
      if(isToday){
        const nl = mkEl('div','wk-now'); nl.id = 'wkNow';
        nl.style.left = wkPos(now.getHours()+now.getMinutes()/60);
        track.appendChild(nl);
      }
      grid.appendChild(track);
      // Cột thứ tiếng Anh (phải)
      const enCell = mkEl('div','wk-day wk-col-en' + cls);
      enCell.textContent = DOW_EN[i];
      grid.appendChild(enCell);
    }
    lastDay = today;
  }

  /* ===== 9. VÒNG LẶP MỖI FRAME — tick() ===== */
  // MỘT mốc giây duy nhất cho cả frame. Trước đây có hai biến riêng (một cho đồng hồ cát,
  // một cho phần chữ) vì cát phải LẬT trước khi vẽ, còn chữ cập nhật sau — nhưng như thế là
  // hai bản sao của cùng một phép so sánh, sửa một chỗ quên chỗ kia là hai phần lệch giây.
  // Nay tính một lần ở đầu frame và chỉ ghi lastSec ở CUỐI, nên thứ tự trong thân hàm muốn
  // đổi thế nào cũng được.
  let lastSec=-1;

  function tick(){
    const now=new Date();
    const tNow=performance.now();
    const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
    const secChanged   = s !== lastSec;
    const justSwitched = secChanged && lastSec===59 && s===0;   // vừa qua mốc 59->00

    // Nhãn mốc: lọc theo thứ hôm nay + bật/tắt class 'upcoming' theo giờ hiện tại
    updateLabelStates(h + m/60 + s/3600, now.getDay());

    // Nét nối nhãn giờ đổi vòng khi qua trưa/nửa đêm (sáng: vòng trong, chiều/tối: vòng ngoài)
    const pm = h >= 12;
    if(pm !== lastPm){ placeHourConn(pm); lastPm = pm; }

    // Kim: góc tăng liên tục, cập nhật MỖI FRAME cho mượt
    const totalSec = now.getTime()/1000 - now.getTimezoneOffset()*60;
    const secDeg  = totalSec*6;
    const minDeg  = (totalSec/60)*6;
    const hourDeg = (totalSec/3600)*30;
    elSec.style.transform=`rotate(${secDeg}deg)`;
    elMin.style.transform=`rotate(${minDeg}deg)`;
    elHour.style.transform=`rotate(${hourDeg}deg)`;
    elOrbitH.style.transform=`rotate(${hourDeg}deg)`;
    elOrbitM.style.transform=`rotate(${minDeg}deg)`;
    const sH = beatScale(beat.H, tNow), sM = beatScale(beat.M, tNow);
    // ĐĨA KÍNH giờ/phút (con .analog): đặt bằng TỌA ĐỘ CỰC (polarTranslate), đứng thẳng
    //   (không cần đối-xoay); translate(-50%,-50%) căn tâm đĩa vào điểm cực.
    elBadgeH.style.transform=`translate(-50%,-50%) ${polarTranslate(HOUR_BADGE_R, hourDeg)} scale(${sH})`;
    elBadgeM.style.transform=`translate(-50%,-50%) ${polarTranslate(MIN_BADGE_R, minDeg)} scale(${sM})`;
    // Lớp SỐ giờ/phút riêng (trong orbit xoay): đối-xoay cho số đứng thẳng + scale nhịp -> trùng khít đĩa kính, nổi TRÊN.
    elOrbitHt.style.transform=`rotate(${hourDeg}deg)`;
    elBadgeHt.style.transform=`translate(-50%,-50%) rotate(${-hourDeg}deg) scale(${sH})`;
    elOrbitMt.style.transform=`rotate(${minDeg}deg)`;
    elBadgeMt.style.transform=`translate(-50%,-50%) rotate(${-minDeg}deg) scale(${sM})`;

    // Cung: cập nhật mỗi frame để chạy theo kim mượt
    updateDayArcs(h, m, s);
    updateMinArc(m, s);

    // Đồng hồ cát: giờ theo phút trôi trong giờ; phút theo giây trôi trong phút (mượt theo ms)
    const ms = now.getMilliseconds();
    // Lật NGAY khi sang chu kỳ mới (kiểm tra TRƯỚC khi vẽ cát để cát không "đầy" lố 1 frame)
    if(justSwitched){
      flipHourglass(hg.M.root);
      if(m===0) flipHourglass(hg.H.root);
    }
    updateHourglass(hg.H, (m + (s + ms/1000)/60) / 60);
    updateHourglass(hg.M, (s + ms/1000) / 60);

    // Text + nhãn: chỉ cập nhật khi giây đổi (đỡ tải, không gây giật)
    if(secChanged){
      // Sang ngày mới -> dựng lại lịch tuần (đổi hôm nay/quá khứ) rồi căn lại bố cục
      if(now.getDate()!==lastDay){ buildWeek(); layout(); }
      // Vạch "bây giờ" trượt theo thời gian trong ngày (chỉ trên hàng hôm nay; ẩn trước 7h sáng)
      const nowLine = $('wkNow');
      if(nowLine){
        nowLine.style.left = wkPos(h + m/60);
        nowLine.style.display = h < WK_H0 ? 'none' : '';
      }
      updateBadge(elTextHt, String(gio12(h)));   // lớp số giờ (solid, trên kính)
      updateBadge(elTextMt, String(m));          // lớp số phút (solid, trên kính)
      elH.textContent=pad(h);
      elM.textContent=pad(m);
      elS.textContent=pad(s);

      // Văn nói: 0–5s VN hơn · 5–10s EN hơn · 10–15s VN kém · 15–20s EN kém.
      // Nửa đầu giờ (<:30) không có cách đọc kém -> trả null. Khi hết câu: bỏ 'show' cho
      // mờ dần, giây sau XOÁ HẲN nội dung -> không để text ẩn nằm lại trong DOM.
      const phrase = s<5  ? noiGioHon(h,m)
                   : s<10 ? noiGioEnHon(h,m)
                   : s<15 ? noiGioKem(h,m)
                   : s<20 ? noiGioEnKem(h,m)
                   : null;
      if(phrase){
        if(elSpoken.innerHTML!==phrase) elSpoken.innerHTML=phrase;
        elSpoken.classList.add('show');
      }else if(elSpoken.classList.contains('show')){
        elSpoken.classList.remove('show');   // vừa hết câu -> mờ dần
      }else if(elSpoken.innerHTML){
        elSpoken.innerHTML='';               // đã mờ xong -> xoá hẳn, không render nữa
      }

      // Tô đậm số giờ hiện tại trên mặt (1-12; giờ 0/12 -> số 12)
      const hourNum = (h%12)===0 ? 12 : (h%12);
      numerals.forEach(el=>{
        el.classList.toggle('active', +el.dataset.n===hourNum);
      });

      // Đếm ngược 6 nhịp: giây 55,56,57,58,59 (nhịp thường) rồi 00 (nhịp CUỐI).
      // Nhãn phút đập mỗi phút; nhãn giờ chỉ khi đang chạm mốc sang giờ mới.
      if(s>=55){
        pulse('M','beat');             // phút: 55-59
        if(m===59) pulse('H','beat');  // giờ : 55-59 của phút 59
      }else if(justSwitched){
        pulse('M','beat-final');       // phút: nhịp cuối tại 00
        if(m===0) pulse('H','beat-final'); // giờ: nhịp cuối tại 00
      }
    }

    lastSec = s;   // ghi ở CUỐI frame: mọi chỗ trên đây đọc chung một mốc giây
    requestAnimationFrame(tick);
  }

  /* ===== 10. POPUP TẠO NHÃN ===== */
  // Popup (không chữ): chọn emoji / giờ (màu giờ) / phút (màu phút) -> ✓ tạo nhãn.
  function setupAddLabelUI(){
    const fab=$('fab'), modal=$('labelModal'), emojiPick=$('emojiPick'),
          hourStrip=$('hourStrip'), minStrip=$('minStrip'), modalAdd=$('modalAdd');
    const EMOJIS=['🍬','☀️','🍒','🏊‍♀️','📺','🙋🏻‍♀️'];   // kẹo · mặt trời · cherry · bơi (nữ) · tivi · giơ tay (nữ)
    let selEmoji=EMOJIS[0], selHour=new Date().getHours(), selMin=0;
    const setSel=(box,btn)=>{ box.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); btn.classList.add('sel'); };
    const mkBtn=(box,txt,on,sel)=>{ const b=document.createElement('button'); b.textContent=txt; if(sel)b.classList.add('sel'); b.addEventListener('click',()=>{on(); setSel(box,b);}); box.appendChild(b); };
    // --- Ô DÁN emoji tùy ý (cuối hàng emoji) — CHỈ trên thiết bị dán được ---
    // "Tivi" (smart TV điều khiển bằng remote) không có clipboard nên không dán được -> ẩn ô.
    // Hiện ô chỉ khi có CÁCH DÁN thật: cảm ứng (điện thoại/tablet) hoặc chuột (máy tính).
    // TV dùng D-pad không có con trỏ (any-pointer:none) nên bị loại; chặn thêm theo user-agent
    // các dòng TV thường gặp (phòng remote-con-trỏ kiểu LG webOS lọt lưới con trỏ).
    const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
    const isTV = /SmartTV|SMART-TV|SmartHub|Tizen|Web0S|WebOS|webOS|HbbTV|NetCast|BRAVIA|GoogleTV|Android.?TV|AFT[\w-]|AppleTV|CrKey|Chromecast|Viera|NETTV|DTVNG|POV_TV|Roku|DLNADOC|VIDAA/i.test(navigator.userAgent||'');
    const canPaste = !isTV && ( mq('(any-pointer: coarse)') || mq('(any-hover: hover) and (any-pointer: fine)') );
    // Nhận diện MỘT emoji: pictographic (😀🎨…) HOẶC nửa cờ vùng (🇻🇳) HOẶC phím số (1️⃣).
    // Dựng bằng new RegExp trong try/catch: trình duyệt TV cũ không hiểu \p{...} sẽ ném lỗi
    // Ở ĐÂY (bắt được), không làm hỏng cả script — ô dán vốn không hiện trên TV nên không sao.
    let EMOJI_RE;
    try{ EMOJI_RE = new RegExp('\\p{Extended_Pictographic}|[\\u{1F1E6}-\\u{1F1FF}]|[#*0-9]\\uFE0F?\\u20E3','u'); }
    catch(e){ EMOJI_RE = /(?!)/; }   // dự phòng: trình duyệt cổ -> tắt êm ô dán tùy ý (nút có sẵn vẫn chạy)
    // EMOJI ĐẦU TIÊN trong chuỗi (gộp đúng emoji ghép ZWJ vd 👨‍👩‍👧 làm MỘT); KHÔNG có -> '' (gõ chữ thường rơi vào đây).
    const firstEmojiOf = s => {
      s = (s||'').trim(); if(!s) return '';
      const parts = (window.Intl && Intl.Segmenter)
        ? [...new Intl.Segmenter().segment(s)].map(x=>x.segment) : Array.from(s);
      for(const g of parts) if(EMOJI_RE.test(g)) return g;
      return '';
    };
    const emojiPaste = document.createElement('input');
    emojiPaste.className='emoji-paste'; emojiPaste.type='text';
    emojiPaste.setAttribute('aria-label','Dán emoji');
    emojiPaste.addEventListener('focus', ()=> emojiPaste.select());   // chọn sẵn -> lần dán/gõ sau THAY emoji cũ
    emojiPaste.addEventListener('input', ()=>{
      const em = firstEmojiOf(emojiPaste.value);
      if(em){                                                          // CÓ emoji -> dùng làm nhãn, bỏ chọn nút có sẵn
        selEmoji = em;
        emojiPick.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
        emojiPaste.classList.remove('invalid'); emojiPaste.classList.add('sel');
        modalAdd.disabled = false;
      }else if(emojiPaste.value.trim()===''){                          // TRỐNG -> quay về emoji đầu hàng, cho phép tạo
        selEmoji = EMOJIS[0];
        emojiPaste.classList.remove('sel','invalid');
        setSel(emojiPick, emojiPick.querySelector('button'));
        modalAdd.disabled = false;
      }else{                                                           // gõ CHỮ (không phải emoji) -> KHOÁ ✓, không cho tạo nhãn
        emojiPaste.classList.remove('sel'); emojiPaste.classList.add('invalid');
        emojiPick.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));   // không có gì "đang chọn"
        modalAdd.disabled = true;
      }
    });
    EMOJIS.forEach((em,i)=> mkBtn(emojiPick, em, ()=>{ selEmoji=em; emojiPaste.value=''; emojiPaste.classList.remove('sel','invalid'); modalAdd.disabled=false; }, i===0));
    if(canPaste) emojiPick.appendChild(emojiPaste);                    // ô dán nằm CUỐI hàng emoji (không tạo trên tivi)
    for(let h=0;h<24;h++)  mkBtn(hourStrip, pad(h),  ()=>{ selHour=h; updatePastDim(); }, h===selHour);
    for(let mm=0;mm<60;mm+=5) mkBtn(minStrip, pad(mm), ()=>selMin=mm, mm===selMin);
    // Giá trị của một nút giờ/phút = chính chữ số trên nút (+'05' -> 5) -> không phụ thuộc
    // thứ tự index, thêm/bớt mốc trong strip không phá logic bên dưới.
    const btnVal = b => +b.textContent;
    // Đánh dấu .sel cho nút có giá trị val trong một strip (giờ/phút)
    const selByVal = (strip,val)=> strip.querySelectorAll('button').forEach(b=> b.classList.toggle('sel', btnVal(b)===val));
    // Làm mờ ô GIỜ đã qua; ô PHÚT mờ ĐẾN TẬN phút hiện tại (<=, vì phút này đã "đang trôi",
    // không còn là tương lai) khi đang chọn GIỜ HIỆN TẠI.
    function updatePastDim(){
      const now=new Date(), nowH=now.getHours(), nowM=now.getMinutes();
      hourStrip.querySelectorAll('button').forEach(b=> b.classList.toggle('past', btnVal(b)<nowH));
      minStrip.querySelectorAll('button').forEach(b=> b.classList.toggle('past', selHour===nowH && btnVal(b)<=nowM));
    }
    // Chọn sẵn mốc 5 phút GẦN NHẤT SẮP TỚI (làm tròn LÊN theo thời điểm mở popup).
    function pickNextSlot(){
      const now=new Date();
      selHour=now.getHours(); selMin=Math.ceil(now.getMinutes()/5)*5;
      if(selMin>=60){ selMin=0; selHour=(selHour+1)%24; }
      selByVal(hourStrip, selHour);
      selByVal(minStrip, selMin);
    }
    // Mở popup -> chọn sẵn thời gian gần nhất tiếp theo + mờ giờ/phút đã qua + focus GIỜ (cho remote TV).
    fab.addEventListener('click', ()=>{
      // Dọn ô gõ-sai còn sót từ lần mở trước (đang khoá ✓) -> trả về trạng thái hợp lệ.
      if(emojiPaste.classList.contains('invalid')){
        emojiPaste.value=''; emojiPaste.classList.remove('invalid');
        setSel(emojiPick, emojiPick.querySelector('button')); selEmoji=EMOJIS[0]; modalAdd.disabled=false;
      }
      pickNextSlot(); updatePastDim(); modal.classList.add('open');
      (hourStrip.querySelector('.sel')||emojiPick.firstChild)?.focus();
    });
    modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });
    // Nút Back/Escape của remote TV (hoặc phím Esc) -> đóng popup
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('open')) modal.classList.remove('open'); });
    modalAdd.addEventListener('click', ()=>{ addUserLabel(selEmoji, selHour + selMin/60); modal.classList.remove('open'); });
  }

  /* ===== 11. KHỞI ĐỘNG ===== */
  // DESKTOP căn vừa khít viewport -> căn lại khi đổi BỀ RỘNG hoặc CHIỀU CAO (>2px).
  // MOBILE trang cuộn tự nhiên, đồng hồ chỉ theo BỀ RỘNG -> CHỈ căn lại khi đổi bề rộng
  // (xoay máy); BỎ QUA đổi chiều cao (thanh công cụ ẩn/hiện, pinch-zoom) nên hết "co dúm".
  // Zoom TRANG trên desktop có đổi bề rộng nên vẫn chạy layout() và mặt vẫn co theo — chấp nhận.
  let lastW=-1, lastVh=-1;
  function relayout(){
    // clientWidth (layout viewport) thay vì innerWidth: Safari iOS đổi innerWidth theo
    // pinch-zoom -> relayout chạy oan giữa cử chỉ, mặt tự co còn số thì không.
    const w=document.documentElement.clientWidth;
    if(mqDesktop.matches){
      const vh=viewportH();
      if(w===lastW && Math.abs(vh-lastVh)<2) return;
      lastVh=vh;
    } else if(w===lastW) return;   // MOBILE: chỉ quan tâm BỀ RỘNG (bỏ qua đổi chiều cao)
    lastW=w; layout();
  }

  loadUserLabels(); buildUserLabels();   // cache cục bộ hiện NGAY; snapshot server về sẽ thay
  startLabelSync();                      // nghe /labels trên RTDB -> đồng bộ giữa các thiết bị
  setupAddLabelUI();
  buildWeek();   // dựng lịch tuần TRƯỚC khi layout để đo đúng bề rộng/chiều cao lịch
  layout();
  // Chỉ nghe resize/orientation cấp window: KHÔNG nghe visualViewport (scroll/pinch) nữa
  // -> trên mobile pinch-zoom chỉ phóng to đồng đều, không kích relayout giữa cử chỉ.
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  // Căn lại sau khi font thật (Space Grotesk) tải xong — tránh căn theo font dự phòng
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(layout);
  }
  // và căn lại vài lần đầu cho chắc (font có thể về trễ)
  setTimeout(layout, 300);
  setTimeout(layout, 1200);
  tick();
</script>
