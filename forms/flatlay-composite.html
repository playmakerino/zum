<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flatlay Compositor</title>
<style>
  :root{ --ink:#1a1a1a; --mut:#6b6b6b; --line:#d8d8d8; --ground:#fff; --accent:#2f6f4e; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; }
  }
  :root[data-theme="dark"]{ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; }

  body{ margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  [hidden]{ display:none!important; }
  .wrap{ display:flex; gap:40px; align-items:flex-start; padding:32px; flex-wrap:wrap; max-width:1180px; margin:0 auto; }
  .controls{ flex:0 0 300px; display:flex; flex-direction:column; gap:20px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  label,figcaption{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  select,input[type=text],.file{ font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:7px; padding:9px 10px; width:100%; box-sizing:border-box; }
  .file{ display:flex; align-items:center; gap:10px; padding:4px 10px 4px 4px; min-height:41px; }
  .file button{ flex:none; padding:5px 10px; font-size:12px; border-radius:5px; }
  .file span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--mut); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .trim{ display:flex; gap:10px; align-items:center; }
  .trim input[type=color]{ width:44px; height:40px; padding:0; border:1px solid var(--line); border-radius:7px; background:transparent; cursor:pointer; }
  .trim input[type=text]{ flex:1; font-family:ui-monospace,"SF Mono",Menlo,monospace; text-transform:uppercase; }
  .scale-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .scale-head .val{ font-family:ui-monospace,Menlo,monospace; color:var(--ink); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  button{ font:inherit; font-weight:600; padding:11px 14px; border-radius:8px; cursor:pointer; background:transparent; }
  .primary{ border:1px solid var(--accent); color:var(--accent); }
  .primary:hover{ background:var(--accent); color:var(--ground); }
  .secondary{ border:1px solid var(--line); color:var(--mut); }
  .secondary:hover{ color:var(--ink); border-color:var(--ink); }
  button:disabled{ opacity:.4; cursor:default; }
  button:disabled:hover{ background:transparent; color:var(--mut); border-color:var(--line); }
  .msg{ font-size:12px; color:var(--mut); min-height:16px; }
  .view{ flex:1; min-width:280px; display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .shot{ margin:0; flex:1 1 300px; min-width:240px; display:flex; flex-direction:column; gap:8px; }
  .shot img{ width:100%; max-height:74vh; object-fit:contain; display:block; }
  figcaption{ text-align:center; }
</style>
</head>
<body>

<div class="wrap">
  <div class="controls">
    <div class="field">
      <label for="garment">Garment</label>
      <select id="garment">
        <option value="romper">Convertible Zippy Romper</option>
        <option value="pajama">Two-Piece Pajama Set</option>
      </select>
    </div>

    <div class="field">
      <label for="modelPick">Model photo</label>
      <select id="modelPick"></select>
    </div>

    <div class="field">
      <label for="patternBtn">Pattern file</label>
      <div class="file">
        <input type="file" id="pattern" accept="image/png,image/jpeg,image/webp" hidden>
        <button type="button" class="secondary" id="patternBtn">Choose file</button>
        <span id="patternName">No file chosen</span>
      </div>
    </div>

    <div class="field">
      <label for="trimHex">Trim color</label>
      <div class="trim">
        <input type="color" id="trimColor" value="#7fb2d9" aria-label="Trim color picker">
        <input type="text" id="trimHex" value="#7FB2D9" spellcheck="false" aria-label="Trim color hex">
      </div>
    </div>

    <div class="field">
      <div class="scale-head"><label for="scale">Motif size</label><span class="val" id="scaleVal">1.00×</span></div>
      <input type="range" id="scale" min="0.5" max="2" step="0.05" value="1">
    </div>

    <div class="actions">
      <button class="primary" id="go">Generate</button>
      <button class="secondary" id="dl" disabled>Download PNGs</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="view">
    <figure class="shot" id="shotFlat" hidden><img id="result" alt="Composited flatlay"><figcaption>Flatlay</figcaption></figure>
    <figure class="shot" id="shotModel" hidden><img id="result2" alt="Composited on model"><figcaption>On model</figcaption></figure>
  </div>
</div>

<script>
'use strict';
const CDN='https://cdn.shopify.com/s/files/1/0704/3321/0621/files/';
// Each garment has a flatlay view and an on-model view: white mockup + panel map on the Shopify CDN.
// The model maps were traced on the photo pixels themselves (SAM + colour threshold, see
// zum-prd/prompt-test/model-map), so they align to the photo exactly; the mock is the original photo.
const V=(mock,map)=>({ mock:CDN+mock, map:CDN+map });
const GARMENTS={
  romper:{ flat:V('zum-flatlay-mock-romper.jpg?v=1788601399','zum-flatlay-map-romper.png?v=1788601403'),
           models:[ V('zum-model-romper-1.jpg?v=1786079988','zum-flatlay-model-map-romper-1.png?v=1788626788'),
                    V('zum-model-romper-2.jpg?v=1786088636','zum-flatlay-model-map-romper-2.png?v=1788626790'),
                    V('zum-model-romper-3.jpg?v=1786080000','zum-flatlay-model-map-romper-3.png?v=1788626791'),
                    V('zum-model-romper-4.jpg?v=1786080138','zum-flatlay-model-map-romper-4.png?v=1788626777') ] },
  pajama:{ flat:V('zum-flatlay-mock-pajama.jpg?v=1788601402','zum-flatlay-map-pajama.png?v=1788601405'),
           models:[ V('zum-model-pajama-boy-1.jpg?v=1786079944','zum-flatlay-model-map-pajama-boy-1.png?v=1788626780'),
                    V('zum-model-pajama-boy-2.jpg?v=1786079965','zum-flatlay-model-map-pajama-boy-2.png?v=1788626782'),
                    V('zum-model-pajama-boy-3.jpg?v=1786079970','zum-flatlay-model-map-pajama-boy-3.png?v=1788626783'),
                    V('zum-model-pajama-girl-1.jpg?v=1786088657','zum-flatlay-model-map-pajama-girl-1.png?v=1788626779'),
                    V('zum-model-pajama-girl-2.jpg?v=1786087973','zum-flatlay-model-map-pajama-girl-2.png?v=1788626785'),
                    V('zum-model-pajama-girl-3.jpg?v=1786079983','zum-flatlay-model-map-pajama-girl-3.png?v=1788626787') ] },
};
const modelName=m=>m.mock.split('/').pop().replace(/^zum-model-/,'').replace(/\.jpg.*$/,'');
// Map encoding: red channel / 20 -> panel id. 0 = background (incl. skin/hair), 1..8 = fabric panels, 9 = trim.
// Panel 6 = inside of the collar (wrong side of a one-sided print): mirrored + faint bleed-through.
// Model maps never use id 6. Per-panel tile phase offsets: seams cut the print, so adjacent panels must not line up.
// Motif size: the flatlay sizes the pattern strip from the garment bbox width (K_BASE x scale x gw).
// The model view sizes it from sqrt(fabric area) x cal, with cal = gw/sqrt(area) measured on the
// flatlay, so the motif keeps the same physical size on the body regardless of pose and framing.
const OFFX=[0,0.37,0.71,0.13,0.58,0.92,0.26,0.64,0.45];
const OFFY=[0,0.53,0.19,0.81,0.34,0.67,0.08,0.46,0.88];
const K_BASE=1.5;          // pattern strip width = K x garment bbox width
const OUT_AREA=1900*2356;  // output pixels (~1900px wide) - crisp motifs
const SS=1.8;              // supersample factor for anti-aliasing
const TRIM_FLOOR=0.65;     // lift trim shadows (lighter inner collar)
const TRIM_CEIL=1.15;
const COLLAR_ID=6;
const AXIS_MIN=250;
const MODEL_OPTS={ auto:true, wrap:true };   // model views: auto centerlines + tube wrap; the flatlay stays flat        // map G/B channel at/above this = limb axis line / its start dot (ids only reach R=180)
const HEX_RE=/^#?([0-9a-f]{6})$/i;

const $=id=>document.getElementById(id);
const msg=m=>{ $('msg').textContent=m; };
// rAF never fires in a hidden tab, so a timer fallback keeps generate() moving when the user switches away
const nextPaint=()=>new Promise(r=>{ let done=false; const go=()=>{ if(!done){ done=true; setTimeout(r,0); } }; requestAnimationFrame(go); setTimeout(go,120); });
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('image load failed: '+src)); i.src=src; });
const parseHex=s=>{ const m=HEX_RE.exec(s.trim()); return m?m[1].toUpperCase():null; };
const hexToRgb=h=>[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));

// Draw img at w x h and return its pixels.
function raster(img,w,h,smooth){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=smooth; x.drawImage(img,0,0,w,h);
  return { w, h, data:x.getImageData(0,0,w,h).data };
}
function rasterArea(img,area,smooth){
  const s=Math.sqrt(area/(img.width*img.height));
  return raster(img, Math.max(1,Math.round(img.width*s)), Math.max(1,Math.round(img.height*s)), smooth);
}
function rasterWidth(img,w,smooth){ return raster(img, w, Math.max(1,Math.round(img.height*w/img.width)), smooth); }

// --- trim auto-detect: same logic as zum_prd_form.html ---
function rgbToHsv(r,g,b){ const max=Math.max(r,g,b),min=Math.min(r,g,b),c=max-min; let h=0; if(c!==0){ if(max===r)h=((g-b)/c+6)%6; else if(max===g)h=(b-r)/c+2; else h=(r-g)/c+4; h/=6; } return [h, max===0?0:c/max, max/255]; }
function hsvToRgb(h,s,v){ const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s); return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].map(x=>Math.round(x*255)); }
const toHex=rgb=>'#'+rgb.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');
// dominant hue of the swatch, pulled into a range a garment trim can actually be
function suggestTrimHex(img){
  try{
    const n=64, B=36, d=raster(img,n,n,false).data;
    const weight=new Float64Array(B), sum=new Float64Array(B*3), count=new Int32Array(B);
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<128) continue;
      const r=d[i],g=d[i+1],b=d[i+2], max=Math.max(r,g,b), ch=max-Math.min(r,g,b);
      if(max<40||ch/max<0.2) continue;
      const k=Math.min(B-1,Math.floor(rgbToHsv(r,g,b)[0]*B));
      weight[k]+=ch; sum[k*3]+=r; sum[k*3+1]+=g; sum[k*3+2]+=b; count[k]++;
    }
    let top=-1,tw=0; for(let k=0;k<B;k++) if(weight[k]>tw){ tw=weight[k]; top=k; }
    if(top<0) return null;
    const c=count[top], [h,s,v]=rgbToHsv(sum[top*3]/c, sum[top*3+1]/c, sum[top*3+2]/c);
    if(s<0.15||v<0.10) return null;
    return toHex(hsvToRgb(h, Math.min(0.70,Math.max(0.25,s)), Math.min(0.86,Math.max(0.52,v))));
  }catch{ return null; }
}
function setTrim(hex){ $('trimColor').value=hex.toLowerCase(); $('trimHex').value=hex.toUpperCase(); }

// --- garment analysis: independent of pattern/scale/trim, so computed once per garment ---
// One pass over the map yields: panel id per pixel, garment bbox width, per-panel centroid +
// major-axis angle (PCA; the print is rotated to follow each panel's grain), and the trim
// luminance reference (90th percentile of panel 9, sampled every 2nd pixel each axis).
const garmentCache=new Map();
function analyzeGarment(spec,opts){
  if(garmentCache.has(spec.map)) return garmentCache.get(spec.map);
  const p=(async()=>{
    const CA=OUT_AREA*SS*SS;
    const [mockImg,mapImg]=await Promise.all([loadImg(spec.mock),loadImg(spec.map)]);
    const M=rasterArea(mockImg,CA,true), MAP=rasterArea(mapImg,CA,false);
    const W=M.w, H=M.h, md=M.data, xd=MAP.data, N=W*H;
    const ids=new Uint8Array(N);
    const cnt=new Float64Array(10), sx=new Float64Array(10), sy=new Float64Array(10),
          sxx=new Float64Array(10), sxy=new Float64Array(10), syy=new Float64Array(10);
    const hist=new Uint32Array(256); let nTrim=0;
    let minx=W, maxx=0;
    let lineMask=null, dotMask=null; const linePx=[], dotPx=[];
    for(let y=0, i=0; y<H; y++) for(let x=0; x<W; x++, i++){
      const k=((xd[i*4]+10)/20)|0; ids[i]=k;
      if(k>=1&&k<=8){ if(x<minx)minx=x; if(x>maxx)maxx=x; cnt[k]++; sx[k]+=x; sy[k]+=y; sxx[k]+=x*x; sxy[k]+=x*y; syy[k]+=y*y; }
      else if(k===9 && !((x|y)&1)){ const p=i*4; hist[((md[p]*299+md[p+1]*587+md[p+2]*114)/1000)|0]++; nTrim++; }
      if(xd[i*4+1]>=AXIS_MIN){ (lineMask||(lineMask=new Uint8Array(N)))[i]=1; linePx.push(i); }
      if(xd[i*4+2]>=AXIS_MIN){ (dotMask||(dotMask=new Uint8Array(N)))[i]=1; dotPx.push(i); }
    }
    const axes=[];
    if(lineMask&&dotMask) for(const d of traceDrawn(W,H,ids,lineMask,linePx,dotMask,dotPx)) axes[d.k]=[buildAxis(d.k,d.px,d.py,W,H,ids,cnt[d.k],!!(opts&&opts.wrap))];
    if(opts&&opts.auto) for(let k=1;k<=8;k++){ if(axes[k]||k===COLLAR_ID||cnt[k]<2000) continue;
      const list=autoAxes(W,H,ids,k).map(a=>buildAxis(k,a.px,a.py,W,H,ids,a.area,!!opts.wrap,a)); if(list.length) axes[k]=list; }
    const cx=new Float64Array(10), cy=new Float64Array(10), cs=new Float64Array(10).fill(1), sn=new Float64Array(10);
    for(let k=1;k<=8;k++){ if(cnt[k]<50) continue;
      cx[k]=sx[k]/cnt[k]; cy[k]=sy[k]/cnt[k];
      const vxx=sxx[k]/cnt[k]-cx[k]*cx[k], vyy=syy[k]/cnt[k]-cy[k]*cy[k], vxy=sxy[k]/cnt[k]-cx[k]*cy[k];
      const th=0.5*Math.atan2(2*vxy, vyy-vxx); cs[k]=Math.cos(th); sn[k]=Math.sin(th); }
    let Lref=255, acc=0; for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=nTrim*0.9){ Lref=v; break; } }
    let area=0; for(let k=1;k<=8;k++) area+=cnt[k];
    return { w:W, h:H, mock:md, ids, gw:Math.max(2,maxx-minx+1), area:Math.max(1,area), cx, cy, cs, sn, axes, Lref:Math.max(1,Lref) };
  })();
  garmentCache.set(spec.map,p); p.catch(()=>garmentCache.delete(spec.map));
  return p;
}

// --- limb axes: each fabric panel gets a centerline; its pixels are mapped to curved coordinates
// (u = arc length along the line, v = signed perpendicular distance) so the print follows a bent
// arm/leg instead of one flat PCA angle. Two sources, drawn wins over auto:
//  * drawn in the map: G=255 line + B=255 dot at its start (traced by BFS from the dot, bucketed by
//    geodesic distance). The panel is the majority id under the line, so it may overshoot at the cuff.
//  * auto (model views): distance transform of the panel at 1/4 res, endpoints = extremes along the PCA
//    axis, cheapest path between them with cost ~ 1/distance-to-edge (hugs the middle), corner tails
//    trimmed, start = the higher end.
const AX_STEP=10;
function traceDrawn(W,H,ids,lineMask,linePx,dotMask,dotPx){
  const nb=[-W-1,-W,-W+1,-1,1,W-1,W,W+1];
  const okStep=(i,j)=>Math.abs(i%W-j%W)<=1;   // 8-neighbour without wrapping across rows
  const seeds=[];
  for(const d0 of dotPx){ if(dotMask[d0]!==1) continue;
    const q=[d0]; dotMask[d0]=2; let sxd=0,syd=0,n=0; const onLine=[];
    for(let h=0;h<q.length;h++){ const i=q[h]; sxd+=i%W; syd+=(i/W)|0; n++; if(lineMask[i]) onLine.push(i);
      for(const d of nb){ const j=i+d; if(j<0||j>=W*H||dotMask[j]!==1||!okStep(i,j)) continue; dotMask[j]=2; q.push(j); } }
    if(onLine.length){ seeds.push(onLine); continue; }
    const cx=sxd/n, cy=syd/n; let best=-1, bd=Infinity;
    for(const i of linePx){ const dx=i%W-cx, dy=((i/W)|0)-cy, dd=dx*dx+dy*dy; if(dd<bd){ bd=dd; best=i; } }
    if(best>=0) seeds.push([best]);
  }
  const out=[];
  for(const seed of seeds){
    const q=[], dist=[]; const bx=[], by=[], bn=[]; const idCnt=new Float64Array(10);
    for(const i of seed){ if(lineMask[i]!==1) continue; lineMask[i]=2; q.push(i); dist.push(0); }
    for(let h=0;h<q.length;h++){ const i=q[h], d0=dist[h], b=(d0/AX_STEP)|0;
      while(bx.length<=b){ bx.push(0); by.push(0); bn.push(0); }
      bx[b]+=i%W; by[b]+=(i/W)|0; bn[b]++; idCnt[ids[i]<=8?ids[i]:0]++;
      for(const d of nb){ const j=i+d; if(j<0||j>=W*H||lineMask[j]!==1||!okStep(i,j)) continue; lineMask[j]=2; q.push(j); dist.push(d0+1); } }
    let k=0; for(let t=1;t<=8;t++) if(idCnt[t]>idCnt[k]) k=t;
    const px=[], py=[]; for(let b=0;b<bn.length;b++) if(bn[b]) { px.push(bx[b]/bn[b]); py.push(by[b]/bn[b]); }
    if(k!==0&&px.length>=3) out.push({k,px,py});
  }
  return out;
}
// Binary heap keyed on cost, for the centerline search.
class MinHeap{ constructor(){ this.c=[]; this.i=[]; }
  push(c,i){ const C=this.c,I=this.i; let p=C.length; C.push(c); I.push(i);
    while(p>0){ const q=(p-1)>>1; if(C[q]<=C[p]) break; [C[p],C[q]]=[C[q],C[p]]; [I[p],I[q]]=[I[q],I[p]]; p=q; } }
  pop(){ const C=this.c,I=this.i, c=C[0], i=I[0], lc=C.pop(), li=I.pop(); if(C.length){ C[0]=lc; I[0]=li; let p=0;
    for(;;){ let l=2*p+1, r=l+1, m=p; if(l<C.length&&C[l]<C[m]) m=l; if(r<C.length&&C[r]<C[m]) m=r; if(m===p) break; [C[p],C[m]]=[C[m],C[p]]; [I[p],I[m]]=[I[m],I[p]]; p=m; } }
    return [c,i]; }
  get size(){ return this.c.length; } }
function pathAxis(m,w,h,F){
  const N=w*h; let n=0, mx=0, my=0; for(let i=0;i<N;i++) if(m[i]){ n++; mx+=i%w; my+=(i/w)|0; }
  if(n<200) return null; mx/=n; my/=n;
  // chamfer 3-4 distance to the panel edge (image border counts as edge)
  const dt=new Float32Array(N); for(let i=0;i<N;i++) dt[i]=m[i]?1e9:0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; if(!m[i]) continue; let d=dt[i];
    if(y>0){ d=Math.min(d,dt[i-w]+3); if(x>0) d=Math.min(d,dt[i-w-1]+4); if(x<w-1) d=Math.min(d,dt[i-w+1]+4); } else d=Math.min(d,3);
    if(x>0) d=Math.min(d,dt[i-1]+3); else d=Math.min(d,3); dt[i]=d; }
  for(let y=h-1;y>=0;y--) for(let x=w-1;x>=0;x--){ const i=y*w+x; if(!m[i]) continue; let d=dt[i];
    if(y<h-1){ d=Math.min(d,dt[i+w]+3); if(x>0) d=Math.min(d,dt[i+w-1]+4); if(x<w-1) d=Math.min(d,dt[i+w+1]+4); } else d=Math.min(d,3);
    if(x<w-1) d=Math.min(d,dt[i+1]+3); else d=Math.min(d,3); dt[i]=d; }
  // endpoints: extremes along the PCA major axis
  let vxx=0,vyy=0,vxy=0; for(let i=0;i<N;i++){ if(!m[i]) continue; const dx=i%w-mx, dy=((i/w)|0)-my; vxx+=dx*dx; vyy+=dy*dy; vxy+=dx*dy; }
  // a blob-like panel (torso) has no meaningful major axis: default to image-vertical, like the grain
  const tr=vxx+vyy, det=vxx*vyy-vxy*vxy, disc=Math.sqrt(Math.max(0,tr*tr/4-det)), elong=(tr/2+disc)/Math.max(1e-9,tr/2-disc);
  if(elong<2){   // torso: a straight vertical line through the centroid, from the top to the bottom of the panel
    let y0=h, y1=0; for(let i=0;i<N;i++) if(m[i]){ const y=(i/w)|0; if(y<y0) y0=y; if(y>y1) y1=y; }
    const px=[], py=[]; for(let y=y0*F; y<=y1*F; y+=AX_STEP){ px.push(mx*F+F/2); py.push(y); }
    return px.length>=3 ? { px, py } : null; }
  const th=0.5*Math.atan2(2*vxy, vxx-vyy), ux=Math.cos(th), uy=Math.sin(th);

      const nc=c+L/(dt[j]/3+0.5); if(nc<cost[j]){ cost[j]=nc; prev[j]=i; heap.push(nc,j); } } }

    let cut=0; for(let i=0;i<pi;i++) if(get(i)<0.7*pk) cut=i+1; return cut; };
  const s0=tail(i=>pd[i]), s1=M-1-tail(i=>pd[M-1-i]);

// 4-connected components of a low-res mask, largest first
function components(m,w,h){
  const N=w*h, lab=new Int32Array(N).fill(-1), q=new Int32Array(N), out=[]; let L=0;
  for(let i0=0;i0<N;i0++){ if(!m[i0]||lab[i0]>=0) continue; let qh=0,qt=0; q[qt++]=i0; lab[i0]=L; const mk=new Uint8Array(N); let c=0;
    while(qh<qt){ const i=q[qh++]; mk[i]=1; c++; const x=i%w, y=(i/w)|0;
      if(x>0&&m[i-1]&&lab[i-1]<0){ lab[i-1]=L; q[qt++]=i-1; } if(x<w-1&&m[i+1]&&lab[i+1]<0){ lab[i+1]=L; q[qt++]=i+1; }
      if(y>0&&m[i-w]&&lab[i-w]<0){ lab[i-w]=L; q[qt++]=i-w; } if(y<h-1&&m[i+w]&&lab[i+w]<0){ lab[i+w]=L; q[qt++]=i+w; } }
    out.push({mask:mk,size:c}); L++; }
  return out.sort((a,b)=>b.size-a.size);
}
// Auto centerlines for one panel. Usually one axis. A panel whose bottom rows hold two separate runs is
// one piece of fabric with two legs (romper back): a straight torso axis clamped at the crotch plus one
// bent axis per leg, each leg frame offset to the torso frame at its top so the print stays continuous
// across the hip (compose blends the frames where they meet).
function autoAxes(W,H,ids,k){
  const F=4, w=Math.ceil(W/F), h=Math.ceil(H/F), N=w*h;
  const m0=new Uint8Array(N); let n0=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(ids[(y*F)*W+x*F]===k){ m0[y*w+x]=1; n0++; }
  if(n0<200) return [];
  const big=components(m0,w,h)[0], m=big.mask, n=big.size;   // SAM masks carry islands
  const minRun=Math.max(3,Math.round(w*0.02)), runs=new Uint8Array(h); let yTop=-1, yBot=-1;
  for(let y=0;y<h;y++){ let r=0,len=0; for(let x=0;x<=w;x++){ if(x<w&&m[y*w+x]) len++; else { if(len>=minRun) r++; len=0; } } runs[y]=r; if(r){ if(yTop<0) yTop=y; yBot=y; } }
  let y1=yBot; while(y1>yTop&&runs[y1]<2) y1--;          // lowest row with two runs
  let yc=y1; while(yc>yTop&&runs[yc]>=2) yc--;            // crotch: first row above the two-run block
  const span=yBot-yTop;
  if(!(y1-yc>=0.15*span && yc-yTop>=0.15*span)){ const a=pathAxis(m,w,h,F); return a?[{px:a.px,py:a.py,area:n*F*F}]:[]; }
  // one long axis per leg: a shared straight torso line (top -> crotch), then that leg's own path.
  // Identical torso samples make the two frames coincide on the back, so the print is continuous there;
  // they part gradually below the hip, and compose blends the frames where they meet.
  let tx=0,tn=0; for(let y=yTop;y<=yc;y++) for(let x=0;x<w;x++) if(m[y*w+x]){ tx+=x; tn++; }
  const cx=(tx/tn)*F+F/2;
  const lm=new Uint8Array(N); for(let i=(yc+1)*w;i<N;i++) lm[i]=m[i];
  const legs=components(lm,w,h).slice(0,2).filter(c=>c.size>=0.05*n), out=[];
  for(const c of legs){
    const mk=new Uint8Array(m); for(const o of legs) if(o!==c) for(let i=0;i<N;i++) if(o.mask[i]) mk[i]=0;   // torso + this leg
    const a=pathAxis(mk,w,h,F); if(!a) continue;
    const px=[], py=[]; for(let y=yTop*F;y<=yc*F;y+=AX_STEP){ px.push(cx); py.push(y); }
    for(let j=0;j<a.px.length;j++) if(a.py[j]>yc*F+AX_STEP){ px.push(a.px[j]); py.push(a.py[j]); }
    if(px.length>=3) out.push({px,py,area:(tn+c.size)*F*F});
  }
  if(!out.length){ const a=pathAxis(m,w,h,F); return a?[{px:a.px,py:a.py,area:n*F*F}]:[]; }
  return out;
}
function buildAxis(k,px,py,W,H,ids,area,wrap,fl){
  let plen=0; for(let j=1;j<px.length;j++) plen+=Math.hypot(px[j]-px[j-1],py[j]-py[j-1]);
  // Smooth the line over ~half the panel width: the (u,v) mapping folds where the bend radius is
  // smaller than the distance to the axis, so a wide panel (romper torso+leg) needs a gentler axis.
  const avgW=area/Math.max(1,plen), hw=Math.max(1,Math.min(60,Math.round(avgW/2/AX_STEP)));
  for(let pass=0;pass<3;pass++){ const qx=px.slice(), qy=py.slice();
    for(let j=0;j<qx.length;j++){ let ax=0,ay=0,m=0; for(let o=-hw;o<=hw;o++){ const jj=Math.min(qx.length-1,Math.max(0,j+o)); ax+=qx[jj]; ay+=qy[jj]; m++; } px[j]=ax/m; py[j]=ay/m; } }
  const n=px.length, s=new Float32Array(n), dx=new Float32Array(n), dy=new Float32Array(n), len=new Float32Array(n);
  for(let j=0;j<n-1;j++){ const ex=px[j+1]-px[j], ey=py[j+1]-py[j], L=Math.hypot(ex,ey)||1; dx[j]=ex/L; dy[j]=ey/L; len[j]=L; s[j+1]=s[j]+L; }
  // Tube wrap: per sample, walk the normal to each side until the panel ends -> half-width, and whether
  // that edge is the silhouette (id 0: fabric curves away, print compresses toward it) or a seam to
  // another panel (flat). f = silhouette fraction, smoothed so the two regimes blend along the limb.
  const wP=new Float32Array(n), wN=new Float32Array(n), fP=new Float32Array(n), fN=new Float32Array(n), valid=new Uint8Array(n);
  const maxW=Math.max(20,avgW*4);
  const at=(x,y)=>{ const xi=Math.round(x), yi=Math.round(y); return (xi<0||yi<0||xi>=W||yi>=H)?0:ids[yi*W+xi]; };
  for(let j=0;j<n;j++){ const tj=Math.min(j,n-2), tx=dx[tj], ty=dy[tj], x0=px[j], y0=py[j];
    if(at(x0,y0)!==k) continue; valid[j]=1;
    let sP=1, hP=0; for(;sP<maxW;sP++){ const q=at(x0+sP*ty,y0-sP*tx); if(q!==k){ hP=q; break; } }
    let sN=1, hN=0; for(;sN<maxW;sN++){ const q=at(x0-sN*ty,y0+sN*tx); if(q!==k){ hN=q; break; } }
    wP[j]=sP; wN[j]=sN; fP[j]=(wrap&&hP===0)?1:0; fN[j]=(wrap&&hN===0)?1:0; }

    for(let d=1; d<n && src<0; d++){ if(j-d>=0&&valid[j-d]) src=j-d; else if(j+d<n&&valid[j+d]) src=j+d; }
    if(src<0) break; wP[j]=wP[src]; wN[j]=wN[src]; fP[j]=fP[src]; fN[j]=fN[src]; }
  const box=(arr,h)=>{ const q=arr.slice(); for(let j=0;j<n;j++){ let a=0,m=0; for(let o=-h;o<=h;o++){ const jj=Math.min(n-1,Math.max(0,j+o)); a+=q[jj]; m++; } arr[j]=a/m; } };
  box(wP,3); box(wN,3); box(fP,hw); box(fN,hw);
  // coarse grid of nearest sample index, refined per pixel in compose
  const CS=8, gw=Math.ceil(W/CS), gh=Math.ceil(H/CS), near=new Int16Array(gw*gh);
  for(let gy=0;gy<gh;gy++) for(let gx=0;gx<gw;gx++){ const cxp=gx*CS+CS/2, cyp=gy*CS+CS/2; let bi=0, bd=Infinity;
    for(let j=0;j<n;j++){ const ex=px[j]-cxp, ey=py[j]-cyp, dd=ex*ex+ey*ey; if(dd<bd){ bd=dd; bi=j; } } near[gy*gw+gx]=bi; }
  return { n, px:Float32Array.from(px), py:Float32Array.from(py), s, dx, dy, len, wP, wN, fP, fN, near, gw, CS,
           U0:(fl&&fl.U0)||0, V0:(fl&&fl.V0)||0, clampStart:!!(fl&&fl.clampStart), clampEnd:!!(fl&&fl.clampEnd) };
}
let AX_U=0, AX_V=0, AX_D=0;
function axisUV(A,x,y){
  const c=A.near[((y/A.CS)|0)*A.gw+((x/A.CS)|0)], n=A.n; let best=Infinity, bj=0, bt=0;
  for(let j=Math.max(0,c-3), je=Math.min(n-2,c+3); j<=je; j++){
    const rx=x-A.px[j], ry=y-A.py[j], dxj=A.dx[j], dyj=A.dy[j];
    let t=rx*dxj+ry*dyj; if((j>0||A.clampStart)&&t<0) t=0; if((j<n-2||A.clampEnd)&&t>A.len[j]) t=A.len[j];   // extrapolate past free ends only
    const ex=rx-t*dxj, ey=ry-t*dyj, d2=ex*ex+ey*ey;
    if(d2<best){ best=d2; bj=j; bt=t; AX_U=A.s[j]+t; AX_V=ex*dyj-ey*dxj; }
  }

  const fr=Math.max(0,Math.min(1,bt/A.len[bj])), j1=bj+1, pos=AX_V>=0;
  const wA=pos?A.wP:A.wN, fA=pos?A.fP:A.fN;
  const w=wA[bj]+(wA[j1]-wA[bj])*fr, f=fA[bj]+(fA[j1]-fA[bj])*fr;
  if(f>0.001&&w>1){ const a=Math.abs(AX_V), r=a/w;
    const wrapped = r<1 ? w*Math.asin(r) : w*1.5708+(a-w)*1.5;
    AX_V=(pos?1:-1)*(a+f*(wrapped-a)); }

// A panel with several axes (torso + legs): blend their frames by inverse distance^4, so each region
// follows its own axis and the hand-over at the hip is continuous instead of a cut.
function panelUV(list,x,y){
  if(list.length===1){ axisUV(list[0],x,y); return; }
  let su=0,sv=0,sw=0; for(const A of list){ axisUV(A,x,y); const g=1/(AX_D*AX_D+1); su+=AX_U*g; sv+=AX_V*g; sw+=g; }
  AX_U=su/sw; AX_V=sv/sw;
}

// --- composite: tile the pattern into each fabric panel, recolor the trim, downscale by SS ---
const big=document.createElement('canvas'), disp=document.createElement('canvas');
// cal (optional): model view calibration = flatGw/sqrt(flatArea); without it the strip width comes from G.gw.
function compose(G, pat, scale, trim, cal){
  const {w:W,h:H,mock:md,ids,cx,cy,cs,sn,axes,Lref}=G;
  const patW = cal ? K_BASE*scale*Math.sqrt(G.area)*cal : K_BASE*scale*G.gw;
  const P=rasterWidth(pat, Math.max(2,Math.round(patW)), true);
  const PW=P.w, PH=P.h, pd=P.data;
  const ox=OFFX.map(v=>Math.floor(v*PW)), oy=OFFY.map(v=>Math.floor(v*PH));
  const out=new Uint8ClampedArray(md);            // background + (when no trim color) trim pixels stay as the mock
  const [tr,tg,tb]=trim||[0,0,0];

  for(let y=0, i=0; y<H; y++) for(let x=0; x<W; x++, i++){
    const k=ids[i]; if(k===0||k>9) continue;
    const o=i*4, r=md[o], g=md[o+1], b=md[o+2];
    if(k===9){
      if(!trim) continue;
      const f=Math.min(TRIM_CEIL, Math.max(TRIM_FLOOR, (r*299+g*587+b*114)/1000/Lref));
      out[o]=(tr*f)|0; out[o+1]=(tg*f)|0; out[o+2]=(tb*f)|0;
      continue;
    }
    let rx, ry;
    if(axes[k]){ panelUV(axes[k],x,y); rx=AX_V; ry=AX_U; }   // curved panel: across / along the limb axis
    else { const dx=x-cx[k], dy=y-cy[k]; rx=dx*cs[k]+dy*sn[k]; ry=-dx*sn[k]+dy*cs[k]; }   // rotate by -theta -> tile in panel-local axes
    let tx=((Math.round(rx)+ox[k])%PW+PW)%PW; const ty=((Math.round(ry)+oy[k])%PH+PH)%PH;
    if(k===COLLAR_ID) tx=PW-1-tx;                       // wrong side of the print -> mirror
    const pp=(ty*PW+tx)*4;
    let pr=pd[pp], pg=pd[pp+1], pb=pd[pp+2];
    if(k===COLLAR_ID){ pr=pr*0.4+126; pg=pg*0.4+126; pb=pb*0.4+126; }  // faint bleed-through (0.6 x 210)
    out[o]=(r*pr)/255|0; out[o+1]=(g*pg)/255|0; out[o+2]=(b*pb)/255|0;
  }

  big.width=W; big.height=H;
  big.getContext('2d').putImageData(new ImageData(out,W,H),0,0);
  disp.width=Math.round(W/SS); disp.height=Math.round(H/SS);
  const dctx=disp.getContext('2d'); dctx.imageSmoothingQuality='high';
  dctx.drawImage(big,0,0,disp.width,disp.height);
  return disp;
}

// --- UI state ---
let patImg=null, busy=false;
const results={ flatlay:null, model:null };   // { blob, url } per view

async function showResult(view, canvas, imgId, figId){
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob) throw new Error('PNG encode failed');
  if(results[view]) URL.revokeObjectURL(results[view].url);
  results[view]={ blob, url:URL.createObjectURL(blob) };
  $(imgId).src=results[view].url; $(figId).hidden=false;
}

async function generate(){
  if(busy) return;
  if(!patImg){ msg('Choose a pattern file first.'); return; }
  busy=true; $('go').disabled=true;
  msg('Generating…'); await nextPaint();
  const t0=performance.now();
  try{
    const g=GARMENTS[$('garment').value];
    const hex=parseHex($('trimHex').value), trim=hex&&hexToRgb(hex);
    const scale=parseFloat($('scale').value);
    // flatlay first: it defines the motif-size calibration the model view follows
    const GF=await analyzeGarment(g.flat);
    await showResult('flatlay', compose(GF, patImg, scale, trim), 'result', 'shotFlat');
    msg('Flatlay done · rendering on-model…'); await nextPaint();
    const GM=await analyzeGarment(g.models[+$('modelPick').value]||g.models[0], MODEL_OPTS);
    await showResult('model', compose(GM, patImg, scale, trim, GF.gw/Math.sqrt(GF.area)), 'result2', 'shotModel');
    $('dl').disabled=false;
    msg('Done · '+((performance.now()-t0)/1000).toFixed(1)+'s');
  }catch(err){ msg('Error: '+err.message); }
  finally{ busy=false; $('go').disabled=false; }
}

$('trimColor').addEventListener('input', e=>{ $('trimHex').value=e.target.value.toUpperCase(); });
$('trimHex').addEventListener('input', e=>{ const h=parseHex(e.target.value); if(h) $('trimColor').value='#'+h.toLowerCase(); });
$('scale').addEventListener('input', e=>{ $('scaleVal').textContent=parseFloat(e.target.value).toFixed(2)+'×'; });
// model photo list follows the garment; a random one is preselected, like the form does on each upload
function fillModelPick(){
  const g=GARMENTS[$('garment').value], s=$('modelPick'); s.innerHTML='';
  g.models.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=modelName(m); s.appendChild(o); });
  s.value=Math.floor(Math.random()*g.models.length);
}
$('garment').addEventListener('change', fillModelPick); fillModelPick();
$('patternBtn').addEventListener('click', ()=>$('pattern').click());
$('pattern').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('patternName').textContent=f.name;
  msg('Reading pattern…'); await nextPaint();
  try{
    const img = window.createImageBitmap ? await createImageBitmap(f) : await loadImg(URL.createObjectURL(f));
    if(patImg&&patImg.close) patImg.close();
    patImg=img;
    const t=suggestTrimHex(img); if(t) setTrim(t);
    msg('Pattern '+img.width+'×'+img.height+(t?' · trim '+t.toUpperCase():''));
  }catch{ msg('Could not read that image.'); }
});
$('go').addEventListener('click', generate);
$('dl').addEventListener('click', async ()=>{
  const g=$('garment').value;
  let dl=null; try{ dl = (window.claude&&claude.use) ? await claude.use('downloads') : null; }catch{}
  for(const view of ['flatlay','model']){
    const r=results[view]; if(!r) continue;
    const name=view+'-'+g+'.png';
    if(dl){ try{ await dl.save({filename:name, data:r.blob}); }catch(e){ msg('Download '+((e&&e.code)||'failed')); } }
    else { const a=document.createElement('a'); a.href=r.url; a.download=name; a.click(); await new Promise(res=>setTimeout(res,300)); }
  }
});
