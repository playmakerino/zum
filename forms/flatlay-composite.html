<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flatlay Compositor</title>
<style>
  :root{
    --ink:#1a1a1a; --mut:#6b6b6b; --line:#d8d8d8; --ground:#ffffff; --accent:#2f6f4e; --focus:#2f6f4e;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; --focus:#6fcaa0; }
  }
  :root[data-theme="dark"]{ --ink:#ededed; --mut:#9a9a9a; --line:#3a3a3a; --ground:#141414; --accent:#6fcaa0; --focus:#6fcaa0; }

  body{ background:var(--ground); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap{ display:flex; gap:40px; align-items:flex-start; padding:32px; flex-wrap:wrap; max-width:1180px; margin:0 auto; }
  .controls{ width:300px; flex:0 0 300px; display:flex; flex-direction:column; gap:20px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  label{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); font-weight:600; }
  select,input[type=file],input[type=text]{ font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:7px; padding:9px 10px; width:100%; }
  input[type=file]{ padding:8px 10px; font-size:13px; }
  select:focus-visible,input:focus-visible,button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .trim{ display:flex; gap:10px; align-items:center; }
  .trim input[type=color]{ width:44px; height:40px; padding:0; border:1px solid var(--line); border-radius:7px; background:transparent; cursor:pointer; }
  .trim input[type=text]{ flex:1; font-family:ui-monospace,"SF Mono",Menlo,monospace; text-transform:uppercase; }
  .scale-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .scale-head .val{ font-family:ui-monospace,Menlo,monospace; letter-spacing:0; text-transform:none; color:var(--ink); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  button{ font:inherit; font-weight:600; padding:11px 14px; border-radius:8px; cursor:pointer; background:transparent; }
  button.primary{ border:1px solid var(--accent); color:var(--accent); }
  button.primary:hover{ background:var(--accent); color:var(--ground); }
  button.secondary{ border:1px solid var(--line); color:var(--mut); }
  button.secondary:hover{ color:var(--ink); border-color:var(--ink); }
  button:disabled{ opacity:.4; cursor:default; }
  button:disabled:hover{ background:transparent; color:var(--mut); }
  .msg{ font-size:12px; color:var(--mut); min-height:16px; }
  .view{ flex:1; min-width:280px; display:flex; }
  .view img{ max-width:100%; max-height:82vh; display:block; margin:0 auto; }
  .view .empty{ color:var(--mut); font-size:13px; padding:40px 0; }
  canvas{ display:none; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>

<div class="wrap">
  <div class="controls">
    <div class="field">
      <label for="garment">Garment</label>
      <select id="garment">
        <option value="romper">Convertible Zippy Romper</option>
        <option value="pajama">Two-Piece Pajama Set</option>
      </select>
    </div>

    <div class="field">
      <label for="pattern">Pattern file</label>
      <input type="file" id="pattern" accept="image/png,image/jpeg,image/webp">
    </div>

    <div class="field">
      <label for="trimHex">Trim color</label>
      <div class="trim">
        <input type="color" id="trimColor" value="#7fb2d9" aria-label="Trim color picker">
        <input type="text" id="trimHex" value="#7FB2D9" spellcheck="false" aria-label="Trim color hex">
      </div>
    </div>

    <div class="field">
      <div class="scale-head"><label for="scale">Motif size</label><span class="val" id="scaleVal">1.00×</span></div>
      <input type="range" id="scale" min="0.5" max="2" step="0.05" value="1">
    </div>

    <div class="actions">
      <button class="primary" id="go">Generate flatlay</button>
      <button class="secondary" id="dl" disabled>Download PNG</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="view">
    <img id="result" alt="Composited flatlay" hidden>
    <div class="empty" id="empty">Choose a pattern and generate.</div>
  </div>
</div>

<script>
const A = JSON.parse(document.getElementById('assets').textContent);
const GARMENTS = { romper:{mock:A.romper_mock, map:A.romper_map}, pajama:{mock:A.pajama_mock, map:A.pajama_map} };
// Tile liền mạch toàn thân: mọi mảnh cùng pha (không lệch pha theo đường may).
const OFFX=[0,0,0,0,0,0,0,0,0];
const OFFY=[0,0,0,0,0,0,0,0,0];
const K_BASE=1.5;          // pattern strip width = K x garment width
const OUT_AREA=1900*2356;  // output pixels (~1900px wide) - crisp motifs
const SS=1.8;              // supersample factor for anti-aliasing
const TRIM_FLOOR=0.65;     // lift trim shadows (lighter inner collar)

const $=id=>document.getElementById(id);
const msg=m=>{ $('msg').textContent=m; };
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('image load failed')); i.src=src; }); }

// --- trim auto-detect: same logic as zum_prd_form.html ---
function rgbToHsv(r,g,b){ const max=Math.max(r,g,b),min=Math.min(r,g,b),c=max-min; let h=0; if(c!==0){ if(max===r)h=((g-b)/c+6)%6; else if(max===g)h=(b-r)/c+2; else h=(r-g)/c+4; h/=6; } return [h, max===0?0:c/max, max/255]; }
function hsvToRgb(h,s,v){ const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s); return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].map(x=>Math.round(x*255)); }
function toHex(rgb){ return '#'+rgb.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join(''); }
// dominant hue of the swatch, pulled into a range a garment trim can actually be
function suggestTrimHex(img){
  try{
    const n=64, c=document.createElement('canvas'); c.width=c.height=n;
    const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=false; x.drawImage(img,0,0,n,n);
    const d=x.getImageData(0,0,n,n).data, B=36;
    const weight=new Float64Array(B), sum=new Float64Array(B*3), count=new Int32Array(B);
    for(let i=0;i<d.length;i+=4){ if(d[i+3]<128) continue; const r=d[i],g=d[i+1],b=d[i+2]; const max=Math.max(r,g,b),min=Math.min(r,g,b),ch=max-min; if(max<40||ch/max<0.2) continue; let h; if(max===r)h=((g-b)/ch+6)%6; else if(max===g)h=(b-r)/ch+2; else h=(r-g)/ch+4; const k=Math.min(B-1,Math.floor(h/6*B)); weight[k]+=ch; sum[k*3]+=r; sum[k*3+1]+=g; sum[k*3+2]+=b; count[k]++; }
    let top=-1,tw=0; for(let k=0;k<B;k++) if(weight[k]>tw){ tw=weight[k]; top=k; }
    if(top<0) return null;
    const r=sum[top*3]/count[top], g=sum[top*3+1]/count[top], b=sum[top*3+2]/count[top];
    const hsv=rgbToHsv(r,g,b); if(hsv[1]<0.15||hsv[2]<0.10) return null;
    return toHex(hsvToRgb(hsv[0], Math.min(0.70,Math.max(0.25,hsv[1])), Math.min(0.86,Math.max(0.52,hsv[2]))));
  }catch(e){ return null; }
}
function setTrim(hex){ $('trimColor').value=hex; $('trimHex').value=hex.toUpperCase(); }

function rasterize(img, area, smooth){
  const s=Math.sqrt(area/(img.width*img.height));
  const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=smooth; x.drawImage(img,0,0,w,h);
  return { w, h, data:x.getImageData(0,0,w,h).data };
}
function rasterizeWidth(img, w, smooth){
  const h=Math.max(1,Math.round(img.height*w/img.width));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=smooth; x.drawImage(img,0,0,w,h);
  return { w, h, data:x.getImageData(0,0,w,h).data };
}

let patImg=null;

async function generate(){
  if(!patImg){ msg('Choose a pattern file first.'); return; }
  msg('Generating…'); await new Promise(r=>setTimeout(r,20));
  const t0=performance.now();

  const g=GARMENTS[$('garment').value];
  const scale=parseFloat($('scale').value);
  const hex=$('trimHex').value.replace(/^#/,'').trim();
  const okHex=/^[0-9a-fA-F]{6}$/.test(hex);
  const tr=okHex?parseInt(hex.slice(0,2),16):0, tg=okHex?parseInt(hex.slice(2,4),16):0, tb=okHex?parseInt(hex.slice(4,6),16):0;

  const CA=OUT_AREA*SS*SS;
  const M   = rasterize(await loadImg(g.mock), CA, true);   // mockup (smooth)
  const MAP = rasterize(await loadImg(g.map),  CA, false);  // panel map, same size, nearest (ids intact)
  const MW=M.w, MH=M.h, md=M.data, xd=MAP.data;
  const idAt=(x,y)=>Math.round(xd[(y*MW+x)*4]/20);          // gray value = id*20

  // garment width from fabric ids (1..8)
  let minx=MW, maxx=0;
  for(let y=0;y<MH;y++){ const row=y*MW; for(let x=0;x<MW;x++){ const id=Math.round(xd[(row+x)*4]/20); if(id>=1&&id<=8){ if(x<minx)minx=x; if(x>maxx)maxx=x; } } }
  const gw=Math.max(2, maxx-minx+1);
  const patW=Math.max(2, Math.round(K_BASE*scale*gw));
  const P=rasterizeWidth(patImg, patW, true);
  const PW=P.w, PH=P.h, pd=P.data;

  // trim reference: 90th percentile luminance of trim region (id 9)
  let Lref=255;
  if(okHex){
    const hist=new Uint32Array(256); let n=0;
    for(let y=0;y<MH;y+=2){ const row=y*MW; for(let x=0;x<MW;x+=2){ if(Math.round(xd[(row+x)*4]/20)!==9) continue; const p=(row+x)*4; hist[((md[p]*299+md[p+1]*587+md[p+2]*114)/1000)|0]++; n++; } }
    let acc=0; Lref=255; for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=n*0.9){ Lref=v; break; } } if(Lref<1) Lref=1;
  }

  const ox=[], oy=[]; for(let k=0;k<9;k++){ ox[k]=Math.floor(OFFX[k]*PW); oy[k]=Math.floor(OFFY[k]*PH); }

  const big=$('cv'); big.width=MW; big.height=MH;
  const bctx=big.getContext('2d');
  const outImg=bctx.createImageData(MW,MH); const out=outImg.data;

  for(let y=0;y<MH;y++){
    const row=y*MW;
    for(let x=0;x<MW;x++){
      const o=(row+x)*4;
      const r=md[o], gg=md[o+1], b=md[o+2];
      const k=Math.round(xd[o]/20);
      if(k===0||k>9){ out[o]=r; out[o+1]=gg; out[o+2]=b; out[o+3]=255; continue; }
      if(k===9){
        if(!okHex){ out[o]=r; out[o+1]=gg; out[o+2]=b; out[o+3]=255; continue; }
        let f=((r*299+gg*587+b*114)/1000)/Lref; if(f<TRIM_FLOOR) f=TRIM_FLOOR; if(f>1.15) f=1.15;
        out[o]=Math.min(255,tr*f)|0; out[o+1]=Math.min(255,tg*f)|0; out[o+2]=Math.min(255,tb*f)|0; out[o+3]=255;
        continue;
      }
      let tx=((x+ox[k])%PW+PW)%PW; const ty=((y+oy[k])%PH+PH)%PH;
      if(k===6) tx=PW-1-tx;                 // inside of the collar = wrong side of one-sided print -> mirror
      const pp=(ty*PW+tx)*4;
      let pr=pd[pp], pg=pd[pp+1], pb=pd[pp+2];
      if(k===6){ pr=pr*0.4+210*0.6; pg=pg*0.4+210*0.6; pb=pb*0.4+210*0.6; }  // faint bleed-through
      out[o]=(r*pr)/255|0; out[o+1]=(gg*pg)/255|0; out[o+2]=(b*pb)/255|0; out[o+3]=255;
    }
  }
  bctx.putImageData(outImg,0,0);

  // downscale for anti-aliasing
  const ow=Math.round(MW/SS), oh=Math.round(MH/SS);
  const disp=document.createElement('canvas'); disp.width=ow; disp.height=oh;
  const dctx=disp.getContext('2d'); dctx.imageSmoothingEnabled=true; dctx.imageSmoothingQuality='high';
  dctx.drawImage(big,0,0,ow,oh);

  const url=disp.toDataURL('image/png');
  const img=$('result'); img.src=url; img.hidden=false; $('empty').hidden=true;
  window.__flatlayCanvas=disp;
  $('dl').disabled=false;
  msg(ow+'×'+oh+' · '+((performance.now()-t0)/1000).toFixed(1)+'s');
}

$('trimColor').addEventListener('input', e=>{ $('trimHex').value=e.target.value.toUpperCase(); });
$('trimHex').addEventListener('input', e=>{ const v=e.target.value.trim().replace(/^#/,''); if(/^[0-9a-fA-F]{6}$/.test(v)) $('trimColor').value='#'+v; });
$('scale').addEventListener('input', e=>{ $('scaleVal').textContent=parseFloat(e.target.value).toFixed(2)+'×'; });
$('pattern').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=async()=>{ try{ patImg=await loadImg(rd.result); const t=suggestTrimHex(patImg); if(t) setTrim(t); msg('Pattern '+patImg.width+'×'+patImg.height+(t?' · trim '+t.toUpperCase():'')); }catch{ msg('Could not read that image.'); } }; rd.readAsDataURL(f); });
$('go').addEventListener('click', ()=>{ generate().catch(err=>msg('Error: '+err.message)); });
$('dl').addEventListener('click', ()=>{ const c=window.__flatlayCanvas; if(!c) return; c.toBlob(async bl=>{ if(!bl) return; const name='flatlay-'+$('garment').value+'.png';
  let dl=null; try{ dl = (window.claude&&claude.use) ? await claude.use('downloads') : null; }catch{ dl=null; }
  if(dl){ try{ await dl.save({filename:name, data:bl}); }catch(e){ msg('Download '+(e&&e.code?e.code:'failed')); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
},'image/png'); });
</script>
