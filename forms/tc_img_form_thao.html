<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Ad Set</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="forms.css">
  <style>
    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .field label em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: 4px;
    }

    .field input[type="text"] {
      width: 100%;
      height: 42px;
      background: var(--surface-elevated);
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .field input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .field input[type="text"]:hover {
      background: #2a2a2a;
    }

    .field input[type="text"]:focus {
      background: #2a2a2a;
      box-shadow: 0 0 0 2px var(--text);
    }

    .submit-wrap {
      margin-top: 32px;
    }

    .submit-btn {
      width: 100%;
      max-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto;
      background: var(--accent);
      border: none;
      color: #000;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 500px;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s, box-shadow 0.2s;
    }

    .submit-btn svg {
      width: 14px;
      height: 14px;
    }

    #payloadPreview {
      font-family: 'SF Mono', 'Fira Code', monospace !important;
      font-size: 12px !important;
    }

    /* Text fields 14px; 16px on phones, where iOS zooms into any field under 16px on focus */
    @media (max-width: 640px) {
      .field input[type="text"] { font-size: 16px; }
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>
  <div class="container">
    <script src="forms.js"></script>
    <div class="card">
      <div class="header">
        <p>Paste a Drive folder of images to auto create ads.</p>
      </div>

      <div class="field">
        <label>Google Drive folder url</label>
        <input type="text" id="folder_input" placeholder="https://drive.google.com/drive/folders/..." />
      </div>

      <div class="submit-wrap">
        <button class="submit-btn" id="submitBtn" onclick="submitForm()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          Create Ads
        </button>
        <div class="status" id="statusMsg"></div>
      </div>

      <div id="payloadPreview" style="display:none; margin-top:14px; padding:14px; background:#0d0d0d; border-radius:8px; font-size:12px; color:#6A6A6A; line-height:1.7; white-space:pre-wrap; word-break:break-all;"></div>

    </div>
  </div>

  <script>
    // ============================================================
    // ⚙️  CONFIG
    // ============================================================
    const N8N_WEBHOOK_URL = "https://playmakerino.app.n8n.cloud/webhook/tc-img-form-thao";
    // ============================================================

    async function submitForm() {
      const rawInput = document.getElementById('folder_input').value;
      const folder_id = extractFolderId(rawInput);

      if (!folder_id) {
        return showStatus('error', '⚠️ Please enter a valid Google Drive folder link or folder ID.');
      }

      const payload = { folder_id };

      showStatus('loading', '<span class="spinner"></span> Sending to n8n...');
      document.getElementById('submitBtn').disabled = true;

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...TC_AUTH_HEADERS() },
          body: JSON.stringify(payload)
        });

        if (res.status === 401 || res.status === 403) {
          showStatus('error', '❌ Wrong password.');
          TC_AUTH_FAIL();
          return;
        }

        if (res.ok) {
          showStatus('success', '✅ Sent successfully! The n8n workflow is running.');
          const preview = document.getElementById('payloadPreview');
          preview.style.display = 'block';
          preview.textContent = '📦 Payload sent:\n' + JSON.stringify(payload, null, 2);
        } else {
          const errText = await res.text();
          showStatus('error', `❌ Error from n8n (${res.status}): ${errText.slice(0,120)}`);
        }
      } catch (err) {
        showStatus('error', `❌ Cannot connect to n8n: ${err.message}`);
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    }

  </script>
</body>
</html>
