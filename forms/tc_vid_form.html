<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Ads</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="forms.css">
  <style>
    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .field label em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: 4px;
    }

    .field input[type="text"] {
      width: 100%;
      height: 42px;
      background: var(--surface-elevated);
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .field input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .field input[type="text"]:hover {
      background: #2a2a2a;
    }

    .field input[type="text"]:focus {
      background: #2a2a2a;
      box-shadow: 0 0 0 2px var(--text);
    }

    .submit-wrap {
      margin-top: 32px;
    }

    .submit-btn {
      width: 100%;
      max-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto;
      background: var(--accent);
      border: none;
      color: #000;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 500px;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s, box-shadow 0.2s;
    }

    .folder-row {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .folder-row .remove-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-muted);
      cursor: pointer;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .folder-row .remove-btn:hover {
      color: var(--error); border-color: var(--error); background: var(--error-soft);
    }

    .add-row-wrap {
      display: flex; align-items: center; gap: 14px;
      margin-top: 6px; flex-wrap: wrap;
    }
    .paste-tip {
      font-size: 12px; color: var(--text-muted); line-height: 1.4;
    }
    .add-btn {
      display: inline-flex; align-items: center;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.20);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px; font-weight: 700;
      padding: 7px 14px;
      border-radius: 500px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
      letter-spacing: 0.01em;
    }
    .add-btn:hover {
      border-color: var(--text);
      background: rgba(255,255,255,0.06);
      transform: scale(1.04);
    }

    #payloadPreview {
      font-family: 'SF Mono', 'Fira Code', monospace !important;
      font-size: 12px !important;
    }

    /* Text fields 14px; 16px on phones, where iOS zooms into any field under 16px on focus */
    @media (max-width: 640px) {
      .field input[type="text"] { font-size: 16px; }
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>
  <div class="container">
    <script src="forms.js"></script>
    <div class="card">
      <div class="header">
        <p>Paste Drive folders of videos to auto create ads.</p>
      </div>

      <div class="field">
        <label>Google Drive folder url</label>
        <div id="rowsContainer"></div>
        <div class="add-row-wrap">
          <button class="add-btn" type="button" onclick="addRow()">+ Add folder</button>
          <span class="paste-tip">Paste several links at once to add one row per link.</span>
        </div>
      </div>

      <div class="submit-wrap">
        <button class="submit-btn" id="submitBtn" onclick="submitForm()">
          Create Ads
        </button>
        <div class="status" id="statusMsg"></div>
      </div>

      <div id="payloadPreview" style="display:none; margin-top:14px; padding:14px; background:#0d0d0d; border-radius:8px; font-size:12px; color:#6A6A6A; line-height:1.7; white-space:pre-wrap; word-break:break-all;"></div>

    </div>
  </div>

  <script>
    // ============================================================
    // ⚙️  CONFIG
    // ============================================================
    const N8N_WEBHOOK_URL = "https://playmakerino.app.n8n.cloud/webhook/01de568d-39af-4f07-a19b-085d1568150a";
    // ============================================================

    function addRow(value = '') {
      const div = document.createElement('div');
      div.className = 'folder-row';
      div.innerHTML = `
        <input type="text" class="folder-input" placeholder="https://drive.google.com/drive/folders/..." value="${escapeHtml(value)}" />
        <button class="remove-btn" type="button" title="Remove" onclick="removeRow(this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      `;
      document.getElementById('rowsContainer').appendChild(div);
    }

    function removeRow(btn) {
      btn.closest('.folder-row').remove();
      if (!document.querySelector('.folder-row')) addRow();
    }

    // Pasting several links into one field fills this row and adds a row for each extra link
    document.getElementById('rowsContainer').addEventListener('paste', e => {
      if (!e.target.classList.contains('folder-input')) return;
      const lines = (e.clipboardData.getData('text') || '').split(/[\r\n\t]+/).map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) return;
      e.preventDefault();
      e.target.value = lines[0];
      lines.slice(1).forEach(l => addRow(l));
    });

    addRow();

    async function submitForm() {
      const inputs = [...document.querySelectorAll('.folder-input')];
      const filled = inputs.filter(i => i.value.trim());
      if (!filled.length) {
        return showStatus('error', '⚠️ Please enter at least one Google Drive folder link.');
      }

      const folder_ids = [];
      for (const input of filled) {
        const id = extractFolderId(input.value);
        if (!id) {
          input.focus();
          return showStatus('error', `⚠️ Row ${inputs.indexOf(input) + 1} is not a valid Google Drive folder link or folder ID.`);
        }
        if (!folder_ids.includes(id)) folder_ids.push(id);
      }

      const payload = { folder_ids };

      showStatus('loading', '<span class="spinner"></span> Sending to n8n...');
      document.getElementById('submitBtn').disabled = true;

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...TC_AUTH_HEADERS() },
          body: JSON.stringify(payload)
        });

        if (res.status === 401 || res.status === 403) {
          showStatus('error', '❌ Wrong password.');
          TC_AUTH_FAIL();
          return;
        }

        if (res.ok) {
          showStatus('success', '✅ Sent successfully! The n8n workflow is running.');
          const preview = document.getElementById('payloadPreview');
          preview.style.display = 'block';
          preview.textContent = '📦 Payload sent:\n' + JSON.stringify(payload, null, 2);
        } else {
          const errText = await res.text();
          showStatus('error', `❌ Error from n8n (${res.status}): ${errText.slice(0,120)}`);
        }
      } catch (err) {
        showStatus('error', `❌ Cannot connect to n8n: ${err.message}`);
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    }

  </script>
</body>
</html>
