<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type IDs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="forms.css">
  <style>
    .container { width: 100%; max-width: 640px; position: relative; z-index: 1; }
    .card + .card { margin-top: 16px; }
    h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.01em; }

    .search {
      width: 100%; height: 42px;
      background: var(--surface-elevated);
      border: none; border-radius: 4px;
      padding: 0 16px; margin-bottom: 14px;
      font-family: var(--font); font-size: 14px; color: var(--text);
      outline: none;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .search::placeholder { color: var(--text-muted); }
    .search:hover, .search:focus { background: #2a2a2a; }
    .search:focus { box-shadow: 0 0 0 2px var(--text); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; font-size: 12px; font-weight: 500;
      color: var(--text-sub); padding: 0 10px 8px;
      border-bottom: 1px solid var(--divider);
    }
    td { padding: 9px 10px; border-bottom: 1px solid var(--divider); color: var(--text-sub); vertical-align: top; }
    td:first-child { width: 120px; }
    code {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
      color: var(--text); background: rgba(255,255,255,0.08);
      padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    }
    .empty { color: var(--text-muted); font-size: 12px; padding-top: 10px; display: none; }

    @media (max-width: 640px) {
      .card { padding: 24px 16px; }
      .search { font-size: 16px; }
      td:first-child { width: 90px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Type group ID</h2>
      <table>
        <thead><tr><th>Type group ID</th><th>Type ID</th></tr></thead>
        <tbody id="groupRows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Type ID</h2>
      <input type="text" class="search" id="search" placeholder="Search by ID or name" />
      <table>
        <thead><tr><th>Type ID</th><th>Product type</th></tr></thead>
        <tbody id="typeRows"></tbody>
      </table>
      <div class="empty" id="empty">No match.</div>
    </div>
  </div>

  <script>
    // Snapshot of the n8n datatable "Product type settings" (2026-10-12): Product_type_ID, Product_type, Product_type_group.
    // New product type or group: update this list together with the datatable.
    const TYPES = [
      ['CZR', 'Convertible Zippy', 'kid pajama'],
      ['TPJ', 'Two Piece Long Sleeve Pajama Set', 'kid pajama'],
      ['SZR', 'Shorty Zippy', 'kid pajama'],
      ['SPJ', 'Two Piece Short Sleeve Shorts Pajama Set', 'kid pajama'],
      ['CSS', 'Crewneck Sweatshirt', 'kid play'],
      ['CTS', 'Crewneck T-Shirt', 'kid play'],
      ['DRS', 'Twirl Dress', 'kid play'],
      ['ZHD', 'Zip Hoodie', 'kid play'],
      ['MPS', 'Men Pajama Set', 'adult pajama'],
      ['MPS', 'Men Short Sleeve Short Pajama Set', 'adult pajama'],
      ['WPS', 'Women Pajama Set', 'adult pajama'],
      ['WPS', 'Women Short Sleeve Short Pajama Set', 'adult pajama'],
      ['BLK', 'Blanket', ''],
      ['PLC', 'Pillow Case', ''],
      ['QBL', 'Quilt Blanket', ''],
      ['QBS', 'Quilt Bedding Set', ''],
      ['ZFR', 'Zippered Footie Romper', ''],
      ['SBP', 'Backpack', ''],
      ['ACS', 'Adult Crewneck Sweatshirt', ''],
      ['BGS', 'Baby Gift Set', ''],
      ['STB', 'Soft Toy Bunny', ''],
      ['QTR', 'Quilt table runner', ''],
      ['SLB', 'Sleep bag', ''],
      ['STRB', 'Stories Book', ''],
      ['BDS', 'Bodysuit', ''],
      ['LPB', 'Printed Leather Patch Beanie', ''],
      ['LPB', 'Leather Patch Beanie', ''],
      ['WCS', 'Women Crewneck Sweatshirt', ''],
      ['MCS', 'Men Crewneck Sweatshirt', ''],
      ['BED', 'Bedding Set', ''],
      ['ONM', 'Ornament', ''],
      ['SWD', 'Swaddle Blanket', ''],
      ['BNB', 'Banner', ''],
      ['Hoop', 'Hoop', ''],
      ['LPL', 'Letter Pillow', ''],
      ['PNT', 'Pennant', ''],
      ['BHD', 'Blanket Hoodie', ''],
      ['BBR', 'Bubble Romper', '']
    ];

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // One row per Type ID; a Type ID with several product names lists them all
    const byId = new Map();
    for (const [id, name] of TYPES) {
      if (!byId.has(id)) byId.set(id, []);
      byId.get(id).push(name);
    }
    // FML (Family) is pinned as the first row, the rest sort by product name
    const typeList = [{ id: 'FML', names: ['Family'] }].concat([...byId].map(([id, names]) => ({ id, names }))
      .sort((a, b) => a.names[0].localeCompare(b.names[0])));

    const groups = new Map();
    for (const [id, , group] of TYPES) {
      if (!group) continue;
      if (!groups.has(group)) groups.set(group, []);
      if (!groups.get(group).includes(id)) groups.get(group).push(id);
    }
    document.getElementById('groupRows').innerHTML = [...groups].map(([g, ids]) =>
      `<tr><td><code>${esc(g)}</code></td><td>${ids.map(i => `<code>${esc(i)}</code>`).join(' ')}</td></tr>`).join('');

    function renderTypes(q = '') {
      q = q.trim().toLowerCase();
      const rows = typeList.filter(t => !q || t.id.toLowerCase().includes(q) || t.names.some(n => n.toLowerCase().includes(q)));
      document.getElementById('typeRows').innerHTML = rows.map(t =>
        `<tr><td><code>${esc(t.id)}</code></td><td>${t.names.map(esc).join('<br>')}</td></tr>`).join('');
      document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
    }
    document.getElementById('search').addEventListener('input', e => renderTypes(e.target.value));
    renderTypes();
  </script>
</body>
</html>
