<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type IDs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">

  <!-- Type ID lookup, laid out like Shopify Settings > Metafields and metaobjects > Product metafield definitions
       (measured on admin 2026-10-16): 26px title, one 784px card, tab pills in the card head (here: type groups) with a search
       button on the right, a 32px #f7f7f7 header row, 36px rows split by 1px #f2f2f2. Type ID shown as a product tag chip. -->
  <style>
    :root {
      --text: #101010; --text-sub: #616161; --text-header: #4a4a4a; --placeholder: #4a4a4a;
      --line: #f2f2f2; --band: #f7f7f7; --t-hover: rgba(0,0,0,.08); --t-active: rgba(0,0,0,.13); --focus: #5083f0;
      --card-sh: 0 0 2px rgba(0,0,0,.24), 0 2px 12px rgba(0,0,0,.02), 0 4px 16px rgba(0,0,0,.02), 0 4px 48px rgba(0,0,0,.02);
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: #fff; color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; line-height: 20px; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
    button, input { font-family: inherit; font-size: 13px; line-height: 20px; letter-spacing: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    mark { background: #fff3a8; color: inherit; border-radius: 2px; }

    .page { max-width: 816px; margin: 0 auto; padding: 40px 16px 48px; }
    /* page title: 26px/32px weight 500, letter-spacing -0.52px, 13px above the card */
    h1 { font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: -0.52px; margin-bottom: 13px; }

    /* card: 20px radius, card shadow, clips its rows */
    .card { background: #fff; border-radius: 20px; box-shadow: var(--card-sh); overflow: hidden; }

    /* card head 45px: tab pills left (28px, padding 4px 12px, 12px/18px weight 500; current rgba(0,0,0,.13) #101010, others transparent #4a4a4a),
       search button right; searching swaps the tabs for a search field */
    .head { display: flex; align-items: center; gap: 4px; min-height: 45px; padding: 8px 8px 8px 12px; }
    .tabs { flex: 1; display: flex; flex-wrap: wrap; gap: 0; min-width: 0; }
    .tab { height: 28px; padding: 4px 12px; border: 0; border-radius: 9999px; background: transparent; color: var(--text-header);
      font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: -0.06px; white-space: nowrap; transition: background-color .2s; }
    .tab:hover { background: var(--t-hover); color: var(--text); }
    .tab.on { background: var(--t-active); color: var(--text); }
    .icon { flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; }
    .icon:hover { background: var(--t-hover); }
    .icon svg { width: 20px; height: 20px; fill: var(--text-header); }
    .sfield { flex: 1; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 8px; border-radius: 8px; box-shadow: 0 0 0 1px var(--focus), 0 0 0 3px rgba(53,115,246,.06); }
    .sfield svg { width: 16px; height: 16px; fill: var(--text-header); flex: none; }
    .sfield input { flex: 1; min-width: 0; height: 28px; border: 0; outline: none; background: none; }
    .sfield input::placeholder { color: var(--placeholder); opacity: 1; }
    .cancel { height: 28px; padding: 4px 12px; border: 0; border-radius: 9999px; background: none; font-size: 12px; line-height: 18px; font-weight: 500; }
    .cancel:hover { background: var(--t-hover); }
    [hidden] { display: none !important; }

    /* list: header row 32px #f7f7f7, padding 8px 12px 8px 16px, 12px/16px weight 500 #4a4a4a; rows 36px + 1px #f2f2f2 line, cells padding 8px 12px */
    .row { display: grid; grid-template-columns: 1fr 120px 160px; align-items: center; }
    .row > div { padding: 8px 12px; min-width: 0; }
    .row > div:first-child { padding-left: 16px; }
    .thead { background: var(--band); color: var(--text-header); font-size: 12px; line-height: 16px; font-weight: 500; }
    .thead > div { padding-top: 8px; padding-bottom: 8px; }
    .item { min-height: 37px; border-top: 1px solid var(--line); }
    .thead + .item { border-top: 0; }
    .nm { font-weight: 500; }
    .nm div + div { margin-top: 2px; }
    .grp { color: var(--text-sub); }
    /* Type ID as a product tag chip (measured): 20px, padding 2px 8px, radius 8px, rgba(0,0,0,.05), 12px/18px weight 500, #4a4a4a */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; background: rgba(0,0,0,.05); color: var(--text-header);
      font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: -0.06px; white-space: nowrap; }
    .foot { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--text-sub); text-align: center; }

    .empty { padding: 48px 16px 40px; text-align: center; color: var(--text-sub); }
    .empty svg { width: 60px; height: 60px; fill: #8a8a8a; display: block; margin: 0 auto 16px; }
    .empty h3 { color: var(--text); font-size: 20px; line-height: 24px; font-weight: 600; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .page { padding: 24px 12px 32px; }
      h1 { font-size: 20px; line-height: 24px; }
      .row { grid-template-columns: 1fr 88px 104px; }
      .sfield input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Type IDs</h1>
    <div class="card">
      <div class="head">
        <div class="tabs" id="tabs" role="tablist" aria-label="Type group"></div>
        <div class="sfield" id="sfield" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.323 13.383a5.5 5.5 0 1 1 1.06-1.06l2.897 2.897a.75.75 0 1 1-1.06 1.06l-2.897-2.897Zm.677-4.383a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"/></svg>
          <input type="text" id="q" placeholder="Search by ID or product type" aria-label="Search by ID or product type" autocomplete="off" />
        </div>
        <button type="button" class="cancel" id="cancel" hidden>Cancel</button>
        <button type="button" class="icon" id="searchBtn" aria-label="Search"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.323 13.383a5.5 5.5 0 1 1 1.06-1.06l2.897 2.897a.75.75 0 1 1-1.06 1.06l-2.897-2.897Zm.677-4.383a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"/></svg></button>
      </div>
      <div class="row thead"><div>Product type</div><div>Type ID</div><div>Type group</div></div>
      <div id="list"></div>
      <div class="foot" id="count"></div>
    </div>
  </div>

  <script>
    // All rows of the n8n datatable "Product type · settings" (BfplDltqK4KKl0Q7), read 2026-10-16: [Product_type_ID, Product_type, Product_type_group].
    // New product type or group: add it here as well as in the datatable.
    const TYPES = [
      ['CZR', 'Convertible Zippy', 'kid pajama'],
      ['TPJ', 'Two Piece Long Sleeve Pajama Set', 'kid pajama'],
      ['SZR', 'Shorty Zippy', 'kid pajama'],
      ['SPJ', 'Two Piece Short Sleeve Shorts Pajama Set', 'kid pajama'],
      ['BLK', 'Blanket', ''],
      ['PLC', 'Pillow Case', ''],
      ['QBL', 'Quilt Blanket', ''],
      ['QBS', 'Quilt Bedding Set', ''],
      ['ZFR', 'Zippered Footie Romper', ''],
      ['SBP', 'Backpack', ''],
      ['CSS', 'Crewneck Sweatshirt', 'kid play'],
      ['ACS', 'Adult Crewneck Sweatshirt', ''],
      ['CTS', 'Crewneck T-Shirt', 'kid play'],
      ['DRS', 'Twirl Dress', 'kid play'],
      ['ZHD', 'Zip Hoodie', 'kid play'],
      ['BGS', 'Baby Gift Set', ''],
      ['STB', 'Soft Toy Bunny', ''],
      ['MPS', 'Men Pajama Set', 'adult pajama'],
      ['MPS', 'Men Short Sleeve Short Pajama Set', 'adult pajama'],
      ['WPS', 'Women Pajama Set', 'adult pajama'],
      ['WPS', 'Women Short Sleeve Short Pajama Set', 'adult pajama'],
      ['QTR', 'Quilt table runner', ''],
      ['SLB', 'Sleep bag', ''],
      ['STRB', 'Stories Book', ''],
      ['BDS', 'Bodysuit', ''],
      ['LPB', 'Printed Leather Patch Beanie', ''],
      ['LPB', 'Leather Patch Beanie', ''],
      ['WCS', 'Women Crewneck Sweatshirt', ''],
      ['MCS', 'Men Crewneck Sweatshirt', ''],
      ['BED', 'Bedding Set', ''],
      ['ONM', 'Ornament', ''],
      ['SWD', 'Swaddle Blanket', ''],
      ['BNB', 'Banner', ''],
      ['Hoop', 'Hoop', ''],
      ['LPL', 'Letter Pillow', ''],
      ['PNT', 'Pennant', ''],
      ['BHD', 'Blanket Hoodie', ''],
      ['BBR', 'Bubble Romper', ''],
      ['FML', 'Family', 'kid pajama']
    ];

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hl = (s, q) => { const i = q ? s.toLowerCase().indexOf(q) : -1; return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };

    // one entry per Type ID (several product names allowed); FML first, the rest by product name
    const byId = new Map();
    for (const [id, name, group] of TYPES) { if (!byId.has(id)) byId.set(id, { id, names: [], group }); byId.get(id).names.push(name); }
    const rows = [...byId.values()].sort((a, b) => (b.id === 'FML') - (a.id === 'FML') || a.names[0].localeCompare(b.names[0]));
    const groups = [...new Set(rows.map(r => r.group).filter(Boolean))];
    const TABS = [['*', 'All'], ...groups.map(g => [g, g]), ['', 'No type group']];
    let tab = '*';

    const EMPTY = '<div class="empty"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.323 13.383a5.5 5.5 0 1 1 1.06-1.06l2.897 2.897a.75.75 0 1 1-1.06 1.06l-2.897-2.897Zm.677-4.383a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"/></svg><h3>No type IDs found</h3><p>Try another ID or product type name.</p></div>';

    function render() {
      const q = $('q').value.trim().toLowerCase();
      const searching = !$('sfield').hidden;
      $('tabs').innerHTML = TABS.map(([v, l]) => `<button type="button" role="tab" class="tab${v === tab ? ' on' : ''}" aria-selected="${v === tab}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
      // a search looks through every group; the tab applies when not searching
      const base = searching && q ? rows : rows.filter(r => tab === '*' || (r.group || '') === tab);
      const list = base.filter(r => !q || r.id.toLowerCase().includes(q) || r.names.some(n => n.toLowerCase().includes(q)));
      $('list').innerHTML = list.length ? list.map(r => `<div class="row item"><div class="nm">${r.names.map(n => `<div>${hl(n, q)}</div>`).join('')}</div><div><span class="tag">${hl(r.id, q)}</span></div><div class="grp">${esc(r.group || '')}</div></div>`).join('') : EMPTY;
      $('count').textContent = list.length + (list.length === 1 ? ' type ID' : ' type IDs');
    }

    function setSearch(on) {
      $('sfield').hidden = !on; $('cancel').hidden = !on; $('tabs').hidden = on; $('searchBtn').hidden = on;
      if (on) $('q').focus(); else { $('q').value = ''; $('searchBtn').focus(); }
      render();
    }
    $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { tab = b.dataset.v; render(); } });
    $('searchBtn').addEventListener('click', () => setSearch(true));
    $('cancel').addEventListener('click', () => setSearch(false));
    $('q').addEventListener('input', render);
    $('q').addEventListener('keydown', e => { if (e.key === 'Escape') setSearch(false); });
    // typing anywhere on the page starts a search
    document.addEventListener('keydown', e => {
      if ($('sfield').hidden && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement.tagName !== 'INPUT') { setSearch(true); }
    });
    render();
  </script>
</body>
</html>
