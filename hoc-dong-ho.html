<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Đồng Hồ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  /* ===== BIẾN & KHUNG TRANG =====
     BA MÀU CỦA ĐỒNG HỒ dùng thống nhất cả trên mặt số lẫn trong câu chữ:
       xanh = GIỜ · cam = PHÚT · hồng = GIÂY (và mọi thứ chạy theo giờ thật: "bây giờ")
     Xanh ngọc chỉ dành cho KHOẢNG (bao nhiêu phút) — khái niệm thứ tư, không phải kim nào. */
  :root{
    --bg:#fdf6f0;
    --card:#fff;
    --ink:#3f3a5c;
    --muted:#a99fb8;
    --line:#e9cdb6;
    --neutral:#2b2b2b;       /* đen trung tính: mép đồng hồ */
    --c-hour:#5a63d8;        /* giờ */
    --c-min:#f5921b;         /* phút */
    --c-sec:#ff5d97;         /* giây + "bây giờ" + chỗ đang hỏi */
    --c-dur:#1fab95;         /* khoảng "bao nhiêu phút" */
    --ok:#1fab95;
    --ghost:.30;             /* độ mờ của mốc "đến" (thời điểm sau) */

    /* Spacing: một thang chung, co theo bề rộng màn (mobile nhỏ lại, desktop nở ra) */
    --sp-1:clamp(.25rem,1vw,.4rem);
    --sp-2:clamp(.4rem,1.6vw,.6rem);
    --sp-3:clamp(.6rem,2.4vw,.9rem);
    --sp-4:clamp(.9rem,3.6vw,1.4rem);
    --fs-say:clamp(1rem,4.2vw,1.12rem);
    --fs-chip:clamp(.8rem,3.4vw,.88rem);
    --fs-opt:clamp(.72rem,3vw,.78rem);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    min-height:100dvh;
    overflow-x:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:var(--sp-3);
    padding:var(--sp-2);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* NGANG (>=768px): đồng hồ bên TRÁI, câu hỏi/câu trả lời bên PHẢI. */
  @media (min-width:768px){
    body{
      flex-direction:row;
      justify-content:center;
      align-items:center;
      gap:24px;
    }
  }

  /* ===== ANALOG: MẶT SỐ, VẠCH, KIM ===== */
  .analog{
    width:300px;height:300px;border-radius:50%;
    background:#fff;
    border:1px solid var(--neutral);  /* mép đồng hồ: đen trung tính */
    position:relative;
    margin:24px;                      /* = hằng MARGIN trong JS (chỗ cho vạch mốc + cung) */
    flex:none;
  }
  .tick{position:absolute;left:50%;top:50%;transform-origin:0 0;}
  .tick span{
    position:absolute;
    width:1px;height:6px;
    background:var(--c-min);          /* vạch phút: màu PHÚT */
    left:-0.5px;top:-118px;
  }
  .tick.major span{height:12px;width:1.5px;left:-0.75px;background:var(--c-hour);}   /* vạch giờ: màu GIỜ */
  .numeral{
    position:absolute;
    font-size:.95rem;font-weight:400;line-height:1;
    color:var(--c-hour);
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
  }
  .numeral.active{font-weight:700;}
  .hand{
    position:absolute;left:50%;top:50%;
    transform-origin:50% 100%;
    border-radius:99px;
  }
  .hour{width:5px;margin-left:-2.5px;background:var(--c-hour);}
  .minute{width:3px;margin-left:-1.5px;background:var(--c-min);}
  .second{width:1.5px;margin-left:-.75px;background:var(--c-sec);}
  .center{
    position:absolute;left:50%;top:50%;
    width:9px;height:9px;border-radius:50%;
    background:var(--c-sec);transform:translate(-50%,-50%);
    z-index:10;
    box-shadow:0 0 0 4px #fff;
  }

  /* ===== MỐC TỪ / ĐẾN = VẠCH NGOÀI MÉP MẶT ===== */
  .mark{position:absolute;left:50%;top:50%;transform-origin:0 0;z-index:8;}
  .mark span{position:absolute;display:block;border-radius:99px;}
  .mk-h span{width:4px;left:-2px;background:var(--c-hour);}
  .mk-m span{width:2.5px;left:-1.25px;background:var(--c-min);}
  .mark.ghost{opacity:var(--ghost);}
  .mark.off{display:none;}          /* thành phần chưa biết -> không vẽ (không lộ đáp án) */
  .r-span{fill:none;stroke:var(--c-dur);stroke-width:3.2px;stroke-linecap:butt;}
  .r-span.off{display:none;}

  /* ===== CỘT CÂU HỎI / CÂU TRẢ LỜI ===== */
  .panel{
    width:min(460px,100%);
    display:flex;flex-direction:column;align-items:stretch;
    gap:var(--sp-3);
    padding:0 var(--sp-1) var(--sp-4);
  }
  .lbl{
    font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);
  }
  .say{
    font-size:var(--fs-say);font-weight:400;
    line-height:2.4;
    word-spacing:.06em;
  }
  .say .v-h{color:var(--c-hour);font-weight:700;}
  .say .v-m{color:var(--c-min);font-weight:700;}
  .say .v-d{color:var(--c-dur);font-weight:700;}
  .say .v-now{color:var(--c-sec);font-weight:700;}
  .say .w-h{color:var(--c-hour);}    /* chữ "giờ" */
  .say .w-m{color:var(--c-min);}     /* chữ "phút" / "đúng" / "rưỡi" */
  .say .w-d{color:var(--c-dur);}     /* chữ "phút" của khoảng */
  .say .q{color:var(--c-sec);font-weight:700;}     /* chỗ đang hỏi */
  .say .todo{color:var(--muted);}
  .block{display:flex;flex-direction:column;gap:var(--sp-2);}
  .block[hidden]{display:none;}

  /* Ô nhập nằm TRONG câu (kiểu B và C) */
  .in{
    width:2.9rem;height:2.1rem;
    border:none;border-bottom:2px solid var(--line);
    border-radius:0;background:transparent;
    font-family:inherit;font-size:var(--fs-say);font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:center;
    color:var(--ink);
    margin:0 .12rem;
    -moz-appearance:textfield;
  }
  .in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .in:focus{outline:none;border-bottom-color:var(--c-sec);}
  .in.h{color:var(--c-hour);border-bottom-color:var(--c-hour);}
  .in.m{color:var(--c-min);border-bottom-color:var(--c-min);}
  .in.d{color:var(--c-dur);border-bottom-color:var(--c-dur);}

  /* Chọn thành phần nào bị hỏi */
  .pick{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
  .chip{
    min-height:2.2rem;padding:.3rem .8rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:var(--fs-chip);
    cursor:pointer;
  }
  .chip.on{background:var(--c-sec);border-color:var(--c-sec);color:#fff;}

  /* ===== KIỂU A: VIÊN GIÁ TRỊ + BẢNG CHỈNH ===== */
  .pill{
    display:inline-flex;align-items:center;
    min-height:2.2rem;padding:.15rem .7rem;margin:0 .12rem;
    border:1.5px solid var(--line);border-radius:99px;
    background:var(--card);
    font-family:inherit;font-size:var(--fs-say);
    color:var(--ink);
    cursor:pointer;
    vertical-align:middle;
  }
  .pill.empty{border-style:dashed;color:var(--muted);}
  .pill.open{border-color:var(--c-sec);box-shadow:0 0 0 3px rgba(255,93,151,.15);}
  .picker{
    border:1px solid var(--line);border-radius:14px;
    background:var(--card);
    padding:var(--sp-3);
    display:flex;flex-direction:column;gap:var(--sp-2);
  }
  .picker[hidden]{display:none;}
  .pk-row{display:flex;align-items:center;gap:var(--sp-2);}
  .pk-name{
    font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);
    width:3.1rem;flex:none;
  }
  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-1);flex:1;}
  .cell{
    min-height:2.3rem;
    border:1px solid var(--line);border-radius:9px;
    background:transparent;color:var(--ink);
    font-family:inherit;font-size:var(--fs-chip);font-weight:500;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .cell.h.on{background:var(--c-hour);border-color:var(--c-hour);color:#fff;}
  .cell.m.on{background:var(--c-min);border-color:var(--c-min);color:#fff;}
  .cell.d.on{background:var(--c-dur);border-color:var(--c-dur);color:#fff;}
  .nudge{
    min-height:2.3rem;padding:0 .6rem;
    border:1px solid var(--line);border-radius:9px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:var(--fs-chip);
    cursor:pointer;flex:none;
  }
  .pk-done{
    align-self:flex-end;
    min-height:2.2rem;padding:0 1rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--ink);
    font-family:inherit;font-size:var(--fs-chip);
    cursor:pointer;
  }

  /* ===== CỤM ĐẶT NHANH (dùng chung cho A trong bảng chỉnh, B ở hàng phụ) ===== */
  .opts{
    display:inline-flex;vertical-align:middle;
    border:1px solid var(--line);border-radius:99px;
    overflow:hidden;
    white-space:nowrap;
  }
  .opt{
    min-height:2rem;padding:0 .7rem;
    border:none;border-left:1px solid var(--line);
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:var(--fs-opt);line-height:1;
    cursor:pointer;white-space:nowrap;
  }
  .opt:first-child{border-left:none;}
  .opt.on{color:#fff;font-weight:500;}
  .opt.on[data-opt="now"]{background:var(--c-sec);}      /* chạy theo giờ thật -> màu GIÂY */
  .opt.on[data-opt="sharp"],
  .opt.on[data-opt="half"]{background:var(--c-min);}     /* đặt PHÚT -> màu PHÚT */

  /* ===== KIỂU B: HÀNG PHỤ DƯỚI CÂU ===== */
  .acc{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-opt);color:var(--muted);}
  .acc[hidden]{display:none;}
  .acc-name{font-size:var(--fs-opt);}

  /* ===== KIỂU C: NÚT ▾ + MENU NỔI ===== */
  .caret{
    min-height:1.8rem;padding:0 .4rem;margin-left:.1rem;
    border:1px solid var(--line);border-radius:7px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:.8rem;line-height:1;
    cursor:pointer;vertical-align:middle;
  }
  .menu{
    position:fixed;z-index:60;
    min-width:9.5rem;
    border:1px solid var(--line);border-radius:12px;
    background:var(--card);
    box-shadow:0 8px 24px rgba(63,58,92,.14);
    padding:.25rem;
    display:flex;flex-direction:column;
  }
  .menu[hidden]{display:none;}
  .menu button{
    text-align:left;
    min-height:2.4rem;padding:0 .7rem;
    border:none;border-radius:8px;background:transparent;
    font-family:inherit;font-size:var(--fs-chip);color:var(--ink);
    cursor:pointer;
  }
  .menu button.on{color:#fff;background:var(--c-sec);}

  .result{font-size:var(--fs-chip);font-weight:500;min-height:1.3em;}
  .result.ok{color:var(--ok);}
  .result.no{color:var(--c-sec);}

  .reset{
    align-self:flex-start;
    min-height:2.3rem;padding:0 1rem;
    border:1px solid var(--c-hour);border-radius:99px;
    background:var(--c-hour);color:#fff;
    font-family:inherit;font-size:var(--fs-chip);font-weight:500;
    cursor:pointer;
  }
  .reset[hidden]{display:none;}

  /* Nút chuyển KIỂU NHẬP — chỉ để thử 3 phương án, bỏ khi đã chốt */
  .uiswitch{
    display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;
    font-size:var(--fs-opt);color:var(--muted);
  }
  .ui-b{
    min-height:1.9rem;padding:0 .6rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:var(--fs-opt);
    cursor:pointer;
  }
  .ui-b.on{background:var(--ink);border-color:var(--ink);color:#fff;}
</style>
</head>
<body>
  <div class="analog" id="analog">
    <svg style="position:absolute;left:50%;top:50%;overflow:visible;pointer-events:none;z-index:9;">
      <path id="spanArc" class="r-span off"></path>
    </svg>
    <!-- Kim GIỜ THẬT chạy liên tục. Vạch mốc từ/đến dựng bằng JS ở phần 2. -->
    <div class="hand hour"   id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center"></div>
  </div>

  <div class="panel">
    <!-- TẠM: chuyển giữa 3 kiểu nhập để thử -->
    <div class="uiswitch" id="uiSwitch">
      <span>Kiểu nhập</span>
      <button class="ui-b" type="button" data-ui="A">A · viên + bảng</button>
      <button class="ui-b" type="button" data-ui="B">B · hàng phụ</button>
      <button class="ui-b" type="button" data-ui="C">C · menu ▾</button>
    </div>

    <div class="pick">
      <button class="chip" type="button" data-ask="from">từ mấy giờ mấy phút?</button>
      <button class="chip" type="button" data-ask="to">đến mấy giờ mấy phút?</button>
      <button class="chip" type="button" data-ask="dur">bao nhiêu phút?</button>
    </div>

    <!-- Hai khối dưới đây ẩn cho tới khi chọn chỗ cần hỏi (chip ở trên) -->
    <div class="block" id="qBlock" hidden>
      <div class="lbl">Câu hỏi</div>
      <div class="say" id="qSay"></div>
      <div class="acc" id="qAcc" hidden></div>
      <div class="picker" id="qPicker" hidden></div>
    </div>

    <div class="block" id="aBlock" hidden>
      <div class="lbl">Câu trả lời</div>
      <div class="say" id="aSay"></div>
      <div class="picker" id="aPicker" hidden></div>
      <div class="result" id="result"></div>
      <button class="reset" id="btnReset" type="button" hidden>Câu hỏi mới</button>
    </div>
  </div>

  <div class="menu" id="menu" hidden></div>

<script>
  /* ============================================================
     HỌC ĐỒNG HỒ — script chia 6 phần:
       1. Tiện ích & tham chiếu DOM      4. Mốc từ/đến + cung khoảng phút
       2. Mặt số: vạch, chữ số, vạch mốc 5. Vòng lặp mỗi frame — tick()
       3. Bố cục tự co (layout)          6. Câu hỏi / câu trả lời

     QUY ƯỚC THỜI GIAN: mặt đồng hồ 12 GIỜ nên mọi mốc quy về SỐ PHÚT TRONG 12 TIẾNG,
     0..719 (12 giờ đúng = 0). Giờ nhập/hiện là 1..12. Mọi phép cộng trừ lấy dư 720.
     ============================================================ */

  /* ===== 1. TIỆN ÍCH & THAM CHIẾU DOM ===== */
  const $ = id => document.getElementById(id);
  const analog = $('analog');
  const elHour=$('hour'), elMin=$('minute'), elSec=$('second');
  const elArc=$('spanArc');

  const HALF_DAY = 720;                       // số phút của một vòng mặt 12 giờ
  const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
  const pad2  = n => String(n).padStart(2,'0');

  // TỌA ĐỘ CỰC quanh tâm mặt: deg đo TỪ 12 GIỜ, theo chiều kim. Trả [dx,dy] px so với tâm.
  function polar(r, deg){
    const a=(deg-90)*Math.PI/180;
    return [r*Math.cos(a), r*Math.sin(a)];
  }

  /* ===== 2. MẶT SỐ: VẠCH CHIA + CHỮ SỐ + VẠCH MỐC ===== */
  const tickSpans=[];
  for(let i=0;i<60;i++){
    const t=document.createElement('div');
    t.className='tick'+(i%5===0?' major':'');
    t.style.transform=`rotate(${i*6}deg)`;
    const sp=document.createElement('span');
    t.appendChild(sp);
    tickSpans.push(sp);
    analog.appendChild(t);
  }
  const numerals=[];
  for(let n=1;n<=12;n++){
    const el=document.createElement('div');
    el.className='numeral';
    el.dataset.n=n;
    el.textContent=n;
    numerals.push(el);
    analog.appendChild(el);
  }

  // 4 vạch mốc NGOÀI mép mặt: mốc "từ" (đặc) và mốc "đến" (mờ), mỗi mốc một vạch giờ + một vạch phút
  function buildMark(cls){
    const d=document.createElement('div');
    d.className='mark '+cls;
    d.appendChild(document.createElement('span'));
    analog.appendChild(d);
    return d;
  }
  const mark = {
    fromH: buildMark('mk-h'),       fromM: buildMark('mk-m'),
    toH:   buildMark('mk-h ghost'), toM:   buildMark('mk-m ghost'),
  };
  const markSpans = Object.values(mark).map(d => d.firstChild);

  /* ===== 3. BỐ CỤC TỰ CO (layout) ===== */
  const EDGE = 12;         // lề tối thiểu tới cạnh màn hình
  const MARGIN = 24;       // lề quanh mặt (= margin của .analog trong CSS)
  const FACE_MIN = 50;     // SÀN CỨNG bán kính mặt: viewport hẹp cỡ nào cũng KHÔNG co về 0
  const MK_IN = 3, MK_OUT = 13;   // vạch mốc nằm trong dải bán kính [FACE+MK_IN, FACE+MK_OUT]
  let FACE = 150;
  let ARC_R = 0;
  let baseFace = 0;        // FACE đo được lúc KHÔNG phóng to — mốc để KHÓA khi zoom in

  const viewportH = () => (window.visualViewport && window.visualViewport.height)
        || document.documentElement.clientHeight || window.innerHeight;

  // ===== NHẬN BIẾT PHÓNG TO (zoom) =====
  // Zoom làm viewport tính theo CSS px HẸP LẠI -> tính lại bố cục theo viewport mới thì mặt
  // co đúng bằng phần vừa phóng to. Bắt được zoom thì KHÓA kích thước mặt ở mức 100%.
  const dprBase = window.devicePixelRatio || 1;
  function zoomFactor(){
    const byDpr   = (window.devicePixelRatio || 1) / dprBase;
    const byPinch = (window.visualViewport && window.visualViewport.scale) || 1;
    return Math.max(byDpr, byPinch);
  }

  const mqDesktop = window.matchMedia('(min-width:768px)');
  const elPanel = document.querySelector('.panel');

  function layout(){
    const desktop = mqDesktop.matches;
    const zoomed  = zoomFactor() > 1.01;
    const vh = viewportH();

    let faceByW;
    if(desktop){
      const panelW = elPanel.offsetWidth || 460;
      const GAP = 24;
      const availW = Math.min(window.innerWidth, 1600) - EDGE*2;
      faceByW = (availW - panelW - GAP - 2*MARGIN) / 2;
      const faceByH = (vh - 2*EDGE - 2*MARGIN) / 2;
      FACE = Math.min(faceByW, faceByH);
    } else {
      const halfW = (Math.min(window.innerWidth, 900) / 2) - EDGE;
      faceByW = halfW - MARGIN;
      FACE = faceByW;
    }
    FACE = Math.max(FACE, Math.min(150, faceByW));
    FACE = Math.max(FACE, FACE_MIN);
    if(zoomed && baseFace > 0) FACE = baseFace;
    else baseFace = FACE;

    const D = FACE*2;
    analog.style.width  = D+'px';
    analog.style.height = D+'px';
    ARC_R = FACE + MK_OUT + 5;   // cung khoảng phút: ngoài vạch mốc

    layoutFace();
    drawMarks();
    document.documentElement.style.overflow = zoomed ? 'auto' : '';
  }

  // Đặt lại vạch chia, chữ số, vạch mốc và chiều dài kim theo FACE hiện tại
  function layoutFace(){
    const G_RIM = 5, G_NUM = 2, majorLen = 8, minorLen = 4;
    const tickOuter = FACE - G_RIM;
    const tickInner = tickOuter - majorLen;

    tickSpans.forEach((sp,i)=>{
      const len = (i%5===0) ? majorLen : minorLen;
      sp.style.top=(-tickOuter)+'px';
      sp.style.height=len+'px';
    });

    // Bán kính RIÊNG cho từng số: mép ngoài mỗi số cách đuôi vạch đúng G_NUM
    numerals.forEach(el=>{
      const n=+el.dataset.n;
      const [ux,uy]=polar(1, n*30);
      const rg=document.createRange(); rg.selectNodeContents(el);
      const r=rg.getBoundingClientRect();
      const halfReach=Math.abs(ux)*r.width/2 + Math.abs(uy)*r.height/2;
      const radius=(tickInner - G_NUM) - halfReach;
      el.style.left=`calc(50% + ${ux*radius}px)`;
      el.style.top=`calc(50% + ${uy*radius}px)`;
    });

    markSpans.forEach(sp=>{
      sp.style.top    = (-(FACE + MK_OUT)) + 'px';
      sp.style.height = (MK_OUT - MK_IN) + 'px';
    });

    const hh=FACE*0.34, mh=FACE*0.55, sh=FACE*0.62;
    elHour.style.height=hh+'px'; elHour.style.marginTop=(-hh)+'px';
    elMin.style.height=mh+'px';  elMin.style.marginTop=(-mh)+'px';
    elSec.style.height=sh+'px';  elSec.style.marginTop=(-sh)+'px';
  }

  /* ===== 4. MỐC TỪ/ĐẾN + CUNG KHOẢNG PHÚT ===== */
  function arcPath(r, startDeg, endDeg){
    const sweep = endDeg - startDeg;
    if(sweep <= 0) return '';
    if(sweep >= 359.99){   // >= 1 giờ: vẽ TRỌN vòng bằng 2 nửa cung (một cung 360° là rỗng)
      const [x0,y0]=polar(r,0), [x1,y1]=polar(r,180);
      return `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1} A ${r} ${r} 0 0 1 ${x0} ${y0}`;
    }
    const [x0,y0]=polar(r,startDeg), [x1,y1]=polar(r,endDeg);
    return `M ${x0} ${y0} A ${r} ${r} 0 ${sweep>180?1:0} 1 ${x1} ${y1}`;
  }

  function setMark(mH, mM, mins){
    const off = (mins === null);
    mH.classList.toggle('off', off);
    mM.classList.toggle('off', off);
    if(off) return;
    mH.style.transform=`rotate(${(mins/60)*30}deg)`;   // vạch giờ nhích dần theo phút
    mM.style.transform=`rotate(${(mins%60)*6}deg)`;
  }

  // Vẽ lại mốc + cung từ những gì ĐANG ĐƯỢC BIẾT (không lộ thành phần đang hỏi)
  function drawMarks(){
    const k = knownNow();
    setMark(mark.fromH, mark.fromM, k.from);
    setMark(mark.toH,   mark.toM,   k.to);

    const showArc = (k.from !== null && k.to !== null);
    elArc.classList.toggle('off', !showArc);
    if(showArc){
      const dur = (k.to - k.from + HALF_DAY) % HALF_DAY;
      const startDeg = (k.from % 60) * 6;
      const sweep = dur <= 60 ? dur*6 : 360;      // hơn 1 giờ -> trọn vòng
      elArc.setAttribute('d', arcPath(ARC_R, startDeg, startDeg + sweep));
    }
  }

  /* ===== 5. VÒNG LẶP MỖI FRAME — tick() ===== */
  let lastSec = -1, lastMin = -1;
  function tick(){
    const now=new Date();
    const h=now.getHours(), s=now.getSeconds();

    const totalSec = now.getTime()/1000 - now.getTimezoneOffset()*60;
    elSec.style.transform  = `rotate(${totalSec*6}deg)`;
    elMin.style.transform  = `rotate(${(totalSec/60)*6}deg)`;
    elHour.style.transform = `rotate(${(totalSec/3600)*30}deg)`;

    if(s!==lastSec){
      lastSec=s;
      const hourNum = (h%12)===0 ? 12 : (h%12);
      numerals.forEach(el => el.classList.toggle('active', +el.dataset.n===hourNum));

      // Mốc chọn "bây giờ" chạy theo giờ thật -> sang phút mới thì vẽ lại vạch mốc
      const mn = now.getMinutes();
      if(mn!==lastMin){
        lastMin=mn;
        // chỉ vẽ lại vạch mốc; câu chữ ghi "bây giờ" (không có số) nên không cần dựng lại
        if(usingNow() && frozenNow===null) drawMarks();
      }
    }
    requestAnimationFrame(tick);
  }

  /* ===== 6. CÂU HỎI / CÂU TRẢ LỜI ===== */
  // MỘT nguồn trạng thái (ô nhập/viên dựng lại từ đây nên không giữ giá trị trong DOM).
  //   unknown : thành phần bị hỏi = thành phần phải điền ở câu trả lời (null = chưa chọn)
  //   from/to : {h, m, mode} với mode = cách đặt mốc:
  //       'input' gõ/chọn giờ + phút · 'now' lấy giờ thật · 'sharp' giờ ĐÚNG (phút 0) · 'half' giờ RƯỠI (phút 30)
  //   solved  : đáp án điền đã đúng -> mới vẽ thành phần đó lên đồng hồ
  //   ui      : KIỂU NHẬP đang thử — 'A' viên + bảng chỉnh · 'B' ô trong câu + hàng phụ · 'C' ô trong câu + menu ▾
  //   edit    : {where:'q'|'a', part} — bảng chỉnh (kiểu A) đang mở cho ô nào
  const MIN_OF = {sharp:0, half:30};
  const state = {
    unknown:null, solved:false,
    from:{h:null, m:null, mode:'input'},
    to:  {h:null, m:null, mode:'input'},
    dur:null,
    ans:{h:null, m:null, d:null},
    ui: localStorage.getItem('hdh-ui') || 'A',
    edit:null,
    accPart:null,        // kiểu B: mốc đang được hàng phụ phục vụ
  };

  const elQBlock=$('qBlock'), elABlock=$('aBlock');
  const elQSay=$('qSay'), elASay=$('aSay'), elResult=$('result'), btnReset=$('btnReset');
  const elQAcc=$('qAcc'), elQPicker=$('qPicker'), elAPicker=$('aPicker'), elMenu=$('menu');
  const chips=[...document.querySelectorAll('.chip')];
  const uiBtns=[...document.querySelectorAll('.ui-b')];

  // "bây giờ" = giờ máy đang chạy (quy về 0..719). Trả lời ĐÚNG thì ĐÓNG BĂNG mốc này lại
  // (frozenNow), nếu không sang phút sau đáp án vừa đúng sẽ thành sai. Sửa gì đó là chạy tiếp.
  const liveNow = () => { const d=new Date(); return (d.getHours()%12)*60 + d.getMinutes(); };
  let frozenNow = null;
  const nowMins  = () => frozenNow!==null ? frozenNow : liveNow();
  const usingNow = () => (state.from.mode==='now' && state.unknown!=='from')
                      || (state.to.mode==='now'   && state.unknown!=='to');

  // Giá trị một mốc (0..719; null = chưa đủ dữ kiện)
  function givenTime(part){
    const p = state[part];
    if(p.mode==='now') return nowMins();
    if(p.h===null) return null;
    const hh = (p.h % 12) * 60;
    if(p.mode==='input') return p.m===null ? null : hh + p.m;
    return hh + MIN_OF[p.mode];
  }
  const givenFrom = () => givenTime('from');
  const givenTo   = () => givenTime('to');
  const givenDur  = () => state.dur;

  // Đáp án đúng của thành phần đang hỏi (null nếu 2 thành phần đã cho chưa đủ)
  function solution(){
    const f=givenFrom(), t=givenTo(), d=givenDur();
    if(state.unknown==='dur')  return (f===null||t===null) ? null : (t - f + HALF_DAY) % HALF_DAY;
    if(state.unknown==='to')   return (f===null||d===null) ? null : (f + d) % HALF_DAY;
    if(state.unknown==='from') return (t===null||d===null) ? null : (t - d + HALF_DAY*2) % HALF_DAY;
    return null;   // chưa chọn chỗ hỏi
  }

  // Những gì ĐANG ĐƯỢC BIẾT để vẽ đồng hồ: 2 thành phần đã cho, cộng đáp án nếu đã lộ
  function knownNow(){
    const out = { from:givenFrom(), to:givenTo(), dur:givenDur() };
    if(state.unknown) out[state.unknown] = state.solved ? solution() : null;
    return out;
  }

  /* --- Mảnh câu dùng chung --- */
  const inp = (k, cls, v, min, max) =>
    `<input class="in ${cls}" data-k="${k}" type="number" inputmode="numeric" min="${min}" max="${max}"` +
    ` value="${v===null?'':v}">`;
  const val = (cls, v) => v===null ? '<span class="todo">…</span>' : `<span class="${cls}">${v}</span>`;
  const W_H = '<span class="w-h">giờ</span>';
  const W_M = '<span class="w-m">phút</span>';
  const W_D = '<span class="w-d">phút</span>';

  // Chữ đọc của một mốc (dùng cho câu trả lời và cho VIÊN ở kiểu A)
  function timeTxt(part){
    const p = state[part];
    if(p.mode==='now')   return '<span class="v-now">bây giờ</span>';
    if(p.mode==='sharp') return `${val('v-h',p.h)} ${W_H} <span class="w-m">đúng</span>`;
    if(p.mode==='half')  return `${val('v-h',p.h)} ${W_H} <span class="w-m">rưỡi</span>`;
    return `${val('v-h',p.h)} ${W_H} ${val('v-m',p.m===null?null:pad2(p.m))} ${W_M}`;
  }
  const durTxt = () => `${val('v-d',state.dur)} ${W_D}`;

  // Mốc còn thiếu dữ kiện? (để viên hiện kiểu "chưa chọn")
  const timeEmpty = part => givenTime(part)===null;

  /* --- Ô nhập mốc trong câu (kiểu B, C) --- */
  function timeFields(part){
    const p = state[part];
    const h = inp(part+'H','h',p.h,1,12);
    if(p.mode==='now')   return '<span class="v-now">bây giờ</span>';
    if(p.mode==='sharp') return `${h} ${W_H} <span class="w-m">đúng</span>`;
    if(p.mode==='half')  return `${h} ${W_H} <span class="w-m">rưỡi</span>`;
    return `${h} ${W_H} ${inp(part+'M','m',p.m,0,59)} ${W_M}`;
  }

  /* --- Lựa chọn đặt nhanh: chỉ những cái còn ý nghĩa --- */
  //   · đang "bây giờ"        -> chỉ còn chính nó (bấm lại để quay về tự nhập)
  //   · mốc kia đang "bây giờ" -> giấu "bây giờ" ở đây (chỉ MỘT mốc được là bây giờ)
  function optList(part){
    const mode  = state[part].mode;
    const other = state[part==='from' ? 'to' : 'from'].mode;
    if(mode==='now') return [['now','bây giờ','Bấm lại để tự nhập giờ']];
    return [
      ...(other==='now' ? [] : [['now','bây giờ','Lấy giờ thật đang chạy']]),
      ['sharp','đúng','Phút 0'],
      ['half','rưỡi','Phút 30'],
    ];
  }
  function optsHTML(part){
    const mode = state[part].mode;
    const b = ([o,txt,tip]) => `<button class="opt${mode===o?' on':''}" type="button"` +
      ` data-part="${part}" data-opt="${o}" title="${tip}">${txt}</button>`;
    return `<span class="opts">${optList(part).map(b).join('')}</span>`;
  }

  /* --- KIỂU A: viên giá trị --- */
  const pillTime = part => `<button class="pill${timeEmpty(part)?' empty':''}` +
    `${state.edit && state.edit.where==='q' && state.edit.part===part ? ' open':''}"` +
    ` type="button" data-pill="q:${part}">${timeEmpty(part) ? 'chọn giờ' : timeTxt(part)}</button>`;
  const pillDur = () => `<button class="pill${state.dur===null?' empty':''}` +
    `${state.edit && state.edit.where==='q' && state.edit.part==='dur' ? ' open':''}"` +
    ` type="button" data-pill="q:dur">${state.dur===null ? 'chọn số phút' : durTxt()}</button>`;
  const pillAns = () => {
    const t = state.unknown==='dur'
      ? (state.ans.d===null ? 'chọn số phút' : `${val('v-d',state.ans.d)} ${W_D}`)
      : (state.ans.h===null||state.ans.m===null ? 'chọn giờ'
         : `${val('v-h',state.ans.h)} ${W_H} ${val('v-m',pad2(state.ans.m))} ${W_M}`);
    const empty = state.unknown==='dur' ? state.ans.d===null : (state.ans.h===null||state.ans.m===null);
    return `<button class="pill${empty?' empty':''}${state.edit && state.edit.where==='a' ? ' open':''}"` +
      ` type="button" data-pill="a:ans">${t}</button>`;
  };

  /* --- Một mốc trong CÂU HỎI, tùy kiểu nhập --- */
  function timeIn(part){
    if(state.ui==='A') return pillTime(part);
    if(state.ui==='B') return timeFields(part);                       // nút nằm ở hàng phụ
    return `${timeFields(part)}<button class="caret" type="button" data-menu="${part}" aria-label="Cách đặt mốc">▾</button>`;
  }
  const durIn = () => state.ui==='A' ? pillDur()
      : `${inp('dur','d',state.dur,0,HALF_DAY-1)} ${W_D}`;
  const ansIn = () => {
    if(state.ui==='A') return pillAns();
    return state.unknown==='dur'
      ? `${inp('ansD','d',state.ans.d,0,HALF_DAY-1)} ${W_D}`
      : `${inp('ansH','h',state.ans.h,1,12)} ${W_H} ${inp('ansM','m',state.ans.m,0,59)} ${W_M}`;
  };

  // MỘT câu liền mạch cho câu hỏi (chỗ đang hỏi in màu hồng)
  function qHTML(){
    if(state.unknown==='dur')
      return `Từ ${timeIn('from')} đến ${timeIn('to')} là còn <span class="q">bao nhiêu phút</span>?`;
    if(state.unknown==='to')
      return `Từ ${timeIn('from')} sau ${durIn()} nữa là <span class="q">mấy giờ mấy phút</span>?`;
    return `Đến ${timeIn('to')} thì đã qua ${durIn()}, vậy bắt đầu từ <span class="q">mấy giờ mấy phút</span>?`;
  }

  // MỘT câu liền mạch cho câu trả lời (chỗ bị hỏi là ô để điền)
  function aHTML(){
    if(state.unknown==='dur')
      return `Từ ${timeTxt('from')} đến ${timeTxt('to')} là còn ${ansIn()}.`;
    if(state.unknown==='to')
      return `Từ ${timeTxt('from')} sau ${durTxt()} nữa là ${ansIn()}.`;
    return `Đến ${timeTxt('to')} thì đã qua ${durTxt()}, vậy bắt đầu từ ${ansIn()}.`;
  }

  /* --- KIỂU A: BẢNG CHỈNH (lưới giờ / lưới phút / đặt nhanh) --- */
  const cells = (cls, list, cur, act) => list.map(v =>
    `<button class="cell ${cls}${v===cur?' on':''}" type="button" data-act="${act}" data-v="${v}">${v}</button>`
  ).join('');
  const HOURS = Array.from({length:12},(_,i)=>i+1);
  const MINS  = Array.from({length:12},(_,i)=>i*5);
  const DURS  = [5,10,15,20,25,30,35,40,45,50,55,60,75,90,105,120];

  function pickerHTML(){
    const e = state.edit;
    if(!e) return '';
    const isDur = (e.where==='q' && e.part==='dur') || (e.where==='a' && state.unknown==='dur');
    if(isDur){
      const cur = e.where==='q' ? state.dur : state.ans.d;
      return `<div class="pk-row"><span class="pk-name">Phút</span>
          <span class="grid">${cells('d',DURS,cur,'dur')}</span></div>
        <div class="pk-row"><span class="pk-name"></span>
          <button class="nudge" type="button" data-act="nudge-d" data-v="-1">−1</button>
          <button class="nudge" type="button" data-act="nudge-d" data-v="1">+1</button>
          <button class="pk-done" type="button" data-act="done">Xong</button></div>`;
    }
    const p = (e.where==='q') ? state[e.part] : state.ans;
    const isNow = (e.where==='q') && p.mode==='now';
    const mCur = (e.where==='q' && p.mode==='sharp') ? 0
               : (e.where==='q' && p.mode==='half')  ? 30 : p.m;
    return `<div class="pk-row"><span class="pk-name">Giờ</span>
        <span class="grid">${cells('h',HOURS,isNow?null:p.h,'hour')}</span></div>
      <div class="pk-row"><span class="pk-name">Phút</span>
        <span class="grid">${cells('m',MINS,isNow?null:mCur,'min')}</span></div>
      <div class="pk-row"><span class="pk-name"></span>
        <button class="nudge" type="button" data-act="nudge-m" data-v="-1">−1</button>
        <button class="nudge" type="button" data-act="nudge-m" data-v="1">+1</button>
        ${e.where==='q' ? optsHTML(e.part) : ''}
        <button class="pk-done" type="button" data-act="done">Xong</button></div>`;
  }

  function syncPicker(){
    const e = state.edit;
    elQPicker.hidden = !(e && e.where==='q');
    elAPicker.hidden = !(e && e.where==='a');
    if(e) (e.where==='q' ? elQPicker : elAPicker).innerHTML = pickerHTML();
  }

  /* --- KIỂU B: hàng phụ dưới câu --- */
  function syncAcc(){
    if(state.ui!=='B' || !state.unknown){ elQAcc.hidden = true; return; }
    // Mốc được phục vụ: cái vừa chạm, mặc định là mốc đầu tiên có trong câu
    let part = state.accPart;
    if(!part || part===state.unknown) part = (state.unknown==='from') ? 'to' : 'from';
    state.accPart = part;
    elQAcc.hidden = false;
    elQAcc.innerHTML = `<span class="acc-name">mốc “${part==='from'?'từ':'đến'}”</span>${optsHTML(part)}`;
  }

  /* --- Dựng lại giao diện --- */
  // Câu HỎI dựng lại khi CẤU TRÚC đổi (đổi chỗ hỏi / đặt nhanh / đổi kiểu nhập / mở bảng),
  // KHÔNG gọi lúc đang gõ trong ô — dựng lại là mất con trỏ.
  function syncQ(){
    chips.forEach(c => c.classList.toggle('on', c.dataset.ask===state.unknown));
    uiBtns.forEach(b => b.classList.toggle('on', b.dataset.ui===state.ui));
    elQBlock.hidden = (state.unknown===null);
    if(state.unknown) elQSay.innerHTML = qHTML();
    syncAcc();
    syncPicker();
  }
  // Câu TRẢ LỜI chỉ hiện khi câu hỏi đã đủ 2 thành phần.
  function syncA(){
    const ready = state.unknown!==null && solution()!==null;
    elABlock.hidden = !ready;
    if(ready) elASay.innerHTML = aHTML();
    if(!ready && state.edit && state.edit.where==='a'){ state.edit=null; syncPicker(); }
  }
  function syncAll(){ syncQ(); syncA(); drawMarks(); }

  function setResult(txt, cls){
    elResult.textContent = txt;
    elResult.className = 'result' + (cls?' '+cls:'');
    btnReset.hidden = !state.solved;
  }

  // Đáp án người học điền (0..719; null = chưa điền đủ)
  function readAnswer(){
    if(state.unknown==='dur') return state.ans.d;
    return (state.ans.h===null||state.ans.m===null) ? null : (state.ans.h%12)*60 + state.ans.m;
  }

  // Không có nút kiểm tra: điền đủ là chấm ngay, đúng thì chỗ đang hỏi hiện lên đồng hồ
  function autoCheck(){
    const ans = readAnswer(), sol = solution();
    if(ans===null || sol===null){
      state.solved=false; frozenNow=null;
      setResult('');
    }else if(ans===sol){
      if(!state.solved && usingNow()) frozenNow = liveNow();   // đóng băng "bây giờ" đúng lúc trả lời đúng
      state.solved=true;
      setResult('Đúng rồi.','ok');
    }else{
      state.solved=false; frozenNow=null;
      setResult('Chưa đúng, thử lại.','no');
    }
    drawMarks();
  }

  /* --- Ô nhập (kiểu B, C) --- */
  function onInput(e){
    const el = e.target;
    if(!el.classList.contains('in')) return;
    const lo = +el.min, hi = +el.max;
    let v = el.value.trim()==='' ? null : parseInt(el.value,10);
    if(v!==null){
      if(Number.isNaN(v)) v=null;
      else if(v>hi || v<lo){ v=clamp(v,lo,hi); el.value=v; }
    }
    switch(el.dataset.k){
      // Ô câu trả lời: chỉ ghi state rồi chấm, KHÔNG dựng lại câu (đang gõ trong chính ô này)
      case 'ansH':  state.ans.h=v;  autoCheck(); return;
      case 'ansM':  state.ans.m=v;  autoCheck(); return;
      case 'ansD':  state.ans.d=v;  autoCheck(); return;
      case 'fromH': state.from.h=v; break;
      case 'fromM': state.from.m=v; break;
      case 'toH':   state.to.h=v;   break;
      case 'toM':   state.to.m=v;   break;
      case 'dur':   state.dur=v;    break;
    }
    frozenNow=null;      // sửa câu hỏi -> mốc "bây giờ" chạy tiếp
    syncA(); autoCheck();
  }
  elQSay.addEventListener('input', onInput);
  elASay.addEventListener('input', onInput);

  // Kiểu B: chạm vào ô nào thì hàng phụ phục vụ mốc đó
  elQSay.addEventListener('focusin', e=>{
    const k = e.target.dataset && e.target.dataset.k;
    if(!k) return;
    const part = k.startsWith('from') ? 'from' : k.startsWith('to') ? 'to' : null;
    if(part && part!==state.accPart){ state.accPart=part; syncAcc(); }
  });

  /* --- Đặt nhanh (dùng chung cả 3 kiểu) --- */
  function setMode(part, opt){
    const p = state[part];
    p.mode = (p.mode===opt) ? 'input' : opt;
    frozenNow=null;
    syncQ(); syncA(); autoCheck();
  }
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-opt]');
    if(!b) return;
    setMode(b.dataset.part, b.dataset.opt);
  });

  /* --- KIỂU A: mở/đóng bảng chỉnh + các ô trong bảng --- */
  elPanel.addEventListener('click', e=>{
    const pill = e.target.closest('[data-pill]');
    if(pill){
      const [where, part] = pill.dataset.pill.split(':');
      const same = state.edit && state.edit.where===where && state.edit.part===part;
      state.edit = same ? null : {where, part};
      syncQ(); syncA();
      return;
    }
    const act = e.target.closest('[data-act]');
    if(!act || !state.edit) return;
    const v = +act.dataset.v;
    const e2 = state.edit;
    const isAns = e2.where==='a';
    const tgt = isAns ? state.ans : state[e2.part];

    switch(act.dataset.act){
      case 'hour':
        if(!isAns && tgt.mode==='now') tgt.mode='input';
        tgt.h = v;
        if(isAns && tgt.m===null) tgt.m = 0;
        break;
      case 'min':
        if(!isAns){ tgt.mode='input'; }
        tgt.m = v;
        break;
      case 'nudge-m':
        if(!isAns){ if(tgt.mode!=='input'){ tgt.m = MIN_OF[tgt.mode] ?? tgt.m; tgt.mode='input'; } }
        tgt.m = ((tgt.m ?? 0) + v + 60) % 60;
        break;
      case 'dur':
        if(isAns) state.ans.d = v; else state.dur = v;
        break;
      case 'nudge-d': {
        const cur = isAns ? state.ans.d : state.dur;
        const nv = clamp((cur ?? 0) + v, 0, HALF_DAY-1);
        if(isAns) state.ans.d = nv; else state.dur = nv;
        break;
      }
      case 'done':
        state.edit = null;
        break;
    }
    frozenNow=null;
    syncQ(); syncA(); autoCheck();
  });

  /* --- KIỂU C: menu ▾ --- */
  function closeMenu(){ elMenu.hidden = true; elMenu.dataset.part=''; }
  elQSay.addEventListener('click', e=>{
    const c = e.target.closest('[data-menu]');
    if(!c) return;
    const part = c.dataset.menu;
    if(!elMenu.hidden && elMenu.dataset.part===part){ closeMenu(); return; }
    const mode = state[part].mode;
    const items = [
      ...optList(part).map(([o,txt]) => [o, o==='now'?'bây giờ':o==='sharp'?'giờ đúng':'giờ rưỡi']),
      ['input','tự nhập'],
    ];
    elMenu.innerHTML = items.map(([o,txt]) =>
      `<button type="button" class="${mode===o?'on':''}" data-mi="${o}">${txt}</button>`).join('');
    elMenu.dataset.part = part;
    elMenu.hidden = false;
    const r = c.getBoundingClientRect();
    const w = elMenu.offsetWidth, h = elMenu.offsetHeight;
    elMenu.style.left = Math.min(r.left, window.innerWidth - w - 8) + 'px';
    elMenu.style.top  = (r.bottom + h + 8 > window.innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
  });
  elMenu.addEventListener('click', e=>{
    const b = e.target.closest('[data-mi]');
    if(!b) return;
    const part = elMenu.dataset.part;
    state[part].mode = b.dataset.mi;
    closeMenu();
    frozenNow=null;
    syncQ(); syncA(); autoCheck();
  });
  document.addEventListener('click', e=>{
    if(elMenu.hidden) return;
    if(e.target.closest('#menu') || e.target.closest('[data-menu]')) return;
    closeMenu();
  });
  window.addEventListener('scroll', closeMenu, true);

  /* --- Chọn chỗ cần hỏi --- */
  chips.forEach(c=>{
    c.addEventListener('click', ()=>{
      state.unknown = c.dataset.ask;
      if(state.unknown!=='dur') state[state.unknown].mode='input';   // chỗ đang hỏi thì không đặt nhanh được
      state.solved = false; frozenNow=null;
      state.ans = {h:null,m:null,d:null};
      state.edit = null; state.accPart = null;
      setResult('');
      syncAll();
    });
  });

  /* --- Xoá sạch, quay về màn chọn chỗ hỏi --- */
  btnReset.addEventListener('click', ()=>{
    state.unknown=null; state.solved=false; frozenNow=null;
    state.from={h:null,m:null,mode:'input'};
    state.to  ={h:null,m:null,mode:'input'};
    state.dur=null;
    state.ans={h:null,m:null,d:null};
    state.edit=null; state.accPart=null;
    setResult('');
    syncAll();
  });

  /* --- Đổi kiểu nhập (tạm, để thử) --- */
  uiBtns.forEach(b=>{
    b.addEventListener('click', ()=>{
      state.ui = b.dataset.ui;
      localStorage.setItem('hdh-ui', state.ui);
      state.edit=null; closeMenu();
      syncAll();
    });
  });

  /* ===== KHỞI ĐỘNG ===== */
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  document.fonts && document.fonts.ready.then(layout);
  syncAll();
  layout();
  tick();
</script>
</body>
</html>
