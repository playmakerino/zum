<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Đồng Hồ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  /* ===== BIẾN & KHUNG TRANG ===== */
  :root{
    --bg:#fdf6f0;
    --ink:#3f3a5c;
    --muted:#a99fb8;
    --line:#e9cdb6;
    --neutral:#2b2b2b;       /* đen trung tính: mép đồng hồ */
    --accent:#ff5d97;
    --c-hour:#5a63d8;        /* giờ */
    --c-min:#f5921b;         /* phút */
    --c-sec:#ff5d97;         /* giây */
    --c-dur:#1fab95;         /* khoảng "bao nhiêu phút" */
    --ok:#1fab95;
    --no:#ff5d97;
    --ghost:.30;             /* độ mờ của mốc "đến" (thời điểm sau) */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    min-height:100dvh;
    overflow-x:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:.5rem;
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* NGANG (>=768px): đồng hồ bên TRÁI, câu hỏi/câu trả lời bên PHẢI. */
  @media (min-width:768px){
    body{
      flex-direction:row;
      justify-content:center;
      align-items:center;
      gap:24px;
    }
  }

  /* ===== ANALOG: MẶT SỐ, VẠCH, KIM ===== */
  .analog{
    width:300px;height:300px;border-radius:50%;
    background:#fff;
    border:1px solid var(--neutral);  /* mép đồng hồ: đen trung tính */
    position:relative;
    margin:24px;
    flex:none;
  }
  .tick{position:absolute;left:50%;top:50%;transform-origin:0 0;}
  .tick span{
    position:absolute;
    width:1px;height:6px;
    background:var(--c-min);
    left:-0.5px;top:-118px;
  }
  .tick.major span{height:12px;width:1.5px;left:-0.75px;background:var(--c-hour);}
  .numeral{
    position:absolute;
    font-size:.95rem;font-weight:400;line-height:1;
    color:var(--c-hour);
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
  }
  .numeral.active{font-weight:700;}
  .hand{
    position:absolute;left:50%;top:50%;
    transform-origin:50% 100%;
    border-radius:99px;
    background:var(--ink);
  }
  .hour{width:5px;margin-left:-2.5px;background:var(--c-hour);}
  .minute{width:3px;margin-left:-1.5px;background:var(--c-min);}
  .second{width:1.5px;margin-left:-.75px;background:var(--c-sec);}
  .center{
    position:absolute;left:50%;top:50%;
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);transform:translate(-50%,-50%);
    z-index:10;
    box-shadow:0 0 0 4px #fff;
  }

  /* ===== MỐC TỪ / ĐẾN = VẠCH NGOÀI MÉP MẶT =====
     Kim bên trong mặt vẫn là GIỜ THẬT đang chạy. Mốc của bài tập vẽ NGOÀI mép:
     mỗi mốc 2 vạch (giờ: đậm xanh · phút: mảnh cam); mốc "đến" mờ đi để phân biệt với "từ". */
  .mark{position:absolute;left:50%;top:50%;transform-origin:0 0;z-index:8;}
  .mark span{position:absolute;display:block;border-radius:99px;}
  .mk-h span{width:4px;left:-2px;background:var(--c-hour);}
  .mk-m span{width:2.5px;left:-1.25px;background:var(--c-min);}
  .mark.ghost{opacity:var(--ghost);}
  .mark.off{display:none;}          /* thành phần chưa biết -> không vẽ (không lộ đáp án) */
  /* Cung KHOẢNG PHÚT: chỉ hiện khi đã biết CẢ hai mốc từ/đến */
  .r-span{fill:none;stroke:var(--c-dur);stroke-width:3.2px;stroke-linecap:butt;}
  .r-span.off{display:none;}

  /* ===== CỘT CÂU HỎI / CÂU TRẢ LỜI ===== */
  .panel{
    width:min(460px,100%);
    display:flex;flex-direction:column;align-items:flex-start;
    gap:.5rem;
    padding:.4rem .3rem 1.2rem;
  }
  .lbl{
    font-size:.78rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);
    margin-top:.5rem;
  }
  .lbl:first-child{margin-top:0;}
  /* MỘT CÂU liền mạch: giá trị nằm ngay trong câu, không tách dòng, không dấu hai chấm */
  .say{
    font-size:1.1rem;font-weight:400;line-height:2.2;
  }
  .say .v-h{color:var(--c-hour);font-weight:700;}
  .say .v-m{color:var(--c-min);font-weight:700;}
  .say .v-d{color:var(--c-dur);font-weight:700;}
  .say .q{color:var(--accent);font-weight:700;}
  .say .todo{color:var(--muted);}

  /* Ô nhập nằm TRONG câu: gạch chân, không khung */
  .in{
    width:2.7rem;height:1.9rem;
    border:none;border-bottom:2px solid var(--line);
    border-radius:0;background:transparent;
    font-family:inherit;font-size:1.1rem;font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:center;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  .in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .in:focus{outline:none;border-bottom-color:var(--accent);}
  .in.h{color:var(--c-hour);border-bottom-color:var(--c-hour);}
  .in.m{color:var(--c-min);border-bottom-color:var(--c-min);}
  .in.d{color:var(--c-dur);border-bottom-color:var(--c-dur);}
  .in:disabled{opacity:.45;border-bottom-style:dotted;}

  /* Chọn thành phần nào bị hỏi */
  .pick{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);}
  .chip{
    padding:.28rem .7rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:.85rem;
    cursor:pointer;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip:disabled{cursor:default;opacity:.5;}

  .btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem;}
  .btn{
    min-height:2.3rem;padding:0 .9rem;
    border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--ink);
    font-family:inherit;font-size:.9rem;font-weight:500;
    cursor:pointer;
  }
  .btn.primary{background:var(--c-hour);border-color:var(--c-hour);color:#fff;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn[hidden]{display:none;}

  .result{font-size:.95rem;font-weight:500;min-height:1.3em;}
  .result.ok{color:var(--ok);}
  .result.no{color:var(--no);}

</style>
</head>
<body>
  <div class="analog" id="analog">
    <!-- Cung khoảng phút (chỉ vẽ khi biết cả hai mốc) -->
    <svg style="position:absolute;left:50%;top:50%;overflow:visible;pointer-events:none;z-index:9;">
      <path id="spanArc" class="r-span off"></path>
    </svg>
    <!-- Kim GIỜ THẬT chạy liên tục. Vạch mốc từ/đến dựng bằng JS ở phần 2. -->
    <div class="hand hour"   id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center"></div>
  </div>

  <div class="panel">
    <div class="lbl">Câu hỏi</div>
    <div class="pick">
      <span>Hỏi</span>
      <button class="chip" type="button" data-ask="from">từ mấy giờ mấy phút</button>
      <button class="chip" type="button" data-ask="to">đến mấy giờ mấy phút</button>
      <button class="chip" type="button" data-ask="dur">bao nhiêu phút</button>
    </div>
    <div class="say" id="qSay"></div>
    <div class="btns">
      <button class="btn primary" id="btnAsk" type="button">Tạo câu hỏi</button>
      <button class="btn" id="btnEdit" type="button" hidden>Sửa câu hỏi</button>
    </div>

    <div class="lbl">Câu trả lời</div>
    <div class="say" id="aSay"></div>
    <div class="btns">
      <button class="btn primary" id="btnCheck" type="button">Kiểm tra</button>
    </div>
    <div class="result" id="result"></div>
  </div>

<script>
  /* ============================================================
     HỌC ĐỒNG HỒ — script chia 6 phần:
       1. Tiện ích & tham chiếu DOM      4. Mốc từ/đến + cung khoảng phút
       2. Mặt số: vạch, chữ số, vạch mốc 5. Vòng lặp mỗi frame — tick()
       3. Bố cục tự co (layout)          6. Câu hỏi / câu trả lời
     ============================================================ */

  /* ===== 1. TIỆN ÍCH & THAM CHIẾU DOM ===== */
  const $ = id => document.getElementById(id);
  const analog = $('analog');
  const elHour=$('hour'), elMin=$('minute'), elSec=$('second');
  const elArc=$('spanArc');

  const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));

  // TỌA ĐỘ CỰC quanh tâm mặt: deg đo TỪ 12 GIỜ, theo chiều kim. Trả [dx,dy] px so với tâm.
  function polar(r, deg){
    const a=(deg-90)*Math.PI/180;
    return [r*Math.cos(a), r*Math.sin(a)];
  }

  /* ===== 2. MẶT SỐ: VẠCH CHIA + CHỮ SỐ + VẠCH MỐC ===== */
  const tickSpans=[];
  for(let i=0;i<60;i++){
    const t=document.createElement('div');
    t.className='tick'+(i%5===0?' major':'');
    t.style.transform=`rotate(${i*6}deg)`;
    const sp=document.createElement('span');
    t.appendChild(sp);
    tickSpans.push(sp);
    analog.appendChild(t);
  }
  const numerals=[];
  for(let n=1;n<=12;n++){
    const el=document.createElement('div');
    el.className='numeral';
    el.dataset.n=n;
    el.textContent=n;
    numerals.push(el);
    analog.appendChild(el);
  }

  // 4 vạch mốc NGOÀI mép mặt: mốc "từ" (đặc) và mốc "đến" (mờ), mỗi mốc một vạch giờ + một vạch phút
  function buildMark(cls){
    const d=document.createElement('div');
    d.className='mark '+cls;
    d.appendChild(document.createElement('span'));
    analog.appendChild(d);
    return d;
  }
  const mark = {
    fromH: buildMark('mk-h'),       fromM: buildMark('mk-m'),
    toH:   buildMark('mk-h ghost'), toM:   buildMark('mk-m ghost'),
  };
  const markSpans = Object.values(mark).map(d => d.firstChild);

  /* ===== 3. BỐ CỤC TỰ CO (layout) ===== */
  const EDGE = 12;         // lề tối thiểu tới cạnh màn hình
  const MARGIN = 24;       // lề quanh mặt (chừa chỗ cho vạch mốc + cung khoảng phút)
  const FACE_MIN = 50;     // SÀN CỨNG bán kính mặt: viewport hẹp cỡ nào cũng KHÔNG co về 0
  const MK_IN = 3, MK_OUT = 13;   // vạch mốc nằm trong dải bán kính [FACE+MK_IN, FACE+MK_OUT]
  let FACE = 150;
  let ARC_R = 0;
  let baseFace = 0;        // FACE đo được lúc KHÔNG phóng to — mốc để KHÓA khi zoom in

  // Chiều cao vùng nhìn thấy THẬT (đã trừ thanh công cụ Safari)
  const viewportH = () => (window.visualViewport && window.visualViewport.height)
        || document.documentElement.clientHeight || window.innerHeight;

  // ===== NHẬN BIẾT PHÓNG TO (zoom) =====
  // Zoom làm viewport tính theo CSS px HẸP LẠI -> tính lại bố cục theo viewport mới thì mặt
  // co đúng bằng phần vừa phóng to (nhìn như "co rúm"). Bắt được zoom thì KHÓA kích thước
  // mặt ở mức 100%, để trình duyệt tự phóng to đều toàn trang.
  //   - zoom trang -> đổi devicePixelRatio | pinch-zoom -> đổi visualViewport.scale
  const dprBase = window.devicePixelRatio || 1;
  function zoomFactor(){
    const byDpr   = (window.devicePixelRatio || 1) / dprBase;
    const byPinch = (window.visualViewport && window.visualViewport.scale) || 1;
    return Math.max(byDpr, byPinch);
  }

  const mqDesktop = window.matchMedia('(min-width:768px)');
  const elPanel = document.querySelector('.panel');

  function layout(){
    const desktop = mqDesktop.matches;
    const zoomed  = zoomFactor() > 1.01;
    const vh = viewportH();

    let faceByW;
    if(desktop){
      // NGANG: đồng hồ | cột câu hỏi -> vừa khít cả bề rộng lẫn chiều cao
      const panelW = elPanel.offsetWidth || 460;
      const GAP = 24;
      const availW = Math.min(window.innerWidth, 1600) - EDGE*2;
      faceByW = (availW - panelW - GAP - 2*MARGIN) / 2;
      const faceByH = (vh - 2*EDGE - 2*MARGIN) / 2;
      FACE = Math.min(faceByW, faceByH);
    } else {
      // DỌC: đồng hồ chỉ co theo BỀ RỘNG, nội dung dài hơn màn thì cuộn
      const halfW = (Math.min(window.innerWidth, 900) / 2) - EDGE;
      faceByW = halfW - MARGIN;
      FACE = faceByW;
    }
    FACE = Math.max(FACE, Math.min(150, faceByW));
    FACE = Math.max(FACE, FACE_MIN);
    if(zoomed && baseFace > 0) FACE = baseFace;
    else baseFace = FACE;

    const D = FACE*2;
    analog.style.width  = D+'px';
    analog.style.height = D+'px';
    ARC_R = FACE + MK_OUT + 5;   // cung khoảng phút: ngoài vạch mốc

    layoutFace();
    drawMarks();

    // Phóng to -> mặt đã KHÓA kích thước nên nội dung có thể tràn: mở cuộn ra cho xem hết
    document.documentElement.style.overflow = zoomed ? 'auto' : '';
  }

  // Đặt lại vạch chia, chữ số, vạch mốc và chiều dài kim theo FACE hiện tại
  function layoutFace(){
    const G_RIM = 5;      // mép -> đầu vạch
    const G_NUM = 2;      // đuôi vạch -> chữ số
    const majorLen = 8, minorLen = 4;
    const tickOuter = FACE - G_RIM;
    const tickInner = tickOuter - majorLen;

    tickSpans.forEach((sp,i)=>{
      const len = (i%5===0) ? majorLen : minorLen;
      sp.style.top=(-tickOuter)+'px';
      sp.style.height=len+'px';
    });

    // Bán kính RIÊNG cho từng số: mép ngoài mỗi số cách đuôi vạch đúng G_NUM
    numerals.forEach(el=>{
      const n=+el.dataset.n;
      const [ux,uy]=polar(1, n*30);
      const rg=document.createRange(); rg.selectNodeContents(el);
      const r=rg.getBoundingClientRect();
      const halfReach=Math.abs(ux)*r.width/2 + Math.abs(uy)*r.height/2;
      const radius=(tickInner - G_NUM) - halfReach;
      el.style.left=`calc(50% + ${ux*radius}px)`;
      el.style.top=`calc(50% + ${uy*radius}px)`;
    });

    // Vạch mốc: đầu XA TÂM ở FACE+MK_OUT, dài (MK_OUT - MK_IN)
    markSpans.forEach(sp=>{
      sp.style.top    = (-(FACE + MK_OUT)) + 'px';
      sp.style.height = (MK_OUT - MK_IN) + 'px';
    });

    // Kim ngắn hơn vòng số để không đè lên số
    const hh=FACE*0.34, mh=FACE*0.55, sh=FACE*0.62;
    elHour.style.height=hh+'px'; elHour.style.marginTop=(-hh)+'px';
    elMin.style.height=mh+'px';  elMin.style.marginTop=(-mh)+'px';
    elSec.style.height=sh+'px';  elSec.style.marginTop=(-sh)+'px';
  }

  /* ===== 4. MỐC TỪ/ĐẾN + CUNG KHOẢNG PHÚT ===== */
  // Cung tròn từ startDeg đến endDeg (đo từ 12h)
  function arcPath(r, startDeg, endDeg){
    const sweep = endDeg - startDeg;
    if(sweep <= 0) return '';
    if(sweep >= 359.99){   // >= 1 giờ: vẽ TRỌN vòng bằng 2 nửa cung (một cung 360° là rỗng)
      const [x0,y0]=polar(r,0), [x1,y1]=polar(r,180);
      return `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1} A ${r} ${r} 0 0 1 ${x0} ${y0}`;
    }
    const [x0,y0]=polar(r,startDeg), [x1,y1]=polar(r,endDeg);
    return `M ${x0} ${y0} A ${r} ${r} 0 ${sweep>180?1:0} 1 ${x1} ${y1}`;
  }

  // Đặt cặp vạch (giờ + phút) của một mốc theo số phút trong ngày; null -> ẩn
  function setMark(mH, mM, mins){
    const off = (mins === null);
    mH.classList.toggle('off', off);
    mM.classList.toggle('off', off);
    if(off) return;
    mH.style.transform=`rotate(${((mins/60)%12)*30}deg)`;   // vạch giờ nhích dần theo phút
    mM.style.transform=`rotate(${(mins%60)*6}deg)`;
  }

  // Vẽ lại mốc + cung từ những gì ĐANG ĐƯỢC BIẾT (không lộ thành phần đang hỏi)
  function drawMarks(){
    const k = knownNow();          // {from, to, dur} — chưa biết = null

    setMark(mark.fromH, mark.fromM, k.from);
    setMark(mark.toH,   mark.toM,   k.to);

    // Cung chỉ vẽ khi biết CẢ hai mốc (biết "từ" + số phút mà vẽ cung là lộ mốc "đến")
    const showArc = (k.from !== null && k.to !== null);
    elArc.classList.toggle('off', !showArc);
    if(showArc){
      const dur = (k.to - k.from + 1440) % 1440;
      const startDeg = (k.from % 60) * 6;
      const sweep = dur <= 60 ? dur*6 : 360;      // hơn 1 giờ -> trọn vòng
      elArc.setAttribute('d', arcPath(ARC_R, startDeg, startDeg + sweep));
    }
  }

  /* ===== 5. VÒNG LẶP MỖI FRAME — tick() ===== */
  let lastSec = -1;
  function tick(){
    const now=new Date();
    const h=now.getHours(), s=now.getSeconds();

    // Kim: góc tăng liên tục, cập nhật MỖI FRAME cho mượt
    const totalSec = now.getTime()/1000 - now.getTimezoneOffset()*60;
    elSec.style.transform  = `rotate(${totalSec*6}deg)`;
    elMin.style.transform  = `rotate(${(totalSec/60)*6}deg)`;
    elHour.style.transform = `rotate(${(totalSec/3600)*30}deg)`;

    // Tô đậm số giờ hiện tại trên mặt (1-12; giờ 0/12 -> số 12)
    if(s!==lastSec){
      lastSec=s;
      const hourNum = (h%12)===0 ? 12 : (h%12);
      numerals.forEach(el => el.classList.toggle('active', +el.dataset.n===hourNum));
    }
    requestAnimationFrame(tick);
  }

  /* ===== 6. CÂU HỎI / CÂU TRẢ LỜI ===== */
  // MỘT nguồn trạng thái (ô nhập dựng lại từ đây nên không giữ giá trị trong DOM).
  //   unknown : thành phần bị hỏi ở câu hỏi = thành phần phải điền ở câu trả lời
  //   asked   : đã chốt câu hỏi (khóa ô nhập câu hỏi)
  //   solved  : đã biết đáp án (trả lời đúng hoặc bấm "Chỉ đáp án") -> mới vẽ lên đồng hồ
  const state = {
    unknown:'dur', asked:false, solved:false,
    from:{h:null, m:null}, to:{h:null, m:null}, dur:null,
    ans:{h:null, m:null, d:null},
  };

  const elQSay=$('qSay'), elASay=$('aSay'), elResult=$('result');
  const btnAsk=$('btnAsk'), btnEdit=$('btnEdit'), btnCheck=$('btnCheck');
  const chips=[...document.querySelectorAll('.chip')];

  // Giá trị 2 thành phần ĐÃ CHO (phút trong ngày; null = chưa điền đủ)
  const givenFrom = () => (state.from.h===null||state.from.m===null) ? null : state.from.h*60+state.from.m;
  const givenTo   = () => (state.to.h===null  ||state.to.m===null)   ? null : state.to.h*60+state.to.m;
  const givenDur  = () => state.dur;

  // Đáp án đúng của thành phần đang hỏi (null nếu 2 thành phần đã cho chưa đủ)
  function solution(){
    const f=givenFrom(), t=givenTo(), d=givenDur();
    if(state.unknown==='dur')  return (f===null||t===null) ? null : (t - f + 1440) % 1440;
    if(state.unknown==='to')   return (f===null||d===null) ? null : (f + d) % 1440;
    return (t===null||d===null) ? null : (t - d + 2880) % 1440;   // unknown==='from'
  }

  // Những gì ĐANG ĐƯỢC BIẾT để vẽ đồng hồ: 2 thành phần đã cho, cộng đáp án nếu đã lộ
  function knownNow(){
    const out = { from:givenFrom(), to:givenTo(), dur:givenDur() };
    out[state.unknown] = state.solved ? solution() : null;
    return out;
  }

  // --- Mảnh câu: ô nhập / giá trị / chỗ trống ---
  const inp = (k, cls, val, max, dis) =>
    `<input class="in ${cls}" data-k="${k}" type="number" inputmode="numeric" min="0" max="${max}"` +
    ` value="${val===null?'':val}"${dis?' disabled':''}>`;

  const val = (cls, v) => v===null ? '<span class="todo">…</span>' : `<span class="${cls}">${v}</span>`;

  // "7 giờ 15 phút" — ô nhập (câu hỏi) hoặc chữ (câu trả lời)
  const timeIn  = (part,dis) => `${inp(part+'H','h',state[part].h,23,dis)} giờ ${inp(part+'M','m',state[part].m,59,dis)} phút`;
  const timeTxt = part => `${val('v-h',state[part].h)} giờ ${val('v-m',state[part].m)} phút`;
  const durIn   = dis => `${inp('dur','d',state.dur,1439,dis)} phút`;
  const durTxt  = () => `${val('v-d',state.dur)} phút`;
  const ansTime = dis => `${inp('ansH','h',state.ans.h,23,dis)} giờ ${inp('ansM','m',state.ans.m,59,dis)} phút`;
  const ansDur  = dis => `${inp('ansD','d',state.ans.d,1439,dis)} phút`;

  // MỘT câu liền mạch cho câu hỏi (thành phần bị hỏi in màu hồng)
  function qHTML(){
    const dis = state.asked;
    if(state.unknown==='dur')
      return `Từ ${timeIn('from',dis)} đến ${timeIn('to',dis)} là còn <span class="q">bao nhiêu phút</span>?`;
    if(state.unknown==='to')
      return `Từ ${timeIn('from',dis)} sau ${durIn(dis)} nữa là <span class="q">mấy giờ mấy phút</span>?`;
    return `Đến ${timeIn('to',dis)} thì đã qua ${durIn(dis)}, vậy bắt đầu từ <span class="q">mấy giờ mấy phút</span>?`;
  }

  // MỘT câu liền mạch cho câu trả lời (chỗ bị hỏi là ô để điền)
  function aHTML(){
    const dis = !state.asked;
    if(state.unknown==='dur')
      return `Từ ${timeTxt('from')} đến ${timeTxt('to')} là còn ${ansDur(dis)}.`;
    if(state.unknown==='to')
      return `Từ ${timeTxt('from')} sau ${durTxt()} nữa là ${ansTime(dis)}.`;
    return `Đến ${timeTxt('to')} thì đã qua ${durTxt()}, vậy bắt đầu từ ${ansTime(dis)}.`;
  }

  // Dựng lại câu HỎI: chỉ gọi khi CẤU TRÚC đổi (đổi chỗ hỏi / khóa-mở / bốc ngẫu nhiên),
  // KHÔNG gọi lúc đang gõ — dựng lại là mất con trỏ trong ô.
  function syncQ(){
    elQSay.innerHTML = qHTML();
    chips.forEach(c=>{
      c.classList.toggle('on', c.dataset.ask===state.unknown);
      c.disabled = state.asked;
    });
    syncBtns();
  }
  // Dựng lại câu TRẢ LỜI: gọi cả khi đang gõ ở câu hỏi (con trỏ không nằm trong câu này).
  function syncA(){
    elASay.innerHTML = aHTML();
    syncBtns();
  }
  function syncBtns(){
    const ready = solution()!==null;
    btnAsk.disabled = !ready || state.asked;
    btnAsk.hidden   = state.asked;
    btnEdit.hidden  = !state.asked;
    btnCheck.disabled = !state.asked || state.solved;
  }
  function syncAll(){ syncQ(); syncA(); drawMarks(); }

  // Đọc số từ ô nhập -> state (rỗng = null để câu vẫn hiện dấu … thay vì số cũ)
  function onInput(e){
    const el = e.target;
    if(!el.classList.contains('in')) return;
    const k = el.dataset.k;
    const max = +el.max;
    let v = el.value.trim()==='' ? null : parseInt(el.value,10);
    if(v!==null){
      if(Number.isNaN(v)) v=null;
      else if(v>max){ v=clamp(v,0,max); el.value=v; }
      else if(v<0){ v=0; el.value=0; }
    }
    switch(k){
      case 'fromH': state.from.h=v; break;
      case 'fromM': state.from.m=v; break;
      case 'toH':   state.to.h=v;   break;
      case 'toM':   state.to.m=v;   break;
      case 'dur':   state.dur=v;    break;
      // Ô câu trả lời: chỉ ghi state, KHÔNG dựng lại câu (đang gõ trong chính ô này)
      case 'ansH':  state.ans.h=v;  return;
      case 'ansM':  state.ans.m=v;  return;
      case 'ansD':  state.ans.d=v;  return;
    }
    syncA(); drawMarks();
  }
  elQSay.addEventListener('input', onInput);
  elASay.addEventListener('input', onInput);

  // Đáp án người học điền (phút; null = chưa điền đủ)
  function readAnswer(){
    if(state.unknown==='dur') return state.ans.d;
    return (state.ans.h===null||state.ans.m===null) ? null : state.ans.h*60+state.ans.m;
  }

  // Điền đáp án đúng vào câu trả lời rồi cho hiện lên đồng hồ
  function reveal(){
    const s = solution();
    if(s===null) return;
    if(state.unknown==='dur') state.ans.d = s;
    else { state.ans.h = Math.floor(s/60); state.ans.m = s%60; }
    state.solved = true;
    syncA(); drawMarks();
  }

  const clearResult = () => { elResult.textContent=''; elResult.className='result'; };

  // --- Sự kiện ---
  chips.forEach(c=>{
    c.addEventListener('click', ()=>{
      if(state.asked) return;
      state.unknown = c.dataset.ask;
      state.solved = false;
      state.ans = {h:null,m:null,d:null};
      clearResult();
      syncAll();
    });
  });

  btnAsk.addEventListener('click', ()=>{
    if(solution()===null) return;
    state.asked = true; state.solved = false;
    state.ans = {h:null,m:null,d:null};     // xoá đáp án cũ để người học tự điền
    clearResult();
    syncAll();
    elASay.querySelector('.in')?.focus();
  });

  btnEdit.addEventListener('click', ()=>{
    state.asked=false; state.solved=false;
    clearResult();
    syncAll();
  });

  btnCheck.addEventListener('click', ()=>{
    const ans = readAnswer(), sol = solution();
    if(ans===null || sol===null){
      elResult.textContent='Chưa điền đủ.'; elResult.className='result no';
      return;
    }
    if(ans===sol){
      elResult.textContent='Đúng rồi.'; elResult.className='result ok';
      reveal();
    }else{
      elResult.textContent='Chưa đúng, thử lại.'; elResult.className='result no';
    }
  });

  /* ===== KHỞI ĐỘNG ===== */
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  document.fonts && document.fonts.ready.then(layout);
  syncAll();
  layout();
  tick();
</script>
</body>
</html>
