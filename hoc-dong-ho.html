<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Đồng Hồ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
  /* ===== BIẾN & KHUNG TRANG =====
     BA MÀU CỦA ĐỒNG HỒ dùng thống nhất cả trên mặt số lẫn trong câu chữ:
       xanh = GIỜ · cam = PHÚT · hồng = GIÂY (và mọi thứ chạy theo giờ thật: "bây giờ")
     Xanh ngọc chỉ dành cho KHOẢNG (bao nhiêu phút) — khái niệm thứ tư, không phải kim nào. */
  :root{
    --bg:#fdf6f0;
    --card:#fff;
    --ink:#3f3a5c;
    --muted:#a99fb8;
    --line:#e9cdb6;
    --neutral:#2b2b2b;       /* đen trung tính: mép đồng hồ */
    --c-hour:#5a63d8;        /* giờ */
    --c-min:#f5921b;         /* phút */
    --c-sec:#ff5d97;         /* giây + "bây giờ" + chỗ đang hỏi */
    --c-dur:#1fab95;         /* khoảng "bao nhiêu phút" */
    --c-star:#f9c22e;        /* sao thưởng — vàng, đứng ngoài hệ màu của kim */
    --ok:#1fab95;
    --badge-dia:26px;        /* đường kính nhãn giờ/phút quay quanh mặt (JS đọc để tính bố cục) */

    /* Spacing: một thang chung, co theo bề rộng màn (mobile nhỏ lại, desktop nở ra) */
    --sp-1:clamp(.25rem,1vw,.4rem);
    --sp-2:clamp(.4rem,1.6vw,.6rem);
    --sp-3:clamp(.6rem,2.4vw,.9rem);
    --sp-4:clamp(.9rem,3.6vw,1.4rem);
    --fs-say:clamp(1rem,4.2vw,1.12rem);
    --fs-chip:clamp(.8rem,3.4vw,.88rem);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    min-height:100dvh;
    overflow-x:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:var(--sp-3);
    padding:var(--sp-2);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* NGANG (>=768px): đồng hồ bên TRÁI, câu hỏi/câu trả lời bên PHẢI. */
  @media (min-width:768px){
    body{
      flex-direction:row;
      justify-content:center;
      align-items:center;
      gap:24px;
    }
  }

  /* ===== KHUNG CHỨA ĐỒNG HỒ + TAB ĐỔI KIỂU =====
     .stage đứng đúng chỗ .analog đứng trước đây trong flex của body (dọc: trên; ngang: trái),
     nên bố cục cũ không đổi; nó chỉ ôm cả hai kiểu đồng hồ. */
  /* Tab ĐỨNG YÊN một chỗ: .stage co theo nội dung, mà mặt kim với khối số rộng/cao khác nhau
     -> đổi tab là hộp đổi kích thước, kéo tab chạy theo. Nên layout() khoá cứng width và
     min-height của .stage theo mặt kim; khối số nằm gọn bên trong, tab không nhúc nhích. */
  .stage{display:flex;flex-direction:column;align-items:center;flex:none;}
  .tabs{display:flex;gap:var(--sp-2);}
  /* Tab là nút GIAO DIỆN -> dùng màu giao diện (--c-sec), giống chip chọn câu hỏi */
  .tab{
    min-height:2.2rem;padding:.3rem .9rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--muted);
    display:flex;align-items:center;
    cursor:pointer;
  }
  .tab.on{background:var(--c-sec);border-color:var(--c-sec);color:#fff;}
  /* Icon ăn theo color của nút -> chỉ cần đổi color là cả nét lẫn dấu hai chấm đổi theo */
  .tico{width:1.3rem;height:1.3rem;display:block;fill:none;stroke:currentColor;
        stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tico .dot{fill:currentColor;stroke:none;}

  /* ===== ANALOG: MẶT SỐ, VẠCH, KIM =====
     Kích thước ở đây chỉ là giá trị ban đầu cho lần vẽ đầu; layout() trong JS ghi đè ngay. */
  .analog{
    width:300px;height:300px;border-radius:50%;
    background:#fff;
    border:1px solid var(--neutral);  /* mép đồng hồ: đen trung tính */
    position:relative;
    margin:24px;                      /* = hằng MARGIN trong JS (chỗ cho vạch mốc + cung) */
    flex:none;
  }
  .tick{position:absolute;left:50%;top:50%;transform-origin:0 0;}
  .tick span{
    position:absolute;
    width:1px;height:6px;
    background:var(--c-min);          /* vạch phút: màu PHÚT */
    left:-0.5px;top:-118px;
  }
  .tick.major span{height:12px;width:1.5px;left:-0.75px;background:var(--c-hour);}   /* vạch giờ: màu GIỜ */
  .numeral{
    position:absolute;
    font-size:.95rem;font-weight:400;line-height:1;
    color:var(--c-hour);
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
  }
  .numeral.active{font-weight:700;}
  .hand{
    position:absolute;left:50%;top:50%;
    transform-origin:50% 100%;
    border-radius:99px;
  }
  .hour{width:5px;margin-left:-2.5px;background:var(--c-hour);}
  .minute{width:3px;margin-left:-1.5px;background:var(--c-min);}
  .second{width:1.5px;margin-left:-.75px;background:var(--c-sec);}
  .center{
    position:absolute;left:50%;top:50%;
    width:9px;height:9px;border-radius:50%;
    background:var(--c-sec);transform:translate(-50%,-50%);
    z-index:10;
    box-shadow:0 0 0 4px #fff;
  }

  /* ===== NHÃN GIỜ / PHÚT HIỆN TẠI QUAY QUANH MẶT (như dong-ho.html) =====
     Mỗi nhãn = một nét nối mảnh từ mép mặt ra một hình tròn mang CON SỐ. Nhãn nằm trong
     .orbit xoay theo kim, còn bản thân nhãn được đối-xoay lại để số luôn đứng thẳng.
     .orbit cũng dùng làm khung xoay cho hai chữ "từ"/"đến" ở dưới. */
  .orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:9;}
  .connector{
    position:absolute;left:50%;
    width:1.5px;margin-left:-.75px;
    transform-origin:center;
  }
  .badge{
    position:absolute;left:50%;top:0;
    transform:translate(-50%,-50%);
    /* HÌNH TRÒN đều: offsetHeight/2 = bán kính ở MỌI hướng -> nét nối chạm đúng viền */
    width:var(--badge-dia);height:var(--badge-dia);
    border-radius:50%;
    font-size:.72rem;font-weight:500;
    font-variant-numeric:tabular-nums;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  #connH,#badgeH{background:var(--c-hour);}
  #connM,#badgeM{background:var(--c-min);}

  /* ===== CHỮ "TỪ" / "ĐẾN" TRÊN MẶT — CẦU NỐI GIỮA CÂU VÀ MẶT ĐỒNG HỒ =====
     Không bịa ký hiệu mới (chấm/mũi tên/số đều phải học mới hiểu): chép thẳng HAI CHỮ đã có
     trong câu ra cạnh hai mốc, đặt NGOÀI cung (không đè lên cung, không cần nền che).
     Màu trung tính, không đụng hệ màu kim. */
  .cue-lab{
    position:absolute;left:50%;top:0;
    transform:translate(-50%,-50%);
    color:var(--ink);
    font-size:.62rem;font-weight:500;line-height:1.4;
    white-space:nowrap;
  }

  /* ===== MỐC TỪ / ĐẾN = VẠCH NGOÀI MÉP MẶT =====
     Kim bên trong mặt vẫn là GIỜ THẬT đang chạy. Mốc của bài tập vẽ NGOÀI mép:
     mỗi mốc 2 vạch (giờ: đậm xanh · phút: mảnh cam). Hai mốc phân biệt nhau bằng CHỮ
     "từ"/"đến" ở trên, nên vạch của hai mốc vẽ y hệt nhau. */
  .mark{position:absolute;left:50%;top:50%;transform-origin:0 0;z-index:8;}
  .mark span{position:absolute;display:block;border-radius:99px;}
  .mk-h span{width:4px;left:-2px;background:var(--c-hour);}
  .mk-m span{width:2.5px;left:-1.25px;background:var(--c-min);}
  /* Cung KHOẢNG PHÚT: chỉ hiện khi đã biết CẢ hai mốc từ/đến */
  .r-span{fill:none;stroke:var(--c-dur);stroke-width:3.2px;stroke-linecap:butt;}

  /* ===== DIGITAL: TỪ (trên) · BÀN TAY (giữa) · ĐẾN (dưới) =====
     Đọc từ trên xuống đúng thứ tự thời gian. Ở giữa là hai bàn tay đang nắm; trả lời đúng
     thì mỗi PHÚT giơ một ngón, trên ngón ghi mốc giờ:phút mà ngón đó đếm tới.
     Quá 10 phút thì mượn thêm hai bàn chân (tổng 20 ngón); quá 20 thì báo không đủ ngón. */
  .digital{
    width:min(340px,100%);          /* .stage đã có bề rộng cứng nên % quy ra px được */
    margin:var(--sp-2) 0 var(--sp-4);
    display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  }
  .dnow{font-size:var(--fs-chip);color:var(--c-sec);display:flex;align-items:baseline;gap:.4rem;}
  .dwork{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);width:100%;}
  .drow{display:flex;align-items:baseline;gap:.5rem;}
  .dlab{font-size:var(--fs-say);color:var(--ink);}
  .dtime{
    font-size:clamp(1.4rem,7vw,1.9rem);font-weight:700;line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .dnow .dtime{font-size:var(--fs-say);}
  .dtime .v-h{color:var(--c-hour);}
  .dtime .v-m{color:var(--c-min);}
  .dtime .v-s{color:var(--c-sec);}   /* giây — cùng màu kim giây bên mặt kim */
  .dtime .sep{color:var(--muted);}
  .dtime .todo{color:var(--muted);font-weight:400;}
  /* Lời báo câu hỏi vượt tầm đếm — nằm trong cột câu hỏi, cùng cỡ/màu với dòng chấm bài */
  .warn{font-size:var(--fs-chip);font-weight:500;color:var(--c-sec);}

  /* Hình bàn tay lấy từ bộ icon rời (6 trạng thái 0-5 ngón), <use> lại từ sprite đầu trang.
     Nhãn giờ:phút đặt NGAY TRÊN đầu ngón, dựng đứng — không đè lên da tay (chữ cam trên nền
     da gần như không đọc được), và dựng đứng thì hai ngón cạnh nhau không chạm nhãn nhau. */
  /* Kho hình: giấu bằng kích thước 0 chứ không display:none — cách này là pattern sprite
     chuẩn, chắc chắn <use> vẫn lấy được symbol trên mọi trình duyệt. */
  .sprite{position:absolute;width:0;height:0;overflow:hidden;}
  .limbs{width:100%;height:auto;display:block;}
  .limbs text{
    font-family:inherit;font-size:26px;font-weight:700;
    text-anchor:middle;dominant-baseline:central;
    /* viền cùng màu nền: ngón cái nằm thấp nên nhãn của nó có thể chạm hình, vẫn đọc được */
    paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;
  }
  .limbs .lh{fill:var(--c-hour);}
  .limbs .lm{fill:var(--c-min);}
  .limbs .ls{fill:var(--muted);}

  /* ===== CỘT CÂU HỎI / CÂU TRẢ LỜI ===== */
  .panel{
    width:min(460px,100%);
    display:flex;flex-direction:column;align-items:stretch;
    gap:var(--sp-3);
    padding:0 var(--sp-1) var(--sp-4);
  }
  .lbl{
    font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);
  }
  /* MỘT CÂU liền mạch: giá trị nằm ngay trong câu, không tách dòng, không dấu hai chấm */
  .say{
    font-size:var(--fs-say);font-weight:400;
    line-height:2.4;
    word-spacing:.06em;
  }
  /* Màu theo vai trò: v-* là CON SỐ (in đậm), w-* là CHỮ đơn vị (nét thường).
     Chữ "phút" LUÔN màu phút, kể cả khi đo khoảng — xanh ngọc chỉ dành cho CON SỐ khoảng
     và cung trên mặt, vì đó mới là thứ "khoảng"; còn đơn vị thì vẫn là phút. */
  .say .v-h,.say .w-h{color:var(--c-hour);}                    /* số giờ · chữ "giờ" */
  .say .v-m,.say .w-m{color:var(--c-min);}                     /* số phút · chữ "phút"/"đúng"/"rưỡi" */
  .say .v-d{color:var(--c-dur);}                               /* số của khoảng */
  .say .v-now{color:var(--c-sec);}                             /* "bây giờ" */
  .say .v-h,.say .v-m,.say .v-d,.say .v-now{font-weight:700;}
  .say .todo{color:var(--muted);}
  /* Khối câu hỏi / câu trả lời: chỉ hiện sau khi đã chọn chỗ cần hỏi */
  .block{display:flex;flex-direction:column;gap:var(--sp-2);}

  /* Ô nhập nằm TRONG câu: gạch chân, không khung */
  .in{
    width:2.9rem;height:2.1rem;
    border:none;border-bottom:2px solid var(--line);
    border-radius:0;background:transparent;
    font-family:inherit;font-size:var(--fs-say);font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:center;
    color:var(--ink);
    margin:0 .12rem;
    -moz-appearance:textfield;
  }
  .in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .in:focus{outline:none;border-bottom-color:var(--c-sec);}
  .in.h{color:var(--c-hour);border-bottom-color:var(--c-hour);}
  .in.m{color:var(--c-min);border-bottom-color:var(--c-min);}
  .in.d{color:var(--c-dur);border-bottom-color:var(--c-dur);}

  /* Chọn thành phần nào bị hỏi */
  .pick{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
  .chip{
    min-height:2.2rem;padding:.3rem .8rem;
    border:1px solid var(--line);border-radius:99px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:var(--fs-chip);
    cursor:pointer;
  }
  .chip.on{background:var(--c-sec);border-color:var(--c-sec);color:#fff;}

  /* ===== CÁCH ĐẶT MỐC: nút ▾ trong câu, mở menu nổi =====
     Một nút nhỏ cho mỗi mốc thay vì cụm 3 nút chen giữa câu -> câu ngắn lại, mobile đỡ chật.
     Menu luôn có đủ bốn lựa chọn (xem hằng MENU trong JS). */
  .caret{
    min-height:1.9rem;padding:0 .45rem;margin-left:.15rem;
    border:1px solid var(--line);border-radius:8px;
    background:transparent;color:var(--muted);
    font-family:inherit;font-size:.8rem;line-height:1;
    cursor:pointer;vertical-align:middle;
  }
  .caret.set{border-color:var(--c-sec);color:var(--c-sec);}   /* mốc đang dùng một cách đặt nhanh */
  .menu{
    position:fixed;z-index:60;
    min-width:9.5rem;
    border:1px solid var(--line);border-radius:12px;
    background:var(--card);
    box-shadow:0 8px 24px rgba(63,58,92,.14);
    padding:.25rem;
    display:flex;flex-direction:column;
  }
  .menu button{
    text-align:left;
    min-height:2.4rem;padding:0 .7rem;
    border:none;border-radius:8px;background:transparent;
    font-family:inherit;font-size:var(--fs-chip);color:var(--ink);
    cursor:pointer;
  }
  .menu button.on{color:#fff;background:var(--c-sec);}

  .result{font-size:var(--fs-chip);font-weight:500;min-height:1.3em;}
  .result.ok{color:var(--ok);}
  .result.no{color:var(--c-sec);}

  .reset{
    align-self:flex-start;
    min-height:2.3rem;padding:0 1rem;
    /* Nút giao diện -> cùng màu với các trạng thái giao diện khác (chip đang chọn, menu) */
    border:1px solid var(--c-sec);border-radius:99px;
    background:var(--c-sec);color:#fff;
    font-family:inherit;font-size:var(--fs-chip);font-weight:500;
    cursor:pointer;
  }

  /* ===== SAO MỖI NGÀY =====
     Mở ngày mới là ba ngôi sao RỖNG (chỉ nét viền, cùng màu nét với các ô nhập chưa dùng);
     mỗi câu trả lời đúng tô đặc thêm một ngôi. Vàng là màu RIÊNG của phần thưởng: không
     phải màu kim nào (xanh/cam/hồng/xanh ngọc) nên nhìn vào là biết đây không phải dữ kiện. */
  .stars{display:flex;gap:var(--sp-3);}
  .star{
    /* to hẳn cho dễ nhìn, nhưng vẫn co theo bề rộng để ba ngôi không tràn trên màn hẹp */
    width:clamp(3.6rem,16vw,4.8rem);height:clamp(3.6rem,16vw,4.8rem);
    fill:none;stroke:var(--line);stroke-width:1.6;
    stroke-linejoin:round;
  }
  .star.on{fill:var(--c-star);stroke:var(--c-star);}

  /* Xoá sao: nút PHỤ nên để mờ (viền + chữ xám, không dùng màu nào của bài) và đẩy ra góc
     màn hình, xa vùng đang học — bấm nhầm giữa chừng là mất sao cả ngày. */
  .clear-stars{
    position:fixed;right:var(--sp-3);bottom:var(--sp-3);z-index:50;
    min-height:1.8rem;padding:0 .7rem;
    border:1px solid var(--line);border-radius:99px;
    background:var(--card);color:var(--muted);
    font-family:inherit;font-size:.72rem;
    cursor:pointer;
  }

  /* ===== ẨN — MỘT luật dùng chung, để CUỐI file nên thắng mọi display ở trên =====
       .off     : phần đồng hồ CHƯA BIẾT (không lộ đáp án)
       [hidden] : khối giao diện chưa dùng tới */
  .off,[hidden]{display:none;}
</style>
</head>
<body>
  <!-- Sáu trạng thái bàn tay (0-5 ngón) nhúng thẳng vào trang: <use> chỉ nhận tham chiếu
       TRONG cùng tài liệu, trỏ ra file .svg ngoài thì trình duyệt chặn. Bản gốc giữ ở
       img/dem-ngon/tay-N.svg. Mỗi symbol đã dịch sẵn để tay áo của cả 6 bản trùng nhau

        <circle cx="12" cy="12" r="9"/><path d="M12 6.5 V12 L15.8 14.2"/>
      </svg>
    </button>
    <button class="tab" type="button" data-view="digital" aria-label="Đồng hồ số" title="Đồng hồ số">
      <svg class="tico" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="6" width="18" height="12" rx="2.5"/>
        <path d="M6.6 9.6 V14.4 M9.4 9.6 V14.4 M14.6 9.6 V14.4 M17.4 9.6 V14.4"/>
        <circle cx="12" cy="10.6" r=".95" class="dot"/><circle cx="12" cy="13.4" r=".95" class="dot"/>
      </svg>
    </button>
  </div>
  <div class="analog" id="analog">
    <!-- Cung khoảng phút (chỉ vẽ khi biết cả hai mốc) -->
    <svg style="position:absolute;left:50%;top:50%;overflow:visible;pointer-events:none;z-index:9;">
      <path id="spanArc" class="r-span off"></path>
    </svg>
    <!-- Kim GIỜ THẬT chạy liên tục. Vạch mốc từ/đến dựng bằng JS ở phần 3. -->
    <div class="hand hour"   id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <!-- Nhãn GIỜ rồi tới nhãn PHÚT: đứng sau trong DOM nên nhãn phút (đặc) che nét nối giờ
         chạy qua phía sau khi hai kim trùng nhau. -->
    <div class="orbit" id="orbitH">
      <div class="connector" id="connH"></div>
      <div class="badge" id="badgeH"><span id="textH">12</span></div>
    </div>
    <div class="orbit" id="orbitM">
      <div class="connector" id="connM"></div>
      <div class="badge" id="badgeM"><span id="textM">0</span></div>
    </div>
    <!-- Chữ đánh dấu hai mốc, đặt tại hai đầu cung khoảng -->
    <div class="orbit off" id="cueFrom"><div class="cue-lab">từ</div></div>
    <div class="orbit off" id="cueTo"><div class="cue-lab">đến</div></div>
    <div class="center"></div>
  </div>

  <!-- KIỂU SỐ: đọc dọc từ trên xuống — từ · hai bàn tay · đến.
       Hàng "bây giờ" luôn hiện (kiểu kim cũng luôn chạy giờ thật); khối dưới chỉ hiện khi
       câu hỏi đã đủ dữ kiện. Hình tay/chân dựng bằng JS ở phần 8. -->
  <div class="digital" id="digital" hidden>
    <div class="dnow" id="dNow" hidden>bây giờ <span class="dtime" id="dNowT"></span></div>
    <div class="dwork" id="dWork" hidden>
      <div class="drow"><span class="dlab">từ</span><span class="dtime" id="dFromT"></span></div>
      <svg class="limbs" id="limbs" viewBox="0 0 432 440" aria-hidden="true"></svg>
      <div class="drow"><span class="dlab">đến</span><span class="dtime" id="dToT"></span></div>
    </div>
  </div>
  </div>

  <div class="panel">
    <div class="block">
      <div class="lbl">Chọn câu hỏi</div>
      <div class="pick">
        <button class="chip" type="button" data-ask="from">từ mấy giờ mấy phút?</button>
        <button class="chip" type="button" data-ask="to">đến mấy giờ mấy phút?</button>
        <button class="chip" type="button" data-ask="dur">bao nhiêu phút?</button>
      </div>
    </div>

    <!-- Hai khối dưới đây ẩn cho tới khi chọn chỗ cần hỏi (chip ở trên) -->
    <div class="block" id="qBlock" hidden>
      <div class="lbl">Câu hỏi</div>
      <div class="say" id="qSay"></div>
      <!-- Kiểu số chỉ đếm được tới 20 phút. Báo ngay ở đây, sát câu hỏi cần sửa, chứ không
           để dưới hình tay — chỗ phải sửa là câu hỏi. -->
      <div class="warn" id="warn" hidden>Không đủ ngón để đếm.</div>
    </div>

    <div class="block" id="aBlock" hidden>
      <div class="lbl">Câu trả lời</div>
      <div class="say" id="aSay"></div>
      <div class="result" id="result"></div>
      <button class="reset" id="btnReset" type="button" hidden>Câu hỏi mới</button>
    </div>

    <!-- LUÔN hiện (kể cả lúc chưa chọn câu hỏi) để thấy ngay còn mấy ngôi chưa tô.
         Ba ngôi sao dựng bằng JS ở phần 7. -->
    <div class="block">
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div class="menu" id="menu" hidden></div>
  <button class="clear-stars" id="btnClearStars" type="button">xoá sao</button>

<script>
  /* ============================================================
     HỌC ĐỒNG HỒ — script chia 9 phần, xếp theo dòng dữ liệu
     (trạng thái -> vẽ -> câu chữ -> tương tác):

       1. Tiện ích & tham chiếu DOM      6. Vòng lặp mỗi frame — tick()
       2. Trạng thái bài tập             7. Câu chữ & chấm bài
       3. Mặt số: vạch, chữ số, vạch mốc 8. Kiểu SỐ: từ · bàn tay · đến
       4. Bố cục tự co (layout)          9. Tương tác & khởi động
       5. Mốc từ/đến + cung khoảng phút

     QUY ƯỚC THỜI GIAN: mặt đồng hồ 12 GIỜ nên mọi mốc quy về SỐ PHÚT TRONG 12 TIẾNG,
     0..719 (12 giờ đúng = 0). Giờ nhập/hiện là 1..12. Mọi phép cộng trừ lấy dư 720.
     ============================================================ */

  /* ===== 1. TIỆN ÍCH & THAM CHIẾU DOM ===== */
  const $ = id => document.getElementById(id);

  // Mặt đồng hồ
  const analog = $('analog');
  const elHour=$('hour'), elMin=$('minute'), elSec=$('second');
  const elArc=$('spanArc');
  const elOrbitH=$('orbitH'), elOrbitM=$('orbitM');
  const elConnH=$('connH'),   elConnM=$('connM');
  const elBadgeH=$('badgeH'), elBadgeM=$('badgeM');
  const elTextH=$('textH'),   elTextM=$('textM');
  const elCue={from:$('cueFrom'), to:$('cueTo')};

  // Tab đổi kiểu đồng hồ + khối "kiểu số"
  const elStage=$('stage'), elTabs=$('tabs'), elDigital=$('digital'), elLimbs=$('limbs');
  const elDWork=$('dWork'), elWarn=$('warn'), elDNow=$('dNow');
  const elDNowT=$('dNowT'), elDFromT=$('dFromT'), elDToT=$('dToT');
  const tabs = [...elTabs.children];

  // Cột câu hỏi / câu trả lời
  const elPanel  = document.querySelector('.panel');
  const elQBlock = $('qBlock'), elABlock = $('aBlock');
  const elQSay   = $('qSay'),   elASay   = $('aSay');
  const elResult = $('result'), btnReset = $('btnReset');
  const elMenu   = $('menu'),   elStars  = $('stars');
  const btnClearStars = $('btnClearStars');
  const chips    = [...document.querySelectorAll('.chip')];

  const HALF_DAY = 720;                       // số phút của một vòng mặt 12 giờ
  const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
  const gio12 = h => (h%12)===0 ? 12 : (h%12);

  // TỌA ĐỘ CỰC quanh tâm mặt: deg đo TỪ 12 GIỜ, theo chiều kim. Trả [dx,dy] px so với tâm.
  function polar(r, deg){
    const a=(deg-90)*Math.PI/180;
    return [r*Math.cos(a), r*Math.sin(a)];
  }

  /* ===== 2. TRẠNG THÁI BÀI TẬP =====
     MỘT nguồn trạng thái duy nhất (ô nhập dựng lại từ đây nên không giữ giá trị trong DOM).
       unknown : thành phần bị hỏi = thành phần phải điền ở câu trả lời (null = chưa chọn)
       from/to : {h, m, mode} với mode = cách đặt mốc:
           'input' gõ giờ + phút · 'now' lấy giờ thật · 'sharp' giờ ĐÚNG (phút 0) · 'half' RƯỠI (phút 30)
       solved  : đáp án điền đã đúng -> mới vẽ thành phần đó lên đồng hồ
       awarded : câu này đã được thưởng sao chưa (MỘT sao cho mỗi câu, xoá rồi gõ lại
                 đáp án cũ không ăn thêm sao; chỉ "Câu hỏi mới" / đổi chỗ hỏi mới mở lại) */
  const MIN_OF = {sharp:0, half:30};
  const state = {
    unknown:null, solved:false, awarded:false,
    from:{h:null, m:null, mode:'input'},
    to:  {h:null, m:null, mode:'input'},
    dur:null,
    ans:{h:null, m:null, d:null},
  };

  // "bây giờ" = giờ máy đang chạy (quy về 0..719). Trả lời ĐÚNG thì ĐÓNG BĂNG mốc này lại
  // (frozenNow), nếu không thì sang phút sau đáp án vừa đúng sẽ thành sai. Sửa gì đó là chạy tiếp.
  const liveNow = () => { const d=new Date(); return (d.getHours()%12)*60 + d.getMinutes(); };
  let frozenNow = null;
  const nowMins  = () => frozenNow!==null ? frozenNow : liveNow();
  const usingNow = () => (state.from.mode==='now' && state.unknown!=='from')
                      || (state.to.mode==='now'   && state.unknown!=='to');

  // Giá trị một mốc (0..719; null = chưa đủ dữ kiện)
  function givenTime(part){
    const p = state[part];
    if(p.mode==='now') return nowMins();
    if(p.h===null) return null;
    const hh = (p.h % 12) * 60;
    if(p.mode==='input') return p.m===null ? null : hh + p.m;
    return hh + MIN_OF[p.mode];
  }

  // Đáp án đúng của thành phần đang hỏi (null nếu 2 thành phần đã cho chưa đủ)
  function solution(){
    const f=givenTime('from'), t=givenTime('to'), d=state.dur;
    switch(state.unknown){
      case 'dur':  return (f===null||t===null) ? null : (t - f + HALF_DAY) % HALF_DAY;
      case 'to':   return (f===null||d===null) ? null : (f + d) % HALF_DAY;
      case 'from': return (t===null||d===null) ? null : (t - d + HALF_DAY*2) % HALF_DAY;
      default:     return null;   // chưa chọn chỗ hỏi
    }
  }

  // Đáp án người học điền (0..719; null = chưa điền đủ)
  function readAnswer(){
    if(state.unknown==='dur') return state.ans.d;
    return (state.ans.h===null||state.ans.m===null) ? null : (state.ans.h%12)*60 + state.ans.m;
  }

  // Những gì ĐANG ĐƯỢC BIẾT để vẽ đồng hồ: 2 thành phần đã cho, cộng đáp án nếu đã lộ
  function knownNow(){
    const out = { from:givenTime('from'), to:givenTime('to'), dur:state.dur };
    if(state.unknown) out[state.unknown] = state.solved ? solution() : null;
    return out;
  }

  /* ===== 3. MẶT SỐ: VẠCH CHIA + CHỮ SỐ + VẠCH MỐC ===== */
  const tickSpans=[];
  for(let i=0;i<60;i++){
    const t=document.createElement('div');
    t.className='tick'+(i%5===0?' major':'');
    t.style.transform=`rotate(${i*6}deg)`;
    const sp=document.createElement('span');
    t.appendChild(sp);
    tickSpans.push(sp);
    analog.appendChild(t);
  }
  const numerals=[];
  for(let n=1;n<=12;n++){
    const el=document.createElement('div');
    el.className='numeral';
    el.dataset.n=n;
    el.textContent=n;
    numerals.push(el);
    analog.appendChild(el);
  }

  // 4 vạch mốc NGOÀI mép mặt: mỗi mốc một vạch giờ + một vạch phút, hai mốc vẽ giống hệt nhau
  function buildMark(cls){
    const d=document.createElement('div');
    d.className='mark '+cls;
    d.appendChild(document.createElement('span'));
    analog.appendChild(d);
    return d;
  }
  const mark = {
    fromH: buildMark('mk-h'),       fromM: buildMark('mk-m'),
    toH:   buildMark('mk-h'),       toM:   buildMark('mk-m'),
  };
  const markSpans = Object.values(mark).map(d => d.firstChild);

  /* ===== 4. BỐ CỤC TỰ CO (layout) ===== */
  const EDGE = 12;         // lề tối thiểu tới cạnh màn hình
  const FACE_MIN = 50;     // SÀN CỨNG bán kính mặt: viewport hẹp cỡ nào cũng KHÔNG co về 0
  const MK_IN = 3, MK_OUT = 13;   // vạch mốc nằm trong dải bán kính [FACE+MK_IN, FACE+MK_OUT]

  // ===== BÁN KÍNH CÁC LỚP NGOÀI MẶT (đều là ĐỘ LỆCH so với FACE, không phụ thuộc FACE) =====
  // Nhãn là hình tròn đều -> nửa bề ngang = nửa bề cao = bán kính; đường kính đọc từ
  // --badge-dia (MỘT nguồn với CSS). Nhãn PHÚT ở vòng trong, nhãn GIỜ ở vòng ngoài, cách
  // nhau đúng một đường kính nhãn nên hai nhãn không chạm nhau khi hai kim trùng.
  const BADGE_D    = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--badge-dia')) || 26;
  const BADGE_HALF = BADGE_D/2;
  const ARC_OFF    = MK_OUT + 5;                        // cung khoảng phút
  const CUE_OFF    = ARC_OFF + 10;                      // chữ "từ"/"đến": NGOÀI cung, không đè lên cung
  const CONN_OFF   = 4;                                 // nét nối bắt đầu sát MÉP MẶT (chạy dài qua vạch mốc + cung)
  const BADGE_M_OFF= ARC_OFF + 7 + BADGE_HALF;          // tâm nhãn PHÚT (bám theo cung, KHÔNG theo nét nối)
  const BADGE_H_OFF= BADGE_M_OFF + BADGE_D + 3;         // tâm nhãn GIỜ (ngoài nhãn phút)
  const MARGIN     = Math.ceil(BADGE_H_OFF + BADGE_HALF + 4);   // lề quanh mặt = tầm với xa nhất
  let FACE = 150;
  let ARC_R = 0;

  // Chiều cao vùng nhìn thấy THẬT (đã trừ thanh công cụ Safari)
  const viewportH = () => (window.visualViewport && window.visualViewport.height)
        || document.documentElement.clientHeight || window.innerHeight;

  // KHÔNG đo zoom ở đây. devicePixelRatio đổi vì nhiều lý do (màn hình khác mức scale, máy có
  // dpr 2/3) chứ không riêng zoom -> lấy nó làm hệ số zoom là có lúc thổi phồng mặt đồng hồ ra
  // ngoài màn. Chống co rúm làm ở chỗ NGHE SỰ KIỆN: mobile không căn lại theo chiều cao.
  const mqDesktop = window.matchMedia('(min-width:768px)');

  function layout(){
    const desktop = mqDesktop.matches;
    const vw = window.innerWidth;
    const vh = viewportH();

    let faceByW;
    if(desktop){
      // NGANG: đồng hồ | cột câu hỏi -> vừa khít cả bề rộng lẫn chiều cao
      const panelW = elPanel.offsetWidth || 460;
      const GAP = 24;
      const availW = Math.min(vw, 1600) - EDGE*2;
      faceByW = (availW - panelW - GAP - 2*MARGIN) / 2;
      // Hàng tab nằm TRÊN mặt đồng hồ nên ăn mất phần chiều cao đó
      const faceByH = (vh - 2*EDGE - 2*MARGIN - elTabs.offsetHeight) / 2;
      FACE = Math.min(faceByW, faceByH);
    } else {
      // DỌC: đồng hồ chỉ co theo BỀ RỘNG, nội dung dài hơn màn thì cuộn
      const halfW = (Math.min(vw, 900) / 2) - EDGE;
      faceByW = halfW - MARGIN;
      FACE = faceByW;
    }
    FACE = Math.max(FACE, Math.min(150, faceByW));
    FACE = Math.max(FACE, FACE_MIN);

    const D = FACE*2;
    analog.style.width  = D+'px';
    analog.style.height = D+'px';
    analog.style.margin = MARGIN+'px';
    // Khoá hộp .stage theo mặt kim -> đổi tab không làm hộp co giãn, tab đứng yên
    elStage.style.width     = (D + 2*MARGIN)+'px';
    elStage.style.minHeight = (D + 2*MARGIN + elTabs.offsetHeight)+'px';
    ARC_R = FACE + ARC_OFF;      // cung khoảng phút: ngoài vạch mốc

    // Nhãn giờ/phút: nét nối chạy từ FACE+CONN_OFF tới đúng mép trong của nhãn
    const connStart = FACE + CONN_OFF;
    const rM = FACE + BADGE_M_OFF, rH = FACE + BADGE_H_OFF;
    place(elConnM, elBadgeM, connStart, (rM - BADGE_HALF) - connStart, rM);
    place(elConnH, elBadgeH, connStart, (rH - BADGE_HALF) - connStart, rH);
    for(const o of Object.values(elCue)) o.firstChild.style.marginTop = (-(FACE + CUE_OFF))+'px';

    layoutFace();
    drawMarks();
  }

  // Nét nối + nhãn: nét nối kéo từ connStart ra dài len; tâm nhãn cách tâm mặt badgeR
  function place(conn, badge, connStart, len, badgeR){
    conn.style.top    = (-(connStart+len))+'px';   // điểm xa tâm nhất của nét nối
    conn.style.height = len+'px';
    badge.style.marginTop = (-badgeR)+'px';
  }

  // Đặt lại vạch chia, chữ số, vạch mốc và chiều dài kim theo FACE hiện tại
  function layoutFace(){
    const G_RIM = 5;      // mép -> đầu vạch
    const G_NUM = 2;      // đuôi vạch -> chữ số
    const majorLen = 8, minorLen = 4;
    const tickOuter = FACE - G_RIM;
    const tickInner = tickOuter - majorLen;

    tickSpans.forEach((sp,i)=>{
      const len = (i%5===0) ? majorLen : minorLen;
      sp.style.top=(-tickOuter)+'px';
      sp.style.height=len+'px';
    });

    // Bán kính RIÊNG cho từng số: mép ngoài mỗi số cách đuôi vạch đúng G_NUM
    numerals.forEach(el=>{
      const n=+el.dataset.n;
      const [ux,uy]=polar(1, n*30);
      const rg=document.createRange(); rg.selectNodeContents(el);
      const r=rg.getBoundingClientRect();
      const halfReach=Math.abs(ux)*r.width/2 + Math.abs(uy)*r.height/2;
      const radius=(tickInner - G_NUM) - halfReach;
      el.style.left=`calc(50% + ${ux*radius}px)`;
      el.style.top=`calc(50% + ${uy*radius}px)`;
    });

    // Vạch mốc: đầu XA TÂM ở FACE+MK_OUT, dài (MK_OUT - MK_IN)
    markSpans.forEach(sp=>{
      sp.style.top    = (-(FACE + MK_OUT)) + 'px';
      sp.style.height = (MK_OUT - MK_IN) + 'px';
    });

    // Kim ngắn hơn vòng số để không đè lên số
    const hh=FACE*0.34, mh=FACE*0.55, sh=FACE*0.62;
    elHour.style.height=hh+'px'; elHour.style.marginTop=(-hh)+'px';
    elMin.style.height=mh+'px';  elMin.style.marginTop=(-mh)+'px';
    elSec.style.height=sh+'px';  elSec.style.marginTop=(-sh)+'px';
  }

  /* ===== 5. MỐC TỪ/ĐẾN + CUNG KHOẢNG PHÚT ===== */
  // Cung tròn từ startDeg đến endDeg (đo từ 12h)
  function arcPath(r, startDeg, endDeg){
    const sweep = endDeg - startDeg;
    if(sweep <= 0) return '';
    if(sweep >= 359.99){   // >= 1 giờ: vẽ TRỌN vòng bằng 2 nửa cung (một cung 360° là rỗng)
      const [x0,y0]=polar(r,0), [x1,y1]=polar(r,180);
      return `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1} A ${r} ${r} 0 0 1 ${x0} ${y0}`;
    }
    const [x0,y0]=polar(r,startDeg), [x1,y1]=polar(r,endDeg);
    return `M ${x0} ${y0} A ${r} ${r} 0 ${sweep>180?1:0} 1 ${x1} ${y1}`;
  }

  // Đặt cặp vạch (giờ + phút) của một mốc theo số phút 0..719; null -> ẩn
  function setMark(mH, mM, mins){
    const off = (mins === null);
    mH.classList.toggle('off', off);
    mM.classList.toggle('off', off);
    if(off) return;
    mH.style.transform=`rotate(${(mins/60)*30}deg)`;   // vạch giờ nhích dần theo phút
    mM.style.transform=`rotate(${(mins%60)*6}deg)`;
  }

  // Vẽ lại mốc + cung từ những gì ĐANG ĐƯỢC BIẾT (không lộ thành phần đang hỏi)
  function drawMarks(){
    const k = knownNow();          // {from, to, dur} — chưa biết = null

    setMark(mark.fromH, mark.fromM, k.from);
    setMark(mark.toH,   mark.toM,   k.to);

    // Cung và hai chữ "từ"/"đến" là phần TỔNG KẾT: chỉ vẽ khi đã trả lời ĐÚNG. Trong lúc
    // đang làm bài, mặt đồng hồ chỉ có vạch mốc — không bày sẵn quãng cần tìm.
    const done = state.solved && k.from!==null && k.to!==null;

    // Chữ đánh dấu đặt tại GÓC PHÚT = đúng hai đầu cung khoảng; đối-xoay cho chữ đứng thẳng
    for(const [part,el] of Object.entries(elCue)){
      el.classList.toggle('off', !done);
      if(!done) continue;
      const deg = (k[part]%60)*6;
      el.style.transform = `rotate(${deg}deg)`;
      el.firstChild.style.transform = `translate(-50%,-50%) rotate(${-deg}deg)`;
    }

    elArc.classList.toggle('off', !done);
    if(done){
      const dur = (k.to - k.from + HALF_DAY) % HALF_DAY;
      const startDeg = (k.from % 60) * 6;
      const sweep = dur <= 60 ? dur*6 : 360;      // hơn 1 giờ -> trọn vòng
      elArc.setAttribute('d', arcPath(ARC_R, startDeg, startDeg + sweep));
    }
  }

  // Vẽ lại CẢ HAI kiểu đồng hồ từ cùng một trạng thái (drawDigital ở phần 9 tự bỏ qua
  // khi đang xem kiểu kim). Mọi chỗ đổi trạng thái gọi hàm này, không gọi thẳng drawMarks.
  function redraw(){ drawMarks(); drawDigital(); }

  /* ===== 6. VÒNG LẶP MỖI FRAME — tick() ===== */
  let lastSec = -1, lastMin = -1;
  function tick(){
    const now=new Date();
    const h=now.getHours(), s=now.getSeconds();

    // Kim: góc tăng liên tục, cập nhật MỖI FRAME cho mượt
    const totalSec = now.getTime()/1000 - now.getTimezoneOffset()*60;
    const minDeg  = (totalSec/60)*6;
    const hourDeg = (totalSec/3600)*30;
    elSec.style.transform  = `rotate(${totalSec*6}deg)`;
    elMin.style.transform  = `rotate(${minDeg}deg)`;
    elHour.style.transform = `rotate(${hourDeg}deg)`;

    // Nhãn giờ/phút quay theo kim; nhãn được đối-xoay để con số luôn đứng thẳng
    elOrbitH.style.transform = `rotate(${hourDeg}deg)`;
    elBadgeH.style.transform = `translate(-50%,-50%) rotate(${-hourDeg}deg)`;
    elOrbitM.style.transform = `rotate(${minDeg}deg)`;
    elBadgeM.style.transform = `translate(-50%,-50%) rotate(${-minDeg}deg)`;

    if(s!==lastSec){
      lastSec=s;
      // Số trên nhãn (chỉ đổi mỗi giây, đỡ tải)
      const hourNum = gio12(h);
      const txtH = String(hourNum), txtM = String(now.getMinutes());
      if(elTextH.textContent!==txtH) elTextH.textContent=txtH;
      if(elTextM.textContent!==txtM) elTextM.textContent=txtM;
      // Tô đậm số giờ hiện tại trên mặt (1-12)
      numerals.forEach(el => el.classList.toggle('active', +el.dataset.n===hourNum));

      // Mốc chọn "bây giờ" chạy theo giờ thật -> sang phút mới thì vẽ lại vạch mốc.
      // Chỉ vẽ lại vạch; câu chữ ghi "bây giờ" (không có số) nên không cần dựng lại.
      if(view==='digital' && !elDNow.hidden) elDNowT.innerHTML = fmtNow();

      const mn = now.getMinutes();
      if(mn!==lastMin){
        lastMin=mn;
        if(usingNow() && frozenNow===null) redraw();
      }
    }
    requestAnimationFrame(tick);
  }

  /* ===== 7. CÂU CHỮ & CHẤM BÀI ===== */
  /* --- Mảnh câu: ô nhập / giá trị / chữ --- */
  const inp = (k, cls, v, min, max) =>
    `<input class="in ${cls}" data-k="${k}" type="number" inputmode="numeric" min="${min}" max="${max}"` +
    ` value="${v===null?'':v}">`;
  const val = (cls, v) => v===null ? '<span class="todo">…</span>' : `<span class="${cls}">${v}</span>`;
  const W_H = '<span class="w-h">giờ</span>';
  const W_M = '<span class="w-m">phút</span>';
  const W_D = W_M;   // đơn vị của khoảng vẫn là PHÚT -> dùng đúng chữ "phút" màu phút
  const NOW = '<span class="v-now">bây giờ</span>';

  // CÁCH ĐỌC: giờ đúng thì có chữ "giờ" ("8 giờ đúng"), còn rưỡi thì BỎ chữ "giờ" ("8 rưỡi")
  const W_SHARP = `${W_H} <span class="w-m">đúng</span>`;
  const W_HALF  = '<span class="w-m">rưỡi</span>';

  // Chỗ đang hỏi: tô theo ĐÚNG màu của thứ đang hỏi (giờ xanh, phút cam, khoảng xanh ngọc)
  const Q_TIME = '<span class="v-h">mấy giờ</span> <span class="v-m">mấy phút</span>';
  const Q_DUR  = `<span class="v-d">bao nhiêu</span> ${W_M}`;

  // MỘT mốc thời điểm. edit=true (trong CÂU HỎI): ô nhập + nút ▾ đổi cách đặt mốc.
  //                    edit=false (trong CÂU TRẢ LỜI): chỉ chữ.
  function timePart(part, edit){
    const p = state[part];
    const h = edit ? inp(part+'H','h',p.h,1,12) : val('v-h',p.h);
    let body;
    switch(p.mode){
      case 'now':   body = NOW; break;
      case 'sharp': body = `${h} ${W_SHARP}`; break;
      case 'half':  body = `${h} ${W_HALF}`; break;
      default:      body = `${h} ${W_H} ${edit ? inp(part+'M','m',p.m,0,59) : val('v-m',p.m)} ${W_M}`;
    }
    if(!edit) return body;
    const set = p.mode!=='input' ? ' set' : '';
    return `${body}<button class="caret${set}" type="button" data-menu="${part}" aria-label="Cách đặt mốc">▾</button>`;
  }

  // Khoảng đã cho, và ô để điền đáp án
  const durPart = edit => `${edit ? inp('dur','d',state.dur,0,HALF_DAY-1) : val('v-d',state.dur)} ${W_D}`;
  const ansIn   = () => state.unknown==='dur'
      ? `${inp('ansD','d',state.ans.d,0,HALF_DAY-1)} ${W_D}`
      : `${inp('ansH','h',state.ans.h,1,12)} ${W_H} ${inp('ansM','m',state.ans.m,0,59)} ${W_M}`;

  /* CỤM NỐI CỦA CÂU "BAO NHIÊU PHÚT" — chọn theo vị trí so với HIỆN TẠI.
     "còn" nói về quãng CHƯA TỚI, "đã qua" nói về quãng ĐÃ TRÔI — không thay nhau được.
     Mọi mốc ở đây quy về 0..719 trên mặt 12 giờ nên KHÔNG biết sáng hay chiều; chỉ khi một
     mốc được đặt là "bây giờ" thì mới biết chắc bên nào là quá khứ, bên nào là tương lai:
       từ = bây giờ  -> mốc đến nằm phía trước  -> CÒN
       đến = bây giờ -> mốc từ đã trôi qua      -> ĐÃ QUA
       không mốc nào là bây giờ                 -> nói trung tính, không "còn" cũng không "đã qua"
     Hai câu hỏi mốc thì KHÔNG dùng luật này: hỏi mốc đến luôn "sau … nữa", hỏi mốc từ luôn
     "đã qua", vì chúng nói về chiều tính toán chứ không nói về quá khứ hay tương lai. */
  const noiTu = () => state.from.mode==='now' ? 'còn'
                    : state.to.mode==='now'   ? 'đã qua' : 'là';

  /* MỘT câu liền mạch, dùng chung cho câu hỏi và câu trả lời — chỉ khác nhau ở hai điểm:
       q=true  (CÂU HỎI)     : dữ kiện là ô nhập, chỗ đang hỏi là chữ "mấy giờ mấy phút", kết bằng ?
       q=false (CÂU TRẢ LỜI) : dữ kiện là chữ,   chỗ đang hỏi là ô để điền,               kết bằng .
     Câu KHÔNG cần dấu riêng cho hai mốc: chính hai chữ "Từ"/"đến" trong câu là dấu, và
     đúng hai chữ đó cũng hiện cạnh hai mốc trên mặt đồng hồ (xem drawMarks). */
  function sayHTML(q){
    const T   = part => timePart(part, q);
    const D   = durPart(q);
    const end = q ? '?' : '.';
    if(state.unknown==='dur')
      return `Từ ${T('from')} đến ${T('to')} ${noiTu()} ${q ? Q_DUR : ansIn()}${end}`;
    const slot = q ? Q_TIME : ansIn();
    if(state.unknown==='to')
      return `Từ ${T('from')} sau ${D} nữa là đến ${slot}${end}`;
    return `Đến ${T('to')} thì đã qua ${D}, vậy bắt đầu từ ${slot}${end}`;
  }

  // Dựng lại câu HỎI: chỉ gọi khi CẤU TRÚC đổi (đổi chỗ hỏi / đổi cách đặt mốc),
  // KHÔNG gọi lúc đang gõ — dựng lại là mất con trỏ trong ô.
  function syncQ(){
    chips.forEach(c => c.classList.toggle('on', c.dataset.ask===state.unknown));
    elQBlock.hidden = (state.unknown===null);
    if(state.unknown) elQSay.innerHTML = sayHTML(true);
  }
  // Câu TRẢ LỜI chỉ hiện khi câu hỏi đã đủ 2 thành phần. Dựng lại được cả khi đang gõ ở câu
  // hỏi (con trỏ không nằm trong câu này), nhưng KHÔNG dựng khi đang gõ ở chính ô đáp án.
  function syncA(){
    // overDigits() > 0: kiểu số không đếm nổi khoảng này -> báo ngay dưới câu hỏi và
    // khoá phần trả lời lại, vì chỗ phải sửa là câu hỏi chứ không phải câu trả lời
    const over = overDigits();
    elWarn.hidden = !over;
    const ready = state.unknown!==null && solution()!==null && !over;
    elABlock.hidden = !ready;
    if(ready) elASay.innerHTML = sayHTML(false);
  }
  function syncAll(){ syncQ(); syncA(); redraw(); }

  function setResult(txt, cls){
    elResult.textContent = txt;
    elResult.className = 'result' + (cls?' '+cls:'');
    btnReset.hidden = !state.solved;
  }

  /* --- SAO MỖI NGÀY ---
     Mỗi ngày ba ngôi sao, bắt đầu rỗng hết; mỗi câu trả lời đúng tô một ngôi, đủ ba thì thôi.
     Số sao nhớ trong localStorage kèm NGÀY: mở lại trang trong cùng ngày thì giữ nguyên,
     sang ngày mới là rỗng lại. Không ghi được (trình duyệt chặn) thì vẫn đếm trong phiên. */
  const STAR_MAX = 3;
  const STAR_KEY = 'hoc-dong-ho:stars';
  const STAR_D   = 'M12 2.5 L14.35 8.76 L21.03 9.06 L15.8 13.24 L17.59 19.68 '
                 + 'L12 16 L6.41 19.68 L8.2 13.24 L2.97 9.06 L9.65 8.76 Z';
  // Ngày theo giờ máy (không dùng ISO/UTC: qua nửa đêm giờ địa phương là ngày mới)
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };

  elStars.innerHTML = `<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_D}"/></svg>`.repeat(STAR_MAX);
  const starEls = [...elStars.children];

  let starDay = today(), starCount = 0;
  try{
    const saved = JSON.parse(localStorage.getItem(STAR_KEY) || '{}');
    if(saved.d === starDay) starCount = clamp(+saved.n || 0, 0, STAR_MAX);
  }catch(e){}

  function drawStars(){
    starEls.forEach((el,i) => el.classList.toggle('on', i < starCount));
  }
  function saveStars(){
    try{ localStorage.setItem(STAR_KEY, JSON.stringify({d:starDay, n:starCount})); }catch(e){}
  }
  function awardStar(){
    if(starDay !== today()){ starDay = today(); starCount = 0; }   // qua nửa đêm -> ngày mới
    if(starCount >= STAR_MAX) return;
    starCount++;
    saveStars(); drawStars();
  }
  // Xoá sao: về lại ba ngôi rỗng của HÔM NAY (ghi đè cả bản đã lưu, không phải chỉ xoá màn hình)
  function clearStars(){
    starDay = today(); starCount = 0;
    saveStars(); drawStars();
  }

  // Không có nút kiểm tra: điền đủ là chấm ngay, đúng thì chỗ đang hỏi hiện lên đồng hồ
  function autoCheck(){
    const ans = readAnswer(), sol = solution();
    if(ans===null || sol===null){
      state.solved=false; frozenNow=null;
      setResult('');
    }else if(ans===sol){
      if(!state.solved && usingNow()) frozenNow = liveNow();   // đóng băng "bây giờ" đúng lúc trả lời đúng
      state.solved=true;
      if(!state.awarded){ state.awarded=true; awardStar(); }
      setResult('Đúng rồi.','ok');
    }else{
      state.solved=false; frozenNow=null;
      setResult('Chưa đúng, thử lại.','no');
    }
    redraw();
  }

  /* ===== 8. KIỂU SỐ: TỪ · BÀN TAY · ĐẾN =====
     ĐẾM PHÚT BẰNG NGÓN: mỗi phút một ngón, ngón thứ i ghi mốc (từ + i). Một bàn tay đếm được
     5 phút, nên bốn bàn tay xếp hai hàng đếm tới 20: hàng trên là phút 1-10, hàng dưới là
     phút 11-20 (hàng dưới chỉ hiện khi cần). Quá 20 thì không đếm nữa mà báo thẳng "không đủ
     ngón để đếm" — thà nói thiếu ngón còn hơn vẽ số ngón sai.

     HÌNH: dùng bộ icon rời gồm 6 trạng thái bàn tay 0-5 ngón (sprite ở đầu trang). Bàn bên
     phải là bản gốc (ngón cái ở mép phải), bàn bên trái là chính nó LẬT NGANG — nên chỉ cần
     một bộ hình. THỨ TỰ ĐẾM CỦA BỘ ICON là trỏ → giữa → nhẫn → út → cái, không phải trái
     sang phải; nhãn trên từng ngón mới là thứ chỉ ra ngón nào đếm tới mốc nào. */
  const HAND_MAX  = 5;                        // một bàn tay = 5 phút
  const DIGIT_MAX = HAND_MAX * 4;             // bốn bàn tay = 20 phút

  /* KHUNG MỘT BÀN, đo trong hệ toạ độ gốc của icon (viewBox 512×512 của bộ icon):
       x 180..388  = bề ngang thật của tay (icon chừa rất nhiều lề trống hai bên)
       y -95..345  = 95 đơn vị phía trên cho NHÃN, rồi tới tay, cắt ngang ở cổ tay
                     (bỏ phần cẳng tay bên dưới, nếu giữ thì hai hàng cao gấp rưỡi) */
  const CELL = {x0:180, y0:-95, w:208, h:440};
  const COL_GAP = 16, ROW_GAP = 20;
  const ROW_W = CELL.w*2 + COL_GAP;           // 432
  const MIRROR_AX = 2 * (CELL.x0 + CELL.w/2); // lật quanh tâm ngang của khung: x -> 568 - x

  /* ĐẦU NGÓN của từng trạng thái, đo thẳng từ path data của 6 file icon (đã căn tay áo).
     Xếp theo THỨ TỰ ĐẾM: trỏ, giữa, nhẫn, út, cái. Bộ icon vẽ tay hơi khác nhau giữa các
     trạng thái nên mỗi trạng thái có bảng riêng, không suy ra từ một bảng chung được. */
  const TIPS = [
    [],
    [[308, 31]],
    [[316, 40], [264, 31]],
    [[316, 41], [268, 31], [232, 43]],
    [[312, 41], [268, 31], [228, 43], [196, 80]],
    [[304, 41], [268, 31], [236, 38], [204, 78], [372, 167]],
  ];
  const LAB_UP = 53;      // nhãn đặt cao hơn đầu ngón bấy nhiêu (dựng đứng, đọc từ dưới lên)

  const SVGNS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const el = document.createElementNS(SVGNS, tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  // Một bàn tay = <use> trỏ vào symbol + 5 nhãn. Bàn lật thì CHỈ lật phần hình; nhãn tính
  // toạ độ lật bằng tay để chữ không bị soi gương.
  function buildHand(ox, oy, mirror){
    const cell = mk('g', {transform:`translate(${ox - CELL.x0},${oy - CELL.y0})`,
                          'clip-path':'url(#cellClip)'});
    const use  = mk('use', {href:'#tay0', x:0, y:0, width:512, height:512});
    if(mirror){
      const g = mk('g', {transform:`translate(${MIRROR_AX},0) scale(-1,1)`});
      g.appendChild(use);
      cell.appendChild(g);
    } else cell.appendChild(use);

    const labs = [];
    for(let i=0;i<HAND_MAX;i++){ const t = mk('text', {}); labs.push(t); cell.appendChild(t); }
    return {g:cell, use, labs, mirror};
  }

  // Vùng cắt chỉ để CẮT NGANG ở cổ tay (bỏ cẳng tay), không cần cắt hai bên -> nới ra 8 đơn vị
  // mỗi bên cho nhãn ngón cái (nằm sát mép khung) không bị xén mất viền. Khe giữa hai bàn là
  // 16 nên nới 8 vẫn không chồng sang bàn bên cạnh, và vẫn đối xứng qua tâm nên bàn lật dùng chung.
  elLimbs.appendChild(mk('clipPath', {id:'cellClip'})).appendChild(
    mk('rect', {x:CELL.x0 - 8, y:CELL.y0, width:CELL.w + 16, height:CELL.h}));

  // Thứ tự trong mảng = thứ tự đếm: 1-5, 6-10 (hàng trên) rồi 11-15, 16-20 (hàng dưới)
  // ox,oy là vị trí GÓC TRÊN-TRÁI của khung trong viewBox, không phải toạ độ gốc của icon
  const rowTop = mk('g', {}), rowBot = mk('g', {class:'off'});
  const OX2 = CELL.w + COL_GAP;
  const hands = [
    buildHand(0, 0, true), buildHand(OX2, 0, false),
    buildHand(0, 0, true), buildHand(OX2, 0, false),
  ];
  hands.slice(0,2).forEach(h => rowTop.appendChild(h.g));
  hands.slice(2).forEach(h => rowBot.appendChild(h.g));
  rowBot.setAttribute('transform', `translate(0,${CELL.h + ROW_GAP})`);
  elLimbs.appendChild(rowTop);
  elLimbs.appendChild(rowBot);

  // Mốc 0..719 -> "8:05" tô đúng màu giờ/phút; null -> dấu … như trong câu
  function fmtTime(mins){
    if(mins===null) return '<span class="todo">…</span>';
    const h = Math.floor(mins/60), m = mins%60;
    return `<span class="v-h">${h===0?12:h}</span><span class="sep">:</span>`
         + `<span class="v-m">${String(m).padStart(2,'0')}</span>`;
  }
  // Nhãn trên ngón: cùng cách đọc, nhưng trong SVG tô màu bằng fill nên phải dùng lớp riêng
  function fmtLimb(mins){
    const h = Math.floor(mins/60), m = mins%60;
    return `<tspan class="lh">${h===0?12:h}</tspan><tspan class="ls">:</tspan>`
         + `<tspan class="lm">${String(m).padStart(2,'0')}</tspan>`;
  }
  // "bây giờ" ở kiểu số chạy tới từng GIÂY (kiểu kim có kim giây, kiểu số thì phải ghi ra),
  // nên nó đọc thẳng đồng hồ máy chứ không qua nowMins() — cái đó bị đóng băng khi trả lời đúng.
  function fmtNow(){
    const d = new Date(), h = d.getHours()%12;
    return `<span class="v-h">${h===0?12:h}</span><span class="sep">:</span>`
         + `<span class="v-m">${String(d.getMinutes()).padStart(2,'0')}</span>`
         + `<span class="sep">:</span><span class="v-s">${String(d.getSeconds()).padStart(2,'0')}</span>`;
  }

  let view = 'analog';

  /* KHOẢNG THẬT của câu hỏi — biết được NGAY khi câu hỏi đủ dữ kiện, không cần đợi trả lời:
     hỏi "bao nhiêu phút" thì khoảng chính là đáp án, hai câu còn lại thì khoảng là dữ kiện.
     Quá 20 phút thì kiểu số không đếm nổi -> báo ngay lúc đặt câu hỏi và KHOÁ luôn phần trả
     lời, thay vì để người học điền xong mới nói là không hiện được. Trả về 0 nghĩa là ổn. */
  function overDigits(){
    if(view!=='digital' || state.unknown===null) return 0;
    const d = state.unknown==='dur' ? solution() : state.dur;
    return (d!==null && d>DIGIT_MAX) ? d : 0;
  }

  function drawDigital(){
    if(view!=='digital') return;               // đang xem kiểu kim thì khỏi tính

    // Giống kiểu kim: chỉ hiện khi câu hỏi đã đủ dữ kiện, và KHÔNG lộ thành phần đang hỏi
    const ready = state.unknown!==null && solution()!==null;

    // "bây giờ" chỉ ẩn khi câu hỏi đã XONG mà không dùng tới nó. Lúc còn đang đặt câu hỏi
    // thì vẫn hiện, vì đó là lúc người học cần nhìn giờ thật để chọn mốc.
    elDNow.hidden = ready && !(state.from.mode==='now' || state.to.mode==='now');
    if(!elDNow.hidden) elDNowT.innerHTML = fmtNow();

    elDWork.hidden = !ready;
    if(!ready) return;

    const k = knownNow();
    elDFromT.innerHTML = fmtTime(k.from);
    elDToT.innerHTML   = fmtTime(k.to);

    const over = overDigits();
    const done = state.solved && k.from!==null && k.to!==null;
    const n    = (!over && done) ? (k.to - k.from + HALF_DAY) % HALF_DAY : 0;

    // Quá tầm đếm thì bỏ hẳn hình, chỉ còn lời báo. Dùng class chứ KHÔNG dùng .hidden:
    // thuộc tính hidden chỉ có ở HTMLElement, gán cho <svg> là gán vào hư không.
    elLimbs.classList.toggle('off', over>0);

    // Hàng dưới (phút 11-20) chỉ dựng khi thật sự đếm quá 10; khung cao theo số hàng đang hiện
    const twoRows = n > HAND_MAX*2;
    rowBot.classList.toggle('off', !twoRows);
    elLimbs.setAttribute('viewBox',
      `0 0 ${ROW_W} ${twoRows ? CELL.h*2 + ROW_GAP : CELL.h}`);

    hands.forEach((hand, hi)=>{
      const base  = hi * HAND_MAX;                       // 0, 5, 10, 15
      const count = clamp(n - base, 0, HAND_MAX);
      hand.use.setAttribute('href', '#tay' + count);
      TIPS[count].forEach((tip, i)=>{
        const x = hand.mirror ? MIRROR_AX - tip[0] : tip[0];
        hand.labs[i].setAttribute('transform', `translate(${x},${tip[1] - LAB_UP}) rotate(-90)`);
        hand.labs[i].innerHTML = fmtLimb((k.from + base + i + 1) % HALF_DAY);
        hand.labs[i].classList.remove('off');
      });
      for(let i=count;i<HAND_MAX;i++) hand.labs[i].classList.add('off');
    });
  }

  /* --- Đổi kiểu đồng hồ --- */
  function setView(v){
    view = v;
    tabs.forEach(t => t.classList.toggle('on', t.dataset.view===v));
    analog.hidden    = (v!=='analog');
    elDigital.hidden = (v!=='digital');
    closeMenu();
    // Mặt kim đo kích thước bằng offsetWidth nên lúc bị ẩn không đo được -> hiện lại thì
    // căn lại từ đầu (xoá mốc lastW/lastVh để relayout không bỏ qua).
    if(v==='analog'){ lastW=-1; lastVh=-1; layout(); }
    // Khoá/mở phần trả lời đổi theo kiểu đang xem (chỉ kiểu số mới có trần 20 phút)
    syncA();
    drawDigital();
  }
  tabs.forEach(t => t.addEventListener('click', ()=> setView(t.dataset.view)));

  /* ===== 9. TƯƠNG TÁC & KHỞI ĐỘNG ===== */
  /* --- Ô nhập: đọc số -> state (rỗng = null để câu vẫn hiện dấu … thay vì số cũ) --- */
  // data-k của ô nhập -> chỗ cất trong state; nhánh null nghĩa là nằm thẳng trên state
  const SLOT = {
    ansH:['ans','h'],   ansM:['ans','m'],  ansD:['ans','d'],
    fromH:['from','h'], fromM:['from','m'],
    toH:['to','h'],     toM:['to','m'],
    dur:[null,'dur'],
  };
  function onInput(e){
    const el = e.target;
    if(!el.classList.contains('in')) return;
    const slot = SLOT[el.dataset.k];
    if(!slot) return;

    const lo = +el.min, hi = +el.max;
    let v = el.value.trim()==='' ? null : parseInt(el.value,10);
    if(v!==null){
      if(Number.isNaN(v)) v=null;
      else if(v>hi || v<lo){ v=clamp(v,lo,hi); el.value=v; }
    }
    const [obj,key] = slot;
    (obj ? state[obj] : state)[key] = v;

    // Ô câu trả lời: chỉ ghi state rồi chấm, KHÔNG dựng lại câu (đang gõ trong chính ô này)
    if(obj==='ans'){ autoCheck(); return; }
    frozenNow=null;      // sửa câu hỏi -> mốc "bây giờ" chạy tiếp
    syncA(); autoCheck();
  }
  elQSay.addEventListener('input', onInput);
  elASay.addEventListener('input', onInput);

  /* --- MENU ▾ --- LUÔN đủ bốn lựa chọn, không bao giờ giấu cái nào: menu mà đổi món theo
       trạng thái thì người dùng không đoán được lần sau bấm vào sẽ thấy gì. Ràng buộc "chỉ
       một mốc được là bây giờ" xử lý lúc CHỌN (mốc kia tự về tự nhập), không xử lý bằng
       cách giấu mục. "tự nhập" đứng đầu vì đó là mặc định. */
  const MENU = [
    ['input','tự nhập'],
    ['now','bây giờ'],
    ['sharp','giờ đúng'],
    ['half','rưỡi'],
  ];
  function closeMenu(){ elMenu.hidden = true; elMenu.dataset.part=''; }

  elQSay.addEventListener('click', e=>{
    const c = e.target.closest('[data-menu]');
    if(!c) return;
    const part = c.dataset.menu;
    if(!elMenu.hidden && elMenu.dataset.part===part){ closeMenu(); return; }
    const mode = state[part].mode;
    elMenu.innerHTML = MENU.map(([o,txt]) =>
      `<button type="button" class="${mode===o?'on':''}" data-mi="${o}">${txt}</button>`).join('');
    elMenu.dataset.part = part;
    elMenu.hidden = false;
    // Đặt menu ngay dưới nút ▾; sát mép dưới màn thì lật lên trên
    const r = c.getBoundingClientRect();
    const w = elMenu.offsetWidth, h = elMenu.offsetHeight;
    elMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    elMenu.style.top  = (r.bottom + h + 8 > window.innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
  });
  elMenu.addEventListener('click', e=>{
    const b = e.target.closest('[data-mi]');
    if(!b) return;
    const part = elMenu.dataset.part, mode = b.dataset.mi;
    state[part].mode = mode;
    // Chỉ MỘT mốc được là "bây giờ": chọn ở đây thì mốc kia trả về tự nhập
    if(mode==='now'){
      const other = state[part==='from' ? 'to' : 'from'];
      if(other.mode==='now') other.mode='input';
    }
    closeMenu();
    frozenNow=null;
    syncQ(); syncA(); autoCheck();
  });
  document.addEventListener('click', e=>{
    if(elMenu.hidden) return;
    if(e.target.closest('#menu') || e.target.closest('[data-menu]')) return;
    closeMenu();
  });
  window.addEventListener('scroll', closeMenu, true);

  /* --- Chọn chỗ cần hỏi --- */
  chips.forEach(c=>{
    c.addEventListener('click', ()=>{
      state.unknown = c.dataset.ask;
      if(state.unknown!=='dur') state[state.unknown].mode='input';   // chỗ đang hỏi thì không đặt nhanh được
      state.solved = false; state.awarded = false; frozenNow=null;
      state.ans = {h:null,m:null,d:null};
      closeMenu();
      setResult('');
      syncAll();
    });
  });

  /* --- Xoá sạch, quay về màn chọn chỗ hỏi --- */
  btnReset.addEventListener('click', ()=>{
    state.unknown=null; state.solved=false; state.awarded=false; frozenNow=null;
    state.from={h:null,m:null,mode:'input'};
    state.to  ={h:null,m:null,mode:'input'};
    state.dur=null;
    state.ans={h:null,m:null,d:null};
    closeMenu();
    setResult('');
    syncAll();
  });

  /* --- Xoá sao (nút góc màn hình) --- */
  btnClearStars.addEventListener('click', clearStars);

  /* --- Khởi động --- */
  // MOBILE: mặt đồng hồ chỉ tính theo BỀ RỘNG -> chỉ căn lại khi bề rộng đổi (xoay máy).
  // BỎ QUA đổi chiều cao: thanh công cụ ẩn/hiện và pinch-zoom làm chiều cao vùng nhìn thấy
  // co lại liên tục, căn lại theo đó thì đồng hồ co rúm giữa cử chỉ.
  // DESKTOP: mặt còn phụ thuộc chiều cao nên vẫn căn lại khi chiều cao đổi (>2px).
  let lastW = -1, lastVh = -1;
  function relayout(){
    const w = window.innerWidth;
    if(mqDesktop.matches){
      const vh = viewportH();
      if(w === lastW && Math.abs(vh - lastVh) < 2) return;
      lastVh = vh;
    } else if(w === lastW) return;
    lastW = w; layout();
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  document.fonts && document.fonts.ready.then(layout);
  drawStars();
  syncAll();
  layout();
  tick();
</script>
</body>
